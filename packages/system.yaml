# Sterowanie stanem systemu. Niebezpieczne polecenia jednorazowe (restart
# i reset fabryczny) nie są wystawiane. Kasowanie aktywnych błędów jest
# dostępne jako przycisk wykonujący pojedynczy zapis 3004 = 1.

button:
  - platform: template
    name: "Clear Fault"
    id: clear_fault_3004
    entity_category: config
    icon: mdi:alert-remove-outline
    on_press:
      - lambda: |-
          auto *controller = id(${modbus_controller_id});
          auto command =
              esphome::modbus_controller::ModbusCommandItem::create_write_single_command(
                  controller, 3004, 1);
          controller->queue_command(command);
          ESP_LOGI("hoymiles.modbus", "Clear Fault command sent: register 3004 = 1");

select:
  - platform: modbus_controller
    modbus_controller_id: ${modbus_settings_controller_id}
    name: "System Operation"
    id: start_stop_system_3001
    address: 3001
    value_type: U_WORD
    entity_category: config
    optionsmap:
      "Stop": 0
      "Start": 1

  - platform: modbus_controller
    modbus_controller_id: ${modbus_controller_id}
    name: "Parallel Networking Command"
    id: parallel_networking_3016
    address: 3016
    value_type: U_WORD
    entity_category: config
    disabled_by_default: true
    optionsmap:
      "Inactive": 0
      "Create Network": 1
      "Disassemble Network": 2
