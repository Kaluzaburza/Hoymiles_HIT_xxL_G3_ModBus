# Zewnętrzne liczniki energii

sensor:
  - platform: modbus_controller
    modbus_controller_id: ${modbus_fast_controller_id}
    name: "Grid Voltage L1n"
    id: grid_voltage_an_1801
    register_type: read
    address: 1801
    unit_of_measurement: "V"
    device_class: voltage
    state_class: measurement
    accuracy_decimals: 1
    value_type: U_WORD
    filters:
    - multiply: 0.1

  - platform: modbus_controller
    modbus_controller_id: ${modbus_fast_controller_id}
    name: "Grid Voltage L2n"
    id: grid_voltage_bn_1802
    register_type: read
    address: 1802
    unit_of_measurement: "V"
    device_class: voltage
    state_class: measurement
    accuracy_decimals: 1
    value_type: U_WORD
    filters:
    - multiply: 0.1

  - platform: modbus_controller
    modbus_controller_id: ${modbus_fast_controller_id}
    name: "Grid Voltage L3n"
    id: grid_voltage_cn_1803
