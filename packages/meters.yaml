    value_type: U_WORD
    filters:
    - multiply: 0.1

  - platform: modbus_controller
    modbus_controller_id: ${modbus_fast_controller_id}
    name: "Grid Current L1n"
    id: grid_current_an_1804
    register_type: read
    address: 1804
    unit_of_measurement: "A"
    device_class: current
    state_class: measurement
    accuracy_decimals: 2
    value_type: S_WORD
    filters:
    - multiply: 0.01

  - platform: modbus_controller
    modbus_controller_id: ${modbus_fast_controller_id}
    name: "Grid Current L2n"
    id: grid_current_bn_1805
    register_type: read
    address: 1805
    unit_of_measurement: "A"
    device_class: current
    state_class: measurement
    accuracy_decimals: 2
    value_type: S_WORD
    filters:
