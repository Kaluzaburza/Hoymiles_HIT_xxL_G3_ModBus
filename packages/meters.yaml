    modbus_controller_id: ${modbus_controller_id}
    name: "Meter Grid Active Power L1"
    id: grid_active_power_an_1808
    register_type: read
    address: 1808
    unit_of_measurement: "W"
    device_class: power
    state_class: measurement
    icon: mdi:flash
    accuracy_decimals: 0
    value_type: S_DWORD

