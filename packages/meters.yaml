  - platform: modbus_controller
    modbus_controller_id: ${modbus_fast_controller_id}
    name: "Grid Current L3n"
    id: grid_current_cn_1806
    register_type: read
    address: 1806
    unit_of_measurement: "A"
    device_class: current
    state_class: measurement
    accuracy_decimals: 2
    value_type: S_WORD
    filters:
    - multiply: 0.01

  - platform: modbus_controller
    modbus_controller_id: ${modbus_fast_controller_id}
    name: "Meter Grid Frequency"
    id: grid_frequency_1807
    register_type: read
    address: 1807
    unit_of_measurement: "Hz"
    device_class: frequency
    state_class: measurement
    accuracy_decimals: 2
    value_type: U_WORD
    filters:
    - multiply: 0.01

  # Mapa nie udostępnia osobnego rejestru prądu łącznego. Ta wartość jest
  # sumą bezwzględnych prądów L1n/L2n/L3n z rejestrów 1804-1806.
  - platform: template
    name: "Grid Total Current"
    id: grid_total_current_1804_1806
    unit_of_measurement: "A"
    device_class: current
    state_class: measurement
    accuracy_decimals: 2
    update_interval: ${fast_update_interval}
    lambda: |-
      if (!id(grid_current_an_1804).has_state() ||
          !id(grid_current_bn_1805).has_state() ||
          !id(grid_current_cn_1806).has_state()) return NAN;
      return std::abs(id(grid_current_an_1804).state) +
             std::abs(id(grid_current_bn_1805).state) +
             std::abs(id(grid_current_cn_1806).state);

