# Szybki podgląd najważniejszych wartości

sensor:
  - platform: modbus_controller
    modbus_controller_id: ${modbus_fast_controller_id}
    name: "Overview PV Total Power"
    id: pv_total_power_30001
    register_type: read
    address: 30001
    unit_of_measurement: "W"
    device_class: power
    state_class: measurement
    icon: mdi:flash
    accuracy_decimals: 0
    value_type: U_DWORD

  - platform: modbus_controller
    modbus_controller_id: ${modbus_fast_controller_id}
    name: "Overview Internal PV Total Power"
    id: internal_pv_total_power_30003
    register_type: read
    address: 30003
    unit_of_measurement: "W"
    device_class: power
    state_class: measurement
    icon: mdi:flash
    accuracy_decimals: 0
    value_type: U_DWORD

  - platform: modbus_controller
    modbus_controller_id: ${modbus_fast_controller_id}
    name: "Overview External PV Total Power"
    id: external_pv_total_power_30005
    register_type: read
    address: 30005
    unit_of_measurement: "W"
    device_class: power
    state_class: measurement
    icon: mdi:flash
    accuracy_decimals: 0
    value_type: U_DWORD

  - platform: modbus_controller
    modbus_controller_id: ${modbus_fast_controller_id}
    name: "Overview Inverter Active Power"
    id: inv_active_power_30007
    register_type: read
    address: 30007
    unit_of_measurement: "W"
    device_class: power
    state_class: measurement
    icon: mdi:flash
    accuracy_decimals: 0
    value_type: S_DWORD

  - platform: modbus_controller
    modbus_controller_id: ${modbus_fast_controller_id}
    name: "Overview Battery Power"
    id: battery_power_30009
    register_type: read
    address: 30009
    unit_of_measurement: "W"
    device_class: power
    state_class: measurement
    icon: mdi:flash
    accuracy_decimals: 0
    value_type: S_DWORD

  - platform: modbus_controller
    modbus_controller_id: ${modbus_fast_controller_id}
    name: "Overview Grid Total Active Power"
    id: grid_total_active_power_30011
    register_type: read
    address: 30011
    unit_of_measurement: "W"
    device_class: power
    state_class: measurement
    icon: mdi:flash
    accuracy_decimals: 0
    value_type: S_DWORD

  - platform: modbus_controller
    modbus_controller_id: ${modbus_fast_controller_id}
    name: "Overview Generator Active Power"
    id: generator_active_power_30013
    register_type: read
    address: 30013
    unit_of_measurement: "W"
    device_class: power
    state_class: measurement
    icon: mdi:flash
    accuracy_decimals: 0
    value_type: S_DWORD

  - platform: modbus_controller
    modbus_controller_id: ${modbus_fast_controller_id}
    name: "Overview Load Active Power"
    id: load_active_power_30015
    register_type: read
    address: 30015
    unit_of_measurement: "W"
    device_class: power
    state_class: measurement
    icon: mdi:flash
    accuracy_decimals: 0
    value_type: S_DWORD

  - platform: modbus_controller
    modbus_controller_id: ${modbus_fast_controller_id}
    name: "Overview Smart Load Active Power"
    id: smart_load_active_power_30017
    register_type: read
    address: 30017
    unit_of_measurement: "W"
    device_class: power
    state_class: measurement
    icon: mdi:flash
    accuracy_decimals: 0
    # Ten model zwraca rejestr 30017 z młodszym słowem jako pierwszym.
    value_type: S_DWORD_R
    register_count: 3

  - platform: modbus_controller
    modbus_controller_id: ${modbus_fast_controller_id}
    name: "Overview Battery SOC"
    id: battery_soc_30020
    register_type: read
    address: 30020
    unit_of_measurement: "%"
    device_class: battery
    state_class: measurement
    accuracy_decimals: 0
    value_type: U_WORD
