# Instalacja PV: wejścia, moc i energia

sensor:
  - platform: template
    name: "PV Total Power (Direct)"
    id: pv_total_power_26
    unit_of_measurement: "W"
    device_class: power
    state_class: measurement
    icon: mdi:flash
    accuracy_decimals: 0
    update_interval: 5s
    lambda: |-
      if (!id(pv1_power_29).has_state() || !id(pv2_power_32).has_state() ||
          !id(pv3_power_35).has_state() || !id(pv4_power_38).has_state()) return NAN;
      return id(pv1_power_29).state + id(pv2_power_32).state +
             id(pv3_power_35).state + id(pv4_power_38).state;

  - platform: modbus_controller
    modbus_controller_id: ${modbus_controller_id}
    name: "PV1 Voltage"
    id: pv1_voltage_27
    register_type: read
    address: 27
    unit_of_measurement: "V"
    device_class: voltage
    state_class: measurement
    accuracy_decimals: 1
    value_type: U_WORD
    filters:
    - multiply: 0.1

  - platform: modbus_controller
    modbus_controller_id: ${modbus_controller_id}
    name: "PV1 Current"
    id: pv1_current_28
    register_type: read
    address: 28
    unit_of_measurement: "A"
    device_class: current
    state_class: measurement
    accuracy_decimals: 2
    value_type: S_WORD
    filters:
    - multiply: 0.01

