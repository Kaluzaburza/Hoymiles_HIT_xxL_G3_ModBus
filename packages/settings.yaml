# Ustawienia falownika, baterii i EMS (rejestry Holding RW)
# Zakresy i przeliczniki pochodzą z Energy Storage MODBUS Protocol Map V2.4.

globals:
  - id: ems_control_last_readback_ms
    type: uint32_t
    restore_value: no
    initial_value: "0"

# Każda zmiana jednego pola EMS zapisuje cały spójny blok 4300-4306. Dla
# pojedynczego falownika jest to zwykły adresowany FC16. Master wysyła ten sam
# blok jako Modbus broadcast 0, który został wcześniej zweryfikowany w układzie
# 2×HIT. Broadcast nie odpowiada, dlatego niczego tu nie publikujemy
# optymistycznie; Home Assistant czeka na późniejszą generację FC03 Mastera.
script:
  - id: ems_write_complete_block_4300_4306
    mode: queued
    max_runs: 4
    parameters:
      mode_code: float
      self_use_soc: float
      backup_soc: float
      force_charge_soc: float
      maximum_charge_power: float
      force_discharge_soc: float
      maximum_discharge_power: float
    then:
      - lambda: |-
          if (!id(ems_verified_hardware_readback_supported).has_state() ||
              id(ems_verified_hardware_readback_supported).state < 0.5f) {
            ESP_LOGE("ems", "Zapis 4300-4306 zablokowany: brak gotowości sprzętowej EMS");
            return;
          }
          auto valid_range = [](float value, float minimum, float maximum) {
            return std::isfinite(value) && value >= minimum && value <= maximum;
          };
          if (!std::isfinite(mode_code)) {
            ESP_LOGE("ems", "Zapis 4300-4306 zablokowany: brak fizycznego trybu EMS");
            return;
          }
          const int32_t requested_mode = static_cast<int32_t>(std::lround(mode_code));
          if ((requested_mode != 0 && requested_mode != 3 && requested_mode != 4 &&
               requested_mode != 5) ||
              !valid_range(self_use_soc, 10.0f, 100.0f) ||
              !valid_range(backup_soc, 60.0f, 100.0f) ||
              !valid_range(force_charge_soc, 10.0f, 100.0f) ||
              !valid_range(maximum_charge_power, 0.0f, 100.0f) ||
              !valid_range(force_discharge_soc, 0.0f, 100.0f) ||
              !valid_range(maximum_discharge_power, 0.0f, 100.0f)) {
            ESP_LOGE("ems", "Zapis 4300-4306 zablokowany: niekompletny snapshot lub wartość poza zakresem");
            return;
          }
          const uint32_t ems_snapshot_ms = id(ems_control_last_readback_ms);
          if (ems_snapshot_ms == 0 ||
              static_cast<uint32_t>(millis() - ems_snapshot_ms) > 15000U) {
            ESP_LOGE("ems", "Zapis 4300-4306 zablokowany: snapshot FC03 jest nieaktualny");
            return;
          }
          if (!id(machines_type_6048).has_state()) {
            ESP_LOGE("ems", "Zapis 4300-4306 zablokowany: brak topologii 6048");
            return;
          }

          const float machine_type_raw = id(machines_type_6048).state;
          if (!std::isfinite(machine_type_raw)) {
            ESP_LOGE("ems", "Zapis 4300-4306 zablokowany: nieprawidłowa topologia");
            return;
          }
          const int machine_type = static_cast<int>(std::lround(machine_type_raw));
          if (std::fabs(machine_type_raw - machine_type) > 0.01f) {
            ESP_LOGE("ems", "Zapis 4300-4306 zablokowany: niecałkowita topologia");
            return;
          }
          if (machine_type == 2) {
            ESP_LOGE("ems", "Zapis 4300-4306 zablokowany: ESP32 jest podłączone do Slave");
            return;
          }
          if (machine_type > 2) {
            ESP_LOGE("ems", "Zapis 4300-4306 zablokowany: nieprawidłowa topologia %d",
                     machine_type);
            return;
          }

          auto encode = [](float value, float scale) -> uint16_t {
            return static_cast<uint16_t>(std::lround(value * scale));
          };
          std::vector<uint16_t> values = {
              static_cast<uint16_t>(requested_mode),
              encode(self_use_soc, 1.0f),
              encode(backup_soc, 1.0f),
              encode(force_charge_soc, 1.0f),
              encode(maximum_charge_power, 10.0f),
              encode(force_discharge_soc, 1.0f),
              encode(maximum_discharge_power, 10.0f),
          };

          if (machine_type == 1) {
            if (!id(number_of_machines_master_and_slave_6049).has_state()) {
              ESP_LOGE("ems", "Broadcast EMS zablokowany: brak liczby falowników");
              return;
            }
            const float machine_count_raw =
                id(number_of_machines_master_and_slave_6049).state;
            if (!std::isfinite(machine_count_raw)) {
              ESP_LOGE("ems", "Broadcast EMS zablokowany: nieprawidłowa liczba falowników");
              return;
            }
            const int machine_count =
                static_cast<int>(std::lround(machine_count_raw));
            if (std::fabs(machine_count_raw - machine_count) > 0.01f) {
              ESP_LOGE("ems", "Broadcast EMS zablokowany: niecałkowita liczba falowników");
              return;
            }
            if (machine_count < 2 || machine_count > 10) {
              ESP_LOGE("ems", "Broadcast EMS zablokowany: liczba falowników=%d",
                       machine_count);
              return;
            }
            std::vector<uint8_t> payload = {
                0x00, 0x10, 0x10, 0xCC, 0x00, 0x07, 0x0E,
            };
            for (const uint16_t value : values) {
              payload.push_back(static_cast<uint8_t>(value >> 8));
              payload.push_back(static_cast<uint8_t>(value & 0xFF));
            }
            id(modbus_1).send_raw(payload);
            ESP_LOGI("ems",
                     "Wysłano systemowy broadcast EMS 4300-4306; tryb=%d, falowniki=%d",
                     requested_mode, machine_count);
            return;
          }

          auto *controller = id(${modbus_control_controller_id});
          auto command =
              esphome::modbus_controller::ModbusCommandItem::create_write_multiple_command(
                  controller, 4300, values.size(), values);
          controller->queue_command(command);
          ESP_LOGI("ems", "Wysłano adresowany FC16 EMS 4300-4306; tryb=%d",
                   requested_mode);

sensor:
  # Autorytatywna generacja odczytu bloku EMS. Jest inkrementowana wyłącznie
  # przez cykliczny odczyt FC03 rejestru 4300, nigdy przez lokalny zapis.
  # Home Assistant używa jej razem z poniższymi lustrami read-only, aby
  # odróżnić fizyczny odczyt Modbus od optymistycznego echa encji number.
  - platform: template
    name: "EMS Control Readback Generation"
    id: ems_control_readback_generation
    accuracy_decimals: 0
    update_interval: never
    force_update: true
    entity_category: diagnostic

  # Te liczniki są publikowane wyłącznie przez sensory FC03 poniżej. Odpowiedź
  # na FC06/FC10 i lokalne echo encji number/select nie mogą ich zwiększyć.
  - platform: template
    name: "GCF Control Readback Generation"
    id: gcf_control_readback_generation
    accuracy_decimals: 0
    update_interval: never
    force_update: true
    entity_category: diagnostic

  - platform: template
    name: "Battery Charge Power Readback Generation"
    id: battery_charge_power_readback_generation
    accuracy_decimals: 0
    update_interval: never
    force_update: true
    entity_category: diagnostic

  # Surowy stan EMS jest tylko odczytywany. Zapis wykonuje poniższy select jako
  # jeden atomowy blok FC10 (4300-4306), tak jak przycisk Save w aplikacji S-Miles.
  - platform: modbus_controller
    modbus_controller_id: ${modbus_control_controller_id}
    id: ems_mode_raw_4300
    name: "EMS Mode Readback Code"
    force_update: true
    entity_category: diagnostic
    register_type: holding
    address: 4300
    value_type: U_WORD
    on_value:
      then:
        - lambda: |-
            const uint16_t mode = static_cast<uint16_t>(x);
            switch (mode) {
              case 0:
                id(ems_mode_4300).publish_state("Autokonsumpcja (Self-Use)");
                break;
              case 3:
                id(ems_mode_4300).publish_state("Off-Grid");
                break;
              case 4:
                id(ems_mode_4300).publish_state("Ładowanie z sieci");
                break;
              case 5:
                id(ems_mode_4300).publish_state("Rozładowanie do sieci");
                break;
              default:
                ESP_LOGW("ems", "Nieznany tryb EMS odczytany z rejestru 4300: %u", mode);
                break;
            }

  - platform: modbus_controller
    modbus_controller_id: ${modbus_control_controller_id}
    name: "EMS Self-Use SOC Readback"
    id: self_used_soc_readback_4301
    register_type: holding
    address: 4301
    value_type: U_WORD
    unit_of_measurement: "%"
    accuracy_decimals: 0
    force_update: true
    entity_category: diagnostic

  # Rejestr 4302 należy do trybu Backup, a nie do Pure Off-Grid. Jego fizyczny
  # odczyt pozostaje częścią atomowego potwierdzenia całego bloku 4300-4306.
  - platform: modbus_controller
    modbus_controller_id: ${modbus_control_controller_id}
    name: "EMS Backup SOC Readback"
    id: backup_soc_raw_4302
    register_type: holding
    address: 4302
    value_type: U_WORD
    unit_of_measurement: "%"
    accuracy_decimals: 0
    force_update: true
    entity_category: diagnostic

  # Niezależne, read-only lustra rejestrów zapisywalnych. ModbusNumber publikuje
  # żądaną wartość po wysłaniu komendy; te sensory zmieniają się dopiero po
  # następnym rzeczywistym odczycie bloku 4300-4306 z falownika.
  - platform: modbus_controller
    modbus_controller_id: ${modbus_control_controller_id}
    name: "EMS Force Charge SOC Readback"
    id: force_charge_soc_readback_4303
    register_type: holding
    address: 4303
    value_type: U_WORD
    unit_of_measurement: "%"
    accuracy_decimals: 0
    force_update: true
    entity_category: diagnostic

  # Oddzielne lustra nastaw bezpieczeństwa. Sensory (nie zapisujące encje
  # select/number) są źródłem generacji udanego odczytu FC03.
  - platform: modbus_controller
    modbus_controller_id: ${modbus_settings_controller_id}
    name: "GCF Enable Readback Code"
    id: gcf_enable_readback_258
    register_type: holding
    address: 258
    value_type: U_WORD
    accuracy_decimals: 0
    force_update: true
    entity_category: diagnostic

  - platform: modbus_controller
    modbus_controller_id: ${modbus_settings_controller_id}
    name: "GCF Maximum Export Power Readback"
    id: gcf_export_soft_limit_ratio_readback_259
    register_type: holding
    address: 259
    value_type: S_WORD
    unit_of_measurement: "%"
    accuracy_decimals: 1
    lambda: return x * 0.1f;
    force_update: true
    entity_category: diagnostic
    on_value:
      then:
        - lambda: |-
            // 259 zamyka zgrupowany odczyt FC03 258-259.
            const float generation =
                id(gcf_control_readback_generation).has_state() &&
                        id(gcf_control_readback_generation).state < 16000000.0f
                    ? id(gcf_control_readback_generation).state + 1.0f
                    : 1.0f;
            id(gcf_control_readback_generation).publish_state(generation);

  - platform: modbus_controller
    modbus_controller_id: ${modbus_settings_controller_id}
    name: "Battery Max Charge Power Readback"
    id: battery_max_charge_power_readback_306
    register_type: holding
    address: 306
    value_type: U_WORD
    unit_of_measurement: "%"
    accuracy_decimals: 1
    lambda: return x * 0.1f;
    force_update: true
    entity_category: diagnostic
    on_value:
      then:
        - lambda: |-
            const float generation =
                id(battery_charge_power_readback_generation).has_state() &&
                        id(battery_charge_power_readback_generation).state < 16000000.0f
                    ? id(battery_charge_power_readback_generation).state + 1.0f
                    : 1.0f;
            id(battery_charge_power_readback_generation).publish_state(generation);

  - platform: modbus_controller
    modbus_controller_id: ${modbus_control_controller_id}
    name: "EMS Maximum Charge Power Readback"
    id: maximum_charge_power_readback_4304
    register_type: holding
    address: 4304
    value_type: U_WORD
    unit_of_measurement: "%"
    accuracy_decimals: 1
    lambda: return x * 0.1f;
    force_update: true
    entity_category: diagnostic

  - platform: modbus_controller
    modbus_controller_id: ${modbus_control_controller_id}
    name: "EMS Force Discharge SOC Readback"
    id: force_discharge_soc_readback_4305
    register_type: holding
    address: 4305
    value_type: U_WORD
    unit_of_measurement: "%"
    accuracy_decimals: 0
    force_update: true
    entity_category: diagnostic

  - platform: modbus_controller
    modbus_controller_id: ${modbus_control_controller_id}
    name: "EMS Maximum Discharge Power Readback"
    id: maximum_discharge_power_readback_4306
    register_type: holding
    address: 4306
    value_type: U_WORD
    unit_of_measurement: "%"
    accuracy_decimals: 1
    lambda: return x * 0.1f;
    force_update: true
    entity_category: diagnostic
    on_value:
      then:
        - lambda: |-
            // 4306 jest ostatnim elementem zgrupowanego FC03 4300-4306.
            id(ems_control_last_readback_ms) = millis();
            const float generation =
                id(ems_control_readback_generation).has_state() &&
                        id(ems_control_readback_generation).state < 16000000.0f
                    ? id(ems_control_readback_generation).state + 1.0f
                    : 1.0f;
            id(ems_control_readback_generation).publish_state(generation);

select:
  - platform: template
    name: "Tryb EMS"
    id: ems_mode_4300
    entity_category: config
    # Odczyt 4300 publikuje stan. Brak lokalnego cyklu zapobiega sztucznemu
    # odświeżaniu encji pomiędzy rzeczywistymi odpowiedziami FC03.
    update_interval: never
    options:
      - "Autokonsumpcja (Self-Use)"
      - "Off-Grid"
      - "Ładowanie z sieci"
      - "Rozładowanie do sieci"
    lambda: |-
      if (!id(ems_mode_raw_4300).has_state()) return {};
      const uint16_t mode = static_cast<uint16_t>(id(ems_mode_raw_4300).state);
      switch (mode) {
        case 0: return std::string("Autokonsumpcja (Self-Use)");
        case 3: return std::string("Off-Grid");
        case 4: return std::string("Ładowanie z sieci");
        case 5: return std::string("Rozładowanie do sieci");
        default: return {};
      }
    set_action:
      - lambda: |-
          uint16_t mode = 0;
          if (x == "Off-Grid") mode = 3;
          else if (x == "Ładowanie z sieci") mode = 4;
          else if (x == "Rozładowanie do sieci") mode = 5;
          id(ems_write_complete_block_4300_4306)->execute(
              mode,
              id(self_used_soc_readback_4301).state,
              id(backup_soc_raw_4302).state,
              id(force_charge_soc_readback_4303).state,
              id(maximum_charge_power_readback_4304).state,
              id(force_discharge_soc_readback_4305).state,
              id(maximum_discharge_power_readback_4306).state);

  # Generation Control Function (GCF), sekcja Safety Parameters.
  # Rejestr 257 (GCF_FuncCode) pozostaje ustawieniem serwisowym producenta.
  # Użytkownik steruje aktywacją funkcji przez 258 i limitem eksportu przez 259.
  - platform: modbus_controller
    modbus_controller_id: ${modbus_settings_controller_id}
    name: "Generation Control Function"
    id: gcf_enable_258
    address: 258
    value_type: U_WORD
    entity_category: config
    optionsmap:
      "Disabled": 0
      "Enabled": 1
    write_lambda: |-
      if (!id(direct_register_verified_readback_supported).has_state() ||
          id(direct_register_verified_readback_supported).state < 0.5f) {
        ESP_LOGE("ems", "Zapis 258 zablokowany: brak świeżego, weryfikowalnego FC03");
        return {};
      }
      return value;

  # Nowe mapy firmware HIT G3 umieszczają tryb złącza GEN w wolnym wcześniej
  # rejestrze 303 (między parametrami systemowymi 302 i baterii 306).
  - platform: modbus_controller
    modbus_controller_id: ${modbus_settings_controller_id}
    name: "GEN Port Mode"
    id: gen_port_mode_303
    address: 303
    value_type: U_WORD
    entity_category: config
    optionsmap:
      "PV": 0
      "Generator": 1
      "Smart Load (G3)": 2
      "Disabled": 3

  - platform: modbus_controller
    modbus_controller_id: ${modbus_settings_controller_id}
    name: "EPS Mode"
    id: eps_mode_323
    address: 323
    value_type: U_WORD
    entity_category: config
    optionsmap:
      "Disabled": 0
      "EPS": 1
      "UPS": 2

  - platform: modbus_controller
    modbus_controller_id: ${modbus_settings_controller_id}
    name: "PV Island Mode"
    id: pv_island_mode_en_324
    address: 324
    value_type: U_WORD
    entity_category: config
    optionsmap:
      "Disabled": 0
      "Enabled": 1

  - platform: modbus_controller
    modbus_controller_id: ${modbus_settings_controller_id}
    name: "Battery Type Setting"
    id: battery_type_4100
    address: 4100
    value_type: U_WORD
    entity_category: config
    optionsmap:
      "No Battery": 0
      "Lithium": 1
      "Lead-Acid": 2

  - platform: modbus_controller
    modbus_controller_id: ${modbus_settings_controller_id}
    name: "BMS Type Setting"
    id: bms_type_4101
    address: 4101
    value_type: U_WORD
    entity_category: config
    optionsmap:
      "Not Configured": 0
      "Pylon LV": 1
      "Pylon HV": 2
      "Dyness HV": 3
      "Dyness LV": 4
      "Sunwoda LV": 5
      "Uz LV": 6
      "Soluna HV": 7
      "Soluna LV": 8
      "Steltec LV": 9
      "XinYi LV": 10
      "Vestwoods LV": 11
      "JK HV": 12
      "BYD LV": 13
      "Uz HV": 14
      "Zetara LV": 15
      "FEB HV": 16
      "Pytes LV": 17
      "Dmegc LV": 18
      "Weineng LV": 19
      "Weineng HV": 20
      "GSL LV": 21
      "HOY LV": 22
      "HOY HV": 23
      "FEB LV": 24
      "UHhome LV": 25
      "UHhome HV": 26
      "BYD HV": 27
      "Vestwoods HV": 28
      "Phylion HV": 29
      "Hoymiles LV": 30
      "Pholion LV": 31
      "Wattsonic LV": 32
      "Enershare HV": 33
      "Beghelli LV": 34
      "LvToPSUN LV": 35
      "PYTES HV": 36
      "LvToPSUN HV": 37
      "RAJA HV": 38
      "Felicity LV": 39

number:
  - platform: modbus_controller
    modbus_controller_id: ${modbus_settings_controller_id}
    name: "Maximum Export Power Limit"
    id: gcf_export_soft_limit_ratio_259
    address: 259
    # Aktualny firmware i aplikacja producenta dopuszczają -10…200%.
    # Typ ze znakiem jest konieczny dla ujemnego limitu.
    value_type: S_WORD
    unit_of_measurement: "%"
    min_value: -10
    max_value: 200
    step: 0.1
    lambda: return x * 0.1f;
    write_lambda: |-
      if (!id(direct_register_verified_readback_supported).has_state() ||
          id(direct_register_verified_readback_supported).state < 0.5f) {
        ESP_LOGE("ems", "Zapis 259 zablokowany: brak świeżego, weryfikowalnego FC03");
        return {};
      }
      const float safe = x > 200.0f ? 200.0f : (x < -10.0f ? -10.0f : x);
      return safe * 10.0f;
    entity_category: config

  - platform: modbus_controller
    modbus_controller_id: ${modbus_settings_controller_id}
    name: "Battery Max Charge Power"
    id: battery_max_charge_power_306
    address: 306
    value_type: U_WORD
    unit_of_measurement: "%"
    min_value: 10
    max_value: 100
    step: 1
    # Rejestry 306/307 używają rozdzielczości 0,1%:
    # wartość użytkownika 75% musi zostać zapisana jako surowe 750.
    lambda: return x * 0.1f;
    write_lambda: |-
      if (!id(direct_register_verified_readback_supported).has_state() ||
          id(direct_register_verified_readback_supported).state < 0.5f) {
        ESP_LOGE("ems", "Zapis 306 zablokowany: brak świeżego, weryfikowalnego FC03");
        return {};
      }
      const float safe = x > 100.0f ? 100.0f : (x < 10.0f ? 10.0f : x);
      return safe * 10.0f;
    entity_category: config

  - platform: modbus_controller
    modbus_controller_id: ${modbus_settings_controller_id}
    name: "Battery Max Discharge Power"
    id: battery_max_discharge_power_307
    address: 307
    value_type: U_WORD
    unit_of_measurement: "%"
    min_value: 10
    max_value: 100
    step: 1
    lambda: return x * 0.1f;
    write_lambda: |-
      const float safe = x > 100.0f ? 100.0f : (x < 10.0f ? 10.0f : x);
      return safe * 10.0f;
    entity_category: config

  - platform: modbus_controller
    modbus_controller_id: ${modbus_settings_controller_id}
    name: "Maximum SOC"
    id: max_soc_308
    address: 308
    value_type: U_WORD
    unit_of_measurement: "%"
    min_value: 10
    max_value: 100
    step: 1
    entity_category: config

  - platform: modbus_controller
    modbus_controller_id: ${modbus_settings_controller_id}
    name: "Minimum SOC"
    id: min_soc_309
    address: 309
    value_type: U_WORD
    unit_of_measurement: "%"
    min_value: 10
    max_value: 90
    step: 1
    entity_category: config

  - platform: modbus_controller
    modbus_controller_id: ${modbus_settings_controller_id}
    name: "Low SOC Grid Charge Power"
    id: replenish_power_310
    address: 310
    value_type: U_WORD
    unit_of_measurement: "W"
    min_value: 0
    # Rejestr 310 przyjmuje najwyżej 1000 W. Wyższa wartość powoduje błędy
    # wewnętrznego oprogramowania falownika, dlatego limitujemy także sam zapis.
    max_value: 1000
    step: 50
    write_lambda: |-
      return x > 1000.0f ? 1000.0f : (x < 0.0f ? 0.0f : x);
    entity_category: config

  - platform: modbus_controller
    modbus_controller_id: ${modbus_settings_controller_id}
    name: "SOC Start Charge From Grid"
    id: rsvd_replenish_power_311
    address: 311
    value_type: U_WORD
    unit_of_measurement: "%"
    min_value: 0
    max_value: 100
    step: 0.1
    lambda: return x * 0.1f;
    write_lambda: |-
      const float safe = x > 100.0f ? 100.0f : (x < 0.0f ? 0.0f : x);
      return safe * 10.0f;
    entity_category: config

  - platform: modbus_controller
    modbus_controller_id: ${modbus_control_controller_id}
    name: "Self-Use SOC"
    id: self_used_soc_4301
    address: 4301
    value_type: U_WORD
    unit_of_measurement: "%"
    min_value: 10
    max_value: 100
    step: 1
    write_lambda: |-
      if (!id(ems_verified_hardware_readback_supported).has_state() ||
