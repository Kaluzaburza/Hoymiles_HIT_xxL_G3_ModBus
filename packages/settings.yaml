number:
  - platform: modbus_controller
    modbus_controller_id: ${modbus_controller_id}
    name: "Grid Input Power Limitation (Valley)"
    id: gridin_power_limitation_when_vally_301
    address: 301
    value_type: U_WORD
    unit_of_measurement: "%"
    min_value: 0
    max_value: 50
    step: 0.1
    lambda: return x * 0.1f;
    write_lambda: return x * 10.0f;
    entity_category: config
    skip_updates: 4

  - platform: modbus_controller
    modbus_controller_id: ${modbus_controller_id}
    name: "Battery Max Charge Power"
    id: battery_max_charge_power_306
    address: 306
    value_type: U_WORD
    unit_of_measurement: "%"
    min_value: 10
    max_value: 100
    step: 1
    # Starsza wersja integracji mogła zapisać 100% jako surowe 1000.
    # Odczyt koryguje tę wartość, ale nowe zapisy są już zgodne z mapą (0-100).
    lambda: |-
      return x > 100.0f ? x * 0.1f : x;
    entity_category: config
    skip_updates: 4

