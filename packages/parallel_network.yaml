# Sieć równoległa falowników (parametry statyczne).
#
# Port Modbus Mastera nie przekazuje zapytań kierowanych bezpośrednio do
# adresów urządzeń Slave. Rejestry 6050/6055/... opisują wewnętrzną sieć
# równoległą, ale nie są dodatkowymi urządzeniami na zewnętrznej magistrali
# RS485. Zgodnie z instrukcją Hoymiles ustawienia EMS i dispatch zapisane do
# Mastera są rozsyłane przez Master do całej wykrytej sieci.

sensor:
  - platform: modbus_controller
    modbus_controller_id: ${modbus_controller_id}
    name: "Machines Type"
    id: machines_type_6048
    register_type: holding
    address: 6048
    accuracy_decimals: 0
    value_type: U_WORD
    skip_updates: 9

  - platform: modbus_controller
    modbus_controller_id: ${modbus_controller_id}
    name: "Number of Machines (Master and Slave)"
    id: number_of_machines_master_and_slave_6049
    register_type: holding
    address: 6049
    accuracy_decimals: 0
    value_type: U_WORD
    skip_updates: 9

  - platform: modbus_controller
