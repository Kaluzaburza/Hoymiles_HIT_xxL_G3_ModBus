name: Validate

on:
  push:
  pull_request:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-hacs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: HACS validation
        uses: hacs/action@main
        with:
          category: integration

  hassfest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: home-assistant/actions/hassfest@master

  project-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install project validation dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-dev.txt
      - name: Generate assets
        run: python tools/build_hacs_assets.py
      - name: Verify generated files are committed
        run: git diff --exit-code
      - name: Run structural tests
        run: python tools/validate_release.py
      - name: Test RCE optimizer
        run: python tools/test_rce_optimizer.py
      - name: Test RCE Recorder history reconstruction
        run: python tools/test_rce_history.py
      - name: Test RCE custom card
        run: node tools/validate_rce_card.js
