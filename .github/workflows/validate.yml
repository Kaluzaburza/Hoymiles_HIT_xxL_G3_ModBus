name: Validate

on:
  push:
  pull_request:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-hacs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: HACS validation
        uses: hacs/action@main
        with:
          category: integration

  hassfest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: home-assistant/actions/hassfest@master

  project-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install project validation dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-dev.txt
      - name: Generate assets
        run: python tools/build_hacs_assets.py
      - name: Verify generated files are committed
        run: git diff --exit-code
      - name: Run structural tests
        run: python tools/validate_release.py
      - name: Test RCE optimizer
        run: python tools/test_rce_optimizer.py
      - name: Test RCE Recorder history reconstruction
        run: python tools/test_rce_history.py
      - name: Test tariff profiles and optimizer
        run: |
          python tools/test_tariff_profiles.py
          python tools/test_tariff_optimizer.py
      - name: Test RCEm history and optimizer
        run: |
          python tools/test_rcm_history.py
          python tools/test_rcm_optimizer.py
      - name: Test cross-system automation matrix
        run: python tools/test_automation_matrix.py
      - name: Test diagnostic privacy filters
        run: python tools/test_diagnostics.py
      - name: Test parallel power balancing
        run: python tools/test_power_balance.py
      - name: Test shared energy input freshness
        run: python tools/test_energy_data.py
      - name: Test shared household LOAD estimates
        run: python tools/test_load_model.py
      - name: Test physical FC03 actuator readback contract
        run: python tools/test_firmware_readback_contract.py
      - name: Test optimizer event-loop offload contract
        run: python tools/test_optimizer_executor_contract.py
      - name: Run exhaustive pre-release automation matrix
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: python tools/test_automation_matrix.py --exhaustive
      - name: Test RCE custom card
        run: node tools/validate_rce_card.js
