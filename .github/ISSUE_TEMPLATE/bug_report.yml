name: Bug report
description: Report an inverter register, entity, dashboard or automation problem.
title: "[Bug]: "
labels:
  - bug
body:
  - type: input
    id: inverter
    attributes:
      label: Inverter model and firmware
      placeholder: HIT-10L-G3, firmware ...
    validations:
      required: true
  - type: input
    id: versions
    attributes:
      label: Home Assistant and ESPHome versions
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: Problem description
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs
      description: Remove passwords, API keys and other secrets.
      render: text
