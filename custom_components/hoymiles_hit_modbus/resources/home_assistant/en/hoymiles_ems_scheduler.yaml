# Pakiet Home Assistant: daily harmonogramy EMS dla falownika Hoymiles.
# Wymaga encji select.hoymiles_hit_ems_mode z integracji ESPHome.

input_boolean:
  hoymiles_ems_push_notifications_enabled:
    name: "EMS — push notifications for status changes"
    icon: mdi:cellphone-message

  hoymiles_discharge_schedule_enabled:
    name: "EMS — daily discharge enabled"
    icon: mdi:transmission-tower-export

  hoymiles_charge_schedule_enabled:
    name: "EMS — daily charge enabled"
    icon: mdi:transmission-tower-import

  # Wewnętrzne znaczniki pozwalają bezpiecznie obsłużyć restart HA podczas cyklu.
  hoymiles_discharge_cycle_active:
    name: "EMS — discharge cycle active"
    icon: mdi:battery-arrow-down

  hoymiles_charge_cycle_active:
    name: "EMS — charge cycle active"
    icon: mdi:battery-arrow-up

  hoymiles_rce_discharge_enabled:
    name: "EMS RCE — automatyczne discharge enabled"
    icon: mdi:chart-line

  hoymiles_rce_dynamic_soc_enabled:
    name: "EMS RCE — dynamic SOC reserve"
    icon: mdi:weather-partly-cloudy

  # Wewnętrzny znacznik: tylko cykl rozpoczęty przez automatykę RCE może zostać
  # przez nią finishony. Ręczne harmonogramy zachowują pierwszeństwo.
  hoymiles_rce_discharge_active:
    name: "EMS RCE — trwa discharge"
    icon: mdi:battery-arrow-down-outline

  hoymiles_sale_block_enabled:
    name: "EMS — export lockout in selected hours"
    icon: mdi:transmission-tower-off

input_datetime:
  hoymiles_discharge_start:
    name: "EMS — discharge start time"
    has_date: false
    has_time: true
    icon: mdi:clock-start

  hoymiles_charge_start:
    name: "EMS — charge start time"
    has_date: false
    has_time: true
    icon: mdi:clock-start

  hoymiles_sale_block_start:
    name: "EMS — export lockout start"
    has_date: false
    has_time: true
    icon: mdi:clock-start

  hoymiles_sale_block_end:
    name: "EMS — export lockout end"
    has_date: false
    has_time: true
    icon: mdi:clock-end

input_text:
  hoymiles_ems_push_notify_target:
    name: "EMS — notification phone (notify entity)"
    max: 255
    icon: mdi:cellphone-cog

  hoymiles_solcast_forecast_today_entity:
    name: "EMS RCE — Solcast today forecast entity"
    max: 255
    icon: mdi:solar-power-variant

  hoymiles_solcast_forecast_tomorrow_entity:
    name: "EMS RCE — Solcast tomorrow forecast entity"
    max: 255
    icon: mdi:solar-power-variant

  # Data ostatniego rozliczenia umożliwia poprawne wyzerowanie liczników
  # dziennych również po restarcie restarts.
  hoymiles_rce_accounting_date:
    name: "EMS RCE — export accounting date"
    max: 10
    icon: mdi:calendar-check

input_select:
  hoymiles_rce_inverter_rated_power:
    name: "EMS RCE — rated power of one inverter"
    options:
      - "10 kW"
      - "5 kW"
      - "8 kW"
      - "12 kW"
      - "15 kW"
      - "20 kW"
    icon: mdi:solar-power

input_number:
  hoymiles_discharge_duration:
    name: "EMS — discharge duration"
    min: 1
    max: 720
    step: 1
    mode: box
    unit_of_measurement: "min"
    icon: mdi:timer-sand

  hoymiles_charge_duration:
    name: "EMS — charge duration"
    min: 1
    max: 720
    step: 1
    mode: box
    unit_of_measurement: "min"
    icon: mdi:timer-sand

  hoymiles_rce_soc_safety_margin:
    name: "EMS RCE — SOC safety correction"
    min: 0
    max: 50
    step: 1
    mode: slider
    unit_of_measurement: "%"
    icon: mdi:shield-plus-outline

  hoymiles_rce_fallback_daily_load:
    name: "EMS RCE — fallback daily consumption before history is available"
    min: 1
    max: 200
    step: 0.5
    initial: 10
    mode: box
    unit_of_measurement: "kWh"
    icon: mdi:home-lightning-bolt-outline

  hoymiles_rce_export_efficiency:
    name: "EMS RCE — battery export efficiency"
    min: 80
    max: 100
    step: 1
    initial: 95
    mode: slider
    unit_of_measurement: "%"
    icon: mdi:percent-outline

  hoymiles_rce_requested_discharge_power:
    name: "EMS RCE — requested grid discharge power"
    min: 0
    max: 100
    step: 0.1
    initial: 100
    mode: box
    unit_of_measurement: "%"
    icon: mdi:battery-arrow-down-outline

  # Wewnętrzne, odtwarzane po restarcie magazyny danych rozdzielają energię
  # faktycznie wysłaną przez automatykę RCE od naturalnej nadwyżki Self-Use.
  hoymiles_rce_realized_controlled_export_store:
    name: "EMS RCE — realized controlled export (store)"
    min: 0
    max: 100000
    step: 0.001
    mode: box
    unit_of_measurement: "kWh"
    icon: mdi:battery-arrow-down-outline

  hoymiles_rce_realized_natural_export_store:
    name: "EMS RCE — realized natural surplus (store)"
    min: 0
    max: 100000
    step: 0.001
    mode: box
    unit_of_measurement: "kWh"
    icon: mdi:solar-power-variant-outline

  hoymiles_rce_realized_controlled_revenue_store:
    name: "EMS RCE — controlled export revenue (store)"
    min: -100000
    max: 100000
    step: 0.001
    mode: box
    unit_of_measurement: "PLN"
    icon: mdi:cash-plus

  hoymiles_rce_realized_natural_revenue_store:
    name: "EMS RCE — natural surplus revenue (store)"
    min: -100000
    max: 100000
    step: 0.001
    mode: box
    unit_of_measurement: "PLN"
    icon: mdi:cash

  hoymiles_rce_unclassified_export_store:
    name: "EMS RCE — unclassified export (store)"
    min: 0
    max: 100000
    step: 0.001
    mode: box
    unit_of_measurement: "kWh"
    icon: mdi:help-rhombus-outline

  hoymiles_rce_grid_sell_checkpoint:
    name: "EMS RCE — grid sell meter checkpoint"
    min: 0
    max: 100000
    step: 0.001
    mode: box
    unit_of_measurement: "kWh"
    icon: mdi:counter

# The daily LOAD meter increases during the day and resets at midnight.
# sum_differences_nonnegative sums only positive increments from the last
# 96 hours, accounting for the reset. Recorder restores the buffer after restart.
sensor:
  - platform: statistics
    name: "Hoymiles Load Energy Last 4 Days"
    unique_id: hoymiles_load_energy_last_4_days
    entity_id: sensor.hoymiles_actual_load_energy_today
    state_characteristic: sum_differences_nonnegative
    sampling_size: 20000
    max_age:
      days: 4
    keep_last_sample: true
    precision: 2

  # Moc LOAD jest próbkowana tylko w chronionym oknie nocnym. Całka tworzy
  # licznik energii, z którego po pierwszej pełnej dobie wyznaczana jest
  # rzeczywista średnia z maksymalnie czterech ostatnich nocy.
  - platform: integration
    source: sensor.hoymiles_night_protected_load_power
    name: "Hoymiles Night Protected Load Energy Total"
    unique_id: hoymiles_night_protected_load_energy_total
    unit_prefix: k
    unit_time: h
    round: 3
    method: left

  - platform: statistics
    name: "Hoymiles Night Protected Load Energy Last 4 Days"
    unique_id: hoymiles_night_protected_load_energy_last_4_days
    entity_id: sensor.hoymiles_night_protected_load_energy_total
    state_characteristic: sum_differences_nonnegative
    sampling_size: 10000
    max_age:
      days: 4
    keep_last_sample: true
    precision: 3

  - platform: integration
    source: sensor.hoymiles_rce_grid_export_power
    name: "Hoymiles RCE Grid Export Energy Total"
    unique_id: hoymiles_rce_grid_export_energy_total
    unit_time: h
    round: 3
    method: left

  - platform: integration
    source: sensor.hoymiles_rce_revenue_rate
    name: "Hoymiles RCE Revenue Total"
    unique_id: hoymiles_rce_revenue_total
    unit_time: h
    round: 3
    method: left

utility_meter:
  hoymiles_rce_grid_export_energy_daily:
    name: "Hoymiles RCE Grid Export Energy Daily"
    unique_id: hoymiles_rce_grid_export_energy_daily
    source: sensor.hoymiles_rce_grid_export_energy_total
    cycle: daily

  hoymiles_rce_grid_export_energy_weekly:
    name: "Hoymiles RCE Grid Export Energy Weekly"
    unique_id: hoymiles_rce_grid_export_energy_weekly
    source: sensor.hoymiles_rce_grid_export_energy_total
    cycle: weekly

  hoymiles_rce_grid_export_energy_monthly:
    name: "Hoymiles RCE Grid Export Energy Monthly"
    unique_id: hoymiles_rce_grid_export_energy_monthly
    source: sensor.hoymiles_rce_grid_export_energy_total
    cycle: monthly

  hoymiles_rce_grid_export_energy_yearly:
    name: "Hoymiles RCE Grid Export Energy Yearly"
    unique_id: hoymiles_rce_grid_export_energy_yearly
    source: sensor.hoymiles_rce_grid_export_energy_total
    cycle: yearly

  hoymiles_rce_revenue_daily:
    name: "Hoymiles RCE Revenue Daily"
    unique_id: hoymiles_rce_revenue_daily
    source: sensor.hoymiles_rce_revenue_total
    cycle: daily

  hoymiles_rce_revenue_weekly:
    name: "Hoymiles RCE Revenue Weekly"
    unique_id: hoymiles_rce_revenue_weekly
    source: sensor.hoymiles_rce_revenue_total
    cycle: weekly

  hoymiles_rce_revenue_monthly:
    name: "Hoymiles RCE Revenue Monthly"
    unique_id: hoymiles_rce_revenue_monthly
    source: sensor.hoymiles_rce_revenue_total
    cycle: monthly

  hoymiles_rce_revenue_yearly:
    name: "Hoymiles RCE Revenue Yearly"
    unique_id: hoymiles_rce_revenue_yearly
    source: sensor.hoymiles_rce_revenue_total
    cycle: yearly

# Oficjalne API PSE publikuje RCE w PLN/MWh w 96 okresach po 15 minut.
# Automatyka oraz dashboard łączą każde dwa kolejne okresy w 48 bloków
# półgodzinnych i przeliczają cenę na PLN/kWh.
rest:
  - resource_template: >-
      https://api.raporty.pse.pl/api/rce-pln?%24select=rce_pln%2Cperiod%2Cbusiness_date&%24filter=business_date%20eq%20%27{{ now().strftime('%Y-%m-%d') }}%27
    method: GET
    scan_interval: 900
    timeout: 30
    headers:
      Accept: application/json
    sensor:
      - name: "Hoymiles RCE Day"
        unique_id: hoymiles_rce_day
        icon: mdi:chart-areaspline
        value_template: "{{ value_json.value | count }}"
        json_attributes:
          - value

  - resource_template: >-
      https://api.raporty.pse.pl/api/rce-pln?%24select=rce_pln%2Cperiod%2Cbusiness_date&%24filter=business_date%20eq%20%27{{ (now() + timedelta(days=1)).strftime('%Y-%m-%d') }}%27
    method: GET
    scan_interval: 900
    timeout: 30
    headers:
      Accept: application/json
    sensor:
      - name: "Hoymiles RCE Day Tomorrow"
        unique_id: hoymiles_rce_day_tomorrow
        icon: mdi:chart-areaspline
        value_template: "{{ value_json.value | count }}"
        json_attributes:
          - value

template:
  - sensor:
      # Rejestr zbiorczy LOAD 2169/30015 obejmuje również zużycie własne
      # falowników i straty przetwarzania. Suma faz 2170-2172 odpowiada
      # rzeczywistemu obciążeniu odbiorników i jest odpytywana szybkim blokiem.
      - name: "Hoymiles Actual Load Power"
        unique_id: hoymiles_actual_load_power
        icon: mdi:home-lightning-bolt-outline
        unit_of_measurement: "W"
        device_class: power
        state_class: measurement
        availability: >-
          {{ is_number(states('sensor.hoymiles_hit_load_power_l1n'))
             and is_number(states('sensor.hoymiles_hit_load_power_l2n'))
             and is_number(states('sensor.hoymiles_hit_load_power_l3n')) }}
        state: >-
          {% set l1 = [states('sensor.hoymiles_hit_load_power_l1n')
                       | float(0), 0] | max %}
          {% set l2 = [states('sensor.hoymiles_hit_load_power_l2n')
                       | float(0), 0] | max %}
          {% set l3 = [states('sensor.hoymiles_hit_load_power_l3n')
                       | float(0), 0] | max %}
          {{ (l1 + l2 + l3) | round(0) }}
        attributes:
          source_registers: "2170 + 2171 + 2172"
          excludes_inverter_self_consumption: true

      - name: "Hoymiles Actual Load Energy Today"
        unique_id: hoymiles_actual_load_energy_today
        icon: mdi:home-lightning-bolt-outline
        unit_of_measurement: "kWh"
        device_class: energy
        state_class: total_increasing
        availability: >-
          {{ is_number(states('sensor.hoymiles_hit_load_energy_use_l1n_today'))
             and is_number(states('sensor.hoymiles_hit_load_energy_use_l2n_today'))
             and is_number(states('sensor.hoymiles_hit_load_energy_use_l3n_today')) }}
        state: >-
          {% set l1 = [states('sensor.hoymiles_hit_load_energy_use_l1n_today')
                       | float(0), 0] | max %}
          {% set l2 = [states('sensor.hoymiles_hit_load_energy_use_l2n_today')
                       | float(0), 0] | max %}
          {% set l3 = [states('sensor.hoymiles_hit_load_energy_use_l3n_today')
                       | float(0), 0] | max %}
          {{ (l1 + l2 + l3) | round(1) }}
        attributes:
          source_registers: "2129 + 2130 + 2131"
          excludes_inverter_self_consumption: true

      - name: "Hoymiles EMS Push Notification Status"
        unique_id: hoymiles_ems_push_notification_status
        icon: >-
          {% set target =
            states('input_text.hoymiles_ems_push_notify_target') | trim %}
          {% if not
            is_state('input_boolean.hoymiles_ems_push_notifications_enabled', 'on') %}
            mdi:bell-off-outline
          {% elif target.startswith('notify.')
            and (expand(target) | list | count) > 0 %}
            mdi:bell-check-outline
          {% else %}
            mdi:bell-alert-outline
          {% endif %}
        state: >-
          {% set target =
            states('input_text.hoymiles_ems_push_notify_target') | trim %}
          {% if not
            is_state('input_boolean.hoymiles_ems_push_notifications_enabled', 'on') %}
            Disabled
          {% elif target.startswith('notify.')
            and (expand(target) | list | count) > 0 %}
            Ready
          {% else %}
            No valid notify entity
          {% endif %}

  # Okno ochronne trwa od 90 minut przed zachodem do 90 minut po wschodzie.
  # Próbkowanie co minutę ogranicza liczbę próbek statystycznych, zachowując
  # wystarczającą dokładność prognozy zużycia nocnego.
  - triggers:
      - trigger: time_pattern
        minutes: "/1"
      - trigger: homeassistant
        event: start
      - trigger: state
        entity_id: sun.sun
    binary_sensor:
      - name: "Hoymiles Night Protection Window"
        unique_id: hoymiles_night_protection_window
        icon: mdi:weather-night
        availability: >-
          {{ as_timestamp(state_attr('sun.sun', 'next_rising'), 0) > 0
             and as_timestamp(state_attr('sun.sun', 'next_setting'), 0) > 0 }}
        state: >-
          {% set current = as_timestamp(now()) %}
          {% set rising =
            as_timestamp(state_attr('sun.sun', 'next_rising'), 0) %}
          {% set setting =
            as_timestamp(state_attr('sun.sun', 'next_setting'), 0) %}
          {% set buffer = 90 * 60 %}
          {% set previous_rising = rising - 24 * 60 * 60 %}
          {% set shortly_after_rising =
            is_state('sun.sun', 'above_horizon')
            and 0 <= current - previous_rising <= buffer %}
          {% set shortly_before_setting =
            is_state('sun.sun', 'above_horizon')
            and 0 <= setting - current <= buffer %}
          {{ is_state('sun.sun', 'below_horizon')
             or shortly_after_rising
             or shortly_before_setting }}

    sensor:
      - name: "Hoymiles Night Protection Window Duration"
        unique_id: hoymiles_night_protection_window_duration
        icon: mdi:weather-sunset-down
        unit_of_measurement: "h"
        state_class: measurement
        availability: >-
          {{ as_timestamp(state_attr('sun.sun', 'next_rising'), 0) > 0
             and as_timestamp(state_attr('sun.sun', 'next_setting'), 0) > 0 }}
        state: >-
          {% set rising =
            as_timestamp(state_attr('sun.sun', 'next_rising'), 0) %}
          {% set setting =
            as_timestamp(state_attr('sun.sun', 'next_setting'), 0) %}
          {% set night_start =
            setting if setting < rising else setting - 24 * 60 * 60 %}
          {% set duration = (rising - night_start + 3 * 60 * 60) / 3600 %}
          {{ ([[duration, 0] | max, 24] | min) | round(2) }}

      - name: "Hoymiles Night Protection Window Remaining"
        unique_id: hoymiles_night_protection_window_remaining
        icon: mdi:weather-sunset-up
        unit_of_measurement: "h"
        state_class: measurement
        availability: >-
          {{ as_timestamp(state_attr('sun.sun', 'next_rising'), 0) > 0
             and as_timestamp(state_attr('sun.sun', 'next_setting'), 0) > 0 }}
        state: >-
          {% set current = as_timestamp(now()) %}
          {% set rising =
            as_timestamp(state_attr('sun.sun', 'next_rising'), 0) %}
          {% set setting =
            as_timestamp(state_attr('sun.sun', 'next_setting'), 0) %}
          {% set buffer = 90 * 60 %}
          {% set previous_rising = rising - 24 * 60 * 60 %}
          {% set shortly_after_rising =
            is_state('sun.sun', 'above_horizon')
            and 0 <= current - previous_rising <= buffer %}
          {% set upcoming_start = setting - buffer %}
          {% set upcoming_end = rising + buffer %}
          {% if shortly_after_rising %}
            {{ (([previous_rising + buffer - current, 0] | max) / 3600)
               | round(2) }}
          {% elif is_state('sun.sun', 'below_horizon') %}
            {{ (([upcoming_end - current, 0] | max) / 3600) | round(2) }}
          {% elif current >= upcoming_start %}
            {{ (([upcoming_end - current, 0] | max) / 3600) | round(2) }}
          {% else %}
            {{ (([upcoming_end - upcoming_start, 0] | max) / 3600)
               | round(2) }}
          {% endif %}

      - name: "Hoymiles Night Protected Load Power"
        unique_id: hoymiles_night_protected_load_power
        icon: mdi:home-lightning-bolt-outline
        unit_of_measurement: "W"
        device_class: power
        state_class: measurement
        availability: >-
          {{ is_number(
               states('sensor.hoymiles_actual_load_power'))
             and as_timestamp(state_attr('sun.sun', 'next_rising'), 0) > 0
             and as_timestamp(state_attr('sun.sun', 'next_setting'), 0) > 0 }}
        state: >-
          {% set current = as_timestamp(now()) %}
          {% set rising =
            as_timestamp(state_attr('sun.sun', 'next_rising'), 0) %}
          {% set setting =
            as_timestamp(state_attr('sun.sun', 'next_setting'), 0) %}
          {% set buffer = 90 * 60 %}
          {% set previous_rising = rising - 24 * 60 * 60 %}
          {% set shortly_after_rising =
            is_state('sun.sun', 'above_horizon')
            and 0 <= current - previous_rising <= buffer %}
          {% set shortly_before_setting =
            is_state('sun.sun', 'above_horizon')
            and 0 <= setting - current <= buffer %}
          {% set in_window =
            is_state('sun.sun', 'below_horizon')
            or shortly_after_rising
            or shortly_before_setting %}
          {% set load =
            states('sensor.hoymiles_actual_load_power')
            | float(0) %}
          {{ ([load, 0] | max if in_window else 0) | round(0) }}

  - sensor:
      - name: "Hoymiles RCE Grid Export Power"
        unique_id: hoymiles_rce_grid_export_power
        icon: mdi:transmission-tower-export
        unit_of_measurement: "kW"
        device_class: power
        state_class: measurement
        availability: >-
          {{ is_number(
               states('sensor.hoymiles_hit_overview_grid_total_active_power')) }}
        state: >-
          {% set grid =
            states('sensor.hoymiles_hit_overview_grid_total_active_power')
            | float(0) %}
          {# A positive register value means power exported to the grid. #}
          {{ ([grid / 1000, 0] | max) | round(3) }}

      - name: "Hoymiles RCE BMS Safe Discharge Power"
        unique_id: hoymiles_rce_bms_safe_discharge_power
        icon: mdi:battery-lock-open-outline
        unit_of_measurement: "kW"
        device_class: power
        state_class: measurement
        availability: >-
          {{ is_number(states(
               'sensor.hoymiles_hit_maximum_discharge_current'))
             and is_number(states(
               'sensor.hoymiles_hit_battery_voltage_bms'))
             and is_number(states(
               'input_number.hoymiles_rce_export_efficiency'))
             and (states(
               'sensor.hoymiles_hit_maximum_discharge_current')
               | float(0)) > 0
             and (states(
               'sensor.hoymiles_hit_battery_voltage_bms')
               | float(0)) > 0 }}
        state: >-
          {% set current =
            states('sensor.hoymiles_hit_maximum_discharge_current')
            | float(0) %}
          {% set voltage =
            states('sensor.hoymiles_hit_battery_voltage_bms')
            | float(0) %}
          {% set efficiency =
            states('input_number.hoymiles_rce_export_efficiency')
            | float(95) / 100 %}
          {# A 5% buffer protects against changes in voltage and the BMS limit. #}
          {{ (current * voltage / 1000 * efficiency * 0.95) | round(2) }}
        attributes:
          maximum_discharge_current_a: >-
            {{ states('sensor.hoymiles_hit_maximum_discharge_current') }}
          battery_voltage_v: >-
            {{ states('sensor.hoymiles_hit_battery_voltage_bms') }}
          bms_safety_margin_percent: 5

      - name: "Hoymiles RCE Effective Discharge Power Percent"
        unique_id: hoymiles_rce_effective_discharge_power_percent
        icon: mdi:speedometer-slow
        unit_of_measurement: "%"
        state_class: measurement
        availability: >-
          {% set rated =
            states('input_select.hoymiles_rce_inverter_rated_power')
            | replace(' kW', '') | float(0) %}
          {{ rated > 0
             and is_number(states(
               'sensor.hoymiles_rce_bms_safe_discharge_power'))
             and is_number(states(
               'input_number.hoymiles_rce_requested_discharge_power')) }}
        state: >-
          {% set rated =
            states('input_select.hoymiles_rce_inverter_rated_power')
            | replace(' kW', '') | float(0) %}
          {% set raw_count =
            states(
              'sensor.hoymiles_hit_number_of_machines_master_and_slave') %}
          {% set count =
            raw_count | float(1) | round(0) | int
            if is_number(raw_count) else 1 %}
          {% set count = [[count, 1] | max, 10] | min %}
          {% set system_power = rated * count %}
          {% set requested =
            states('input_number.hoymiles_rce_requested_discharge_power')
            | float(0) %}
          {% set bms_percent =
            states('sensor.hoymiles_rce_bms_safe_discharge_power')
            | float(0) / system_power * 100
            if system_power > 0 else 0 %}
