  hoymiles_rcm_latched_pre_discharge_target_soc:
    name: "RCEm 253 V+ — latched headroom-preparation SOC target"
    min: 0
    max: 100
    step: 0.1
    initial: 100
    mode: box
    unit_of_measurement: "%"
    icon: mdi:battery-lock

  hoymiles_rcm_latched_pre_discharge_power:
    name: "RCEm 253 V+ — latched headroom-preparation power"
    min: 0
    max: 100
    step: 0.1
    initial: 0
    mode: box
    unit_of_measurement: "%"
    icon: mdi:flash-lock-outline

  hoymiles_rcm_soc_safety_margin:
    name: "RCEm 253 V+ — SOC safety correction"
    min: 0
    max: 20
    step: 1
    initial: 2
    mode: slider
    unit_of_measurement: "%"
    icon: mdi:shield-plus-outline

  hoymiles_rcm_charge_efficiency:
    name: "RCEm 253 V+ — battery charging efficiency"
    min: 80
    max: 100
    step: 1
    initial: 95
    mode: slider
    unit_of_measurement: "%"
    icon: mdi:percent-outline

  # Pamięć ustawienia użytkownika. Pole nie jest pokazywane na dashboardzie.
  hoymiles_rcm_saved_battery_charge_power:
    name: "RCEm 253 V+ — saved global charging limit"
