# Oficjalne API PSE publikuje RCE w PLN/MWh w 96 okresach po 15 minut.
# Automatyka oraz dashboard łączą każde dwa kolejne okresy w 48 bloków
# półgodzinnych i przeliczają cenę na PLN/kWh.
rest:
  - resource_template: >-
      https://api.raporty.pse.pl/api/rce-pln?%24select=rce_pln%2Cperiod%2Cbusiness_date%2Cdtime_utc%2Cperiod_utc&%24filter=business_date%20eq%20%27{{ now().strftime('%Y-%m-%d') }}%27&%24orderby=dtime_utc%20asc
    method: GET
    scan_interval: 900
    timeout: 30
    headers:
      Accept: application/json
    sensor:
      - name: "Hoymiles RCE Day"
        unique_id: hoymiles_rce_day
        icon: mdi:chart-areaspline
        value_template: "{{ value_json.value | count }}"
        json_attributes:
          - value

  - resource_template: >-
      https://api.raporty.pse.pl/api/rce-pln?%24select=rce_pln%2Cperiod%2Cbusiness_date%2Cdtime_utc%2Cperiod_utc&%24filter=business_date%20eq%20%27{{ (now() + timedelta(days=1)).strftime('%Y-%m-%d') }}%27&%24orderby=dtime_utc%20asc
    method: GET
    scan_interval: 900
    timeout: 30
    headers:
      Accept: application/json
    sensor:
      - name: "Hoymiles RCE Day Tomorrow"
        unique_id: hoymiles_rce_day_tomorrow
        icon: mdi:chart-areaspline
        value_template: "{{ value_json.value | count }}"
        json_attributes:
          - value

template:
  - sensor:
      # Version marker used by the HACS integration to detect whether the
      # managed package copied during an update has already been loaded by HA.
      - name: "Hoymiles EMS Package Version"
        unique_id: hoymiles_ems_package_version
        icon: mdi:package-variant-closed-check
        state: "1.5.3"

      - name: "Hoymiles EMS Hardware Mode"
        unique_id: hoymiles_ems_hardware_mode
        icon: mdi:state-machine
        availability: >-
          {{ is_number(states('sensor.hoymiles_hit_ems_mode_readback_code'))
             and is_number(states(
               'sensor.hoymiles_hit_ems_control_readback_generation'))
             and (states(
               'sensor.hoymiles_hit_ems_verified_hardware_readback_supported')
               | float(0)) > 0.5 }}
        state: >-
          {% set code = states('sensor.hoymiles_hit_ems_mode_readback_code')
               | int(-1) %}
          {{ {0: 'self_use', 4: 'grid_charge',
              5: 'grid_discharge'}.get(code, 'unknown') }}
        attributes:
          raw_code: "{{ states('sensor.hoymiles_hit_ems_mode_readback_code') }}"
          readback_generation: >-
            {{ states('sensor.hoymiles_hit_ems_control_readback_generation') }}

      # Rejestr zbiorczy LOAD 2169/30015 obejmuje również zużycie własne
      # falowników i straty przetwarzania. Suma faz 2170-2172 odpowiada
      # rzeczywistemu obciążeniu odbiorników i jest odpytywana szybkim blokiem.
      - name: "Hoymiles Actual Load Power"
        unique_id: hoymiles_actual_load_power
        icon: mdi:home-lightning-bolt-outline
        unit_of_measurement: "W"
        device_class: power
        state_class: measurement
        availability: >-
          {{ is_number(states('sensor.hoymiles_hit_load_power_l1n'))
             and is_number(states('sensor.hoymiles_hit_load_power_l2n'))
             and is_number(states('sensor.hoymiles_hit_load_power_l3n')) }}
        state: >-
          {% set l1 = [states('sensor.hoymiles_hit_load_power_l1n')
                       | float(0), 0] | max %}
          {% set l2 = [states('sensor.hoymiles_hit_load_power_l2n')
                       | float(0), 0] | max %}
          {% set l3 = [states('sensor.hoymiles_hit_load_power_l3n')
                       | float(0), 0] | max %}
          {{ (l1 + l2 + l3) | round(0) }}
        attributes:
          source_registers: "2170 + 2171 + 2172"
          excludes_inverter_self_consumption: true

      - name: "Hoymiles Actual Load Energy Today"
        unique_id: hoymiles_actual_load_energy_today
        icon: mdi:home-lightning-bolt-outline
        unit_of_measurement: "kWh"
        device_class: energy
        state_class: total_increasing
        availability: >-
          {{ is_number(states('sensor.hoymiles_actual_load_energy_daily')) }}
        state: >-
          {{ states('sensor.hoymiles_actual_load_energy_daily')
             | float(0) | round(3) }}
        attributes:
          source_entity: sensor.hoymiles_actual_load_power
          integration_method: left
          excludes_inverter_self_consumption: true

      - name: "Hoymiles EMS Push Notification Status"
        unique_id: hoymiles_ems_push_notification_status
        icon: >-
          {% set target =
            states('input_text.hoymiles_ems_push_notify_target') | trim %}
          {% if not
            is_state('input_boolean.hoymiles_ems_push_notifications_enabled', 'on') %}
            mdi:bell-off-outline
          {% elif target.startswith('notify.')
            and (expand(target) | list | count) > 0 %}
            mdi:bell-check-outline
          {% else %}
            mdi:bell-alert-outline
          {% endif %}
        state: >-
          {% set target =
            states('input_text.hoymiles_ems_push_notify_target') | trim %}
          {% if not
            is_state('input_boolean.hoymiles_ems_push_notifications_enabled', 'on') %}
            Disabled
          {% elif target.startswith('notify.')
            and (expand(target) | list | count) > 0 %}
            Ready
          {% else %}
            No valid notify entity
          {% endif %}

  # A shared execution gate used by every automatic EMS writer. The status
  # published by ESPHome validates the detected topology and, for a parallel
  # installation, all configured Master/Slave addresses before HA may write.
  - binary_sensor:
      - name: "Hoymiles EMS Execution Ready"
        unique_id: hoymiles_ems_execution_ready
        icon: mdi:shield-check-outline
        state: >-
          {% set ems_code = states.sensor.hoymiles_hit_ems_mode_readback_code %}
          {% set ems_generation =
            states.sensor.hoymiles_hit_ems_control_readback_generation %}
          {% set topology_generation =
            states.sensor.hoymiles_hit_parallel_topology_readback_generation %}
          {% set esp_state = states.sensor.hoymiles_hit_esp_uptime %}
          {% set esp_reported = esp_state.last_reported
            if esp_state.last_reported is defined else esp_state.last_updated %}
          {% set esp_age = as_timestamp(now())
            - as_timestamp(esp_reported, 0) %}
          {% set ems_reported = ems_generation.last_reported
            if ems_generation.last_reported is defined
            else ems_generation.last_updated %}
          {% set topology_reported = topology_generation.last_reported
            if topology_generation.last_reported is defined
            else topology_generation.last_updated %}
          {% set ems_age = as_timestamp(now())
            - as_timestamp(ems_reported, 0) %}
          {% set topology_age = as_timestamp(now())
            - as_timestamp(topology_reported, 0) %}
          {{ states('sensor.hoymiles_hit_ems_verified_hardware_readback_supported')
               | float(0) > 0.5
             and is_number(ems_code.state)
             and (ems_code.state | int(-1)) in [0, 4, 5]
             and is_number(ems_generation.state)
             and is_number(topology_generation.state)
             and ems_age >= -5 and ems_age <= 180
             and topology_age >= -5 and topology_age <= 180
             and is_number(states(
               'sensor.hoymiles_hit_overview_battery_soc'))
             and is_number(states('sensor.hoymiles_hit_esp_uptime'))
             and esp_age >= -5 and esp_age <= 180 }}
        attributes:
          physical_mode_code: >-
            {{ states('sensor.hoymiles_hit_ems_mode_readback_code') }}
          hardware_readback_supported: >-
            {{ states(
              'sensor.hoymiles_hit_ems_verified_hardware_readback_supported')
              | float(0) > 0.5 }}
          detected_inverters: >-
            {{ states(
              'sensor.hoymiles_hit_number_of_machines_master_and_slave') }}
          liveness_source: sensor.hoymiles_hit_esp_uptime
          esp_uptime_age_seconds: >-
            {% set item = states.sensor.hoymiles_hit_esp_uptime %}
            {% set reported = item.last_reported
              if item.last_reported is defined else item.last_updated %}
            {{ (as_timestamp(now()) - as_timestamp(reported, 0))
               | round(0) }}
          reason: >-
            {% set ems = states('sensor.hoymiles_hit_ems_mode_readback_code') %}
            {% set esp_state = states.sensor.hoymiles_hit_esp_uptime %}
            {% set esp_reported = esp_state.last_reported
              if esp_state.last_reported is defined
              else esp_state.last_updated %}
            {% set esp_age = as_timestamp(now())
              - as_timestamp(esp_reported, 0) %}
            {% if not (states(
              'sensor.hoymiles_hit_ems_verified_hardware_readback_supported')
              | float(0) > 0.5) %}
              Verified hardware readback is not supported
            {% elif not is_number(ems) %}
              Physical EMS-mode readback is unavailable
            {% elif not is_number(states(
              'sensor.hoymiles_hit_overview_battery_soc')) %}
              Current battery SOC is unavailable
            {% elif not is_number(states('sensor.hoymiles_hit_esp_uptime')) %}
              No ESP32 liveness signal
            {% elif esp_age < 0 or esp_age > 180 %}
              ESP32 has not reported its liveness signal for more than 3 minutes
            {% else %}
              Ready
            {% endif %}

      - name: "Hoymiles RCE Control Data Ready"
        unique_id: hoymiles_rce_control_data_ready
        icon: mdi:database-check-outline
        state: >-
          {% set status = state_attr(
            'sensor.hoymiles_hit_rce_optimized_plan', 'status_code') %}
          {% set plan = states.sensor.hoymiles_hit_rce_optimized_plan %}
          {% set price = states.sensor.hoymiles_rce_current_price %}
          {% set source = states.sensor.hoymiles_rce_day %}
          {% set plan_reported = plan.last_reported
            if plan.last_reported is defined else plan.last_updated %}
          {% set price_reported = price.last_reported
            if price.last_reported is defined else price.last_updated %}
          {% set source_reported = source.last_reported
            if source.last_reported is defined else source.last_updated %}
          {% set plan_age = as_timestamp(now())
            - as_timestamp(plan_reported, 0) %}
          {% set price_age = as_timestamp(now())
            - as_timestamp(price_reported, 0) %}
          {% set source_age = as_timestamp(now())
            - as_timestamp(source_reported, 0) %}
          {{ is_state('binary_sensor.hoymiles_ems_execution_ready', 'on')
             and is_state('binary_sensor.hoymiles_ems_export_allowed', 'on')
             and state_attr('sensor.hoymiles_hit_rce_optimized_plan',
                            'result_current') is sameas true
             and status in ['ready', 'waiting_for_market', 'home_protected']
             and price_age >= -5 and price_age <= 300
             and plan_age >= -5 and plan_age <= 300
             and source_age >= -5 and source_age <= 1200
             and state_attr('sensor.hoymiles_hit_rce_optimized_plan',
                            'rce_today_data_fresh') is sameas true
             and state_attr('sensor.hoymiles_hit_rce_optimized_plan',
                             'forecast_today_data_fresh') is sameas true
             and state_attr('sensor.hoymiles_hit_rce_optimized_plan',
                            'gcf_execution_data_fresh') is sameas true
             and state_attr('sensor.hoymiles_hit_rce_optimized_plan',
                            'bms_discharge_data_fresh') is sameas true
             and state_attr('sensor.hoymiles_hit_rce_optimized_plan',
                            'bms_discharge_data_available') is sameas true
             and is_number(state_attr(
               'sensor.hoymiles_hit_rce_optimized_plan',
               'bms_discharge_data_age_seconds'))
             and (state_attr('sensor.hoymiles_hit_rce_optimized_plan',
                             'bms_discharge_data_age_seconds') | float(999))
                   >= -5
             and (state_attr('sensor.hoymiles_hit_rce_optimized_plan',
                             'bms_discharge_data_age_seconds') | float(999))
                   <= 300
             and state_attr('sensor.hoymiles_hit_rce_optimized_plan',
                            'soc_data_fresh') is sameas true
             and is_number(state_attr(
               'sensor.hoymiles_hit_rce_optimized_plan',
               'soc_data_age_seconds'))
             and (state_attr('sensor.hoymiles_hit_rce_optimized_plan',
                             'soc_data_age_seconds') | float(999)) >= -5
             and (state_attr('sensor.hoymiles_hit_rce_optimized_plan',
                             'soc_data_age_seconds') | float(999)) <= 120
             and is_number(states('sensor.hoymiles_rce_current_price'))
             and is_number(states(
               'sensor.hoymiles_rce_effective_minimum_soc'))
             and is_number(states(
               'sensor.hoymiles_rce_effective_discharge_power_percent'))
             and is_number(states(
               'sensor.hoymiles_hit_ems_force_discharge_soc_readback'))
             and is_number(states(
               'sensor.hoymiles_hit_ems_maximum_discharge_power_readback')) }}
        attributes:
          optimizer_status: >-
            {{ state_attr('sensor.hoymiles_hit_rce_optimized_plan',
                          'status_code') | default('missing_data', true) }}
          plan_age_seconds: >-
            {% set item = states.sensor.hoymiles_hit_rce_optimized_plan %}
            {% set reported = item.last_reported
              if item.last_reported is defined else item.last_updated %}
            {{ (as_timestamp(now()) - as_timestamp(reported, 0))
               | round(0) }}
          price_age_seconds: >-
            {% set item = states.sensor.hoymiles_rce_current_price %}
            {% set reported = item.last_reported
              if item.last_reported is defined else item.last_updated %}
            {{ (as_timestamp(now()) - as_timestamp(reported, 0))
               | round(0) }}
          reason: >-
            {% set plan = states.sensor.hoymiles_hit_rce_optimized_plan %}
            {% set price = states.sensor.hoymiles_rce_current_price %}
            {% set source = states.sensor.hoymiles_rce_day %}
            {% set plan_reported = plan.last_reported
              if plan.last_reported is defined else plan.last_updated %}
            {% set price_reported = price.last_reported
              if price.last_reported is defined else price.last_updated %}
            {% set source_reported = source.last_reported
              if source.last_reported is defined else source.last_updated %}
            {% set plan_age = as_timestamp(now())
              - as_timestamp(plan_reported, 0) %}
            {% set price_age = as_timestamp(now())
              - as_timestamp(price_reported, 0) %}
            {% set source_age = as_timestamp(now())
              - as_timestamp(source_reported, 0) %}
            {% if not is_state(
              'binary_sensor.hoymiles_ems_execution_ready', 'on') %}
              EMS control or the parallel network is not ready
            {% elif not is_state(
              'binary_sensor.hoymiles_ems_export_allowed', 'on') %}
              Export is blocked by GCF or a 0% limit
            {% elif state_attr('sensor.hoymiles_hit_rce_optimized_plan',
                               'status_code')
                    in ['missing_data', 'optimizer_error', none] %}
              The RCE plan is stale or incomplete
            {% elif state_attr('sensor.hoymiles_hit_rce_optimized_plan',
                               'rce_today_data_fresh') is not sameas true %}
              Today's RCE data is stale or incomplete
            {% elif state_attr('sensor.hoymiles_hit_rce_optimized_plan',
                               'forecast_today_data_fresh') is not sameas true %}
              Today's PV forecast is stale or incomplete
            {% elif state_attr('sensor.hoymiles_hit_rce_optimized_plan',
                               'gcf_execution_data_fresh') is not sameas true %}
              The GCF state or its export limit is stale
            {% elif not is_number(states(
              'sensor.hoymiles_rce_current_price')) %}
              Current RCE price is unavailable
            {% elif price_age < 0 or price_age > 300 %}
              RCE price has not been reported for more than 5 minutes
            {% elif plan_age > 300 and source_age > 1200 %}
              The RCE plan and PSE data are stale
            {% else %}
              Ready
            {% endif %}

      - name: "Hoymiles EMS Export Allowed"
        unique_id: hoymiles_ems_export_allowed
        icon: mdi:transmission-tower-export
        state: >-
          {% set gcf = states('sensor.hoymiles_hit_gcf_enable_readback_code') %}
          {% set limit = states(
            'sensor.hoymiles_hit_gcf_maximum_export_power_readback') %}
          {% set generation =
            states.sensor.hoymiles_hit_gcf_control_readback_generation %}
          {% set reported = generation.last_reported
            if generation.last_reported is defined else generation.last_updated %}
          {% set age = as_timestamp(now()) - as_timestamp(reported, 0) %}
          {{ (states(
               'sensor.hoymiles_hit_ems_verified_hardware_readback_supported')
               | float(0) > 0.5)
             and is_number(gcf) and is_number(limit)
             and is_number(generation.state)
             and age >= -5 and age <= 180
             and ((gcf | int(-1)) == 0
                  or ((gcf | int(-1)) == 1 and (limit | float(0)) > 0)) }}
        attributes:
          gcf: >-
            {{ states('sensor.hoymiles_hit_gcf_enable_readback_code') }}
          export_limit_percent: >-
            {{ states(
              'sensor.hoymiles_hit_gcf_maximum_export_power_readback') }}
          reason: >-
            {% set gcf = states('sensor.hoymiles_hit_gcf_enable_readback_code') %}
            {% set limit = states(
              'sensor.hoymiles_hit_gcf_maximum_export_power_readback') %}
            {% if is_number(gcf) and (gcf | int(-1)) == 0 %}
              GCF disabled — export is not constrained by a GCF limit
            {% elif is_number(gcf) and (gcf | int(-1)) == 1 and is_number(limit)
                    and (limit | float(0)) > 0 %}
              Export permitted by GCF
            {% elif is_number(gcf) and (gcf | int(-1)) == 1 and is_number(limit) %}
              Zero Export — limit GCF wynosi 0%
            {% else %}
              Export settings are not confirmed
            {% endif %}

      - name: "Hoymiles Tariff Control Data Ready"
        unique_id: hoymiles_tariff_control_data_ready
        icon: mdi:database-check-outline
        state: >-
          {% set status = state_attr(
            'sensor.hoymiles_hit_tariff_charge_plan', 'status_code') %}
          {% set plan = states.sensor.hoymiles_hit_tariff_charge_plan %}
          {% set forecast = states.sensor.hoymiles_solcast_forecast_today %}
          {% set plan_reported = plan.last_reported
            if plan.last_reported is defined else plan.last_updated %}
          {% set forecast_reported = forecast.last_reported
            if forecast.last_reported is defined else forecast.last_updated %}
          {% set plan_age = as_timestamp(now())
            - as_timestamp(plan_reported, 0) %}
          {% set forecast_age = as_timestamp(now())
            - as_timestamp(forecast_reported, 0) %}
          {{ is_state('binary_sensor.hoymiles_ems_execution_ready', 'on')
             and state_attr('sensor.hoymiles_hit_tariff_charge_plan',
                            'result_current') is sameas true
             and status in [
               'ready',
               'insufficient_cheap_window',
               'no_charge_needed',
               'no_discount_window',
               'not_economically_beneficial',
               'shortage_in_low_period',
               'no_cheap_window']
             and plan_age >= 0 and plan_age <= 300
             and forecast_age >= 0 and forecast_age <= 300
             and state_attr(
               'sensor.hoymiles_hit_tariff_charge_plan',
               'control_inputs_fresh') is sameas true
             and is_number(states('sensor.hoymiles_tariff_target_soc'))
             and is_number(states(
               'sensor.hoymiles_hit_ems_force_charge_soc_readback'))
             and is_number(states(
               'sensor.hoymiles_hit_ems_maximum_charge_power_readback')) }}
        attributes:
          optimizer_status: >-
            {{ state_attr('sensor.hoymiles_hit_tariff_charge_plan',
                          'status_code') | default('missing_data', true) }}
          plan_age_seconds: >-
            {% set item = states.sensor.hoymiles_hit_tariff_charge_plan %}
            {% set reported = item.last_reported
              if item.last_reported is defined else item.last_updated %}
            {{ (as_timestamp(now()) - as_timestamp(reported, 0))
               | round(0) }}
          reason: >-
            {% set plan = states.sensor.hoymiles_hit_tariff_charge_plan %}
            {% set forecast = states.sensor.hoymiles_solcast_forecast_today %}
            {% set plan_reported = plan.last_reported
              if plan.last_reported is defined else plan.last_updated %}
            {% set forecast_reported = forecast.last_reported
              if forecast.last_reported is defined else forecast.last_updated %}
            {% set plan_age = as_timestamp(now())
              - as_timestamp(plan_reported, 0) %}
            {% set forecast_age = as_timestamp(now())
              - as_timestamp(forecast_reported, 0) %}
            {% if not is_state(
              'binary_sensor.hoymiles_ems_execution_ready', 'on') %}
              EMS control or the parallel network is not ready
            {% elif state_attr('sensor.hoymiles_hit_tariff_charge_plan',
                               'status_code')
                    in ['missing_data', 'optimizer_error', 'learning', none] %}
              The tariff plan is stale or incomplete
            {% elif plan_age < 0 or plan_age > 300 %}
              The tariff plan has not been reported for more than 5 minutes
            {% elif forecast_age < 0 or forecast_age > 300 %}
              The tariff forecast has not been reported for more than 5 minutes
            {% elif state_attr(
              'sensor.hoymiles_hit_tariff_charge_plan',
              'control_inputs_fresh') is not sameas true %}
              Tariff control data is stale: {{ state_attr(
                'sensor.hoymiles_hit_tariff_charge_plan',
                'control_input_block_reason') | default('data unavailable', true) }}
            {% else %}
              Ready
            {% endif %}

  # Okno ochronne trwa od 90 minut przed zachodem do 90 minut po wschodzie.
  # Próbkowanie co minutę ogranicza liczbę samples statystycznych, zachowując
  # wystarczającą dokładność prognozy zużycia nocnego.
  - triggers:
      - trigger: time_pattern
        minutes: "/1"
      - trigger: homeassistant
        event: start
      - trigger: state
        entity_id: sun.sun
    binary_sensor:
      - name: "Hoymiles Night Protection Window"
        unique_id: hoymiles_night_protection_window
        icon: mdi:weather-night
        availability: >-
          {{ as_timestamp(state_attr('sun.sun', 'next_rising'), 0) > 0
             and as_timestamp(state_attr('sun.sun', 'next_setting'), 0) > 0 }}
        state: >-
          {% set current = as_timestamp(now()) %}
          {% set rising =
            as_timestamp(state_attr('sun.sun', 'next_rising'), 0) %}
          {% set setting =
            as_timestamp(state_attr('sun.sun', 'next_setting'), 0) %}
          {% set buffer = 90 * 60 %}
          {% set previous_rising = rising - 24 * 60 * 60 %}
          {% set shortly_after_rising =
            is_state('sun.sun', 'above_horizon')
            and 0 <= current - previous_rising <= buffer %}
          {% set shortly_before_setting =
            is_state('sun.sun', 'above_horizon')
            and 0 <= setting - current <= buffer %}
          {{ is_state('sun.sun', 'below_horizon')
             or shortly_after_rising
             or shortly_before_setting }}

    sensor:
      - name: "Hoymiles Night Protection Window Duration"
        unique_id: hoymiles_night_protection_window_duration
        icon: mdi:weather-sunset-down
        unit_of_measurement: "h"
        state_class: measurement
        availability: >-
          {{ as_timestamp(state_attr('sun.sun', 'next_rising'), 0) > 0
             and as_timestamp(state_attr('sun.sun', 'next_setting'), 0) > 0 }}
        state: >-
          {% set rising =
            as_timestamp(state_attr('sun.sun', 'next_rising'), 0) %}
          {% set setting =
            as_timestamp(state_attr('sun.sun', 'next_setting'), 0) %}
          {% set night_start =
            setting if setting < rising else setting - 24 * 60 * 60 %}
          {% set duration = (rising - night_start + 3 * 60 * 60) / 3600 %}
          {{ ([[duration, 0] | max, 24] | min) | round(2) }}

      - name: "Hoymiles Night Protection Window Remaining"
        unique_id: hoymiles_night_protection_window_remaining
        icon: mdi:weather-sunset-up
        unit_of_measurement: "h"
        state_class: measurement
        availability: >-
          {{ as_timestamp(state_attr('sun.sun', 'next_rising'), 0) > 0
             and as_timestamp(state_attr('sun.sun', 'next_setting'), 0) > 0 }}
        state: >-
          {% set current = as_timestamp(now()) %}
          {% set rising =
            as_timestamp(state_attr('sun.sun', 'next_rising'), 0) %}
          {% set setting =
            as_timestamp(state_attr('sun.sun', 'next_setting'), 0) %}
          {% set buffer = 90 * 60 %}
          {% set previous_rising = rising - 24 * 60 * 60 %}
          {% set shortly_after_rising =
            is_state('sun.sun', 'above_horizon')
            and 0 <= current - previous_rising <= buffer %}
          {% set upcoming_start = setting - buffer %}
          {% set upcoming_end = rising + buffer %}
          {% if shortly_after_rising %}
            {{ (([previous_rising + buffer - current, 0] | max) / 3600)
               | round(2) }}
          {% elif is_state('sun.sun', 'below_horizon') %}
            {{ (([upcoming_end - current, 0] | max) / 3600) | round(2) }}
          {% elif current >= upcoming_start %}
            {{ (([upcoming_end - current, 0] | max) / 3600) | round(2) }}
          {% else %}
            {{ (([upcoming_end - upcoming_start, 0] | max) / 3600)
               | round(2) }}
          {% endif %}

      - name: "Hoymiles Night Protected Load Power"
        unique_id: hoymiles_night_protected_load_power
        icon: mdi:home-lightning-bolt-outline
        unit_of_measurement: "W"
        device_class: power
        state_class: measurement
        availability: >-
          {{ is_number(
               states('sensor.hoymiles_actual_load_power'))
             and as_timestamp(state_attr('sun.sun', 'next_rising'), 0) > 0
             and as_timestamp(state_attr('sun.sun', 'next_setting'), 0) > 0 }}
        state: >-
          {% set current = as_timestamp(now()) %}
          {% set rising =
            as_timestamp(state_attr('sun.sun', 'next_rising'), 0) %}
          {% set setting =
            as_timestamp(state_attr('sun.sun', 'next_setting'), 0) %}
          {% set buffer = 90 * 60 %}
          {% set previous_rising = rising - 24 * 60 * 60 %}
          {% set shortly_after_rising =
            is_state('sun.sun', 'above_horizon')
            and 0 <= current - previous_rising <= buffer %}
          {% set shortly_before_setting =
            is_state('sun.sun', 'above_horizon')
            and 0 <= setting - current <= buffer %}
          {% set in_window =
            is_state('sun.sun', 'below_horizon')
            or shortly_after_rising
            or shortly_before_setting %}
          {% set load =
            states('sensor.hoymiles_actual_load_power')
            | float(0) %}
          {{ ([load, 0] | max if in_window else 0) | round(0) }}

  - sensor:
      - name: "Hoymiles RCE Grid Export Power"
        unique_id: hoymiles_rce_grid_export_power
        icon: mdi:transmission-tower-export
        unit_of_measurement: "kW"
        device_class: power
        state_class: measurement
        availability: >-
          {{ is_number(
               states('sensor.hoymiles_hit_overview_grid_total_active_power')) }}
        state: >-
          {% set grid =
            states('sensor.hoymiles_hit_overview_grid_total_active_power')
            | float(0) %}
          {# A positive register value means power exported to the grid. #}
          {{ ([grid / 1000, 0] | max) | round(3) }}

      - name: "Hoymiles RCE BMS Safe Discharge Power"
        unique_id: hoymiles_rce_bms_safe_discharge_power
        icon: mdi:battery-lock-open-outline
        unit_of_measurement: "kW"
        device_class: power
        state_class: measurement
        availability: >-
          {{ is_number(states(
               'sensor.hoymiles_hit_maximum_discharge_current'))
             and is_number(states(
               'sensor.hoymiles_hit_battery_voltage_bms'))
             and is_number(states(
               'input_number.hoymiles_rce_export_efficiency'))
             and (states(
               'sensor.hoymiles_hit_maximum_discharge_current')
               | float(0)) > 0
             and (states(
               'sensor.hoymiles_hit_battery_voltage_bms')
               | float(0)) > 0 }}
        state: >-
          {% set current =
            states('sensor.hoymiles_hit_maximum_discharge_current')
            | float(0) %}
          {% set voltage =
            states('sensor.hoymiles_hit_battery_voltage_bms')
            | float(0) %}
          {% set efficiency =
            states('input_number.hoymiles_rce_export_efficiency')
            | float(95) / 100 %}
          {# A 5% buffer protects against changes in voltage and the BMS limit. #}
          {{ (current * voltage / 1000 * efficiency * 0.95) | round(2) }}
        attributes:
          maximum_discharge_current_a: >-
            {{ states('sensor.hoymiles_hit_maximum_discharge_current') }}
          battery_voltage_v: >-
            {{ states('sensor.hoymiles_hit_battery_voltage_bms') }}
          bms_safety_margin_percent: 5

      - name: "Hoymiles RCE Effective Discharge Power Percent"
        unique_id: hoymiles_rce_effective_discharge_power_percent
        icon: mdi:speedometer-slow
        unit_of_measurement: "%"
        state_class: measurement
        availability: >-
          {% set rated =
            states('input_select.hoymiles_rce_inverter_rated_power')
            | replace(' kW', '') | float(0) %}
           {{ rated > 0
              and is_number(states(
                'sensor.hoymiles_rce_bms_safe_discharge_power'))
              and is_number(states(
                'input_number.hoymiles_rce_requested_discharge_power'))
              and is_number(state_attr(
                'sensor.hoymiles_hit_rce_optimized_plan',
                'current_slot_execution_power_percent')) }}
        state: >-
          {% set rated =
            states('input_select.hoymiles_rce_inverter_rated_power')
            | replace(' kW', '') | float(0) %}
          {% set raw_count =
            states(
              'sensor.hoymiles_hit_number_of_machines_master_and_slave') %}
          {% set count =
            raw_count | float(1) | round(0) | int
            if is_number(raw_count) else 1 %}
          {% set count = [[count, 1] | max, 10] | min %}
          {% set system_power = rated * count %}
          {% set requested =
            states('input_number.hoymiles_rce_requested_discharge_power')
            | float(0) %}
           {% set bms_percent =
             states('sensor.hoymiles_rce_bms_safe_discharge_power')
             | float(0) / system_power * 100
             if system_power > 0 else 0 %}
          {% set planned = state_attr(
            'sensor.hoymiles_hit_rce_optimized_plan',
            'current_slot_execution_power_percent') | float(0) %}
          {{ ([[requested, bms_percent, planned, 100] | min, 0] | max)
             | round(1) }}
        attributes:
          requested_percent: >-
            {{ states('input_number.hoymiles_rce_requested_discharge_power') }}
          bms_safe_power_kw: >-
            {{ states('sensor.hoymiles_rce_bms_safe_discharge_power') }}
          planned_execution_percent: >-
            {{ state_attr('sensor.hoymiles_hit_rce_optimized_plan',
                          'current_slot_execution_power_percent') }}
          planned_export_power_kw: >-
            {{ state_attr('sensor.hoymiles_hit_rce_optimized_plan',
                          'current_slot_execution_export_power_kw') }}
          planned_total_discharge_power_kw: >-
            {{ state_attr('sensor.hoymiles_hit_rce_optimized_plan',
                          'current_slot_execution_discharge_power_kw') }}
          inverter_count: >-
            {{ states(
              'sensor.hoymiles_hit_number_of_machines_master_and_slave') }}
          rated_power_each: >-
            {{ states('input_select.hoymiles_rce_inverter_rated_power') }}

      - name: "Hoymiles RCE Revenue Rate"
        unique_id: hoymiles_rce_revenue_rate
        icon: mdi:cash-fast
        unit_of_measurement: "PLN/h"
        state_class: measurement
        availability: >-
          {{ is_number(states('sensor.hoymiles_rce_grid_export_power'))
             and is_number(states('sensor.hoymiles_rce_current_price')) }}
        state: >-
          {% set power =
            states('sensor.hoymiles_rce_grid_export_power') | float(0) %}
          {% set price =
            states('sensor.hoymiles_rce_current_price') | float(0) %}
          {{ (power * price) | round(4) }}

      - name: "Hoymiles RCE Current Price"
        unique_id: hoymiles_rce_current_price
        icon: mdi:cash-clock
        unit_of_measurement: "PLN/kWh"
        state_class: measurement
        availability: >-
          {{ is_number(state_attr(
            'sensor.hoymiles_hit_rce_optimized_plan',
            'current_price_pln_kwh')) }}
        state: >-
          {{ state_attr('sensor.hoymiles_hit_rce_optimized_plan',
                        'current_price_pln_kwh') | float(0) | round(6) }}

      - name: "Hoymiles Solcast Forecast Today"
        unique_id: hoymiles_solcast_forecast_today
        icon: mdi:weather-sunny
        unit_of_measurement: "kWh"
        device_class: energy
        availability: >-
          {% set refresh = now().minute %}
          {% set configured =
            states('input_text.hoymiles_solcast_forecast_today_entity')
            | trim %}
          {% set candidates = [
            configured,
            'sensor.solcast_pv_forecast_forecast_today',
            'sensor.solcast_pv_forecast_prognoza_na_dzisiaj',
            'sensor.solcast_forecast_today'
          ] %}
          {% set ns = namespace(value=none) %}
          {% for entity in candidates if entity and ns.value is none %}
            {% if is_number(states(entity)) %}
              {% set ns.value = states(entity) | float(0) %}
            {% endif %}
          {% endfor %}
          {{ ns.value is not none }}
        state: >-
          {% set refresh = now().minute %}
          {% set configured =
            states('input_text.hoymiles_solcast_forecast_today_entity')
            | trim %}
          {% set candidates = [
            configured,
            'sensor.solcast_pv_forecast_forecast_today',
            'sensor.solcast_pv_forecast_prognoza_na_dzisiaj',
            'sensor.solcast_forecast_today'
          ] %}
          {% set ns = namespace(value=none) %}
          {% for entity in candidates if entity and ns.value is none %}
            {% if is_number(states(entity)) %}
              {% set ns.value = states(entity) | float(0) %}
            {% endif %}
          {% endfor %}
          {{ ns.value | round(2) if ns.value is not none else none }}
        attributes:
          source_entity: >-
            {% set configured =
              states('input_text.hoymiles_solcast_forecast_today_entity')
              | trim %}
            {% set candidates = [
              configured,
              'sensor.solcast_pv_forecast_forecast_today',
              'sensor.solcast_pv_forecast_prognoza_na_dzisiaj',
              'sensor.solcast_forecast_today'
            ] %}
            {% set ns = namespace(entity='') %}
            {% for entity in candidates if entity and not ns.entity %}
              {% if is_number(states(entity)) %}
                {% set ns.entity = entity %}
              {% endif %}
            {% endfor %}
            {{ ns.entity or 'none' }}

      - name: "Hoymiles Solcast Forecast Remaining Today"
        unique_id: hoymiles_solcast_forecast_remaining_today
        icon: mdi:weather-sunset-up
        unit_of_measurement: "kWh"
        device_class: energy
        availability: >-
          {% set candidates = [
            'sensor.solcast_pv_forecast_forecast_remaining_today',
            'sensor.solcast_pv_forecast_pozostala_prognoza_na_dzis',
            'sensor.solcast_forecast_remaining_today'
          ] %}
          {% set ns = namespace(value=none) %}
          {% for entity in candidates if ns.value is none %}
            {% if is_number(states(entity)) %}
              {% set ns.value = states(entity) | float(0) %}
            {% endif %}
          {% endfor %}
          {{ ns.value is not none
             or (is_number(states('sensor.hoymiles_solcast_forecast_today'))
                 and is_number(
                   states('sensor.hoymiles_hit_pv_total_energy_today'))) }}
        state: >-
          {% set candidates = [
            'sensor.solcast_pv_forecast_forecast_remaining_today',
            'sensor.solcast_pv_forecast_pozostala_prognoza_na_dzis',
            'sensor.solcast_forecast_remaining_today'
          ] %}
          {% set ns = namespace(value=none) %}
          {% for entity in candidates if ns.value is none %}
            {% if is_number(states(entity)) %}
              {% set ns.value = states(entity) | float(0) %}
            {% endif %}
          {% endfor %}
          {% if ns.value is not none %}
            {{ ns.value | round(2) }}
          {% else %}
            {% set forecast =
              states('sensor.hoymiles_solcast_forecast_today') | float(0) %}
            {% set actual =
              states('sensor.hoymiles_hit_pv_total_energy_today') | float(0) %}
            {{ ([forecast - actual, 0] | max) | round(2) }}
          {% endif %}

      - name: "Hoymiles Solcast Forecast Tomorrow"
        unique_id: hoymiles_solcast_forecast_tomorrow
        icon: mdi:weather-partly-cloudy
        unit_of_measurement: "kWh"
        device_class: energy
        availability: >-
          {% set refresh = now().minute %}
          {% set configured =
            states('input_text.hoymiles_solcast_forecast_tomorrow_entity')
            | trim %}
          {% set candidates = [
            configured,
            'sensor.solcast_pv_forecast_forecast_tomorrow',
            'sensor.solcast_pv_forecast_prognoza_na_jutro',
            'sensor.solcast_forecast_tomorrow'
          ] %}
          {% set ns = namespace(value=none) %}
          {% for entity in candidates if entity and ns.value is none %}
            {% if is_number(states(entity)) %}
              {% set ns.value = states(entity) | float(0) %}
            {% endif %}
          {% endfor %}
          {{ ns.value is not none }}
        state: >-
          {% set refresh = now().minute %}
          {% set configured =
            states('input_text.hoymiles_solcast_forecast_tomorrow_entity')
            | trim %}
          {% set candidates = [
            configured,
            'sensor.solcast_pv_forecast_forecast_tomorrow',
            'sensor.solcast_pv_forecast_prognoza_na_jutro',
            'sensor.solcast_forecast_tomorrow'
          ] %}
          {% set ns = namespace(value=none) %}
          {% for entity in candidates if entity and ns.value is none %}
            {% if is_number(states(entity)) %}
              {% set ns.value = states(entity) | float(0) %}
            {% endif %}
          {% endfor %}
          {{ ns.value | round(2) if ns.value is not none else none }}
        attributes:
          source_entity: >-
            {% set configured =
              states('input_text.hoymiles_solcast_forecast_tomorrow_entity')
              | trim %}
            {% set candidates = [
              configured,
              'sensor.solcast_pv_forecast_forecast_tomorrow',
              'sensor.solcast_pv_forecast_prognoza_na_jutro',
              'sensor.solcast_forecast_tomorrow'
            ] %}
            {% set ns = namespace(entity='') %}
            {% for entity in candidates if entity and not ns.entity %}
              {% if is_number(states(entity)) %}
                {% set ns.entity = entity %}
              {% endif %}
            {% endfor %}
            {{ ns.entity or 'none' }}

      - name: "Hoymiles Load Average 4 Days"
        unique_id: hoymiles_load_average_4_days
        icon: mdi:home-lightning-bolt-outline
        unit_of_measurement: "kWh"
        device_class: energy
        availability: >-
          {% set recorder_average =
            state_attr('sensor.hoymiles_hit_rce_optimized_plan',
                       'recorder_load_average_4d_kwh') %}
          {% set recorder_days =
            state_attr('sensor.hoymiles_hit_rce_optimized_plan',
                       'recorder_load_history_days') | int(0) %}
          {% set coverage =
            state_attr('sensor.hoymiles_load_energy_last_4_days',
                       'age_coverage_ratio') | float(0) %}
          {{ (is_number(recorder_average) and recorder_days >= 1)
             or (is_number(states('sensor.hoymiles_load_energy_last_4_days'))
                 and coverage >= 0.24) }}
        state: >-
          {% set recorder_average =
            state_attr('sensor.hoymiles_hit_rce_optimized_plan',
                       'recorder_load_average_4d_kwh') %}
          {% if is_number(recorder_average) %}
            {{ recorder_average | float(0) | round(2) }}
          {% else %}
            {% set total =
              states('sensor.hoymiles_load_energy_last_4_days') | float(0) %}
            {% set coverage =
              state_attr('sensor.hoymiles_load_energy_last_4_days',
                         'age_coverage_ratio') | float(0) %}
            {% set history_days = [[coverage * 4, 1] | max, 4] | min %}
            {{ (total / history_days) | round(2) }}
          {% endif %}
        attributes:
          history_days: >-
            {% set recorder_days =
              state_attr('sensor.hoymiles_hit_rce_optimized_plan',
                         'recorder_load_history_days') %}
            {% if is_number(recorder_days) and recorder_days | int(0) >= 1 %}
              {{ recorder_days | float(0) | round(2) }}
            {% else %}
              {% set coverage =
                state_attr('sensor.hoymiles_load_energy_last_4_days',
                           'age_coverage_ratio') | float(0) %}
              {{ ([coverage * 4, 4] | min) | round(2) }}
            {% endif %}
          energy_in_history: >-
            {% set recorder_energy =
              state_attr('sensor.hoymiles_hit_rce_optimized_plan',
                         'recorder_load_history_energy_kwh') %}
            {{ recorder_energy if is_number(recorder_energy)
               else states('sensor.hoymiles_load_energy_last_4_days') }}
          source: >-
            {% set recorder_days =
              state_attr('sensor.hoymiles_hit_rce_optimized_plan',
                         'recorder_load_history_days') | int(0) %}
            {{ 'recorder_phase_energy_counters'
               if recorder_days >= 1 else 'statistics_fallback' }}

      - name: "Hoymiles Night Load Average 4 Days"
        unique_id: hoymiles_night_load_average_4_days
        icon: mdi:weather-night
        unit_of_measurement: "kWh"
        device_class: energy
        availability: >-
          {% set recorder_average =
            state_attr('sensor.hoymiles_hit_rce_optimized_plan',
                       'recorder_night_load_average_4d_kwh') %}
          {% set recorder_days =
            state_attr('sensor.hoymiles_hit_rce_optimized_plan',
                       'recorder_night_history_days') | int(0) %}
          {% set coverage =
            state_attr(
              'sensor.hoymiles_night_protected_load_energy_last_4_days',
              'age_coverage_ratio') | float(0) %}
          {{ (is_number(recorder_average) and recorder_days >= 1)
             or (is_number(states(
                   'sensor.hoymiles_night_protected_load_energy_last_4_days'))
                 and coverage >= 0.24) }}
        state: >-
          {% set recorder_average =
            state_attr('sensor.hoymiles_hit_rce_optimized_plan',
                       'recorder_night_load_average_4d_kwh') %}
          {% if is_number(recorder_average) %}
            {{ recorder_average | float(0) | round(2) }}
          {% else %}
            {% set total =
              states('sensor.hoymiles_night_protected_load_energy_last_4_days')
              | float(0) %}
            {% set coverage =
