                        'risk_window_active') | default(false, true) }}

      - name: "Hoymiles Battery Balancing Due"
        unique_id: hoymiles_battery_balancing_due
        icon: mdi:calendar-alert
        availability: >-
          {{ states('input_datetime.hoymiles_battery_balancing_last_completed')
               not in ['unknown', 'unavailable', 'none'] }}
        state: >-
          {% set last = states(
               'input_datetime.hoymiles_battery_balancing_last_completed') %}
          {% set midnight = as_timestamp(last[0:10], as_timestamp(now())) %}
          {% set days = states(
               'input_number.hoymiles_battery_balancing_interval_days')
               | int(30) %}
          {{ is_state('input_boolean.hoymiles_battery_balancing_enabled', 'on')
             and is_state('input_boolean.hoymiles_battery_balancing_active', 'off')
             and as_timestamp(now()) >= midnight + days * 86400 }}

      - name: "Hoymiles RCE Planned Export Slot"
        unique_id: hoymiles_rce_price_above_threshold
        icon: mdi:calendar-check
        availability: >-
          {{ state_attr('sensor.hoymiles_hit_rce_optimized_plan',
                        'current_slot_planned') is not none }}
        state: >-
          {{ state_attr('sensor.hoymiles_hit_rce_optimized_plan',
                        'current_slot_planned') | default(false, true) }}

      - name: "Hoymiles Tariff Planned Charge Slot"
        unique_id: hoymiles_tariff_planned_charge_slot
        icon: mdi:battery-clock-outline
        availability: >-
          {{ state_attr('sensor.hoymiles_hit_tariff_charge_plan',
                        'current_slot_planned') is not none }}
        state: >-
          {{ state_attr('sensor.hoymiles_hit_tariff_charge_plan',
                        'current_slot_planned') | default(false, true) }}

      - name: "Hoymiles RCE Reserve Ready"
        unique_id: hoymiles_rce_reserve_ready
        icon: mdi:shield-check-outline
        state: >-
          {% set status = state_attr(
            'sensor.hoymiles_hit_rce_optimized_plan', 'status_code') %}
          {{ status in ['ready', 'waiting_for_market', 'home_protected'] }}

      - name: "Hoymiles Sale Block Active"
        unique_id: hoymiles_sale_block_active
        icon: mdi:transmission-tower-off
        availability: >-
          {{ states('input_datetime.hoymiles_sale_block_start')
               not in ['unknown', 'unavailable', 'none']
             and states('input_datetime.hoymiles_sale_block_end')
               not in ['unknown', 'unavailable', 'none'] }}
        state: >-
          {% set start_parts =
            states('input_datetime.hoymiles_sale_block_start').split(':') %}
          {% set end_parts =
            states('input_datetime.hoymiles_sale_block_end').split(':') %}
          {% set start = (start_parts[0] | int(0)) * 60
                       + (start_parts[1] | int(0)) %}
          {% set finish = (end_parts[0] | int(0)) * 60
                        + (end_parts[1] | int(0)) %}
          {% set current = now().hour * 60 + now().minute %}
          {% set in_window =
            (start < finish and start <= current < finish)
            or (start > finish and (current >= start or current < finish)) %}
          {{ is_state('input_boolean.hoymiles_sale_block_enabled', 'on')
             and start != finish and in_window }}
        attributes:
          configured_window: >-
            {{ states('input_datetime.hoymiles_sale_block_start')[0:5] }}
            –
            {{ states('input_datetime.hoymiles_sale_block_end')[0:5] }}

timer:
  hoymiles_battery_balancing_hold:
    name: "Battery balancing — remaining time at 100% SOC"
    duration: "02:00:00"
    restore: true
    icon: mdi:timer-sand-complete

  hoymiles_battery_balancing_watchdog:
    name: "Battery balancing — cycle time limit"
    duration: "24:00:00"
    restore: true
    icon: mdi:timer-alert-outline

  hoymiles_discharge:
    name: "EMS — discharge time remaining"
    duration: "01:30:00"
    restore: true
    icon: mdi:timer-outline

  hoymiles_charge:
    name: "EMS — charge time remaining"
    duration: "01:30:00"
    restore: true
    icon: mdi:timer-outline

script:
  hoymiles_start_grid_discharge:
    alias: "EMS — start discharge do sieci"
    description: "Switches EMS to grid discharge outside the export lockout and starts the timer."
    icon: mdi:transmission-tower-export
    mode: restart
    sequence:
      - condition: state
        entity_id: input_boolean.hoymiles_battery_balancing_active
        state: "off"
      - condition: state
        entity_id: binary_sensor.hoymiles_sale_block_active
        state: "off"
      - wait_template: >-
          {{ states('select.hoymiles_hit_ems_mode') not in
             ['unknown', 'unavailable', 'none'] }}
        timeout: "00:05:00"
        continue_on_timeout: false
      - action: timer.cancel
        target:
          entity_id: timer.hoymiles_charge
      - action: input_boolean.turn_off
        target:
          entity_id: input_boolean.hoymiles_charge_cycle_active
      - action: select.select_option
        target:
          entity_id: select.hoymiles_hit_ems_mode
        data:
          option: "grid_discharge"
      - action: timer.start
        target:
          entity_id: timer.hoymiles_discharge
        data:
          duration: >-
            {{ (states('input_number.hoymiles_discharge_duration') | int(90)) * 60 }}
      - action: input_boolean.turn_on
        target:
          entity_id: input_boolean.hoymiles_discharge_cycle_active

  hoymiles_start_grid_charge:
    alias: "EMS — start charge z sieci"
    description: "Switches EMS to grid charge and starts the timer using the dashboard duration."
    icon: mdi:transmission-tower-import
    mode: restart
    sequence:
      - condition: state
        entity_id: input_boolean.hoymiles_battery_balancing_active
        state: "off"
      - wait_template: >-
          {{ states('select.hoymiles_hit_ems_mode') not in
             ['unknown', 'unavailable', 'none'] }}
        timeout: "00:05:00"
        continue_on_timeout: false
      - action: timer.cancel
        target:
          entity_id: timer.hoymiles_discharge
      - action: input_boolean.turn_off
        target:
          entity_id: input_boolean.hoymiles_discharge_cycle_active
      - action: select.select_option
        target:
          entity_id: select.hoymiles_hit_ems_mode
        data:
          option: "grid_charge"
      - action: timer.start
        target:
          entity_id: timer.hoymiles_charge
        data:
          duration: >-
            {{ (states('input_number.hoymiles_charge_duration') | int(90)) * 60 }}
      - action: input_boolean.turn_on
        target:
          entity_id: input_boolean.hoymiles_charge_cycle_active

  hoymiles_stop_scheduled_cycle:
    alias: "EMS — zatrzymaj cykl i return do Self-Use"
    description: "Stops both timers and safely returns the inverter to Self-Use."
    icon: mdi:stop-circle-outline
    mode: restart
    sequence:
      - condition: state
        entity_id: input_boolean.hoymiles_battery_balancing_active
        state: "off"
      - action: timer.cancel
        target:
          entity_id:
            - timer.hoymiles_discharge
            - timer.hoymiles_charge
      - action: input_boolean.turn_off
        target:
          entity_id:
            - input_boolean.hoymiles_discharge_cycle_active
            - input_boolean.hoymiles_charge_cycle_active
      - wait_template: >-
          {{ states('select.hoymiles_hit_ems_mode') not in
             ['unknown', 'unavailable', 'none'] }}
        timeout: "00:05:00"
        continue_on_timeout: false
      - action: select.select_option
        target:
          entity_id: select.hoymiles_hit_ems_mode
        data:
          option: "self_use"

  hoymiles_start_battery_balancing:
    alias: "Battery balancing — start cycle"
    description: >-
      Suspends all other EMS plans and keeps the inverter in Self-Use
      during PV production while preparing a safe charge cycle to 100%.
    icon: mdi:battery-sync
    mode: restart
    sequence:
      - condition: state
        entity_id: input_boolean.hoymiles_battery_balancing_enabled
        state: "on"
      - condition: state
        entity_id: input_boolean.hoymiles_battery_balancing_active
        state: "off"
      - condition: state
        entity_id: sun.sun
        state: "above_horizon"
      - condition: template
        value_template: >-
          {{ is_number(states('sensor.hoymiles_hit_overview_battery_soc'))
             and is_number(states('number.hoymiles_hit_maximum_charge_power'))
             and is_number(states('number.hoymiles_hit_force_charge_soc'))
             and states('select.hoymiles_hit_ems_mode')
               not in ['unknown', 'unavailable', 'none'] }}
      - if:
          - condition: state
            entity_id: input_boolean.hoymiles_rcm_pre_discharge_active
            state: "on"
        then:
          - if:
              - condition: state
                entity_id: select.hoymiles_hit_ems_mode
                state: "grid_discharge"
            then:
              - action: select.select_option
                target:
                  entity_id: select.hoymiles_hit_ems_mode
                data:
                  option: "self_use"
          - action: number.set_value
            target:
              entity_id: number.hoymiles_hit_maximum_discharge_power
            data:
              value: >-
                {{ states(
                  'input_number.hoymiles_rcm_saved_max_discharge_power')
                   | float(100) | round(1) }}
          - action: number.set_value
            target:
              entity_id: number.hoymiles_hit_force_discharge_soc
            data:
              value: >-
                {{ states(
                  'input_number.hoymiles_rcm_saved_force_discharge_soc')
                   | float(20) | round(0) }}
          - action: input_boolean.turn_off
            target:
              entity_id: input_boolean.hoymiles_rcm_pre_discharge_active
      - if:
          - condition: state
            entity_id: input_boolean.hoymiles_rcm_active
            state: "on"
        then:
          - action: number.set_value
            target:
              entity_id: number.hoymiles_hit_battery_max_charge_power
            data:
              value: >-
                {{ states(
                  'input_number.hoymiles_rcm_saved_battery_charge_power')
                   | float(100) | round(1) }}
          - if:
              - condition: state
                entity_id: input_boolean.hoymiles_rcm_export_control_active
                state: "on"
            then:
              - action: number.set_value
                target:
                  entity_id: number.hoymiles_hit_maximum_export_power_limit
                data:
                  value: >-
                    {{ [states(
                         'input_number.hoymiles_rcm_saved_export_limit')
                          | float(0),
                        states('input_number.hoymiles_rcm_export_cap_percent')
                          | float(100)] | min | round(1) }}
              - action: input_boolean.turn_off
                target:
                  entity_id: input_boolean.hoymiles_rcm_export_control_active
          - action: input_boolean.turn_off
            target:
              entity_id: input_boolean.hoymiles_rcm_active
      - action: input_number.set_value
        target:
          entity_id: input_number.hoymiles_battery_balancing_saved_charge_power
        data:
          value: >-
            {{ states('number.hoymiles_hit_maximum_charge_power') | float(50) }}
      - action: input_number.set_value
        target:
          entity_id: input_number.hoymiles_battery_balancing_saved_force_charge_soc
        data:
          value: >-
            {{ states('number.hoymiles_hit_force_charge_soc') | float(100) }}
      # Znacznik blokady jest ustawiany przed anulowaniem innych planów, aby
      # żadna ich automatyzacja nie zdążyła ponownie przełączyć trybu EMS.
      - action: input_boolean.turn_on
        target:
          entity_id: input_boolean.hoymiles_battery_balancing_active
      - action: input_text.set_value
        target:
          entity_id: input_text.hoymiles_battery_balancing_phase
        data:
          value: "pv"
      - action: timer.cancel
        target:
          entity_id:
            - timer.hoymiles_discharge
            - timer.hoymiles_charge
            - timer.hoymiles_battery_balancing_hold
      - action: input_boolean.turn_off
        target:
          entity_id:
            - input_boolean.hoymiles_discharge_cycle_active
            - input_boolean.hoymiles_charge_cycle_active
            - input_boolean.hoymiles_rce_discharge_active
            - input_boolean.hoymiles_tariff_charge_active
      - action: input_text.set_value
        target:
          entity_id: input_text.hoymiles_tariff_active_action
        data:
          value: "none"
      - action: timer.start
        target:
          entity_id: timer.hoymiles_battery_balancing_watchdog
        data:
          duration: 86400
      - if:
          - condition: template
            value_template: >-
              {{ not is_state('select.hoymiles_hit_ems_mode', 'self_use') }}
        then:
          - action: select.select_option
            target:
              entity_id: select.hoymiles_hit_ems_mode
            data:
              option: "self_use"

  hoymiles_stop_battery_balancing:
    alias: "Battery balancing — finish cycle"
    description: >-
      Returns to Self-Use, restores charge settings, and releases the lock
      on other EMS plans. A successfully completed cycle stores its date.
    icon: mdi:battery-check-outline
    mode: restart
    fields:
      completed:
        description: "Whether the cycle reached 100% SOC and completed its balancing time"
        example: true
        default: false
    sequence:
      - variables:
          completed_cycle: "{{ completed | default(false) | bool }}"
      - action: timer.cancel
        target:
          entity_id:
            - timer.hoymiles_battery_balancing_hold
            - timer.hoymiles_battery_balancing_watchdog
      - if:
          - condition: template
            value_template: >-
              {{ states('select.hoymiles_hit_ems_mode')
                   not in ['unknown', 'unavailable', 'none']
                 and not is_state('select.hoymiles_hit_ems_mode', 'self_use') }}
        then:
          - action: select.select_option
            target:
              entity_id: select.hoymiles_hit_ems_mode
            data:
              option: "self_use"
      - if:
          - condition: template
            value_template: >-
              {{ is_number(states(
                   'input_number.hoymiles_battery_balancing_saved_charge_power')) }}
        then:
          - action: number.set_value
            target:
              entity_id: number.hoymiles_hit_maximum_charge_power
            data:
              value: >-
                {{ states(
                     'input_number.hoymiles_battery_balancing_saved_charge_power')
                     | float(50) }}
      - if:
          - condition: template
            value_template: >-
              {{ is_number(states(
                   'input_number.hoymiles_battery_balancing_saved_force_charge_soc')) }}
        then:
          - action: number.set_value
            target:
              entity_id: number.hoymiles_hit_force_charge_soc
            data:
              value: >-
                {{ states(
                     'input_number.hoymiles_battery_balancing_saved_force_charge_soc')
                     | float(100) }}
      - if:
          - condition: template
            value_template: "{{ completed_cycle }}"
        then:
          - action: input_datetime.set_datetime
            target:
              entity_id: input_datetime.hoymiles_battery_balancing_last_completed
            data:
              datetime: "{{ now().strftime('%Y-%m-%d %H:%M:%S') }}"
      - action: input_text.set_value
        target:
          entity_id: input_text.hoymiles_battery_balancing_phase
        data:
          value: "idle"
      - action: input_boolean.turn_off
        target:
          entity_id: input_boolean.hoymiles_battery_balancing_active

automation:
  - id: hoymiles_battery_balancing_control
    alias: "Battery balancing — cycle control"
    description: >-
      Runs the cycle at the configured day interval. It first uses PV in Self-Use,
      tops up the battery from the grid after sunset, and from 99% limits
      battery charging to about 2 kW; balancing time starts only at 100% SOC.
    mode: single
    max_exceeded: silent
    triggers:
      - trigger: time_pattern
        minutes: "/1"
        id: periodic
      - trigger: state
        entity_id:
          - input_boolean.hoymiles_battery_balancing_enabled
          - input_boolean.hoymiles_battery_balancing_active
          - input_number.hoymiles_battery_balancing_interval_days
          - input_number.hoymiles_battery_balancing_hold_hours
          - input_text.hoymiles_battery_balancing_phase
          - binary_sensor.hoymiles_battery_balancing_due
          - sensor.hoymiles_hit_overview_battery_soc
          - sensor.hoymiles_battery_balancing_slow_charge_power
          - sensor.hoymiles_actual_load_power
          - sun.sun
          - select.hoymiles_hit_ems_mode
        id: state_change
      - trigger: event
        event_type: timer.finished
        event_data:
          entity_id: timer.hoymiles_battery_balancing_hold
        id: hold_finished
      - trigger: event
        event_type: timer.finished
        event_data:
          entity_id: timer.hoymiles_battery_balancing_watchdog
        id: watchdog_finished
      - trigger: homeassistant
        event: start
        id: startup
    actions:
      - if:
          - condition: trigger
            id: startup
        then:
          - delay: "00:00:20"
      # Helpers without `initial` restore their last state after an HA restart.
      # On a genuinely fresh installation initialize only missing internal
      # markers; never overwrite a value already selected by the user.
      - if:
          - condition: template
            value_template: >-
              {{ states('input_datetime.hoymiles_battery_balancing_last_completed')
                   in ['unknown', 'unavailable', 'none', ''] }}
        then:
          - action: input_datetime.set_datetime
            target:
              entity_id: input_datetime.hoymiles_battery_balancing_last_completed
            data:
              datetime: >-
                {{ (now() - timedelta(days=states(
                     'input_number.hoymiles_battery_balancing_interval_days')
                     | int(30))).strftime('%Y-%m-%d %H:%M:%S') }}
      - if:
          - condition: template
            value_template: >-
              {{ states('input_text.hoymiles_tariff_active_action')
                   in ['unknown', 'unavailable', 'none', ''] }}
        then:
          - action: input_text.set_value
            target:
              entity_id: input_text.hoymiles_tariff_active_action
            data:
              value: "none"
      - if:
          - condition: template
            value_template: >-
              {{ states('input_text.hoymiles_battery_balancing_phase')
                   in ['unknown', 'unavailable', 'none', ''] }}
        then:
          - action: input_text.set_value
            target:
              entity_id: input_text.hoymiles_battery_balancing_phase
            data:
              value: "idle"
      - choose:
          # Twardy limit 24 godzin chroni przed pozostawieniem Grid Charge po
          # utracie wiarygodnego SOC albo problemie z komunikacją BMS.
          - conditions:
              - condition: trigger
                id: watchdog_finished
              - condition: state
                entity_id: input_boolean.hoymiles_battery_balancing_active
                state: "on"
            sequence:
              - action: script.hoymiles_stop_battery_balancing
                data:
                  completed: false

          - conditions:
              - condition: trigger
                id: hold_finished
              - condition: state
                entity_id: input_boolean.hoymiles_battery_balancing_active
                state: "on"
              - condition: state
                entity_id: input_text.hoymiles_battery_balancing_phase
                state: "holding"
            sequence:
              - action: script.hoymiles_stop_battery_balancing
                data:
                  completed: true

          # Wyłączenie przełącznika w czasie cyklu jest bezpiecznym przerwaniem:
          # Self-Use i wcześniejsze nastawy ładowania zostają odtworzone.
          - conditions:
              - condition: state
                entity_id: input_boolean.hoymiles_battery_balancing_active
                state: "on"
              - condition: state
                entity_id: input_boolean.hoymiles_battery_balancing_enabled
                state: "off"
            sequence:
              - action: script.hoymiles_stop_battery_balancing
                data:
                  completed: false

          # Po restarcie HA finish poprawnie odtworzony etap utrzymania, jeżeli
          # timer zdążył upłynąć podczas niedostępności systemu.
          - conditions:
              - condition: state
                entity_id: input_boolean.hoymiles_battery_balancing_active
                state: "on"
              - condition: state
                entity_id: input_text.hoymiles_battery_balancing_phase
                state: "holding"
              - condition: template
                value_template: >-
                  {{ not is_state(
                       'timer.hoymiles_battery_balancing_hold', 'active') }}
            sequence:
              - action: script.hoymiles_stop_battery_balancing
                data:
                  completed: true

          # Cykl należny w danym dniu rozpoczyna się dopiero po wschodzie.
          # Zapewnia to maksymalne wykorzystanie PV zamiast nocnego ładowania.
          - conditions:
              - condition: state
                entity_id: input_boolean.hoymiles_battery_balancing_enabled
                state: "on"
              - condition: state
                entity_id: input_boolean.hoymiles_battery_balancing_active
                state: "off"
              - condition: state
                entity_id: binary_sensor.hoymiles_battery_balancing_due
                state: "on"
              - condition: state
                entity_id: sun.sun
                state: "above_horizon"
            sequence:
              - action: script.hoymiles_start_battery_balancing

          # Pełny magazyn: ustaw delikatny wspólny limit wejścia AC i start
          # właściwy czas wyrównywania. Timer nie biegnie przy 99%.
          - conditions:
              - condition: state
                entity_id: input_boolean.hoymiles_battery_balancing_active
                state: "on"
              - condition: template
                value_template: >-
                  {{ states('input_text.hoymiles_battery_balancing_phase')
                       in ['pv', 'grid', 'slow']
                     and is_number(states(
                       'sensor.hoymiles_hit_overview_battery_soc'))
                     and (states('sensor.hoymiles_hit_overview_battery_soc')
                          | float(0)) >= 99.9
                     and is_number(states(
                       'sensor.hoymiles_battery_balancing_slow_charge_power')) }}
            sequence:
              - action: number.set_value
                target:
                  entity_id: number.hoymiles_hit_maximum_charge_power
                data:
                  value: >-
                    {{ states(
                         'sensor.hoymiles_battery_balancing_slow_charge_power')
                         | float(20) }}
              - action: number.set_value
                target:
                  entity_id: number.hoymiles_hit_force_charge_soc
                data:
                  value: 100
              - if:
                  - condition: template
                    value_template: >-
                      {{ states('select.hoymiles_hit_ems_mode')
                           not in ['unknown', 'unavailable', 'none']
                         and not is_state(
                           'select.hoymiles_hit_ems_mode', 'grid_charge') }}
                then:
                  - action: select.select_option
                    target:
                      entity_id: select.hoymiles_hit_ems_mode
                    data:
                      option: "grid_charge"
              - action: timer.start
                target:
                  entity_id: timer.hoymiles_battery_balancing_hold
                data:
                  duration: >-
                    {{ (states(
                         'input_number.hoymiles_battery_balancing_hold_hours')
                         | float(2) * 3600) | int }}
              - action: input_text.set_value
                target:
                  entity_id: input_text.hoymiles_battery_balancing_phase
                data:
                  value: "holding"

          # Po zachodzie PV nie odbuduje już magazynu. Rozpoczyna się pełne
          # docharge sieciowe; pobór domu jest częścią wspólnego limitu AC.
          - conditions:
              - condition: state
                entity_id: input_boolean.hoymiles_battery_balancing_active
                state: "on"
              - condition: state
                entity_id: input_text.hoymiles_battery_balancing_phase
                state: "pv"
              - condition: state
                entity_id: sun.sun
                state: "below_horizon"
              - condition: template
                value_template: >-
                  {{ is_number(states(
                       'sensor.hoymiles_hit_overview_battery_soc')) }}
            sequence:
              - action: number.set_value
                target:
                  entity_id: number.hoymiles_hit_force_charge_soc
                data:
                  value: 100
              - choose:
                  - conditions:
                      - condition: template
                        value_template: >-
                          {{ (states(
                               'sensor.hoymiles_hit_overview_battery_soc')
                               | float(0)) >= 99 }}
                    sequence:
                      - action: number.set_value
                        target:
                          entity_id: number.hoymiles_hit_maximum_charge_power
                        data:
                          value: >-
                            {{ states(
                                 'sensor.hoymiles_battery_balancing_slow_charge_power')
                                 | float(20) }}
                      - action: input_text.set_value
                        target:
                          entity_id: input_text.hoymiles_battery_balancing_phase
                        data:
                          value: "slow"
                default:
                  - action: number.set_value
                    target:
                      entity_id: number.hoymiles_hit_maximum_charge_power
                    data:
                      value: 100
                  - action: input_text.set_value
                    target:
                      entity_id: input_text.hoymiles_battery_balancing_phase
                    data:
                      value: "grid"
              - if:
                  - condition: template
                    value_template: >-
                      {{ states('select.hoymiles_hit_ems_mode')
                           not in ['unknown', 'unavailable', 'none'] }}
                then:
                  - action: select.select_option
                    target:
                      entity_id: select.hoymiles_hit_ems_mode
                    data:
                      option: "grid_charge"

          # Od 99% zmniejsz moc dostępną dla baterii do około 2 kW. Limit jest
          # korygowany o bieżący LOAD, ponieważ Grid Charge najpierw zasila dom.
          - conditions:
              - condition: state
                entity_id: input_boolean.hoymiles_battery_balancing_active
                state: "on"
              - condition: state
                entity_id: input_text.hoymiles_battery_balancing_phase
                state: "grid"
              - condition: template
                value_template: >-
                  {{ is_number(states(
                       'sensor.hoymiles_hit_overview_battery_soc'))
                     and (states('sensor.hoymiles_hit_overview_battery_soc')
                          | float(0)) >= 99
                     and is_number(states(
                       'sensor.hoymiles_battery_balancing_slow_charge_power')) }}
            sequence:
              - action: number.set_value
                target:
                  entity_id: number.hoymiles_hit_maximum_charge_power
                data:
                  value: >-
                    {{ states(
                         'sensor.hoymiles_battery_balancing_slow_charge_power')
                         | float(20) }}
              - action: input_text.set_value
                target:
                  entity_id: input_text.hoymiles_battery_balancing_phase
                data:
                  value: "slow"

          # Poniżej 99% utrzymuj pełny limit ładowania, cel 100% i Grid Charge.
          - conditions:
              - condition: state
                entity_id: input_boolean.hoymiles_battery_balancing_active
                state: "on"
              - condition: state
                entity_id: input_text.hoymiles_battery_balancing_phase
                state: "grid"
              - condition: template
                value_template: >-
                  {{ is_number(states(
                       'sensor.hoymiles_hit_overview_battery_soc'))
                     and (states('sensor.hoymiles_hit_overview_battery_soc')
                          | float(0)) < 99
                     and ((states(
                       'number.hoymiles_hit_maximum_charge_power') | float(0))
                          < 99.5
                       or (states('number.hoymiles_hit_force_charge_soc')
                           | float(0)) < 99.5
                       or not is_state(
                         'select.hoymiles_hit_ems_mode', 'grid_charge')) }}
            sequence:
              - action: number.set_value
                target:
                  entity_id: number.hoymiles_hit_maximum_charge_power
                data:
                  value: 100
              - action: number.set_value
                target:
                  entity_id: number.hoymiles_hit_force_charge_soc
                data:
                  value: 100
              - if:
                  - condition: template
                    value_template: >-
                      {{ states('select.hoymiles_hit_ems_mode')
                           not in ['unknown', 'unavailable', 'none']
                         and not is_state(
                           'select.hoymiles_hit_ems_mode', 'grid_charge') }}
                then:
                  - action: select.select_option
                    target:
                      entity_id: select.hoymiles_hit_ems_mode
                    data:
                      option: "grid_charge"

          # W etapie wolnym wspólny limit AC śledzi LOAD, aby dla baterii
          # pozostawało około 2 kW również przy zmianach poboru domu.
          - conditions:
              - condition: state
                entity_id: input_boolean.hoymiles_battery_balancing_active
                state: "on"
              - condition: state
                entity_id: input_text.hoymiles_battery_balancing_phase
                state: "slow"
              - condition: template
                value_template: >-
                  {{ is_number(states(
                       'sensor.hoymiles_battery_balancing_slow_charge_power'))
                     and (((states(
                       'number.hoymiles_hit_maximum_charge_power') | float(0))
                         - (states(
                       'sensor.hoymiles_battery_balancing_slow_charge_power')
                            | float(0))) | abs >= 0.5
                       or (states('number.hoymiles_hit_force_charge_soc')
                           | float(0)) < 99.5
                       or not is_state(
                         'select.hoymiles_hit_ems_mode', 'grid_charge')) }}
            sequence:
              - action: number.set_value
                target:
                  entity_id: number.hoymiles_hit_maximum_charge_power
                data:
                  value: >-
                    {{ states(
                         'sensor.hoymiles_battery_balancing_slow_charge_power')
                         | float(20) }}
              - action: number.set_value
                target:
                  entity_id: number.hoymiles_hit_force_charge_soc
                data:
                  value: 100
              - if:
                  - condition: template
                    value_template: >-
                      {{ states('select.hoymiles_hit_ems_mode')
                           not in ['unknown', 'unavailable', 'none']
                         and not is_state(
                           'select.hoymiles_hit_ems_mode', 'grid_charge') }}
                then:
                  - action: select.select_option
                    target:
                      entity_id: select.hoymiles_hit_ems_mode
                    data:
                      option: "grid_charge"

          # W czasie utrzymania nie pozwól zewnętrznej zmianie nastaw przerwać
          # serwisu. Wyłączenie głównego przełącznika nadal kończy cykl od razu.
          - conditions:
              - condition: state
                entity_id: input_boolean.hoymiles_battery_balancing_active
                state: "on"
              - condition: state
                entity_id: input_text.hoymiles_battery_balancing_phase
                state: "holding"
              - condition: state
                entity_id: timer.hoymiles_battery_balancing_hold
                state: "active"
              - condition: template
                value_template: >-
                  {{ not is_state('select.hoymiles_hit_ems_mode', 'grid_charge')
                     or (states('number.hoymiles_hit_force_charge_soc')
                         | float(0)) < 99.5
                     or ((states(
                       'number.hoymiles_hit_maximum_charge_power') | float(0))
                       - (states(
                       'sensor.hoymiles_battery_balancing_slow_charge_power')
                          | float(0))) | abs >= 0.5 }}
            sequence:
              - action: number.set_value
                target:
                  entity_id: number.hoymiles_hit_maximum_charge_power
                data:
                  value: >-
                    {{ states(
                         'sensor.hoymiles_battery_balancing_slow_charge_power')
                         | float(20) }}
              - action: number.set_value
                target:
                  entity_id: number.hoymiles_hit_force_charge_soc
                data:
                  value: 100
              - if:
                  - condition: template
                    value_template: >-
                      {{ states('select.hoymiles_hit_ems_mode')
                           not in ['unknown', 'unavailable', 'none']
                         and not is_state(
                           'select.hoymiles_hit_ems_mode', 'grid_charge') }}
                then:
                  - action: select.select_option
                    target:
                      entity_id: select.hoymiles_hit_ems_mode
                    data:
                      option: "grid_charge"

  - id: hoymiles_ems_push_status_notification
    alias: "EMS — push notification for status change"
    description: >-
      Sends the current EMS mode and inverter operating status to the selected phone
      when either status changes.
    mode: restart
    triggers:
      - trigger: state
        entity_id: select.hoymiles_hit_ems_mode
        id: ems_mode
        for: "00:00:15"
      - trigger: state
        entity_id: sensor.hoymiles_hit_inverter_work_status
        id: inverter_status
        for: "00:00:15"
    conditions:
      - condition: state
        entity_id: input_boolean.hoymiles_ems_push_notifications_enabled
        state: "on"
      - condition: template
        value_template: >-
          {% set target =
            states('input_text.hoymiles_ems_push_notify_target') | trim %}
          {{ target.startswith('notify.')
             and (expand(target) | list | count) > 0 }}
      - condition: template
        value_template: >-
          {{ trigger is not defined
             or trigger.to_state is not defined
             or trigger.to_state is none
             or trigger.to_state.state not in
               ['unknown', 'unavailable', 'none', ''] }}
      - condition: template
        value_template: >-
          {{ trigger is not defined
             or trigger.from_state is not defined
             or trigger.from_state is none
             or trigger.from_state.state != trigger.to_state.state }}
    actions:
      # Tryb EMS i inverter operating status mogą zaktualizować się niemal
      # jednocześnie. Restart automatyzacji scala je w jedno powiadomienie.
      - delay: "00:00:02"
      - variables:
          target_entity: >-
            {{ states('input_text.hoymiles_ems_push_notify_target') | trim }}
          ems_mode: >-
            {% set raw = states('select.hoymiles_hit_ems_mode') %}
            {% set labels = {
              'self_use': 'Self-Use',
              'grid_discharge': 'Grid discharge',
              'grid_charge': 'Grid charge',
              'off_grid': 'Off-grid operation'
            } %}
            {{ labels.get(raw, raw) }}
          inverter_status: >-
            {{ states('sensor.hoymiles_hit_inverter_work_status') }}
          changed_status: >-
            {% if trigger is defined and trigger.id == 'ems_mode' %}
              EMS mode
            {% elif trigger is defined and trigger.id == 'inverter_status' %}
              inverter operating status
            {% else %}
              test
            {% endif %}
      - action: notify.send_message
        target:
          entity_id: "{{ target_entity }}"
        data:
          title: "Hoymiles — status change"
          message: |-
            EMS mode: {{ ems_mode }}
            Inverter status: {{ inverter_status }}
            Changed: {{ changed_status }}

  - id: hoymiles_initialize_solcast_forecast_entity
    alias: "EMS RCE — set default Solcast entity"
    description: >-
      Detects the English or Polish Forecast Today and Forecast Tomorrow entities
      from the BJReplay Solcast PV Forecast integration. Valid custom entities
      made by the user are preserved.
    mode: single
    triggers:
      - trigger: homeassistant
        event: start
    actions:
      - delay: "00:00:15"
      - if:
          - condition: template
            value_template: >-
              {% set configured =
                states('input_text.hoymiles_solcast_forecast_today_entity')
                | trim %}
              {% set candidates = [
                configured,
                'sensor.solcast_pv_forecast_forecast_today',
                'sensor.solcast_pv_forecast_prognoza_na_dzisiaj',
                'sensor.solcast_forecast_today'
              ] %}
              {% set ns = namespace(entity='') %}
              {% for entity in candidates if entity and not ns.entity %}
                {% if is_number(states(entity)) %}
                  {% set ns.entity = entity %}
                {% endif %}
              {% endfor %}
              {{ ns.entity != '' and ns.entity != configured }}
        then:
          - action: input_text.set_value
            target:
              entity_id: input_text.hoymiles_solcast_forecast_today_entity
            data:
              value: >-
                {% set configured =
                  states('input_text.hoymiles_solcast_forecast_today_entity')
                  | trim %}
                {% set candidates = [
                  configured,
                  'sensor.solcast_pv_forecast_forecast_today',
                  'sensor.solcast_pv_forecast_prognoza_na_dzisiaj',
                  'sensor.solcast_forecast_today'
                ] %}
                {% set ns = namespace(entity='') %}
                {% for entity in candidates if entity and not ns.entity %}
                  {% if is_number(states(entity)) %}
                    {% set ns.entity = entity %}
                  {% endif %}
                {% endfor %}
                {{ ns.entity }}
      - if:
          - condition: template
            value_template: >-
              {% set configured =
                states('input_text.hoymiles_solcast_forecast_tomorrow_entity')
                | trim %}
              {% set candidates = [
                configured,
                'sensor.solcast_pv_forecast_forecast_tomorrow',
                'sensor.solcast_pv_forecast_prognoza_na_jutro',
                'sensor.solcast_forecast_tomorrow'
              ] %}
              {% set ns = namespace(entity='') %}
              {% for entity in candidates if entity and not ns.entity %}
                {% if is_number(states(entity)) %}
                  {% set ns.entity = entity %}
                {% endif %}
              {% endfor %}
              {{ ns.entity != '' and ns.entity != configured }}
        then:
          - action: input_text.set_value
            target:
              entity_id: input_text.hoymiles_solcast_forecast_tomorrow_entity
            data:
              value: >-
                {% set configured =
                  states('input_text.hoymiles_solcast_forecast_tomorrow_entity')
                  | trim %}
                {% set candidates = [
                  configured,
                  'sensor.solcast_pv_forecast_forecast_tomorrow',
                  'sensor.solcast_pv_forecast_prognoza_na_jutro',
                  'sensor.solcast_forecast_tomorrow'
                ] %}
                {% set ns = namespace(entity='') %}
                {% for entity in candidates if entity and not ns.entity %}
                  {% if is_number(states(entity)) %}
                    {% set ns.entity = entity %}
                  {% endif %}
                {% endfor %}
                {{ ns.entity }}

  - id: hoymiles_rce_sync_dynamic_minimum_soc
    alias: "EMS RCE — write dynamic SOC reserve"
    description: >-
      Writes the calculated minimum discharge SOC to the inverter. The plan protects
      home supply from now through tonight, the next day, and the following
      night until 90 minutes after sunrise, then selects the most valuable RCE slots.
    mode: restart
    triggers:
      - trigger: state
        entity_id:
          - input_boolean.hoymiles_rce_discharge_enabled
          - input_boolean.hoymiles_rce_dynamic_soc_enabled
          - input_number.hoymiles_rce_soc_safety_margin
          - number.hoymiles_hit_self_use_soc
          - sensor.hoymiles_hit_battery_capacity
          - sensor.hoymiles_solcast_forecast_today
          - sensor.hoymiles_solcast_forecast_remaining_today
          - sensor.hoymiles_solcast_forecast_tomorrow
          - sensor.hoymiles_load_average_4_days
          - sensor.hoymiles_night_load_average_4_days
          - sensor.hoymiles_night_protection_window_remaining
          - sensor.hoymiles_protected_window_expected_load
          - sensor.hoymiles_rce_energy_deficit_tomorrow
          - sensor.hoymiles_rce_protected_home_energy
          - sensor.hoymiles_rce_dynamic_minimum_soc
          - binary_sensor.hoymiles_rce_reserve_ready
          - sensor.hoymiles_hit_rce_optimized_plan
      - trigger: time_pattern
        minutes: "/5"
      - trigger: homeassistant
        event: start
    conditions:
      - condition: state
        entity_id: input_boolean.hoymiles_battery_balancing_active
        state: "off"
      - condition: state
        entity_id: input_boolean.hoymiles_rce_discharge_enabled
        state: "on"
      - condition: state
        entity_id: input_boolean.hoymiles_rce_dynamic_soc_enabled
        state: "on"
      - condition: state
        entity_id: binary_sensor.hoymiles_rce_reserve_ready
        state: "on"
      - condition: template
        value_template: >-
          {{ is_number(states('sensor.hoymiles_rce_dynamic_minimum_soc'))
             and is_number(
               states('number.hoymiles_hit_force_discharge_soc')) }}
      - condition: template
        value_template: >-
          {{ ((states('number.hoymiles_hit_force_discharge_soc')
                | float(0))
              - (states('sensor.hoymiles_rce_dynamic_minimum_soc')
                 | float(0))) | abs >= 0.5 }}
    actions:
      - action: number.set_value
        target:
          entity_id: number.hoymiles_hit_force_discharge_soc
        data:
          value: >-
            {{ states('sensor.hoymiles_rce_dynamic_minimum_soc') | float(100) }}

  - id: hoymiles_enforce_sale_block
    alias: "EMS — enforce export lockout"
    description: >-
      During the lockout, stops every grid-discharge cycle and switches
      the inverter to Self-Use. Grid charging remains allowed.
    mode: restart
    triggers:
      - trigger: state
        entity_id: binary_sensor.hoymiles_sale_block_active
        to: "on"
      - trigger: state
        entity_id: select.hoymiles_hit_ems_mode
        to: "grid_discharge"
      - trigger: homeassistant
        event: start
    conditions:
      - condition: state
        entity_id: binary_sensor.hoymiles_sale_block_active
        state: "on"
    actions:
      - action: timer.cancel
        target:
          entity_id: timer.hoymiles_discharge
      - action: input_boolean.turn_off
        target:
          entity_id:
            - input_boolean.hoymiles_discharge_cycle_active
            - input_boolean.hoymiles_rce_discharge_active
      - wait_template: >-
          {{ states('select.hoymiles_hit_ems_mode') not in
             ['unknown', 'unavailable', 'none'] }}
        timeout: "00:05:00"
        continue_on_timeout: false
      - if:
          - condition: state
            entity_id: select.hoymiles_hit_ems_mode
            state: "grid_discharge"
        then:
          - action: select.select_option
            target:
              entity_id: select.hoymiles_hit_ems_mode
            data:
              option: "self_use"

  - id: hoymiles_rce_export_accounting
    alias: "EMS RCE — realized export accounting"
    description: >-
      Accounts for positive increments of the inverter grid-sell energy
      counter. Export during an active RCE cycle is stored separately from
      the natural Self-Use surplus. The RCE marker remains active
      during an ESP communication outage.
    mode: queued
    max: 20
    triggers:
      - trigger: state
        entity_id: sensor.hoymiles_hit_grid_energy_sell_today
      - trigger: homeassistant
        event: start
      - trigger: time
        at: "00:00:10"
    conditions:
      - condition: template
        value_template: >-
          {{ is_number(states('sensor.hoymiles_hit_grid_energy_sell_today')) }}
    actions:
      - variables:
          accounting_date: "{{ now().strftime('%Y-%m-%d') }}"
          stored_date: "{{ states('input_text.hoymiles_rce_accounting_date') }}"
          current_counter: >-
            {{ states('sensor.hoymiles_hit_grid_energy_sell_today') | float(0) }}
          checkpoint: >-
            {{ states('input_number.hoymiles_rce_grid_sell_checkpoint')
               | float(0) }}
          counter_delta: >-
            {% set current = states(
              'sensor.hoymiles_hit_grid_energy_sell_today') | float(0) %}
            {% set previous = states(
              'input_number.hoymiles_rce_grid_sell_checkpoint') | float(0) %}
            {{ ([current - previous, 0] | max) if current >= previous
               else current }}
          current_price: >-
            {{ states('sensor.hoymiles_rce_current_price') | float(0) }}
      - choose:
          # Przy zmianie daty punkt kontrolny może jeszcze zawierać końcową
          # wartość sprzętowego licznika z poprzedniego dnia. Nie wolno
          # przepisywać jej do bieżącego dnia jako eksport nierozpoznany.
          - conditions:
              - condition: template
                value_template: "{{ stored_date != accounting_date }}"
            sequence:
              - action: input_number.set_value
                target:
                  entity_id:
                    - input_number.hoymiles_rce_realized_controlled_export_store
                    - input_number.hoymiles_rce_realized_natural_export_store
                    - input_number.hoymiles_rce_realized_controlled_revenue_store
                    - input_number.hoymiles_rce_realized_natural_revenue_store
                data:
                  value: 0
              - action: input_number.set_value
                target:
                  entity_id: input_number.hoymiles_rce_unclassified_export_store
                data:
                  value: 0
              - action: input_number.set_value
                target:
                  entity_id: input_number.hoymiles_rce_grid_sell_checkpoint
                data:
                  value: "{{ current_counter }}"
              - action: input_text.set_value
                target:
                  entity_id: input_text.hoymiles_rce_accounting_date
                data:
                  value: "{{ accounting_date }}"

          - conditions:
              - condition: template
                value_template: "{{ counter_delta | float(0) > 0 }}"
            sequence:
              - action: input_number.set_value
                target:
                  entity_id: input_number.hoymiles_rce_grid_sell_checkpoint
                data:
                  value: "{{ current_counter }}"
              - choose:
                  - conditions:
                      - condition: state
                        entity_id: input_boolean.hoymiles_rce_discharge_active
                        state: "on"
                    sequence:
                      - action: input_number.set_value
                        target:
                          entity_id: >-
                            input_number.hoymiles_rce_realized_controlled_export_store
                        data:
                          value: >-
                            {{ ((states(
                              'input_number.hoymiles_rce_realized_controlled_export_store')
                              | float(0)) + (counter_delta | float(0))) }}
                      - action: input_number.set_value
                        target:
                          entity_id: >-
                            input_number.hoymiles_rce_realized_controlled_revenue_store
                        data:
                          value: >-
                            {{ ((states(
                              'input_number.hoymiles_rce_realized_controlled_revenue_store')
                              | float(0))
                               + (counter_delta | float(0))
                               * (current_price | float(0))) }}

                  - conditions:
                      - condition: state
                        entity_id: select.hoymiles_hit_ems_mode
                        state: "self_use"
                    sequence:
                      - action: input_number.set_value
                        target:
                          entity_id: >-
                            input_number.hoymiles_rce_realized_natural_export_store
                        data:
                          value: >-
                            {{ ((states(
                              'input_number.hoymiles_rce_realized_natural_export_store')
                              | float(0)) + (counter_delta | float(0))) }}
                      - action: input_number.set_value
                        target:
                          entity_id: >-
                            input_number.hoymiles_rce_realized_natural_revenue_store
                        data:
                          value: >-
                            {{ ((states(
                              'input_number.hoymiles_rce_realized_natural_revenue_store')
                              | float(0))
                               + (counter_delta | float(0))
                               * (current_price | float(0))) }}

                default:
                  - action: input_number.set_value
                    target:
                      entity_id: input_number.hoymiles_rce_unclassified_export_store
                    data:
                      value: >-
                        {{ ((states(
                          'input_number.hoymiles_rce_unclassified_export_store')
                          | float(0)) + (counter_delta | float(0))) }}
        default:
          - action: input_number.set_value
            target:
              entity_id: input_number.hoymiles_rce_grid_sell_checkpoint
            data:
              value: "{{ current_counter }}"

  - id: hoymiles_automatic_ems_mode_interlock
    alias: "EMS — interlock for RCE, tariff and RCEm automation"
    description: >-
      Allows only one automation to run. RCE, tariff charging and RCEm
      253 V+ are mutually exclusive. After restart, RCE has priority,
      followed by tariff charging and then RCEm.
    mode: restart
    triggers:
      - trigger: state
        entity_id: input_boolean.hoymiles_rce_discharge_enabled
        to: "on"
        id: rce_enabled
      - trigger: state
        entity_id: input_boolean.hoymiles_tariff_charge_enabled
        to: "on"
        id: tariff_enabled
      - trigger: state
        entity_id: input_boolean.hoymiles_rcm_enabled
        to: "on"
        id: rcm_enabled
      - trigger: homeassistant
        event: start
        id: startup
    actions:
      - if:
          - condition: trigger
            id: startup
        then:
          - delay: "00:00:20"
      - choose:
          - conditions:
              - condition: template
                value_template: >-
                  {{ trigger.id == 'rce_enabled'
                     or (trigger.id == 'startup'
                         and is_state(
                           'input_boolean.hoymiles_rce_discharge_enabled', 'on')) }}
            sequence:
              - action: input_boolean.turn_off
                target:
                  entity_id:
                    - input_boolean.hoymiles_tariff_charge_enabled
                    - input_boolean.hoymiles_rcm_enabled
              - if:
                  - condition: state
                    entity_id: input_boolean.hoymiles_tariff_charge_active
                    state: "on"
                then:
                  - if:
                      - condition: state
                        entity_id: select.hoymiles_hit_ems_mode
                        state: "grid_charge"
                    then:
                      - action: select.select_option
                        target:
                          entity_id: select.hoymiles_hit_ems_mode
                        data:
                          option: "self_use"
                  - action: input_boolean.turn_off
                    target:
                      entity_id: input_boolean.hoymiles_tariff_charge_active
                  - action: input_text.set_value
                    target:
                      entity_id: input_text.hoymiles_tariff_active_action
                    data:
                      value: "none"

          - conditions:
              - condition: template
                value_template: >-
                  {{ trigger.id == 'tariff_enabled'
                     or (trigger.id == 'startup'
                         and is_state(
                           'input_boolean.hoymiles_tariff_charge_enabled', 'on')) }}
            sequence:
              - action: input_boolean.turn_off
                target:
                  entity_id:
                    - input_boolean.hoymiles_rce_discharge_enabled
                    - input_boolean.hoymiles_rcm_enabled
              - if:
                  - condition: state
                    entity_id: input_boolean.hoymiles_rce_discharge_active
                    state: "on"
                then:
                  - if:
                      - condition: state
                        entity_id: select.hoymiles_hit_ems_mode
                        state: "grid_discharge"
                    then:
                      - action: select.select_option
                        target:
                          entity_id: select.hoymiles_hit_ems_mode
                        data:
                          option: "self_use"
                  - action: input_boolean.turn_off
                    target:
                      entity_id: input_boolean.hoymiles_rce_discharge_active

          - conditions:
              - condition: template
                value_template: >-
                  {{ trigger.id == 'rcm_enabled'
                     or (trigger.id == 'startup'
                         and is_state('input_boolean.hoymiles_rcm_enabled', 'on')
                         and is_state(
                           'input_boolean.hoymiles_rce_discharge_enabled', 'off')
                         and is_state(
                           'input_boolean.hoymiles_tariff_charge_enabled', 'off')) }}
            sequence:
              - action: input_boolean.turn_off
                target:
                  entity_id:
                    - input_boolean.hoymiles_rce_discharge_enabled
                    - input_boolean.hoymiles_tariff_charge_enabled
              - if:
                  - condition: state
                    entity_id: input_boolean.hoymiles_rce_discharge_active
                    state: "on"
                then:
                  - action: input_boolean.turn_off
                    target:
                      entity_id: input_boolean.hoymiles_rce_discharge_active
              - if:
                  - condition: state
                    entity_id: input_boolean.hoymiles_tariff_charge_active
                    state: "on"
                then:
                  - action: input_boolean.turn_off
                    target:
                      entity_id: input_boolean.hoymiles_tariff_charge_active
                  - action: input_text.set_value
                    target:
                      entity_id: input_text.hoymiles_tariff_active_action
                    data:
                      value: "none"

  - id: hoymiles_tariff_grid_charge_control
    alias: "Tariff EMS — forecast-based charging in low-cost periods"
    description: >-
      Every minute it simulates the home, PV, and battery balance through tomorrow.
      It charges only in a planned low-cost slot before the forecast shortage.
      It cannot run together with RCE or manual EMS timers.
    mode: single
    max_exceeded: silent
    triggers:
      - trigger: time_pattern
        minutes: "/1"
      - trigger: state
        entity_id:
          - sensor.hoymiles_hit_tariff_charge_plan
          - binary_sensor.hoymiles_tariff_planned_charge_slot
          - input_boolean.hoymiles_tariff_charge_enabled
          - input_boolean.hoymiles_rce_discharge_enabled
          - input_boolean.hoymiles_discharge_cycle_active
          - input_boolean.hoymiles_charge_cycle_active
          - sensor.hoymiles_hit_overview_battery_soc
          - sensor.hoymiles_tariff_target_soc
          - number.hoymiles_hit_force_charge_soc
          - number.hoymiles_hit_maximum_charge_power
          - select.hoymiles_hit_ems_mode
          - input_boolean.hoymiles_battery_balancing_active
      - trigger: homeassistant
        event: start
    actions:
      - choose:
          # Wyrównywanie ma bezwzględne pierwszeństwo. Zwalniamy jedynie
          # wewnętrzny znacznik taryfowy; tryb ustawia sterownik serwisowy.
          - conditions:
              - condition: state
                entity_id: input_boolean.hoymiles_battery_balancing_active
                state: "on"
            sequence:
              - if:
                  - condition: state
                    entity_id: input_boolean.hoymiles_tariff_charge_active
                    state: "on"
                then:
                  - action: input_boolean.turn_off
                    target:
                      entity_id: input_boolean.hoymiles_tariff_charge_active
              - action: input_text.set_value
                target:
                  entity_id: input_text.hoymiles_tariff_active_action
                data:
                  value: "none"

          # Ręczne harmonogramy mają pierwszeństwo. Automat przestaje uznawać
          # cykl za własny i nie nadpisuje trybu wybranego przez użytkownika.
          - conditions:
              - condition: state
                entity_id: input_boolean.hoymiles_tariff_charge_active
                state: "on"
              - condition: or
                conditions:
                  - condition: state
                    entity_id: input_boolean.hoymiles_discharge_cycle_active
                    state: "on"
                  - condition: state
                    entity_id: input_boolean.hoymiles_charge_cycle_active
                    state: "on"
            sequence:
              - action: input_boolean.turn_off
                target:
                  entity_id: input_boolean.hoymiles_tariff_charge_active
              - action: input_text.set_value
                target:
                  entity_id: input_text.hoymiles_tariff_active_action
                data:
                  value: "none"

          # Start: plan i wszystkie dane są ważne, bieżący blok został wybrany,
          # a magazyn nie osiągnął jeszcze wyliczonego celu SOC. Pełny 1% próg
          # startu oddziela się od progu zatrzymania i zapobiega oscylacji.
          - conditions:
              - condition: state
                entity_id: input_boolean.hoymiles_tariff_charge_enabled
                state: "on"
              - condition: state
                entity_id: input_boolean.hoymiles_rce_discharge_enabled
                state: "off"
              - condition: state
                entity_id: input_boolean.hoymiles_tariff_charge_active
                state: "off"
              - condition: state
                entity_id: input_boolean.hoymiles_battery_balancing_active
                state: "off"
              - condition: state
                entity_id: binary_sensor.hoymiles_tariff_planned_charge_slot
                state: "on"
              - condition: template
                value_template: >-
                  {{ state_attr('sensor.hoymiles_hit_tariff_charge_plan',
                                'status_code')
                     in ['ready', 'insufficient_cheap_window'] }}
              - condition: template
                value_template: >-
                  {% set action = state_attr(
                    'sensor.hoymiles_hit_tariff_charge_plan',
                    'current_action') %}
                  {{ action == 'grid_support'
                     or (is_number(states('sensor.hoymiles_tariff_target_soc'))
                         and is_number(states(
                           'sensor.hoymiles_hit_overview_battery_soc'))
                         and (states(
                           'sensor.hoymiles_hit_overview_battery_soc')
                              | float(0)) + 1.0
                             < (states('sensor.hoymiles_tariff_target_soc')
                                | float(0))) }}
              - condition: template
                value_template: >-
                  {{ is_number(state_attr(
                       'sensor.hoymiles_hit_tariff_charge_plan',
                       'effective_charge_power_percent'))
                     and (state_attr(
                       'sensor.hoymiles_hit_tariff_charge_plan',
                       'effective_charge_power_percent') | float(0)) > 0
                     and states('select.hoymiles_hit_ems_mode')
                       not in ['unknown', 'unavailable', 'none'] }}
              - condition: template
                value_template: >-
                  {% set slot_end = state_attr(
                    'sensor.hoymiles_hit_tariff_charge_plan',
                    'current_slot_end') %}
                  {{ slot_end is not none
                     and as_timestamp(slot_end, 0) > as_timestamp(now()) }}
              - condition: state
                entity_id: input_boolean.hoymiles_discharge_cycle_active
                state: "off"
              - condition: state
                entity_id: input_boolean.hoymiles_charge_cycle_active
                state: "off"
              - condition: template
                value_template: >-
                  {{ not is_state('timer.hoymiles_discharge', 'active')
                     and not is_state('timer.hoymiles_charge', 'active') }}
            sequence:
              # Zamrożony cel pozostaje stały do końca rozpoczętego cyklu.
              # Kolejne przeliczenia pogody i obciążenia nie mogą wywołać
              # naprzemiennego Grid Charge / Self-Use.
              - action: input_number.set_value
                target:
                  entity_id: input_number.hoymiles_tariff_latched_target_soc
                data:
                  value: >-
                    {% if state_attr(
                      'sensor.hoymiles_hit_tariff_charge_plan',
                      'current_action') == 'grid_support' %}
                      {{ states('sensor.hoymiles_hit_overview_battery_soc')
                         | float(0) | round(0, 'floor') }}
                    {% else %}
                      {{ states('sensor.hoymiles_tariff_target_soc')
                         | float(100) | round(0, 'ceil') }}
                    {% endif %}
              - action: input_datetime.set_datetime
                target:
                  entity_id: input_datetime.hoymiles_tariff_latched_slot_end
                data:
                  timestamp: >-
                    {{ as_timestamp(state_attr(
                      'sensor.hoymiles_hit_tariff_charge_plan',
                      'current_slot_end')) }}
              - action: number.set_value
                target:
                  entity_id: number.hoymiles_hit_maximum_charge_power
                data:
                  value: >-
                    {{ state_attr('sensor.hoymiles_hit_tariff_charge_plan',
                                  'effective_charge_power_percent')
                       | float(0) | round(1) }}
              - action: number.set_value
                target:
                  entity_id: number.hoymiles_hit_force_charge_soc
                data:
                  value: >-
                    {% if state_attr(
                      'sensor.hoymiles_hit_tariff_charge_plan',
                      'current_action') == 'grid_support' %}
                      {{ states('sensor.hoymiles_hit_overview_battery_soc')
                         | float(10) | round(0, 'floor') }}
                    {% else %}
                      {{ states('sensor.hoymiles_tariff_target_soc')
                         | float(100) | round(0, 'ceil') }}
                    {% endif %}
              - wait_template: >-
                  {{ state_attr('sensor.hoymiles_hit_tariff_charge_plan',
                                'current_action') == 'grid_support'
                     or (((states('number.hoymiles_hit_force_charge_soc')
                           | float(0))
                          - (states(
                            'input_number.hoymiles_tariff_latched_target_soc')
                             | float(100))) | abs < 1.1) }}
                timeout: "00:01:00"
                continue_on_timeout: false
              - action: select.select_option
                target:
                  entity_id: select.hoymiles_hit_ems_mode
                data:
                  option: "grid_charge"
              - wait_template: >-
                  {{ is_state('select.hoymiles_hit_ems_mode', 'grid_charge') }}
                timeout: "00:02:00"
                continue_on_timeout: false
              - action: input_text.set_value
                target:
                  entity_id: input_text.hoymiles_tariff_active_action
                data:
                  value: >-
                    {{ state_attr('sensor.hoymiles_hit_tariff_charge_plan',
                                  'current_action') | default('none', true) }}
              - action: input_boolean.turn_on
                target:
                  entity_id: input_boolean.hoymiles_tariff_charge_active

          # Aktualizacja ograniczeń BMS podczas bieżącego bloku. Cel SOC nie
          # podąża już za ruchomym planem — używany jest cel zapamiętany przy
          # starcie cyklu.
          - conditions:
              - condition: state
                entity_id: input_boolean.hoymiles_tariff_charge_active
                state: "on"
              - condition: state
                entity_id: input_boolean.hoymiles_tariff_charge_enabled
                state: "on"
              - condition: state
                entity_id: input_boolean.hoymiles_rce_discharge_enabled
                state: "off"
              - condition: state
                entity_id: select.hoymiles_hit_ems_mode
                state: "grid_charge"
              - condition: state
                entity_id: binary_sensor.hoymiles_tariff_planned_charge_slot
                state: "on"
              - condition: template
                value_template: >-
                  {{ state_attr('sensor.hoymiles_hit_tariff_charge_plan',
                                'status_code')
                     in ['ready', 'insufficient_cheap_window'] }}
              - condition: template
                value_template: >-
                  {{ is_number(states(
                       'input_number.hoymiles_tariff_latched_target_soc')) }}
            sequence:
              - if:
                  - condition: template
                    value_template: >-
                      {{ is_number(state_attr(
                           'sensor.hoymiles_hit_tariff_charge_plan',
                           'effective_charge_power_percent'))
                         and ((states(
                           'number.hoymiles_hit_maximum_charge_power')
                           | float(0))
                           - (state_attr(
                             'sensor.hoymiles_hit_tariff_charge_plan',
                             'effective_charge_power_percent')
                              | float(0))) | abs >= 0.5 }}
                then:
                  - action: number.set_value
                    target:
                      entity_id: number.hoymiles_hit_maximum_charge_power
                    data:
                      value: >-
                        {{ state_attr(
                             'sensor.hoymiles_hit_tariff_charge_plan',
                             'effective_charge_power_percent')
                           | float(0) | round(1) }}
              - if:
                  - condition: template
                    value_template: >-
                      {% set slot_end = state_attr(
                        'sensor.hoymiles_hit_tariff_charge_plan',
                        'current_slot_end') %}
                      {{ slot_end is not none
                         and as_timestamp(slot_end, 0)
                           > as_timestamp(states(
                             'input_datetime.hoymiles_tariff_latched_slot_end'), 0)
                             + 5 }}
                then:
                  - action: input_datetime.set_datetime
                    target:
                      entity_id: input_datetime.hoymiles_tariff_latched_slot_end
                    data:
                      timestamp: >-
                        {{ as_timestamp(state_attr(
                          'sensor.hoymiles_hit_tariff_charge_plan',
                          'current_slot_end')) }}
              - if:
                  - condition: template
                    value_template: >-
                      {% set wanted = states(
                        'input_number.hoymiles_tariff_latched_target_soc')
                         | float(100) | round(0) %}
                      {{ ((states('number.hoymiles_hit_force_charge_soc')
                           | float(0)) - wanted) | abs >= 1.0 }}
                then:
                  - action: number.set_value
                    target:
                      entity_id: number.hoymiles_hit_force_charge_soc
                    data:
                      value: >-
                        {{ states(
                             'input_number.hoymiles_tariff_latched_target_soc')
                           | float(100) | round(0) }}

          # Stop: end zapamiętanego ciągłego okna, osiągnięcie zamrożonego
          # celu, wyłączenie automatu albo trwała utrata wymaganych danych.
          # Chwilowe zniknięcie bieżącego bloku z ponownie przeliczonego planu
          # nie przerywa rozpoczętego ładowania. Minimalny czas 90 s pozwala
          # potwierdzić SOC i wykonanie zapisu Modbus przed komendą Self-Use.
          - conditions:
              - condition: state
                entity_id: input_boolean.hoymiles_tariff_charge_active
                state: "on"
              - condition: template
                value_template: >-
                  {{ is_state('input_boolean.hoymiles_tariff_charge_enabled', 'off')
                     or is_state('input_boolean.hoymiles_rce_discharge_enabled', 'on')
                     or state_attr('sensor.hoymiles_hit_tariff_charge_plan',
                                   'status_code')
                        in ['missing_data', 'optimizer_error', 'learning']
                     or states('input_text.hoymiles_tariff_active_action')
                        not in
                          ['battery_charge', 'grid_support',
                           'grid_support_and_charge']
                     or not is_number(states(
                       'input_number.hoymiles_tariff_latched_target_soc'))
                     or not is_number(states(
                       'sensor.hoymiles_hit_overview_battery_soc'))
                     or as_timestamp(states(
                          'input_datetime.hoymiles_tariff_latched_slot_end'), 0)
                        <= as_timestamp(now())
                     or (states('input_text.hoymiles_tariff_active_action')
                           in ['battery_charge', 'grid_support_and_charge']
                         and (as_timestamp(now()) - as_timestamp(
                           states.input_boolean.hoymiles_tariff_charge_active
                             .last_changed)) >= 90
                         and (states(
                           'sensor.hoymiles_hit_overview_battery_soc')
                              | float(0))
                             >= (states(
                               'input_number.hoymiles_tariff_latched_target_soc')
                                 | float(100)) - 0.1)
                     or not is_state(
                       'select.hoymiles_hit_ems_mode', 'grid_charge') }}
              - condition: template
                value_template: >-
                  {{ states('select.hoymiles_hit_ems_mode')
                     not in ['unknown', 'unavailable', 'none'] }}
            sequence:
              - if:
                  - condition: state
                    entity_id: select.hoymiles_hit_ems_mode
                    state: "grid_charge"
                then:
                  - action: select.select_option
                    target:
                      entity_id: select.hoymiles_hit_ems_mode
                    data:
                      option: "self_use"
              - action: input_boolean.turn_off
                target:
                  entity_id: input_boolean.hoymiles_tariff_charge_active
              - action: input_text.set_value
                target:
                  entity_id: input_text.hoymiles_tariff_active_action
                data:
                  value: "none"

  - id: hoymiles_rce_grid_discharge_control
    alias: "EMS RCE — optimized-plan discharge control"
    description: >-
      Every minute, checks the optimizer's two-day plan. It discharges only in
      the selected most profitable slots and only above the SOC required to
      supply the home. Manual timers take priority.
    mode: single
    max_exceeded: silent
    triggers:
      - trigger: time_pattern
        minutes: "/1"
      - trigger: state
        entity_id:
          - sensor.hoymiles_rce_current_price
          - sensor.hoymiles_hit_rce_optimized_plan
          - binary_sensor.hoymiles_rce_price_above_threshold
          - input_boolean.hoymiles_rce_discharge_enabled
          - input_boolean.hoymiles_tariff_charge_enabled
          - input_boolean.hoymiles_sale_block_enabled
          - input_datetime.hoymiles_sale_block_start
          - input_datetime.hoymiles_sale_block_end
          - binary_sensor.hoymiles_sale_block_active
          - input_boolean.hoymiles_discharge_cycle_active
          - input_boolean.hoymiles_charge_cycle_active
          - timer.hoymiles_discharge
          - timer.hoymiles_charge
          - sensor.hoymiles_hit_overview_battery_soc
          - number.hoymiles_hit_force_discharge_soc
          - number.hoymiles_hit_maximum_discharge_power
          - sensor.hoymiles_hit_maximum_discharge_current
          - sensor.hoymiles_hit_battery_voltage_bms
          - sensor.hoymiles_rce_effective_discharge_power_percent
          - input_number.hoymiles_rce_requested_discharge_power
          - input_select.hoymiles_rce_inverter_rated_power
          - sensor.hoymiles_hit_number_of_machines_master_and_slave
          - input_boolean.hoymiles_rce_dynamic_soc_enabled
          - input_number.hoymiles_rce_soc_safety_margin
          - sensor.hoymiles_rce_effective_minimum_soc
          - sensor.hoymiles_rce_dynamic_minimum_soc
          - binary_sensor.hoymiles_rce_reserve_ready
          - input_boolean.hoymiles_battery_balancing_active
      - trigger: homeassistant
        event: start
    actions:
      # Ustaw bezpieczny limit przed zmianą trybu i obniżaj go na bieżąco,
      # jeżeli BMS zmieni dopuszczalny prąd rozładowania.
      - if:
          - condition: state
            entity_id: input_boolean.hoymiles_battery_balancing_active
            state: "off"
          - condition: state
            entity_id: input_boolean.hoymiles_rce_discharge_enabled
            state: "on"
          - condition: template
            value_template: >-
              {{ is_number(states(
                   'sensor.hoymiles_rce_effective_discharge_power_percent'))
                 and is_number(states(
                   'number.hoymiles_hit_maximum_discharge_power'))
                 and ((states(
                   'sensor.hoymiles_rce_effective_discharge_power_percent')
                   | float(0))
                    - (states(
                      'number.hoymiles_hit_maximum_discharge_power')
                      | float(0))) | abs >= 0.5 }}
        then:
          - action: number.set_value
            target:
              entity_id: number.hoymiles_hit_maximum_discharge_power
            data:
              value: >-
                {{ states(
                  'sensor.hoymiles_rce_effective_discharge_power_percent')
                  | float(0) }}
          - wait_template: >-
              {{ ((states(
                   'number.hoymiles_hit_maximum_discharge_power')
                   | float(0))
                  - (states(
                    'sensor.hoymiles_rce_effective_discharge_power_percent')
                    | float(0))) | abs < 0.5 }}
            timeout: "00:01:00"
            continue_on_timeout: false
      - choose:
          # Battery balancing ustawia własny tryb i nie może zostać
          # przerwane przez aktywny wcześniej blok RCE.
          - conditions:
              - condition: state
                entity_id: input_boolean.hoymiles_battery_balancing_active
                state: "on"
            sequence:
              - if:
                  - condition: state
                    entity_id: input_boolean.hoymiles_rce_discharge_active
                    state: "on"
                then:
                  - action: input_boolean.turn_off
                    target:
                      entity_id: input_boolean.hoymiles_rce_discharge_active

          # Jeśli w trakcie pracy RCE uruchomiono ręczny timer, automatyka RCE
          # oddaje mu control i nie zmienia ustawionego przez niego trybu.
          - conditions:
              - condition: state
                entity_id: input_boolean.hoymiles_rce_discharge_active
                state: "on"
              - condition: or
                conditions:
                  - condition: state
                    entity_id: input_boolean.hoymiles_discharge_cycle_active
                    state: "on"
                  - condition: state
                    entity_id: input_boolean.hoymiles_charge_cycle_active
                    state: "on"
            sequence:
              - action: input_boolean.turn_off
                target:
                  entity_id: input_boolean.hoymiles_rce_discharge_active

          # Start RCE: the current slot is planned, SOC reserve is available, and
          # no manual cycle is active.
          - conditions:
              - condition: state
                entity_id: input_boolean.hoymiles_rce_discharge_enabled
                state: "on"
              - condition: state
                entity_id: input_boolean.hoymiles_rce_discharge_active
                state: "off"
              - condition: state
                entity_id: input_boolean.hoymiles_battery_balancing_active
                state: "off"
              - condition: state
                entity_id: input_boolean.hoymiles_tariff_charge_enabled
                state: "off"
              - condition: state
                entity_id: binary_sensor.hoymiles_rce_price_above_threshold
                state: "on"
              - condition: state
                entity_id: binary_sensor.hoymiles_sale_block_active
                state: "off"
              - condition: state
                entity_id: binary_sensor.hoymiles_rce_reserve_ready
                state: "on"
              - condition: template
                value_template: >-
                  {{ is_number(states(
                    'sensor.hoymiles_rce_effective_discharge_power_percent'))
                     and (states(
                       'sensor.hoymiles_rce_effective_discharge_power_percent')
                       | float(0)) > 0 }}
              - condition: template
                value_template: >-
                  {{ (states('sensor.hoymiles_hit_overview_battery_soc') | float(0))
                     > (states('sensor.hoymiles_rce_effective_minimum_soc') | float(100)) }}
              - condition: state
                entity_id: input_boolean.hoymiles_discharge_cycle_active
                state: "off"
              - condition: state
                entity_id: input_boolean.hoymiles_charge_cycle_active
                state: "off"
              - condition: template
                value_template: >-
                  {{ not is_state('timer.hoymiles_discharge', 'active')
                     and not is_state('timer.hoymiles_charge', 'active')
                     and states('select.hoymiles_hit_ems_mode')
                       not in ['unknown', 'unavailable', 'none'] }}
            sequence:
              # Znacznik jest ustawiany przed komendą. Dzięki temu pierwszy
              # przyrost licznika oraz sprzedaż podczas utraty łączności nie
              # zostaną błędnie uznane za naturalną nadwyżkę PV.
              - action: input_boolean.turn_on
                target:
                  entity_id: input_boolean.hoymiles_rce_discharge_active
              - if:
                  - condition: state
                    entity_id: input_boolean.hoymiles_rce_dynamic_soc_enabled
                    state: "on"
                then:
                  - action: number.set_value
                    target:
                      entity_id: number.hoymiles_hit_force_discharge_soc
                    data:
                      value: >-
                        {{ states('sensor.hoymiles_rce_effective_minimum_soc')
                           | float(100) }}
                  - wait_template: >-
                      {{ ((states(
                           'number.hoymiles_hit_force_discharge_soc')
                           | float(0))
                          - (states(
                            'sensor.hoymiles_rce_effective_minimum_soc')
                            | float(100))) | abs < 1.0 }}
                    timeout: "00:01:00"
                    continue_on_timeout: false
              - action: select.select_option
                target:
                  entity_id: select.hoymiles_hit_ems_mode
                data:
                  option: "grid_discharge"
              - wait_template: >-
                  {{ is_state('select.hoymiles_hit_ems_mode', 'grid_discharge')
                     or (states(
                       'sensor.hoymiles_hit_overview_grid_total_active_power')
                       | float(0)) > 1000 }}
                timeout: "00:01:00"
                continue_on_timeout: true
              - if:
                  - condition: template
                    value_template: >-
                      {{ not is_state(
                           'select.hoymiles_hit_ems_mode', 'grid_discharge')
                         and (states(
                           'sensor.hoymiles_hit_overview_grid_total_active_power')
                           | float(0)) <= 1000 }}
                then:
                  - action: input_boolean.turn_off
                    target:
                      entity_id: input_boolean.hoymiles_rce_discharge_active

          # Stop RCE: the slot left the plan, minimum SOC was reached, automation
          # was disabled, or PSE data became unavailable.
          - conditions:
              - condition: state
                entity_id: input_boolean.hoymiles_rce_discharge_active
                state: "on"
              - condition: template
                value_template: >-
                  {{ is_state('input_boolean.hoymiles_rce_discharge_enabled', 'off')
                     or is_state('input_boolean.hoymiles_tariff_charge_enabled', 'on')
                     or is_state('binary_sensor.hoymiles_sale_block_active', 'on')
                     or is_state('binary_sensor.hoymiles_rce_reserve_ready', 'off')
                     or not is_number(states(
                       'sensor.hoymiles_rce_effective_discharge_power_percent'))
                     or (states(
                       'sensor.hoymiles_rce_effective_discharge_power_percent')
                       | float(0)) <= 0
                     or not is_state('binary_sensor.hoymiles_rce_price_above_threshold', 'on')
                     or (states('sensor.hoymiles_hit_overview_battery_soc') | float(0))
                        <= (states('sensor.hoymiles_rce_effective_minimum_soc') | float(100)) }}
              - condition: template
                value_template: >-
                  {{ states('select.hoymiles_hit_ems_mode')
                     not in ['unknown', 'unavailable', 'none'] }}
            sequence:
              - if:
                  - condition: state
                    entity_id: select.hoymiles_hit_ems_mode
                    state: "grid_discharge"
                then:
                  - action: select.select_option
                    target:
                      entity_id: select.hoymiles_hit_ems_mode
                    data:
                      option: "self_use"
              - wait_template: >-
                  {{ (states(
                       'sensor.hoymiles_hit_overview_grid_total_active_power')
                       | float(0)) <= 1000 }}
                timeout: "00:02:00"
                continue_on_timeout: true
              - delay: "00:00:15"
              - action: input_boolean.turn_off
                target:
                  entity_id: input_boolean.hoymiles_rce_discharge_active

  - id: hoymiles_daily_grid_discharge
    alias: "EMS — daily discharge do sieci"
    description: "Uruchamia discharge codziennie o godzinie ustawionej na dashboardzie."
    mode: single
    triggers:
      - trigger: time
        at: input_datetime.hoymiles_discharge_start
    conditions:
      - condition: state
        entity_id: input_boolean.hoymiles_battery_balancing_active
        state: "off"
      - condition: state
        entity_id: input_boolean.hoymiles_discharge_schedule_enabled
        state: "on"
      - condition: state
        entity_id: binary_sensor.hoymiles_sale_block_active
        state: "off"
    actions:
      - action: script.hoymiles_start_grid_discharge

  - id: hoymiles_daily_grid_charge
    alias: "EMS — daily charge z sieci"
    description: "Uruchamia charge codziennie o godzinie ustawionej na dashboardzie."
    mode: single
    triggers:
      - trigger: time
        at: input_datetime.hoymiles_charge_start
    conditions:
      - condition: state
        entity_id: input_boolean.hoymiles_battery_balancing_active
        state: "off"
      - condition: state
        entity_id: input_boolean.hoymiles_charge_schedule_enabled
        state: "on"
    actions:
      - action: script.hoymiles_start_grid_charge

  - id: hoymiles_finish_grid_discharge
    alias: "EMS — finish discharge i return do Self-Use"
    mode: single
    triggers:
      - trigger: timer.finished
        target:
          entity_id: timer.hoymiles_discharge
    actions:
      - condition: state
        entity_id: input_boolean.hoymiles_battery_balancing_active
        state: "off"
      - wait_template: >-
          {{ states('select.hoymiles_hit_ems_mode') not in
             ['unknown', 'unavailable', 'none'] }}
        timeout: "01:00:00"
        continue_on_timeout: false
      - if:
          - condition: state
            entity_id: select.hoymiles_hit_ems_mode
            state: "grid_discharge"
        then:
          - action: select.select_option
            target:
              entity_id: select.hoymiles_hit_ems_mode
            data:
              option: "self_use"
      - action: input_boolean.turn_off
        target:
          entity_id: input_boolean.hoymiles_discharge_cycle_active

  - id: hoymiles_finish_grid_charge
    alias: "EMS — finish charge i return do Self-Use"
    mode: single
    triggers:
      - trigger: timer.finished
        target:
          entity_id: timer.hoymiles_charge
    actions:
      - condition: state
        entity_id: input_boolean.hoymiles_battery_balancing_active
        state: "off"
      - wait_template: >-
          {{ states('select.hoymiles_hit_ems_mode') not in
             ['unknown', 'unavailable', 'none'] }}
        timeout: "01:00:00"
        continue_on_timeout: false
      - if:
          - condition: state
            entity_id: select.hoymiles_hit_ems_mode
            state: "grid_charge"
        then:
          - action: select.select_option
            target:
              entity_id: select.hoymiles_hit_ems_mode
            data:
              option: "self_use"
      - action: input_boolean.turn_off
        target:
          entity_id: input_boolean.hoymiles_charge_cycle_active

  - id: hoymiles_restore_ems_cycle_after_ha_restart
    alias: "EMS — restore cycle after Home Assistant restart"
    description: "Restores an active cycle or returns to Self-Use if its timer expired while HA was offline."
    mode: single
    triggers:
      - trigger: homeassistant
        event: start
    actions:
      - delay: "00:00:15"
      - condition: state
        entity_id: input_boolean.hoymiles_battery_balancing_active
        state: "off"
      - choose:
          - conditions:
              - condition: state
                entity_id: input_boolean.hoymiles_discharge_cycle_active
                state: "on"
              - condition: state
                entity_id: timer.hoymiles_discharge
                state: "active"
              - condition: state
                entity_id: binary_sensor.hoymiles_sale_block_active
                state: "off"
            sequence:
              - wait_template: >-
                  {{ states('select.hoymiles_hit_ems_mode') not in
                     ['unknown', 'unavailable', 'none'] }}
                timeout: "00:05:00"
                continue_on_timeout: false
              - action: select.select_option
                target:
                  entity_id: select.hoymiles_hit_ems_mode
                data:
                  option: "grid_discharge"
          - conditions:
              - condition: state
                entity_id: input_boolean.hoymiles_discharge_cycle_active
                state: "on"
            sequence:
              - wait_template: >-
                  {{ states('select.hoymiles_hit_ems_mode') not in
                     ['unknown', 'unavailable', 'none'] }}
                timeout: "00:05:00"
                continue_on_timeout: false
              - action: select.select_option
                target:
                  entity_id: select.hoymiles_hit_ems_mode
                data:
                  option: "self_use"
              - action: input_boolean.turn_off
                target:
                  entity_id: input_boolean.hoymiles_discharge_cycle_active
      - choose:
          - conditions:
              - condition: state
                entity_id: input_boolean.hoymiles_charge_cycle_active
                state: "on"
              - condition: state
                entity_id: timer.hoymiles_charge
                state: "active"
            sequence:
              - wait_template: >-
                  {{ states('select.hoymiles_hit_ems_mode') not in
                     ['unknown', 'unavailable', 'none'] }}
                timeout: "00:05:00"
                continue_on_timeout: false
              - action: select.select_option
                target:
                  entity_id: select.hoymiles_hit_ems_mode
                data:
                  option: "grid_charge"
          - conditions:
              - condition: state
                entity_id: input_boolean.hoymiles_charge_cycle_active
                state: "on"
            sequence:
              - wait_template: >-
                  {{ states('select.hoymiles_hit_ems_mode') not in
                     ['unknown', 'unavailable', 'none'] }}
                timeout: "00:05:00"
                continue_on_timeout: false
              - action: select.select_option
                target:
                  entity_id: select.hoymiles_hit_ems_mode
                data:
                  option: "self_use"
              - action: input_boolean.turn_off
                target:
                  entity_id: input_boolean.hoymiles_charge_cycle_active

  - id: hoymiles_rcm_voltage_charge_control
    alias: "RCEm 253 V+ — battery and safe-export control"
    description: >-
      Applies the voltage planner recommendation to the global limit every minute
      Battery Max Charge Power and, when separately enabled, the maximum
      export limit. Observation mode never writes to the inverter. RCEm does not
      switch GCF, Grid Charge, unbalance or protection settings.
    mode: single
    max_exceeded: silent
    triggers:
      - trigger: time_pattern
        minutes: "/1"
      - trigger: state
        entity_id:
          - input_boolean.hoymiles_rcm_enabled
          - input_boolean.hoymiles_rcm_shadow_mode
          - input_boolean.hoymiles_rcm_export_control_enabled
          - input_number.hoymiles_rcm_export_cap_percent
          - input_boolean.hoymiles_rce_discharge_enabled
          - input_boolean.hoymiles_tariff_charge_enabled
          - input_boolean.hoymiles_battery_balancing_active
          - input_boolean.hoymiles_discharge_cycle_active
          - input_boolean.hoymiles_charge_cycle_active
          - select.hoymiles_hit_ems_mode
      - trigger: numeric_state
        entity_id: sensor.hoymiles_rcem_maximum_grid_voltage
        above: 252.2
        id: voltage_emergency
      - trigger: homeassistant
        event: start
    actions:
      - variables:
          plan_status: >-
            {{ state_attr('sensor.hoymiles_hit_rcm_voltage_plan',
                          'status_code') | default('missing_data', true) }}
          recommended_limit: >-
            {{ state_attr('sensor.hoymiles_hit_rcm_voltage_plan',
                          'recommended_charge_limit_percent') | float(0) }}
          recommended_export_limit: >-
            {{ state_attr('sensor.hoymiles_hit_rcm_voltage_plan',
                          'recommended_export_limit_percent') | float(-1) }}
          export_control_requested: >-
            {{ is_state('input_boolean.hoymiles_rcm_export_control_enabled',
                        'on') }}
          export_control_available: >-
            {{ is_number(states(
                 'number.hoymiles_hit_maximum_export_power_limit'))
               and states('select.hoymiles_hit_generation_control_function')
                 not in ['unknown', 'unavailable', 'none', 'disabled', 'off'] }}
          rcm_blocked: >-
            {{ is_state('input_boolean.hoymiles_rce_discharge_enabled', 'on')
               or is_state('input_boolean.hoymiles_tariff_charge_enabled', 'on')
               or is_state('input_boolean.hoymiles_battery_balancing_active', 'on')
               or is_state('input_boolean.hoymiles_discharge_cycle_active', 'on')
               or is_state('input_boolean.hoymiles_charge_cycle_active', 'on')
               or is_state('timer.hoymiles_discharge', 'active')
               or is_state('timer.hoymiles_charge', 'active') }}
      - choose:
          # Zwolnienie własności parametru zawsze odtwarza ustawienie użytkownika.
          - conditions:
              - condition: state
                entity_id: input_boolean.hoymiles_rcm_active
                state: "on"
              - condition: template
                value_template: >-
                  {{ is_state('input_boolean.hoymiles_rcm_enabled', 'off')
                     or is_state('input_boolean.hoymiles_rcm_shadow_mode', 'on')
                     or rcm_blocked
                     or plan_status in ['missing_data', 'optimizer_error', 'learning'] }}
            sequence:
              - if:
                  - condition: template
                    value_template: >-
                      {{ is_number(states(
                           'input_number.hoymiles_rcm_saved_battery_charge_power'))
                         and is_number(states(
                           'number.hoymiles_hit_battery_max_charge_power')) }}
                then:
                  - action: number.set_value
                    target:
                      entity_id: number.hoymiles_hit_battery_max_charge_power
                    data:
                      value: >-
                        {{ states(
                          'input_number.hoymiles_rcm_saved_battery_charge_power')
                           | float(100) | round(1) }}
              - if:
                  - condition: state
                    entity_id: input_boolean.hoymiles_rcm_export_control_active
                    state: "on"
                  - condition: template
                    value_template: >-
                      {{ is_number(states(
                           'number.hoymiles_hit_maximum_export_power_limit')) }}
                then:
                  - action: number.set_value
                    target:
                      entity_id: number.hoymiles_hit_maximum_export_power_limit
                    data:
                      value: >-
                        {{ [states(
                             'input_number.hoymiles_rcm_saved_export_limit')
                              | float(0),
                            states(
                             'input_number.hoymiles_rcm_export_cap_percent')
                              | float(100)] | min | round(1) }}
                  - action: input_boolean.turn_off
                    target:
                      entity_id: input_boolean.hoymiles_rcm_export_control_active
              - action: input_boolean.turn_off
                target:
                  entity_id: input_boolean.hoymiles_rcm_active

          # Odtwórz limit eksportu także po restarcie lub wyłączeniu samego
          # regulatora eksportu, bez zatrzymywania części magazynowej RCEm.
          - conditions:
              - condition: state
                entity_id: input_boolean.hoymiles_rcm_export_control_active
                state: "on"
              - condition: template
                value_template: >-
                  {{ is_state('input_boolean.hoymiles_rcm_active', 'off')
                     or not export_control_requested
                     or not export_control_available }}
            sequence:
              - if:
                  - condition: template
                    value_template: >-
                      {{ is_number(states(
                           'number.hoymiles_hit_maximum_export_power_limit')) }}
                then:
                  - action: number.set_value
                    target:
                      entity_id: number.hoymiles_hit_maximum_export_power_limit
                    data:
                      value: >-
                        {{ [states(
                             'input_number.hoymiles_rcm_saved_export_limit')
                              | float(0),
                            states(
                             'input_number.hoymiles_rcm_export_cap_percent')
                              | float(100)] | min | round(1) }}
              - action: input_boolean.turn_off
                target:
                  entity_id: input_boolean.hoymiles_rcm_export_control_active

          # Pierwszy aktywny przebieg zapamiętuje globalny limit użytkownika.
          - conditions:
              - condition: state
                entity_id: input_boolean.hoymiles_rcm_enabled
                state: "on"
              - condition: state
                entity_id: input_boolean.hoymiles_rcm_shadow_mode
                state: "off"
              - condition: state
                entity_id: input_boolean.hoymiles_rcm_active
                state: "off"
              - condition: template
                value_template: >-
                  {{ not rcm_blocked
                     and plan_status not in
                       ['missing_data', 'optimizer_error', 'learning']
                     and recommended_limit >= 10 }}
            sequence:
              - action: input_number.set_value
                target:
                  entity_id: input_number.hoymiles_rcm_saved_battery_charge_power
                data:
                  value: >-
                    {{ states('number.hoymiles_hit_battery_max_charge_power')
                       | float(100) | round(1) }}
              - if:
                  - condition: template
                    value_template: >-
                      {{ not is_state('select.hoymiles_hit_ems_mode', 'self_use') }}
                then:
                  - action: select.select_option
                    target:
                      entity_id: select.hoymiles_hit_ems_mode
                    data:
                      option: "self_use"
                  - wait_template: >-
                      {{ is_state('select.hoymiles_hit_ems_mode', 'self_use') }}
                    timeout: "00:01:00"
                    continue_on_timeout: false
              - action: input_boolean.turn_on
                target:
                  entity_id: input_boolean.hoymiles_rcm_active

          # Kolejne przebiegi stosują osobno ograniczoną rekomendację magazynu
          # i — po świadomym włączeniu — limit eksportu. Próg 253 V może
          # natychmiast wyzerować eksport i użyć pełnej bezpiecznej mocy BMS.
          - conditions:
              - condition: state
                entity_id: input_boolean.hoymiles_rcm_active
                state: "on"
              - condition: template
                value_template: >-
                  {{ not rcm_blocked
                     and plan_status not in
                       ['missing_data', 'optimizer_error', 'learning']
                     and recommended_limit >= 10
                     and is_number(states(
                       'number.hoymiles_hit_battery_max_charge_power')) }}
              - condition: state
                entity_id: select.hoymiles_hit_ems_mode
                state: "self_use"
            sequence:
              - if:
                  - condition: template
                    value_template: >-
                      {{ export_control_requested
                         and export_control_available
                         and is_state(
                           'input_boolean.hoymiles_rcm_export_control_active',
                           'off') }}
                then:
                  - action: input_number.set_value
                    target:
                      entity_id: input_number.hoymiles_rcm_saved_export_limit
                    data:
                      value: >-
                        {{ states(
                          'number.hoymiles_hit_maximum_export_power_limit')
                           | float(0) | round(1) }}
                  - action: input_boolean.turn_on
                    target:
                      entity_id: input_boolean.hoymiles_rcm_export_control_active

              - if:
                  - condition: template
                    value_template: >-
                      {{ (recommended_limit
                           - (states(
                             'number.hoymiles_hit_battery_max_charge_power')
                              | float(0))) | abs >= 1.0 }}
                then:
                  - action: number.set_value
                    target:
                      entity_id: number.hoymiles_hit_battery_max_charge_power
                    data:
                      value: "{{ recommended_limit | round(1) }}"

              - if:
                  - condition: state
                    entity_id: input_boolean.hoymiles_rcm_export_control_active
                    state: "on"
                  - condition: template
                    value_template: >-
                      {{ recommended_export_limit >= 0
                         and is_number(states(
                           'number.hoymiles_hit_maximum_export_power_limit'))
                         and (recommended_export_limit
                              - (states(
                                'number.hoymiles_hit_maximum_export_power_limit')
                                 | float(0))) | abs >= 1.0 }}
                then:
                  - action: number.set_value
                    target:
                      entity_id: number.hoymiles_hit_maximum_export_power_limit
                    data:
                      value: "{{ recommended_export_limit | round(1) }}"

  - id: hoymiles_rcm_pre_discharge_control
    alias: "RCEm 253 V+ — morning battery-headroom preparation"
    description: >-
      Before today's high-voltage window, it discharges to the grid only
      the energy that the home will not consume beforehand and that is required as
      headroom for the forecast PV surplus. Power is selected from the energy amount
      and available time. It never goes below protected SOC and respects
      the export lockout, BMS limit and existing export cap. It changes neither
      GCF nor Maximum Export Power Limit.
    mode: single
    max_exceeded: silent
    triggers:
      - trigger: time_pattern
        minutes: "/1"
      - trigger: state
        entity_id:
          - input_boolean.hoymiles_rcm_enabled
          - input_boolean.hoymiles_rcm_shadow_mode
          - input_boolean.hoymiles_rcm_pre_discharge_enabled
          - input_boolean.hoymiles_rcm_active
          - input_boolean.hoymiles_rce_discharge_enabled
          - input_boolean.hoymiles_tariff_charge_enabled
          - input_boolean.hoymiles_battery_balancing_active
          - input_boolean.hoymiles_discharge_cycle_active
          - input_boolean.hoymiles_charge_cycle_active
          - binary_sensor.hoymiles_sale_block_active
          - select.hoymiles_hit_ems_mode
          - sensor.hoymiles_hit_overview_battery_soc
          - sensor.hoymiles_hit_rcm_voltage_plan
          - number.hoymiles_hit_maximum_export_power_limit
      - trigger: homeassistant
        event: start
    actions:
      - variables:
          plan_status: >-
            {{ state_attr('sensor.hoymiles_hit_rcm_voltage_plan',
                          'status_code') | default('missing_data', true) }}
          pre_discharge_ready: >-
            {{ state_attr('sensor.hoymiles_hit_rcm_voltage_plan',
                          'pre_discharge_ready') | default(false, true) }}
          target_soc: >-
            {{ state_attr('sensor.hoymiles_hit_rcm_voltage_plan',
                          'pre_discharge_target_soc_percent') | float(100) }}
          power_percent: >-
            {{ state_attr('sensor.hoymiles_hit_rcm_voltage_plan',
                          'pre_discharge_power_percent') | float(0) }}
          maximum_voltage: >-
            {{ state_attr('sensor.hoymiles_hit_rcm_voltage_plan',
                          'maximum_voltage_v') | float(999) }}
          rolling_voltage: >-
            {{ state_attr('sensor.hoymiles_hit_rcm_voltage_plan',
                          'rolling_10m_voltage_v') | float(999) }}
          export_available: >-
            {{ is_number(states(
                 'number.hoymiles_hit_maximum_export_power_limit'))
               and (states('number.hoymiles_hit_maximum_export_power_limit')
                    | float(0)) > 0
               and states('select.hoymiles_hit_generation_control_function')
                 not in ['unknown', 'unavailable', 'none', 'disabled', 'off'] }}
          pre_discharge_blocked: >-
            {{ is_state('input_boolean.hoymiles_rce_discharge_enabled', 'on')
               or is_state('input_boolean.hoymiles_tariff_charge_enabled', 'on')
               or is_state('input_boolean.hoymiles_battery_balancing_active', 'on')
               or is_state('input_boolean.hoymiles_discharge_cycle_active', 'on')
               or is_state('input_boolean.hoymiles_charge_cycle_active', 'on')
               or is_state('timer.hoymiles_discharge', 'active')
               or is_state('timer.hoymiles_charge', 'active') }}
      - choose:
          # Każde naruszenie warunków natychmiast kończy tylko cykl należący do
          # RCEm i odtwarza dokładnie nastawy zastane przed jego rozpoczęciem.
          - conditions:
              - condition: state
                entity_id: input_boolean.hoymiles_rcm_pre_discharge_active
                state: "on"
              - condition: template
                value_template: >-
                  {{ is_state('input_boolean.hoymiles_rcm_enabled', 'off')
                     or is_state('input_boolean.hoymiles_rcm_shadow_mode', 'on')
                     or is_state(
                       'input_boolean.hoymiles_rcm_pre_discharge_enabled', 'off')
                     or is_state('input_boolean.hoymiles_rcm_active', 'off')
                     or pre_discharge_blocked
                     or is_state('binary_sensor.hoymiles_sale_block_active', 'on')
                     or plan_status in
                       ['missing_data', 'optimizer_error', 'learning']
                     or not pre_discharge_ready
                     or not export_available
                     or maximum_voltage >= 248.4
                     or rolling_voltage >= 249.2
                     or (states('sensor.hoymiles_hit_overview_battery_soc')
                         | float(0)) <= target_soc + 0.5
                     or not is_state(
                       'select.hoymiles_hit_ems_mode', 'grid_discharge') }}
            sequence:
              - if:
                  - condition: state
                    entity_id: select.hoymiles_hit_ems_mode
                    state: "grid_discharge"
                  - condition: template
                    value_template: >-
                      {{ is_state(
                           'input_boolean.hoymiles_discharge_cycle_active', 'off')
                         and is_state(
                           'input_boolean.hoymiles_rce_discharge_active', 'off') }}
                then:
                  - action: select.select_option
                    target:
                      entity_id: select.hoymiles_hit_ems_mode
                    data:
                      option: "self_use"
                  - wait_template: >-
                      {{ is_state('select.hoymiles_hit_ems_mode', 'self_use') }}
                    timeout: "00:01:00"
                    continue_on_timeout: true
              - if:
                  - condition: template
                    value_template: >-
                      {{ is_number(states(
                           'number.hoymiles_hit_maximum_discharge_power')) }}
                then:
                  - action: number.set_value
                    target:
                      entity_id: number.hoymiles_hit_maximum_discharge_power
                    data:
                      value: >-
                        {{ states(
                          'input_number.hoymiles_rcm_saved_max_discharge_power')
                           | float(100) | round(1) }}
              - if:
                  - condition: template
                    value_template: >-
                      {{ is_number(states(
                           'number.hoymiles_hit_force_discharge_soc')) }}
                then:
                  - action: number.set_value
                    target:
                      entity_id: number.hoymiles_hit_force_discharge_soc
                    data:
                      value: >-
                        {{ states(
                          'input_number.hoymiles_rcm_saved_force_discharge_soc')
                           | float(20) | round(0) }}
              - action: input_boolean.turn_off
                target:
                  entity_id: input_boolean.hoymiles_rcm_pre_discharge_active

          # Rozpoczęcie jest dozwolone wyłącznie dla dzisiejszego okna ryzyka,
          # przy bezpiecznym napięciu, aktywnym eksporcie i poza blokadą sprzedaży.
          - conditions:
              - condition: state
                entity_id: input_boolean.hoymiles_rcm_enabled
                state: "on"
              - condition: state
                entity_id: input_boolean.hoymiles_rcm_shadow_mode
                state: "off"
              - condition: state
                entity_id: input_boolean.hoymiles_rcm_pre_discharge_enabled
                state: "on"
              - condition: state
                entity_id: input_boolean.hoymiles_rcm_active
                state: "on"
              - condition: state
                entity_id: input_boolean.hoymiles_rcm_pre_discharge_active
                state: "off"
              - condition: state
                entity_id: binary_sensor.hoymiles_sale_block_active
                state: "off"
              - condition: state
                entity_id: sun.sun
                state: "above_horizon"
              - condition: state
                entity_id: select.hoymiles_hit_ems_mode
                state: "self_use"
              - condition: template
                value_template: >-
                  {{ not pre_discharge_blocked
                     and pre_discharge_ready
                     and export_available
                     and power_percent >= 1
                     and target_soc >= 0
                     and is_number(states(
                       'number.hoymiles_hit_maximum_discharge_power'))
                     and is_number(states(
                       'number.hoymiles_hit_force_discharge_soc')) }}
            sequence:
              - action: input_number.set_value
                target:
                  entity_id: input_number.hoymiles_rcm_saved_max_discharge_power
                data:
                  value: >-
                    {{ states('number.hoymiles_hit_maximum_discharge_power')
                       | float(100) | round(1) }}
              - action: input_number.set_value
                target:
                  entity_id: input_number.hoymiles_rcm_saved_force_discharge_soc
                data:
                  value: >-
                    {{ states('number.hoymiles_hit_force_discharge_soc')
                       | float(20) | round(0) }}
              - action: number.set_value
                target:
                  entity_id: number.hoymiles_hit_maximum_discharge_power
                data:
                  value: "{{ power_percent | round(1) }}"
              - action: number.set_value
                target:
                  entity_id: number.hoymiles_hit_force_discharge_soc
                data:
                  value: "{{ target_soc | round(0, 'ceil') }}"
              - action: input_boolean.turn_on
                target:
                  entity_id: input_boolean.hoymiles_rcm_pre_discharge_active
              - action: select.select_option
                target:
                  entity_id: select.hoymiles_hit_ems_mode
                data:
                  option: "grid_discharge"
              - wait_template: >-
                  {{ is_state('select.hoymiles_hit_ems_mode', 'grid_discharge')
                     or (states(
                       'sensor.hoymiles_hit_overview_grid_total_active_power')
                        | float(0)) > 500 }}
                timeout: "00:01:00"
                continue_on_timeout: true
              - if:
                  - condition: template
                    value_template: >-
                      {{ not is_state(
                           'select.hoymiles_hit_ems_mode', 'grid_discharge')
                         and (states(
                           'sensor.hoymiles_hit_overview_grid_total_active_power')
                            | float(0)) <= 500 }}
                then:
                  - action: number.set_value
                    target:
                      entity_id: number.hoymiles_hit_maximum_discharge_power
                    data:
                      value: >-
                        {{ states(
                          'input_number.hoymiles_rcm_saved_max_discharge_power')
                           | float(100) | round(1) }}
                  - action: number.set_value
                    target:
                      entity_id: number.hoymiles_hit_force_discharge_soc
                    data:
                      value: >-
                        {{ states(
                          'input_number.hoymiles_rcm_saved_force_discharge_soc')
                           | float(20) | round(0) }}
                  - action: input_boolean.turn_off
                    target:
                      entity_id: input_boolean.hoymiles_rcm_pre_discharge_active

          # Podczas cyklu aktualizuj moc i cel SOC wraz ze zmianą prognozy, ale
          # nie przełączaj ponownie trybu EMS i nie dotykaj limitu eksportu.
          - conditions:
              - condition: state
                entity_id: input_boolean.hoymiles_rcm_pre_discharge_active
                state: "on"
              - condition: state
                entity_id: select.hoymiles_hit_ems_mode
                state: "grid_discharge"
              - condition: template
                value_template: >-
                  {{ pre_discharge_ready
                     and power_percent >= 1
                     and not pre_discharge_blocked }}
            sequence:
              - if:
                  - condition: template
                    value_template: >-
                      {{ (power_percent
                           - (states(
                             'number.hoymiles_hit_maximum_discharge_power')
                              | float(0))) | abs >= 1.0 }}
                then:
                  - action: number.set_value
                    target:
                      entity_id: number.hoymiles_hit_maximum_discharge_power
                    data:
                      value: "{{ power_percent | round(1) }}"
              - if:
                  - condition: template
                    value_template: >-
                      {{ ((target_soc | round(0, 'ceil'))
                           - (states('number.hoymiles_hit_force_discharge_soc')
                              | float(0))) | abs >= 1.0 }}
                then:
                  - action: number.set_value
                    target:
                      entity_id: number.hoymiles_hit_force_discharge_soc
                    data:
                      value: "{{ target_soc | round(0, 'ceil') }}"
