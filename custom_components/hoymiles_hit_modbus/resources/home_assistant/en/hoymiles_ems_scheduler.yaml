    binary_sensor:
      - name: "Hoymiles EMS Control Conflict"
        unique_id: hoymiles_ems_control_conflict
        icon: mdi:alert-octagon-outline
        state: >-
          {% set configured =
               (1 if is_state('input_boolean.hoymiles_rce_discharge_enabled', 'on') else 0)
             + (1 if is_state('input_boolean.hoymiles_tariff_charge_enabled', 'on') else 0)
             + (1 if is_state('input_boolean.hoymiles_rcm_enabled', 'on')
                    and is_state('input_boolean.hoymiles_rcm_shadow_mode', 'off')
                  else 0) %}
          {% set running =
               (1 if is_state('input_boolean.hoymiles_rce_discharge_active', 'on') else 0)
             + (1 if is_state('input_boolean.hoymiles_tariff_charge_active', 'on') else 0)
             + (1 if is_state('input_boolean.hoymiles_rcm_active', 'on') else 0)
             + (1 if is_state('input_boolean.hoymiles_discharge_cycle_active', 'on') else 0)
             + (1 if is_state('input_boolean.hoymiles_charge_cycle_active', 'on') else 0)
              + (1 if is_state('input_boolean.hoymiles_battery_balancing_active', 'on') else 0) %}
          {% set export_owner = is_state(
               'input_boolean.hoymiles_rcm_export_control_active', 'on') %}
          {% set foreign_running =
               (1 if is_state('input_boolean.hoymiles_rce_discharge_active', 'on') else 0)
             + (1 if is_state('input_boolean.hoymiles_tariff_charge_active', 'on') else 0)
             + (1 if is_state('input_boolean.hoymiles_discharge_cycle_active', 'on') else 0)
             + (1 if is_state('input_boolean.hoymiles_charge_cycle_active', 'on') else 0)
             + (1 if is_state('input_boolean.hoymiles_battery_balancing_active', 'on') else 0) %}
          {{ configured > 1 or running > 1
             or (export_owner and foreign_running > 0) }}
        attributes:
          configured_automatic_modes: >-
            {{ [
              'RCE' if is_state('input_boolean.hoymiles_rce_discharge_enabled', 'on') else none,
              'Tariff' if is_state('input_boolean.hoymiles_tariff_charge_enabled', 'on') else none,
              'RCEm' if is_state('input_boolean.hoymiles_rcm_enabled', 'on')
                         and is_state('input_boolean.hoymiles_rcm_shadow_mode', 'off')
                       else none
            ] | reject('equalto', none) | list | join(', ') }}

      - name: "Hoymiles RCEm Risk Window Active"
        unique_id: hoymiles_rcm_risk_window_active
        icon: mdi:transmission-tower-export
        availability: >-
          {{ state_attr('sensor.hoymiles_hit_rcm_voltage_plan',
                        'risk_window_active') is not none }}
        state: >-
          {{ state_attr('sensor.hoymiles_hit_rcm_voltage_plan',
                        'risk_window_active') | default(false, true) }}

      - name: "Hoymiles Battery Balancing Due"
        unique_id: hoymiles_battery_balancing_due
        icon: mdi:calendar-alert
        availability: >-
          {{ states('input_datetime.hoymiles_battery_balancing_last_completed')
               not in ['unknown', 'unavailable', 'none'] }}
        state: >-
          {% set last = states(
               'input_datetime.hoymiles_battery_balancing_last_completed') %}
          {% set midnight = as_timestamp(last[0:10], as_timestamp(now())) %}
          {% set days = states(
               'input_number.hoymiles_battery_balancing_interval_days')
               | int(30) %}
          {{ is_state('input_boolean.hoymiles_battery_balancing_enabled', 'on')
             and is_state('input_boolean.hoymiles_battery_balancing_active', 'off')
             and as_timestamp(now()) >= midnight + days * 86400 }}

      - name: "Hoymiles Battery Balancing Control Data Ready"
        unique_id: hoymiles_battery_balancing_control_data_ready
        icon: mdi:battery-check-outline
        state: >-
          {% set soc = states.sensor.hoymiles_hit_overview_battery_soc %}
          {% set load = states.sensor.hoymiles_actual_load_power %}
          {% set current = states.sensor.hoymiles_hit_maximum_charge_current %}
          {% set voltage = states.sensor.hoymiles_hit_battery_voltage_bms %}
          {% set max_power =
            states.sensor.hoymiles_hit_ems_maximum_charge_power_readback %}
          {% set force_soc =
            states.sensor.hoymiles_hit_ems_force_charge_soc_readback %}
          {% set ems_generation =
            states.sensor.hoymiles_hit_ems_control_readback_generation %}
          {% set soc_reported = soc.last_reported
               if soc.last_reported is defined else soc.last_updated %}
          {% set load_reported = load.last_reported
               if load.last_reported is defined else load.last_updated %}
          {% set current_reported = current.last_reported
               if current.last_reported is defined else current.last_updated %}
          {% set voltage_reported = voltage.last_reported
               if voltage.last_reported is defined else voltage.last_updated %}
          {% set max_power_reported = max_power.last_reported
               if max_power.last_reported is defined else max_power.last_updated %}
          {% set force_soc_reported = force_soc.last_reported
               if force_soc.last_reported is defined else force_soc.last_updated %}
          {% set ems_reported = ems_generation.last_reported
               if ems_generation.last_reported is defined
               else ems_generation.last_updated %}
          {% set soc_age = as_timestamp(now()) - as_timestamp(soc_reported, 0) %}
          {% set load_age = as_timestamp(now()) - as_timestamp(load_reported, 0) %}
          {% set current_age = as_timestamp(now())
               - as_timestamp(current_reported, 0) %}
          {% set voltage_age = as_timestamp(now())
               - as_timestamp(voltage_reported, 0) %}
          {% set max_power_age = as_timestamp(now())
               - as_timestamp(max_power_reported, 0) %}
          {% set force_soc_age = as_timestamp(now())
               - as_timestamp(force_soc_reported, 0) %}
          {% set ems_age = as_timestamp(now())
               - as_timestamp(ems_reported, 0) %}
          {{ is_state('binary_sensor.hoymiles_ems_execution_ready', 'on')
             and states('sensor.hoymiles_ems_hardware_mode')
               not in ['unknown', 'unavailable', 'none', '']
             and is_number(soc.state)
             and is_number(load.state)
             and is_number(current.state)
             and is_number(voltage.state)
              and is_number(max_power.state)
              and is_number(force_soc.state)
              and is_number(ems_generation.state)
              and (soc.state | float(-1)) >= 0
              and (soc.state | float(101)) <= 100
             and (current.state | float(0)) > 0
             and (voltage.state | float(0)) > 0
             and is_number(states(
               'sensor.hoymiles_hit_number_of_machines_master_and_slave'))
             and (states(
               'sensor.hoymiles_hit_number_of_machines_master_and_slave')
               | int(0)) >= 1
             and is_number(states(
               'sensor.hoymiles_battery_balancing_bms_safe_charge_power'))
             and (states(
               'sensor.hoymiles_battery_balancing_bms_safe_charge_power')
               | float(0)) > 0
             and soc_age >= -5 and soc_age <= 120
             and load_age >= -5 and load_age <= 120
             and current_age >= -5 and current_age <= 300
             and voltage_age >= -5 and voltage_age <= 300
             and max_power_age >= -5 and max_power_age <= 300
             and force_soc_age >= -5 and force_soc_age <= 300
             and ems_age >= -5 and ems_age <= 180 }}
        attributes:
          soc_age_seconds: >-
            {% set item = states.sensor.hoymiles_hit_overview_battery_soc %}
            {% set reported = item.last_reported
                 if item.last_reported is defined else item.last_updated %}
            {{ (as_timestamp(now()) - as_timestamp(reported, 0)) | round(1) }}
          bms_charge_limit_percent: >-
            {{ states(
              'sensor.hoymiles_battery_balancing_bms_safe_charge_power') }}

      - name: "Hoymiles RCE Planned Export Slot"
        unique_id: hoymiles_rce_price_above_threshold
        icon: mdi:calendar-check
        availability: >-
          {{ state_attr('sensor.hoymiles_hit_rce_optimized_plan',
                        'current_slot_planned') is not none }}
        state: >-
          {{ state_attr('sensor.hoymiles_hit_rce_optimized_plan',
                        'current_slot_planned') | default(false, true) }}

      - name: "Hoymiles Tariff Planned Charge Slot"
        unique_id: hoymiles_tariff_planned_charge_slot
        icon: mdi:battery-clock-outline
        availability: >-
          {{ state_attr('sensor.hoymiles_hit_tariff_charge_plan',
                        'current_slot_planned') is not none }}
        state: >-
          {% set plan = 'sensor.hoymiles_hit_tariff_charge_plan' %}
          {% set action = state_attr(plan, 'current_action') %}
          {% set remaining = state_attr(plan, 'current_run_remaining_minutes') %}
          {% if state_attr(plan, 'status_code')
                not in ['ready', 'insufficient_cheap_window'] %}
            false
          {% elif not state_attr(plan, 'current_slot_planned')
                | default(false, true) %}
            false
          {% elif not is_number(remaining) or (remaining | float(0)) < 7 %}
            false
          {% elif action == 'grid_support' %}
            {{ state_attr(plan, 'current_run_start_eligible') is sameas true }}
          {% else %}
            {{ action in ['battery_charge', 'grid_support_and_charge'] }}
          {% endif %}
        attributes:
          raw_plan_selected: >-
            {{ state_attr('sensor.hoymiles_hit_tariff_charge_plan',
                          'current_slot_planned') | default(false, true) }}
          current_action: >-
            {{ state_attr('sensor.hoymiles_hit_tariff_charge_plan',
                          'current_action') | default('none', true) }}
          suppression_reason: >-
            {{ state_attr('sensor.hoymiles_hit_tariff_charge_plan',
                          'current_run_suppression_reason')
               | default('no_current_plan', true) }}
          remaining_minutes: >-
            {{ state_attr('sensor.hoymiles_hit_tariff_charge_plan',
                          'current_run_remaining_minutes') }}

      - name: "Hoymiles RCE Reserve Ready"
        unique_id: hoymiles_rce_reserve_ready
        icon: mdi:shield-check-outline
        state: >-
          {% set status = state_attr(
            'sensor.hoymiles_hit_rce_optimized_plan', 'status_code') %}
          {{ status in ['ready', 'waiting_for_market', 'home_protected'] }}

      - name: "Hoymiles Sale Block Active"
        unique_id: hoymiles_sale_block_active
        icon: mdi:transmission-tower-off
        availability: >-
          {{ states('input_datetime.hoymiles_sale_block_start')
               not in ['unknown', 'unavailable', 'none']
             and states('input_datetime.hoymiles_sale_block_end')
               not in ['unknown', 'unavailable', 'none'] }}
        state: >-
          {% set start_parts =
            states('input_datetime.hoymiles_sale_block_start').split(':') %}
          {% set end_parts =
            states('input_datetime.hoymiles_sale_block_end').split(':') %}
          {% set start = (start_parts[0] | int(0)) * 60
                       + (start_parts[1] | int(0)) %}
          {% set finish = (end_parts[0] | int(0)) * 60
                        + (end_parts[1] | int(0)) %}
          {% set current = now().hour * 60 + now().minute %}
          {% set in_window =
            (start < finish and start <= current < finish)
            or (start > finish and (current >= start or current < finish)) %}
          {{ is_state('input_boolean.hoymiles_sale_block_enabled', 'on')
             and start != finish and in_window }}
        attributes:
          configured_window: >-
            {{ states('input_datetime.hoymiles_sale_block_start')[0:5] }}
            –
            {{ states('input_datetime.hoymiles_sale_block_end')[0:5] }}

timer:
  hoymiles_battery_balancing_hold:
    name: "Battery balancing — remaining time at 100% SOC"
    duration: "02:00:00"
    restore: true
    icon: mdi:timer-sand-complete

  hoymiles_battery_balancing_watchdog:
    name: "Battery balancing — cycle time limit"
    duration: "24:00:00"
    restore: true
    icon: mdi:timer-alert-outline

  hoymiles_discharge:
    name: "EMS — discharge time remaining"
    duration: "01:30:00"
    restore: true
    icon: mdi:timer-outline

  hoymiles_charge:
    name: "EMS — charge time remaining"
    duration: "01:30:00"
    restore: true
    icon: mdi:timer-outline

script:
  # These are the only scripts allowed to write HIT/GCF control entities.
  # A Home Assistant number/select state is only a command echo.  Every helper
  # snapshots the firmware readback generation *after* the service call and
  # returns only after a later Modbus read proves the requested raw value.
  hoymiles_verified_set_ems_mode:
    alias: "EMS — set mode with hardware readback"
    description: >-
      Writes the EMS mode with FC10 and confirms a new readback generation, mode code
      and unchanged physical mirrors for all six remaining 430x settings.
    # A newer safety command (especially RCEm 253 V+) pre-empts a stale ACK
    # wait immediately; it never sits behind a minute-long normal queue.
    mode: restart
    fields:
      option:
        required: true
        selector:
          select:
            options:
              - self_use
              - grid_charge
              - grid_discharge
    sequence:
      - condition: template
        value_template: >-
          {{ states('sensor.hoymiles_hit_ems_verified_hardware_readback_supported')
               | float(0) > 0.5 }}
      - condition: template
        value_template: >-
          {{ option in ['self_use', 'grid_charge', 'grid_discharge']
             and is_number(states(
               'sensor.hoymiles_hit_parallel_topology_readback_generation'))
             and is_number(states(
               'sensor.hoymiles_hit_ems_control_readback_generation'))
             and is_number(states(
               'sensor.hoymiles_hit_ems_mode_readback_code'))
             and is_number(states(
               'sensor.hoymiles_hit_ems_self_use_soc_readback'))
             and is_number(states(
               'sensor.hoymiles_hit_ems_backup_soc_readback'))
             and is_number(states(
               'sensor.hoymiles_hit_ems_force_charge_soc_readback'))
             and is_number(states(
               'sensor.hoymiles_hit_ems_maximum_charge_power_readback'))
             and is_number(states(
               'sensor.hoymiles_hit_ems_force_discharge_soc_readback'))
             and is_number(states(
               'sensor.hoymiles_hit_ems_maximum_discharge_power_readback')) }}
      - variables:
          target_mode_code: >-
            {{ {'self_use': 0, 'grid_charge': 4,
                'grid_discharge': 5}.get(option, -1) }}
          expected_self_use_soc: >-
            {{ states('sensor.hoymiles_hit_ems_self_use_soc_readback')
               | float(-999) }}
          expected_backup_soc: >-
            {{ states('sensor.hoymiles_hit_ems_backup_soc_readback')
               | float(-999) }}
          expected_force_charge_soc: >-
            {{ states('sensor.hoymiles_hit_ems_force_charge_soc_readback')
               | float(-999) }}
          expected_maximum_charge_power: >-
            {{ states('sensor.hoymiles_hit_ems_maximum_charge_power_readback')
               | float(-999) }}
          expected_force_discharge_soc: >-
            {{ states('sensor.hoymiles_hit_ems_force_discharge_soc_readback')
               | float(-999) }}
          expected_maximum_discharge_power: >-
            {{ states('sensor.hoymiles_hit_ems_maximum_discharge_power_readback')
               | float(-999) }}
      - action: select.select_option
        target:
          entity_id: select.hoymiles_hit_ems_mode
        data:
          option: "{{ option }}"
      # Capture after the write.  A cached/pre-write read may never satisfy it.
      - variables:
          ems_generation_after_write: >-
            {{ states('sensor.hoymiles_hit_ems_control_readback_generation') }}
      - wait_template: >-
          {{ (states(
               'sensor.hoymiles_hit_ems_verified_hardware_readback_supported')
               | float(0) > 0.5)
             and states(
               'sensor.hoymiles_hit_ems_control_readback_generation')
                 not in ['unknown', 'unavailable', 'none', '']
             and states(
               'sensor.hoymiles_hit_ems_control_readback_generation')
                 != ems_generation_after_write
             and (states('sensor.hoymiles_hit_ems_mode_readback_code')
                  | int(-1)) == (target_mode_code | int(-2))
             and (states('sensor.hoymiles_hit_ems_self_use_soc_readback')
                  | float(-999)) == (expected_self_use_soc | float(-998))
             and (states('sensor.hoymiles_hit_ems_backup_soc_readback')
                  | float(-999)) == (expected_backup_soc | float(-998))
             and (states(
               'sensor.hoymiles_hit_ems_force_charge_soc_readback')
                  | float(-999)) == (expected_force_charge_soc | float(-998))
             and (states(
               'sensor.hoymiles_hit_ems_maximum_charge_power_readback')
                  | float(-999))
                    == (expected_maximum_charge_power | float(-998))
             and (states(
               'sensor.hoymiles_hit_ems_force_discharge_soc_readback')
                  | float(-999))
                    == (expected_force_discharge_soc | float(-998))
             and (states(
               'sensor.hoymiles_hit_ems_maximum_discharge_power_readback')
                  | float(-999))
                    == (expected_maximum_discharge_power | float(-998)) }}
        timeout: "00:01:00"
        continue_on_timeout: false

  hoymiles_verified_set_ems_maximum_charge_power:
    alias: "EMS — set charging limit with hardware readback"
    mode: restart
    fields:
      value:
        required: true
        selector:
          number:
            min: 0
            max: 100
            step: 0.1
    sequence:
      - condition: template
        value_template: >-
          {{ states('sensor.hoymiles_hit_ems_verified_hardware_readback_supported')
               | float(0) > 0.5 }}
      - condition: template
        value_template: >-
          {{ is_number(value)
             and is_number(states(
               'sensor.hoymiles_hit_parallel_topology_readback_generation'))
             and is_number(states(
               'sensor.hoymiles_hit_ems_control_readback_generation')) }}
      - action: number.set_value
        target:
          entity_id: number.hoymiles_hit_maximum_charge_power
        data:
          value: "{{ value | float(0) | round(1) }}"
      - variables:
          ems_generation_after_write: >-
            {{ states('sensor.hoymiles_hit_ems_control_readback_generation') }}
      - wait_template: >-
          {{ (states(
               'sensor.hoymiles_hit_ems_verified_hardware_readback_supported')
               | float(0) > 0.5)
             and states('sensor.hoymiles_hit_ems_control_readback_generation')
               not in ['unknown', 'unavailable', 'none', '']
             and states('sensor.hoymiles_hit_ems_control_readback_generation')
               != ems_generation_after_write
             and ((states(
               'sensor.hoymiles_hit_ems_maximum_charge_power_readback')
                 | float(-999)) - (value | float(0))) | abs < 0.05 }}
        timeout: "00:01:00"
        continue_on_timeout: false

  hoymiles_verified_set_ems_force_charge_soc:
    alias: "EMS — set charging threshold with hardware readback"
    mode: restart
    fields:
      value:
        required: true
        selector:
          number:
            min: 0
            max: 100
            step: 1
    sequence:
      - condition: template
        value_template: >-
          {{ states('sensor.hoymiles_hit_ems_verified_hardware_readback_supported')
               | float(0) > 0.5 }}
      - condition: template
        value_template: >-
          {{ is_number(value)
             and is_number(states(
               'sensor.hoymiles_hit_parallel_topology_readback_generation'))
             and is_number(states(
               'sensor.hoymiles_hit_ems_control_readback_generation')) }}
      - action: number.set_value
        target:
          entity_id: number.hoymiles_hit_force_charge_soc
        data:
          value: "{{ value | float(0) | round(0) }}"
      - variables:
          ems_generation_after_write: >-
            {{ states('sensor.hoymiles_hit_ems_control_readback_generation') }}
      - wait_template: >-
          {{ (states(
               'sensor.hoymiles_hit_ems_verified_hardware_readback_supported')
               | float(0) > 0.5)
             and states('sensor.hoymiles_hit_ems_control_readback_generation')
               not in ['unknown', 'unavailable', 'none', '']
             and states('sensor.hoymiles_hit_ems_control_readback_generation')
               != ems_generation_after_write
             and ((states(
               'sensor.hoymiles_hit_ems_force_charge_soc_readback')
                 | float(-999)) - (value | float(0))) | abs < 0.5 }}
        timeout: "00:01:00"
        continue_on_timeout: false

  hoymiles_verified_set_ems_maximum_discharge_power:
    alias: "EMS — set discharging limit with hardware readback"
    mode: restart
    fields:
      value:
        required: true
        selector:
          number:
            min: 0
            max: 100
            step: 0.1
    sequence:
      - condition: template
        value_template: >-
          {{ states('sensor.hoymiles_hit_ems_verified_hardware_readback_supported')
               | float(0) > 0.5 }}
      - condition: template
        value_template: >-
          {{ is_number(value)
             and is_number(states(
               'sensor.hoymiles_hit_parallel_topology_readback_generation'))
             and is_number(states(
               'sensor.hoymiles_hit_ems_control_readback_generation')) }}
      - action: number.set_value
        target:
          entity_id: number.hoymiles_hit_maximum_discharge_power
        data:
          value: "{{ value | float(0) | round(1) }}"
      - variables:
          ems_generation_after_write: >-
            {{ states('sensor.hoymiles_hit_ems_control_readback_generation') }}
      - wait_template: >-
          {{ (states(
               'sensor.hoymiles_hit_ems_verified_hardware_readback_supported')
               | float(0) > 0.5)
             and states('sensor.hoymiles_hit_ems_control_readback_generation')
               not in ['unknown', 'unavailable', 'none', '']
             and states('sensor.hoymiles_hit_ems_control_readback_generation')
               != ems_generation_after_write
             and ((states(
               'sensor.hoymiles_hit_ems_maximum_discharge_power_readback')
                 | float(-999)) - (value | float(0))) | abs < 0.05 }}
        timeout: "00:01:00"
        continue_on_timeout: false

  hoymiles_verified_set_ems_force_discharge_soc:
    alias: "EMS — set discharge threshold with hardware readback"
    mode: restart
    fields:
      value:
        required: true
        selector:
          number:
            min: 0
            max: 100
            step: 1
    sequence:
      - condition: template
        value_template: >-
          {{ states('sensor.hoymiles_hit_ems_verified_hardware_readback_supported')
               | float(0) > 0.5 }}
      - condition: template
        value_template: >-
          {{ is_number(value)
             and is_number(states(
               'sensor.hoymiles_hit_parallel_topology_readback_generation'))
             and is_number(states(
               'sensor.hoymiles_hit_ems_control_readback_generation')) }}
      - action: number.set_value
        target:
          entity_id: number.hoymiles_hit_force_discharge_soc
        data:
          value: "{{ value | float(0) | round(0) }}"
      - variables:
          ems_generation_after_write: >-
            {{ states('sensor.hoymiles_hit_ems_control_readback_generation') }}
      - wait_template: >-
          {{ (states(
               'sensor.hoymiles_hit_ems_verified_hardware_readback_supported')
               | float(0) > 0.5)
             and states('sensor.hoymiles_hit_ems_control_readback_generation')
               not in ['unknown', 'unavailable', 'none', '']
             and states('sensor.hoymiles_hit_ems_control_readback_generation')
               != ems_generation_after_write
             and ((states(
               'sensor.hoymiles_hit_ems_force_discharge_soc_readback')
                 | float(-999)) - (value | float(0))) | abs < 0.5 }}
        timeout: "00:01:00"
        continue_on_timeout: false

  hoymiles_verified_set_battery_max_charge_power:
    alias: "RCEm — set battery charging limit with hardware readback"
    # Emergency RCEm writes pre-empt an in-flight normal adjustment.
    mode: restart
    fields:
      value:
        required: true
        selector:
          number:
            min: 0
            max: 100
            step: 0.1
    sequence:
      - condition: template
        value_template: >-
          {{ states('sensor.hoymiles_hit_ems_verified_hardware_readback_supported')
               | float(0) > 0.5 }}
      - condition: template
        value_template: >-
          {{ is_number(value)
             and is_number(states(
               'sensor.hoymiles_hit_parallel_topology_readback_generation'))
             and is_number(states(
               'sensor.hoymiles_hit_battery_charge_power_readback_generation')) }}
      - action: number.set_value
        target:
          entity_id: number.hoymiles_hit_battery_max_charge_power
        data:
          value: "{{ value | float(0) | round(1) }}"
      - variables:
          battery_generation_after_write: >-
            {{ states(
              'sensor.hoymiles_hit_battery_charge_power_readback_generation') }}
      - wait_template: >-
          {{ (states(
               'sensor.hoymiles_hit_ems_verified_hardware_readback_supported')
               | float(0) > 0.5)
             and states(
               'sensor.hoymiles_hit_battery_charge_power_readback_generation')
                 not in ['unknown', 'unavailable', 'none', '']
             and states(
               'sensor.hoymiles_hit_battery_charge_power_readback_generation')
                 != battery_generation_after_write
             and ((states(
               'sensor.hoymiles_hit_battery_max_charge_power_readback')
                 | float(-999)) - (value | float(0))) | abs < 0.05 }}
        timeout: "00:01:00"
        continue_on_timeout: false

  hoymiles_verified_set_gcf_export_limit:
    alias: "GCF — set export limit with hardware readback"
    # Emergency RCEm writes pre-empt an in-flight normal adjustment.
    mode: restart
    fields:
      value:
        required: true
        selector:
          number:
            min: -10
            max: 200
            step: 0.1
    sequence:
      - condition: template
        value_template: >-
          {{ states('sensor.hoymiles_hit_ems_verified_hardware_readback_supported')
               | float(0) > 0.5 }}
      - condition: template
        value_template: >-
          {{ is_number(value)
             and is_number(states(
               'sensor.hoymiles_hit_parallel_topology_readback_generation'))
             and is_number(states(
               'sensor.hoymiles_hit_gcf_control_readback_generation')) }}
      - action: number.set_value
        target:
          entity_id: number.hoymiles_hit_maximum_export_power_limit
        data:
          value: "{{ value | float(0) | round(1) }}"
      - variables:
          gcf_generation_after_write: >-
            {{ states('sensor.hoymiles_hit_gcf_control_readback_generation') }}
      - wait_template: >-
          {{ (states(
               'sensor.hoymiles_hit_ems_verified_hardware_readback_supported')
               | float(0) > 0.5)
             and states('sensor.hoymiles_hit_gcf_control_readback_generation')
               not in ['unknown', 'unavailable', 'none', '']
             and states('sensor.hoymiles_hit_gcf_control_readback_generation')
               != gcf_generation_after_write
             and ((states(
               'sensor.hoymiles_hit_gcf_maximum_export_power_readback')
                 | float(-999)) - (value | float(0))) | abs < 0.05 }}
        timeout: "00:01:00"
        continue_on_timeout: false

  hoymiles_start_grid_discharge:
    alias: "EMS — start discharge do sieci"
    description: "Switches EMS to grid discharge outside the export lockout and starts the timer."
    icon: mdi:transmission-tower-export
    mode: restart
    sequence:
      - condition: state
        entity_id: input_boolean.hoymiles_battery_balancing_active
        state: "off"
      - condition: state
        entity_id: binary_sensor.hoymiles_sale_block_active
        state: "off"
      - wait_template: >-
          {{ states('sensor.hoymiles_ems_hardware_mode') not in
             ['unknown', 'unavailable', 'none'] }}
        timeout: "00:05:00"
        continue_on_timeout: false
      - action: timer.cancel
        target:
          entity_id: timer.hoymiles_charge
      - action: input_boolean.turn_off
        target:
          entity_id: input_boolean.hoymiles_charge_cycle_active
      # Claim manual ownership before the first EMS write. Automatic final
      # interlocks observe this flag and cannot overwrite the user's direction.
      - action: input_boolean.turn_on
        target:
          entity_id: input_boolean.hoymiles_discharge_cycle_active
      # Manual ownership is visible before asking an automatic owner to roll
      # back its register transaction. A failed rollback aborts this start and
      # leaves the manual watchdog to retry a neutral hand-off.
      - if:
          - condition: state
            entity_id: input_boolean.hoymiles_tariff_charge_active
            state: "on"
        then:
          - action: script.hoymiles_rollback_tariff_transaction
      - if:
          - condition: state
            entity_id: input_boolean.hoymiles_rce_discharge_active
            state: "on"
        then:
          - action: script.hoymiles_rollback_rce_transaction
      # RCEm owns the same EMS mode and discharge registers. Its minute
      # controller performs a readback-safe restore after seeing the manual
      # owner, so do not race that restore with the user's final mode write.
      - wait_template: >-
          {{ is_state('input_boolean.hoymiles_tariff_charge_active', 'off')
             and is_state('input_boolean.hoymiles_rce_discharge_active', 'off')
             and is_state('input_boolean.hoymiles_rcm_active', 'off')
             and is_state(
               'input_boolean.hoymiles_rcm_pre_discharge_active', 'off')
             and is_state(
               'input_boolean.hoymiles_rcm_export_control_active', 'off') }}
        timeout: "00:03:00"
        continue_on_timeout: false
      - condition: state
        entity_id: input_boolean.hoymiles_discharge_cycle_active
        state: "on"
      - condition: state
        entity_id: input_boolean.hoymiles_charge_cycle_active
        state: "off"
      - condition: state
        entity_id: input_boolean.hoymiles_battery_balancing_active
        state: "off"
      - action: script.hoymiles_verified_set_ems_mode
        data:
          option: "grid_discharge"
      - delay: "00:00:05"
      - wait_template: >-
          {{ is_state('sensor.hoymiles_ems_hardware_mode', 'grid_discharge') }}
        timeout: "00:01:00"
        continue_on_timeout: false
      - condition: state
        entity_id: sensor.hoymiles_ems_hardware_mode
        state: "grid_discharge"
      - condition: state
        entity_id: input_boolean.hoymiles_discharge_cycle_active
        state: "on"
      - action: timer.start
        target:
          entity_id: timer.hoymiles_discharge
        data:
          duration: >-
            {{ (states('input_number.hoymiles_discharge_duration') | int(90)) * 60 }}

  hoymiles_start_grid_charge:
    alias: "EMS — start charge z sieci"
    description: "Switches EMS to grid charge and starts the timer using the dashboard duration."
    icon: mdi:transmission-tower-import
    mode: restart
    sequence:
      - condition: state
        entity_id: input_boolean.hoymiles_battery_balancing_active
        state: "off"
      - wait_template: >-
          {{ states('sensor.hoymiles_ems_hardware_mode') not in
             ['unknown', 'unavailable', 'none'] }}
        timeout: "00:05:00"
        continue_on_timeout: false
      - action: timer.cancel
        target:
          entity_id: timer.hoymiles_discharge
      - action: input_boolean.turn_off
        target:
          entity_id: input_boolean.hoymiles_discharge_cycle_active
      # Claim manual ownership before the first EMS write. Automatic final
      # interlocks observe this flag and cannot overwrite the user's direction.
      - action: input_boolean.turn_on
        target:
          entity_id: input_boolean.hoymiles_charge_cycle_active
      # Complete any automatic register rollback before the user's mode write.
      - if:
          - condition: state
            entity_id: input_boolean.hoymiles_tariff_charge_active
            state: "on"
        then:
          - action: script.hoymiles_rollback_tariff_transaction
      - if:
          - condition: state
            entity_id: input_boolean.hoymiles_rce_discharge_active
            state: "on"
        then:
          - action: script.hoymiles_rollback_rce_transaction
      # Wait until both RCEm ownership paths and the other automatic owners
      # have positively released their transactions. Otherwise a late RCEm
      # cleanup could overwrite the manual Grid Charge command with Self-Use.
      - wait_template: >-
          {{ is_state('input_boolean.hoymiles_tariff_charge_active', 'off')
             and is_state('input_boolean.hoymiles_rce_discharge_active', 'off')
             and is_state('input_boolean.hoymiles_rcm_active', 'off')
             and is_state(
               'input_boolean.hoymiles_rcm_pre_discharge_active', 'off')
             and is_state(
               'input_boolean.hoymiles_rcm_export_control_active', 'off') }}
        timeout: "00:03:00"
        continue_on_timeout: false
      - condition: state
        entity_id: input_boolean.hoymiles_charge_cycle_active
        state: "on"
      - condition: state
        entity_id: input_boolean.hoymiles_discharge_cycle_active
        state: "off"
      - condition: state
        entity_id: input_boolean.hoymiles_battery_balancing_active
        state: "off"
      - action: script.hoymiles_verified_set_ems_mode
        data:
          option: "grid_charge"
      - delay: "00:00:05"
      - wait_template: >-
          {{ is_state('sensor.hoymiles_ems_hardware_mode', 'grid_charge') }}
        timeout: "00:01:00"
        continue_on_timeout: false
      - condition: state
        entity_id: sensor.hoymiles_ems_hardware_mode
        state: "grid_charge"
      - condition: state
        entity_id: input_boolean.hoymiles_charge_cycle_active
        state: "on"
      - action: timer.start
        target:
          entity_id: timer.hoymiles_charge
        data:
          duration: >-
            {{ (states('input_number.hoymiles_charge_duration') | int(90)) * 60 }}

  hoymiles_stop_scheduled_cycle:
    alias: "EMS — stop the cycle and return to Self-Use"
    description: "Stops both timers and safely returns the inverter to Self-Use."
    icon: mdi:stop-circle-outline
    mode: restart
    sequence:
      - condition: state
        entity_id: input_boolean.hoymiles_battery_balancing_active
        state: "off"
      - action: timer.cancel
        target:
          entity_id:
            - timer.hoymiles_discharge
            - timer.hoymiles_charge
      # Cancel only the timers. Their ownership flags deliberately remain on
      # until Self-Use and both idle states are positively read back. If the
      # API disappears, the minute finish watchdogs retry this same hand-off.
      - wait_template: >-
          {{ states('sensor.hoymiles_ems_hardware_mode') not in
             ['unknown', 'unavailable', 'none', ''] }}
        timeout: "00:00:10"
        continue_on_timeout: false
      - condition: state
        entity_id: input_boolean.hoymiles_battery_balancing_active
        state: "off"
      - if:
          - condition: template
            value_template: >-
              {{ not is_state('sensor.hoymiles_ems_hardware_mode', 'self_use') }}
        then:
          - action: script.hoymiles_verified_set_ems_mode
            data:
              option: "self_use"
      - delay: "00:00:05"
      - wait_template: >-
          {{ is_state('sensor.hoymiles_ems_hardware_mode', 'self_use') }}
        timeout: "00:00:35"
        continue_on_timeout: false
      - condition: state
        entity_id: sensor.hoymiles_ems_hardware_mode
        state: "self_use"
      - condition: state
        entity_id: timer.hoymiles_discharge
        state: "idle"
      - condition: state
        entity_id: timer.hoymiles_charge
        state: "idle"
      # Exact Self-Use + idle readback closes the explicit stop transaction.
      - action: input_boolean.turn_off
        target:
          entity_id:
            - input_boolean.hoymiles_discharge_cycle_active
            - input_boolean.hoymiles_charge_cycle_active

  hoymiles_rollback_tariff_transaction:
    alias: "Tariff EMS — roll back an incomplete transaction"
    description: >-
      Returns to Self-Use and restores both settings from before the automatic start.
      Ownership remains active until every readback matches.
    mode: queued
    max: 5
    max_exceeded: silent
    sequence:
      - condition: state
        entity_id: input_boolean.hoymiles_tariff_charge_active
        state: "on"
      - wait_template: >-
          {{ states('sensor.hoymiles_ems_hardware_mode') not in
             ['unknown', 'unavailable', 'none', ''] }}
        timeout: "00:00:10"
        continue_on_timeout: false
      - if:
          - condition: template
            value_template: >-
              {{ not is_state('sensor.hoymiles_ems_hardware_mode', 'self_use') }}
        then:
          - action: script.hoymiles_verified_set_ems_mode
            data:
              option: "self_use"
      - delay: "00:00:05"
      - wait_template: >-
          {{ is_state('sensor.hoymiles_ems_hardware_mode', 'self_use') }}
        timeout: "00:00:35"
        continue_on_timeout: false
      - condition: template
        value_template: >-
          {{ is_number(states('sensor.hoymiles_hit_ems_maximum_charge_power_readback'))
             and is_number(states('sensor.hoymiles_hit_ems_force_charge_soc_readback'))
             and is_number(states(
               'input_number.hoymiles_tariff_saved_max_charge_power'))
             and is_number(states(
               'input_number.hoymiles_tariff_saved_force_charge_soc')) }}
      - action: script.hoymiles_verified_set_ems_maximum_charge_power
        data:
          value: >-
            {{ states('input_number.hoymiles_tariff_saved_max_charge_power')
               | float(100) | round(1) }}
      - wait_template: >-
          {{ ((states('sensor.hoymiles_hit_ems_maximum_charge_power_readback')
                | float(-999)) - (states(
                'input_number.hoymiles_tariff_saved_max_charge_power')
                | float(100))) | abs < 0.5 }}
        timeout: "00:01:00"
        continue_on_timeout: false
      - action: script.hoymiles_verified_set_ems_force_charge_soc
        data:
          value: >-
            {{ states('input_number.hoymiles_tariff_saved_force_charge_soc')
               | float(100) | round(0) }}
      - wait_template: >-
          {{ ((states('sensor.hoymiles_hit_ems_force_charge_soc_readback')
                | float(-999)) - (states(
                'input_number.hoymiles_tariff_saved_force_charge_soc')
                | float(100))) | abs < 1.0 }}
        timeout: "00:01:00"
        continue_on_timeout: false
      # Clear only after exact neutral mode and both restored register readbacks.
      - condition: state
        entity_id: sensor.hoymiles_ems_hardware_mode
        state: "self_use"
      - action: input_boolean.turn_off
        target:
          entity_id: input_boolean.hoymiles_tariff_charge_active
      - action: input_text.set_value
        target:
          entity_id: input_text.hoymiles_tariff_active_action
        data:
          value: "none"

  hoymiles_rollback_rce_transaction:
    alias: "RCE EMS — roll back an incomplete transaction"
    description: >-
      Returns to Self-Use and restores both settings from before the automatic start.
      Ownership remains active until every readback matches.
    mode: queued
    max: 5
    max_exceeded: silent
    sequence:
      - condition: state
        entity_id: input_boolean.hoymiles_rce_discharge_active
        state: "on"
      - wait_template: >-
          {{ states('sensor.hoymiles_ems_hardware_mode') not in
             ['unknown', 'unavailable', 'none', ''] }}
        timeout: "00:00:10"
        continue_on_timeout: false
      - if:
          - condition: template
            value_template: >-
              {{ not is_state('sensor.hoymiles_ems_hardware_mode', 'self_use') }}
        then:
          - action: script.hoymiles_verified_set_ems_mode
            data:
              option: "self_use"
      - delay: "00:00:05"
      - wait_template: >-
          {{ is_state('sensor.hoymiles_ems_hardware_mode', 'self_use') }}
        timeout: "00:00:35"
        continue_on_timeout: false
      - condition: template
        value_template: >-
          {{ is_number(states('sensor.hoymiles_hit_ems_maximum_discharge_power_readback'))
             and is_number(states('sensor.hoymiles_hit_ems_force_discharge_soc_readback'))
             and is_number(states(
               'input_number.hoymiles_rce_saved_max_discharge_power'))
             and is_number(states(
               'input_number.hoymiles_rce_saved_force_discharge_soc')) }}
      - action: script.hoymiles_verified_set_ems_maximum_discharge_power
        data:
          value: >-
            {{ states('input_number.hoymiles_rce_saved_max_discharge_power')
               | float(100) | round(1) }}
      - wait_template: >-
          {{ ((states('sensor.hoymiles_hit_ems_maximum_discharge_power_readback')
                | float(-999)) - (states(
                'input_number.hoymiles_rce_saved_max_discharge_power')
                | float(100))) | abs < 0.5 }}
        timeout: "00:01:00"
        continue_on_timeout: false
      - action: script.hoymiles_verified_set_ems_force_discharge_soc
        data:
          value: >-
            {{ states('input_number.hoymiles_rce_saved_force_discharge_soc')
               | float(20) | round(0) }}
      - wait_template: >-
          {{ ((states('sensor.hoymiles_hit_ems_force_discharge_soc_readback')
                | float(-999)) - (states(
                'input_number.hoymiles_rce_saved_force_discharge_soc')
                | float(20))) | abs < 1.0 }}
        timeout: "00:01:00"
        continue_on_timeout: false
      # Clear only after exact neutral mode and both restored register readbacks.
      - condition: state
        entity_id: sensor.hoymiles_ems_hardware_mode
        state: "self_use"
      - action: input_boolean.turn_off
        target:
          entity_id: input_boolean.hoymiles_rce_discharge_active

  hoymiles_start_battery_balancing:
    alias: "Battery balancing — start cycle"
    description: >-
      Suspends all other EMS plans and keeps the inverter in Self-Use
      during PV production while preparing a safe charge cycle to 100%.
    icon: mdi:battery-sync
    mode: restart
    sequence:
      - condition: state
        entity_id: input_boolean.hoymiles_battery_balancing_enabled
        state: "on"
      - condition: state
        entity_id: input_boolean.hoymiles_battery_balancing_active
        state: "off"
      - condition: state
        entity_id: sun.sun
        state: "above_horizon"
      - condition: state
        entity_id: binary_sensor.hoymiles_battery_balancing_control_data_ready
        state: "on"
      - condition: template
        value_template: >-
          {{ is_number(states('sensor.hoymiles_hit_overview_battery_soc'))
             and is_number(states('sensor.hoymiles_hit_ems_maximum_charge_power_readback'))
             and is_number(states('sensor.hoymiles_hit_ems_force_charge_soc_readback'))
             and states('sensor.hoymiles_ems_hardware_mode')
               not in ['unknown', 'unavailable', 'none'] }}
      # Latch ownership before asking any competing automation to release.
      # The balancing baseline is snapshotted only after their restores are
      # positively acknowledged in the durable handover phase below.
      - action: input_boolean.turn_on
        target:
          entity_id: input_boolean.hoymiles_battery_balancing_active
      - action: input_text.set_value
        target:
          entity_id: input_text.hoymiles_battery_balancing_phase
        data:
          value: "handover"
      - action: timer.cancel
        target:
          entity_id:
            - timer.hoymiles_discharge
            - timer.hoymiles_charge
            - timer.hoymiles_battery_balancing_hold
      - action: timer.start
        target:
          entity_id: timer.hoymiles_battery_balancing_watchdog
        data:
          duration: 86400
      - if:
          - condition: template
            value_template: >-
              {{ not is_state('sensor.hoymiles_ems_hardware_mode', 'self_use') }}
        then:
          - action: script.hoymiles_verified_set_ems_mode
            data:
              option: "self_use"
      - wait_template: >-
          {{ is_state('sensor.hoymiles_ems_hardware_mode', 'self_use')
             and is_state('input_boolean.hoymiles_rce_discharge_active', 'off')
             and is_state('input_boolean.hoymiles_tariff_charge_active', 'off')
             and is_state('input_boolean.hoymiles_rcm_active', 'off')
             and is_state(
               'input_boolean.hoymiles_rcm_pre_discharge_active', 'off')
             and is_state(
               'input_boolean.hoymiles_rcm_export_control_active', 'off') }}
        timeout: "00:00:30"
        continue_on_timeout: true
      # The balancing owner intentionally blocks the normal manual finalizers.
      # Once exact Self-Use and both cancelled timers are read back, handover
      # may safely close those manual owners itself.
      - if:
          - condition: state
            entity_id: sensor.hoymiles_ems_hardware_mode
            state: "self_use"
          - condition: state
            entity_id: timer.hoymiles_discharge
            state: "idle"
          - condition: state
            entity_id: timer.hoymiles_charge
            state: "idle"
          - condition: state
            entity_id: input_boolean.hoymiles_rce_discharge_active
            state: "off"
          - condition: state
            entity_id: input_boolean.hoymiles_tariff_charge_active
            state: "off"
          - condition: state
            entity_id: input_boolean.hoymiles_rcm_active
            state: "off"
          - condition: state
            entity_id: input_boolean.hoymiles_rcm_pre_discharge_active
            state: "off"
          - condition: state
            entity_id: input_boolean.hoymiles_rcm_export_control_active
            state: "off"
        then:
          - action: input_boolean.turn_off
            target:
              entity_id:
                - input_boolean.hoymiles_discharge_cycle_active
                - input_boolean.hoymiles_charge_cycle_active
      - if:
          - condition: template
            value_template: >-
              {{ is_state('sensor.hoymiles_ems_hardware_mode', 'self_use')
                 and is_state('input_boolean.hoymiles_discharge_cycle_active', 'off')
                 and is_state('input_boolean.hoymiles_charge_cycle_active', 'off')
                 and is_state('input_boolean.hoymiles_rce_discharge_active', 'off')
                 and is_state('input_boolean.hoymiles_tariff_charge_active', 'off')
                 and is_state('input_boolean.hoymiles_rcm_active', 'off')
                  and is_state(
                    'input_boolean.hoymiles_rcm_pre_discharge_active', 'off')
                  and is_state(
                    'input_boolean.hoymiles_rcm_export_control_active', 'off')
                 and is_number(states(
                   'sensor.hoymiles_hit_ems_maximum_charge_power_readback'))
                 and is_number(states(
                   'sensor.hoymiles_hit_ems_force_charge_soc_readback')) }}
        then:
          - action: input_number.set_value
            target:
              entity_id: >-
                input_number.hoymiles_battery_balancing_saved_charge_power
            data:
              value: >-
                {{ states(
                  'sensor.hoymiles_hit_ems_maximum_charge_power_readback')
                   | float }}
          - action: input_number.set_value
            target:
              entity_id: >-
                input_number.hoymiles_battery_balancing_saved_force_charge_soc
            data:
              value: >-
                {{ states('sensor.hoymiles_hit_ems_force_charge_soc_readback')
                   | float }}
          - action: input_text.set_value
            target:
              entity_id: input_text.hoymiles_battery_balancing_phase
            data:
              value: "pv"

  hoymiles_stop_battery_balancing:
    alias: "Battery balancing — finish cycle"
    description: >-
      Returns to Self-Use, restores charge settings, and releases the lock
      on other EMS plans. A successfully completed cycle stores its date.
    icon: mdi:battery-check-outline
    mode: restart
    fields:
      completed:
        description: "Whether the cycle reached 100% SOC and completed its balancing time"
        example: true
        default: false
    sequence:
      - variables:
          stopping_from_handover: >-
            {{ states('input_text.hoymiles_battery_balancing_phase')
                 in ['handover', 'stopping_handover'] }}
          completed_cycle: >-
            {{ completed | default(false) | bool
               or is_state(
                 'input_text.hoymiles_battery_balancing_phase',
                 'stopping_complete') }}
      # Persist the stop reason so a timeout can be retried by the periodic
      # controller without losing a successfully completed balancing cycle.
      - action: input_text.set_value
        target:
          entity_id: input_text.hoymiles_battery_balancing_phase
        data:
          value: >-
            {% if stopping_from_handover %}stopping_handover
            {% elif completed_cycle %}stopping_complete
            {% else %}stopping_abort{% endif %}
      - action: timer.cancel
        target:
          entity_id:
            - timer.hoymiles_battery_balancing_hold
            - timer.hoymiles_battery_balancing_watchdog
      - if:
          - condition: template
            value_template: >-
              {{ states('sensor.hoymiles_ems_hardware_mode')
                   not in ['unknown', 'unavailable', 'none', '']
                 and not is_state('sensor.hoymiles_ems_hardware_mode', 'self_use') }}
        then:
          - action: script.hoymiles_verified_set_ems_mode
            data:
              option: "self_use"
      - wait_template: >-
          {{ is_state('sensor.hoymiles_ems_hardware_mode', 'self_use') }}
        timeout: "00:00:15"
        continue_on_timeout: true
      - if:
          - condition: template
            value_template: >-
              {{ not stopping_from_handover
                 and is_number(states('sensor.hoymiles_hit_ems_maximum_charge_power_readback'))
                 and is_number(states(
                   'input_number.hoymiles_battery_balancing_saved_charge_power')) }}
        then:
          - action: script.hoymiles_verified_set_ems_maximum_charge_power
            data:
              value: >-
                {{ states(
                     'input_number.hoymiles_battery_balancing_saved_charge_power')
                     | float(50) }}
          - wait_template: >-
              {{ ((states('sensor.hoymiles_hit_ems_maximum_charge_power_readback')
                    | float(-999)) - (states(
                    'input_number.hoymiles_battery_balancing_saved_charge_power')
                    | float(50))) | abs < 1.0 }}
            timeout: "00:00:15"
            continue_on_timeout: true
      - if:
          - condition: template
            value_template: >-
              {{ not stopping_from_handover
                 and is_number(states('sensor.hoymiles_hit_ems_force_charge_soc_readback'))
                 and is_number(states(
                   'input_number.hoymiles_battery_balancing_saved_force_charge_soc')) }}
        then:
          - action: script.hoymiles_verified_set_ems_force_charge_soc
            data:
              value: >-
                {{ states(
                     'input_number.hoymiles_battery_balancing_saved_force_charge_soc')
                     | float(100) }}
          - wait_template: >-
              {{ ((states('sensor.hoymiles_hit_ems_force_charge_soc_readback')
                    | float(-999)) - (states(
                    'input_number.hoymiles_battery_balancing_saved_force_charge_soc')
                    | float(100))) | abs < 1.0 }}
            timeout: "00:00:15"
            continue_on_timeout: true
      # Ownership is released only after three positive readbacks. If any
      # source is unavailable or a write is not acknowledged, the stopping
      # phase remains active and the next minute retries safely.
      - if:
          - condition: template
            value_template: >-
              {{ is_state('sensor.hoymiles_ems_hardware_mode', 'self_use')
                 and (stopping_from_handover
                      or (((states('sensor.hoymiles_hit_ems_maximum_charge_power_readback')
                       | float(-999)) - (states(
                       'input_number.hoymiles_battery_balancing_saved_charge_power')
                       | float(50))) | abs < 1.0
                 and ((states('sensor.hoymiles_hit_ems_force_charge_soc_readback')
                       | float(-999)) - (states(
                       'input_number.hoymiles_battery_balancing_saved_force_charge_soc')
                       | float(100))) | abs < 1.0)) }}
        then:
          - if:
              - condition: template
                value_template: "{{ completed_cycle }}"
            then:
              - action: input_datetime.set_datetime
                target:
                  entity_id: input_datetime.hoymiles_battery_balancing_last_completed
                data:
                  datetime: "{{ now().strftime('%Y-%m-%d %H:%M:%S') }}"
          - action: input_text.set_value
            target:
              entity_id: input_text.hoymiles_battery_balancing_phase
            data:
              value: "idle"
          - action: input_boolean.turn_off
            target:
              entity_id: input_boolean.hoymiles_battery_balancing_active

automation:
  - id: hoymiles_battery_balancing_control
    alias: "Battery balancing — cycle control"
    description: >-
      Runs the cycle at the configured day interval. It first uses PV in Self-Use,
      tops up the battery from the grid after sunset, and from 99% limits
      battery charging to about 2 kW; balancing time starts only at 100% SOC.
    mode: single
    max_exceeded: silent
    triggers:
      - trigger: time_pattern
        minutes: "/1"
        id: periodic
      - trigger: state
        entity_id:
          - input_boolean.hoymiles_battery_balancing_enabled
          - input_boolean.hoymiles_battery_balancing_active
          - input_number.hoymiles_battery_balancing_interval_days
          - input_number.hoymiles_battery_balancing_hold_hours
          - input_text.hoymiles_battery_balancing_phase
          - binary_sensor.hoymiles_battery_balancing_due
          - binary_sensor.hoymiles_battery_balancing_control_data_ready
          - sensor.hoymiles_hit_overview_battery_soc
          - sensor.hoymiles_hit_maximum_charge_current
          - sensor.hoymiles_hit_battery_voltage_bms
          - sensor.hoymiles_battery_balancing_bms_safe_charge_power
          - sensor.hoymiles_battery_balancing_slow_charge_power
          - sensor.hoymiles_actual_load_power
          - sun.sun
          - sensor.hoymiles_ems_hardware_mode
        id: state_change
      - trigger: event
        event_type: timer.finished
        event_data:
          entity_id: timer.hoymiles_battery_balancing_hold
        id: hold_finished
      - trigger: event
        event_type: timer.finished
        event_data:
          entity_id: timer.hoymiles_battery_balancing_watchdog
        id: watchdog_finished
      - trigger: homeassistant
        event: start
        id: startup
    actions:
      - if:
          - condition: trigger
            id: startup
        then:
          - delay: "00:00:20"
      # Helpers without `initial` restore their last state after an HA restart.
      # On a genuinely fresh installation initialize only missing internal
      # markers; never overwrite a value already selected by the user.
      - if:
          - condition: template
            value_template: >-
              {{ states('input_datetime.hoymiles_battery_balancing_last_completed')
                   in ['unknown', 'unavailable', 'none', ''] }}
        then:
          - action: input_datetime.set_datetime
            target:
              entity_id: input_datetime.hoymiles_battery_balancing_last_completed
            data:
              datetime: >-
                {{ (now() - timedelta(days=states(
                     'input_number.hoymiles_battery_balancing_interval_days')
                     | int(30))).strftime('%Y-%m-%d %H:%M:%S') }}
      - if:
          - condition: template
            value_template: >-
              {{ states('input_text.hoymiles_tariff_active_action')
                   in ['unknown', 'unavailable', 'none', ''] }}
        then:
          - action: input_text.set_value
            target:
              entity_id: input_text.hoymiles_tariff_active_action
            data:
              value: "none"
      - if:
          - condition: template
            value_template: >-
              {{ states('input_text.hoymiles_battery_balancing_phase')
                   in ['unknown', 'unavailable', 'none', ''] }}
        then:
          - action: input_text.set_value
            target:
              entity_id: input_text.hoymiles_battery_balancing_phase
            data:
              value: "idle"
      - choose:
          # A failed restore keeps ownership and a durable stopping phase. The
          # periodic trigger retries until Self-Use and both saved registers
          # are positively read back.
          - conditions:
              - condition: state
                entity_id: input_boolean.hoymiles_battery_balancing_active
                state: "on"
              - condition: template
                value_template: >-
                  {{ states('input_text.hoymiles_battery_balancing_phase')
                       in ['stopping_complete', 'stopping_abort',
                           'stopping_handover'] }}
            sequence:
              - action: script.hoymiles_stop_battery_balancing
                data:
                  completed: >-
                    {{ is_state(
                      'input_text.hoymiles_battery_balancing_phase',
                      'stopping_complete') }}

          # Any stale SOC, BMS limit, LOAD or writable-register readback is a
          # hard stop. Ownership remains durable inside the stop script until
          # Self-Use and the saved settings are positively acknowledged.
          - conditions:
              - condition: state
                entity_id: input_boolean.hoymiles_battery_balancing_active
                state: "on"
              - condition: state
                entity_id: binary_sensor.hoymiles_battery_balancing_control_data_ready
                state: "off"
              - condition: template
                value_template: >-
                  {{ states('input_text.hoymiles_battery_balancing_phase')
                       not in ['stopping_complete', 'stopping_abort',
                               'stopping_handover'] }}
            sequence:
              - action: script.hoymiles_stop_battery_balancing
                data:
                  completed: false

          # During handover balancing already owns the EMS, while each former
          # controller completes its own readback-safe cleanup. Keep retrying
          # Self-Use and enter the PV phase only after every owner is released.
          - conditions:
              - condition: state
                entity_id: input_boolean.hoymiles_battery_balancing_active
                state: "on"
              - condition: state
                entity_id: input_boolean.hoymiles_battery_balancing_enabled
                state: "on"
              - condition: state
                entity_id: input_text.hoymiles_battery_balancing_phase
                state: "handover"
              - condition: template
                value_template: "{{ trigger.id != 'watchdog_finished' }}"
            sequence:
              - if:
                  - condition: template
                    value_template: >-
                      {{ states('sensor.hoymiles_ems_hardware_mode')
                           not in ['unknown', 'unavailable', 'none', '']
                         and not is_state(
                           'sensor.hoymiles_ems_hardware_mode', 'self_use') }}
                then:
                  - action: script.hoymiles_verified_set_ems_mode
                    data:
                      option: "self_use"
              - if:
                  - condition: template
                    value_template: >-
                      {{ is_state('sensor.hoymiles_ems_hardware_mode', 'self_use')
                         and is_state(
                           'input_boolean.hoymiles_discharge_cycle_active', 'off')
                         and is_state(
                           'input_boolean.hoymiles_charge_cycle_active', 'off')
                         and is_state(
                           'input_boolean.hoymiles_rce_discharge_active', 'off')
                         and is_state(
                           'input_boolean.hoymiles_tariff_charge_active', 'off')
                         and is_state('input_boolean.hoymiles_rcm_active', 'off')
                          and is_state(
                            'input_boolean.hoymiles_rcm_pre_discharge_active',
                            'off')
                          and is_state(
                            'input_boolean.hoymiles_rcm_export_control_active',
                            'off')
                          and is_number(states(
                           'sensor.hoymiles_hit_ems_maximum_charge_power_readback'))
                         and is_number(states(
                           'sensor.hoymiles_hit_ems_force_charge_soc_readback')) }}
                then:
                  - action: input_number.set_value
                    target:
                      entity_id: >-
                        input_number.hoymiles_battery_balancing_saved_charge_power
                    data:
                      value: >-
                        {{ states(
                          'sensor.hoymiles_hit_ems_maximum_charge_power_readback')
                           | float }}
                  - action: input_number.set_value
                    target:
                      entity_id: >-
                        input_number.hoymiles_battery_balancing_saved_force_charge_soc
                    data:
                      value: >-
                        {{ states(
                          'sensor.hoymiles_hit_ems_force_charge_soc_readback')
                           | float }}
                  - action: input_text.set_value
                    target:
                      entity_id: input_text.hoymiles_battery_balancing_phase
                    data:
                      value: "pv"

          # The daylight PV phase has a hard Self-Use invariant. A lost or
          # rejected mode write is retried every minute while ownership stays.
          - conditions:
              - condition: state
                entity_id: input_boolean.hoymiles_battery_balancing_active
                state: "on"
              - condition: state
                entity_id: input_boolean.hoymiles_battery_balancing_enabled
                state: "on"
              - condition: state
                entity_id: input_text.hoymiles_battery_balancing_phase
                state: "pv"
              - condition: template
                value_template: "{{ trigger.id != 'watchdog_finished' }}"
              - condition: state
                entity_id: sun.sun
                state: "above_horizon"
              - condition: template
                value_template: >-
                  {{ not is_state('sensor.hoymiles_ems_hardware_mode', 'self_use') }}
            sequence:
              - if:
                  - condition: template
                    value_template: >-
                      {{ states('sensor.hoymiles_ems_hardware_mode')
                           not in ['unknown', 'unavailable', 'none', ''] }}
                then:
                  - action: script.hoymiles_verified_set_ems_mode
                    data:
                      option: "self_use"

          # Twardy limit 24 godzin chroni przed pozostawieniem Grid Charge po
          # utracie wiarygodnego SOC albo problemie z komunikacją BMS.
          - conditions:
              - condition: trigger
                id: watchdog_finished
              - condition: state
                entity_id: input_boolean.hoymiles_battery_balancing_active
                state: "on"
            sequence:
              - action: script.hoymiles_stop_battery_balancing
                data:
                  completed: false

          - conditions:
              - condition: trigger
                id: hold_finished
              - condition: state
                entity_id: input_boolean.hoymiles_battery_balancing_active
                state: "on"
              - condition: state
                entity_id: input_text.hoymiles_battery_balancing_phase
                state: "holding"
              - condition: template
                value_template: >-
                  {{ is_number(states(
                       'sensor.hoymiles_hit_overview_battery_soc'))
                     and (states(
                       'sensor.hoymiles_hit_overview_battery_soc')
                       | float(-1)) >= 0
                     and (states(
                       'sensor.hoymiles_hit_overview_battery_soc')
                       | float(101)) <= 100 }}
            sequence:
              - action: script.hoymiles_stop_battery_balancing
                data:
                  completed: true

          # Wyłączenie przełącznika w czasie cyklu jest bezpiecznym przerwaniem:
          # Self-Use i wcześniejsze nastawy ładowania zostają odtworzone.
          - conditions:
              - condition: state
                entity_id: input_boolean.hoymiles_battery_balancing_active
                state: "on"
              - condition: state
                entity_id: input_boolean.hoymiles_battery_balancing_enabled
                state: "off"
            sequence:
              - action: script.hoymiles_stop_battery_balancing
                data:
                  completed: false

          # Po restarcie HA finish poprawnie odtworzony etap utrzymania, jeżeli
          # timer zdążył upłynąć podczas niedostępności systemu.
          - conditions:
              - condition: state
                entity_id: input_boolean.hoymiles_battery_balancing_active
                state: "on"
              - condition: state
                entity_id: input_text.hoymiles_battery_balancing_phase
                state: "holding"
              - condition: template
                value_template: >-
                  {{ is_number(states(
                       'sensor.hoymiles_hit_overview_battery_soc'))
                     and (states(
                       'sensor.hoymiles_hit_overview_battery_soc')
                       | float(-1)) >= 0
                     and (states(
                       'sensor.hoymiles_hit_overview_battery_soc')
                       | float(101)) <= 100 }}
              - condition: template
                value_template: >-
                  {{ not is_state(
                       'timer.hoymiles_battery_balancing_hold', 'active') }}
            sequence:
              - action: script.hoymiles_stop_battery_balancing
                data:
                  completed: true

          # Cykl należny w danym dniu rozpoczyna się dopiero po wschodzie.
          # Zapewnia to maksymalne wykorzystanie PV zamiast nocnego ładowania.
          - conditions:
              - condition: state
                entity_id: input_boolean.hoymiles_battery_balancing_enabled
                state: "on"
              - condition: state
                entity_id: input_boolean.hoymiles_battery_balancing_active
                state: "off"
              - condition: state
                entity_id: binary_sensor.hoymiles_battery_balancing_due
                state: "on"
              - condition: state
                entity_id: binary_sensor.hoymiles_battery_balancing_control_data_ready
                state: "on"
              - condition: state
                entity_id: sun.sun
                state: "above_horizon"
            sequence:
              - action: script.hoymiles_start_battery_balancing

          # Pełny magazyn: ustaw delikatny wspólny limit wejścia AC i start
          # właściwy czas wyrównywania. Timer nie biegnie przy 99%.
          - conditions:
              - condition: state
                entity_id: input_boolean.hoymiles_battery_balancing_active
                state: "on"
              - condition: template
                value_template: >-
                  {{ states('input_text.hoymiles_battery_balancing_phase')
                       in ['pv', 'grid', 'slow']
                     and is_number(states(
                       'sensor.hoymiles_hit_overview_battery_soc'))
                     and (states('sensor.hoymiles_hit_overview_battery_soc')
                          | float(0)) >= 99.9
                     and is_number(states(
                       'sensor.hoymiles_battery_balancing_slow_charge_power')) }}
            sequence:
              - action: script.hoymiles_verified_set_ems_maximum_charge_power
                data:
                  value: >-
                    {{ states(
                         'sensor.hoymiles_battery_balancing_slow_charge_power')
                         | float(20) }}
              - action: script.hoymiles_verified_set_ems_force_charge_soc
                data:
                  value: 100
              - if:
                  - condition: template
                    value_template: >-
                      {{ states('sensor.hoymiles_ems_hardware_mode')
                           not in ['unknown', 'unavailable', 'none']
                         and not is_state(
                           'sensor.hoymiles_ems_hardware_mode', 'grid_charge') }}
                then:
                  - action: script.hoymiles_verified_set_ems_mode
                    data:
                      option: "grid_charge"
              - delay: "00:00:05"
              - wait_template: >-
                  {{ is_state('sensor.hoymiles_ems_hardware_mode', 'grid_charge')
                     and is_number(states(
                       'sensor.hoymiles_battery_balancing_slow_charge_power'))
                     and ((states(
                       'sensor.hoymiles_hit_ems_maximum_charge_power_readback') | float(-999))
                       - (states(
                       'sensor.hoymiles_battery_balancing_slow_charge_power')
                          | float(0))) | abs < 0.5
                     and ((states('sensor.hoymiles_hit_ems_force_charge_soc_readback')
                           | float(-999)) - 100) | abs < 1.0 }}
                timeout: "00:01:00"
                continue_on_timeout: false
              - condition: state
                entity_id: binary_sensor.hoymiles_battery_balancing_control_data_ready
                state: "on"
              - condition: state
                entity_id: sensor.hoymiles_ems_hardware_mode
                state: "grid_charge"
              - action: timer.start
                target:
                  entity_id: timer.hoymiles_battery_balancing_hold
                data:
                  duration: >-
                    {{ (states(
                         'input_number.hoymiles_battery_balancing_hold_hours')
                         | float(2) * 3600) | int }}
              - action: input_text.set_value
                target:
                  entity_id: input_text.hoymiles_battery_balancing_phase
                data:
                  value: "holding"

          # Po zachodzie PV nie odbuduje już magazynu. Rozpoczyna się pełne
          # docharge sieciowe; pobór domu jest częścią wspólnego limitu AC.
          - conditions:
              - condition: state
                entity_id: input_boolean.hoymiles_battery_balancing_active
                state: "on"
              - condition: state
                entity_id: input_text.hoymiles_battery_balancing_phase
                state: "pv"
              - condition: state
                entity_id: sun.sun
                state: "below_horizon"
              - condition: template
                value_template: >-
                  {{ is_number(states(
                       'sensor.hoymiles_hit_overview_battery_soc')) }}
            sequence:
              - action: script.hoymiles_verified_set_ems_force_charge_soc
                data:
                  value: 100
              - choose:
                  - conditions:
                      - condition: template
                        value_template: >-
                          {{ (states(
                               'sensor.hoymiles_hit_overview_battery_soc')
                               | float(0)) >= 99 }}
                    sequence:
                      - action: script.hoymiles_verified_set_ems_maximum_charge_power
                        data:
                          value: >-
                            {{ states(
                                 'sensor.hoymiles_battery_balancing_slow_charge_power')
                                 | float(20) }}
                      - action: input_text.set_value
                        target:
                          entity_id: input_text.hoymiles_battery_balancing_phase
                        data:
                          value: "slow"
                default:
                  - action: script.hoymiles_verified_set_ems_maximum_charge_power
                    data:
                      value: >-
                        {{ states(
                          'sensor.hoymiles_battery_balancing_bms_safe_charge_power')
                          | float(0) }}
                  - action: input_text.set_value
                    target:
                      entity_id: input_text.hoymiles_battery_balancing_phase
                    data:
                      value: "grid"
              - if:
                  - condition: template
                    value_template: >-
                      {{ states('sensor.hoymiles_ems_hardware_mode')
                           not in ['unknown', 'unavailable', 'none'] }}
                then:
                  - action: script.hoymiles_verified_set_ems_mode
                    data:
                      option: "grid_charge"

          # Od 99% zmniejsz moc dostępną dla baterii do około 2 kW. Limit jest
          # korygowany o bieżący LOAD, ponieważ Grid Charge najpierw zasila dom.
          - conditions:
              - condition: state
                entity_id: input_boolean.hoymiles_battery_balancing_active
                state: "on"
              - condition: state
                entity_id: input_text.hoymiles_battery_balancing_phase
                state: "grid"
              - condition: template
                value_template: >-
                  {{ is_number(states(
                       'sensor.hoymiles_hit_overview_battery_soc'))
                     and (states('sensor.hoymiles_hit_overview_battery_soc')
                          | float(0)) >= 99
                     and is_number(states(
                       'sensor.hoymiles_battery_balancing_slow_charge_power')) }}
            sequence:
              - action: script.hoymiles_verified_set_ems_maximum_charge_power
                data:
                  value: >-
                    {{ states(
                         'sensor.hoymiles_battery_balancing_slow_charge_power')
                         | float(20) }}
              - action: input_text.set_value
                target:
                  entity_id: input_text.hoymiles_battery_balancing_phase
                data:
                  value: "slow"

          # Poniżej 99% utrzymuj pełny limit ładowania, cel 100% i Grid Charge.
          - conditions:
              - condition: state
                entity_id: input_boolean.hoymiles_battery_balancing_active
                state: "on"
              - condition: state
                entity_id: input_text.hoymiles_battery_balancing_phase
                state: "grid"
              - condition: template
                value_template: >-
                  {{ is_number(states(
                       'sensor.hoymiles_hit_overview_battery_soc'))
                     and (states('sensor.hoymiles_hit_overview_battery_soc')
                          | float(0)) < 99
                      and (((states(
                       'sensor.hoymiles_hit_ems_maximum_charge_power_readback') | float(0))
                          - (states(
                       'sensor.hoymiles_battery_balancing_bms_safe_charge_power')
                             | float(0))) | abs >= 0.5
                        or (states('sensor.hoymiles_hit_ems_force_charge_soc_readback')
                           | float(0)) < 99.5
                       or not is_state(
                         'sensor.hoymiles_ems_hardware_mode', 'grid_charge')) }}
            sequence:
              - action: script.hoymiles_verified_set_ems_maximum_charge_power
                data:
                  value: >-
                    {{ states(
                      'sensor.hoymiles_battery_balancing_bms_safe_charge_power')
                      | float(0) }}
              - action: script.hoymiles_verified_set_ems_force_charge_soc
                data:
                  value: 100
              - if:
                  - condition: template
                    value_template: >-
                      {{ states('sensor.hoymiles_ems_hardware_mode')
                           not in ['unknown', 'unavailable', 'none']
                         and not is_state(
                           'sensor.hoymiles_ems_hardware_mode', 'grid_charge') }}
                then:
                  - action: script.hoymiles_verified_set_ems_mode
                    data:
                      option: "grid_charge"

          # W etapie wolnym wspólny limit AC śledzi LOAD, aby dla baterii
          # pozostawało około 2 kW również przy zmianach poboru domu.
          - conditions:
              - condition: state
                entity_id: input_boolean.hoymiles_battery_balancing_active
                state: "on"
              - condition: state
                entity_id: input_text.hoymiles_battery_balancing_phase
                state: "slow"
              - condition: template
                value_template: >-
                  {{ is_number(states(
                       'sensor.hoymiles_battery_balancing_slow_charge_power'))
                     and (((states(
                       'sensor.hoymiles_hit_ems_maximum_charge_power_readback') | float(0))
                         - (states(
                       'sensor.hoymiles_battery_balancing_slow_charge_power')
                            | float(0))) | abs >= 0.5
                       or (states('sensor.hoymiles_hit_ems_force_charge_soc_readback')
                           | float(0)) < 99.5
                       or not is_state(
                         'sensor.hoymiles_ems_hardware_mode', 'grid_charge')) }}
            sequence:
              - action: script.hoymiles_verified_set_ems_maximum_charge_power
                data:
                  value: >-
                    {{ states(
                         'sensor.hoymiles_battery_balancing_slow_charge_power')
                         | float(20) }}
              - action: script.hoymiles_verified_set_ems_force_charge_soc
                data:
                  value: 100
              - if:
                  - condition: template
                    value_template: >-
                      {{ states('sensor.hoymiles_ems_hardware_mode')
                           not in ['unknown', 'unavailable', 'none']
                         and not is_state(
                           'sensor.hoymiles_ems_hardware_mode', 'grid_charge') }}
                then:
                  - action: script.hoymiles_verified_set_ems_mode
                    data:
                      option: "grid_charge"

          # W czasie utrzymania nie pozwól zewnętrznej zmianie nastaw przerwać
          # serwisu. Wyłączenie głównego przełącznika nadal kończy cykl od razu.
          - conditions:
              - condition: state
                entity_id: input_boolean.hoymiles_battery_balancing_active
                state: "on"
              - condition: state
                entity_id: input_text.hoymiles_battery_balancing_phase
                state: "holding"
              - condition: state
                entity_id: timer.hoymiles_battery_balancing_hold
                state: "active"
              - condition: template
                value_template: >-
                  {{ not is_state('sensor.hoymiles_ems_hardware_mode', 'grid_charge')
                     or (states('sensor.hoymiles_hit_ems_force_charge_soc_readback')
                         | float(0)) < 99.5
                     or ((states(
                       'sensor.hoymiles_hit_ems_maximum_charge_power_readback') | float(0))
                       - (states(
                       'sensor.hoymiles_battery_balancing_slow_charge_power')
                          | float(0))) | abs >= 0.5 }}
            sequence:
              - action: script.hoymiles_verified_set_ems_maximum_charge_power
                data:
                  value: >-
                    {{ states(
                         'sensor.hoymiles_battery_balancing_slow_charge_power')
                         | float(20) }}
              - action: script.hoymiles_verified_set_ems_force_charge_soc
                data:
                  value: 100
              - if:
                  - condition: template
                    value_template: >-
                      {{ states('sensor.hoymiles_ems_hardware_mode')
                           not in ['unknown', 'unavailable', 'none']
                         and not is_state(
                           'sensor.hoymiles_ems_hardware_mode', 'grid_charge') }}
                then:
                  - action: script.hoymiles_verified_set_ems_mode
                    data:
                      option: "grid_charge"

  - id: hoymiles_ems_push_status_notification
    alias: "EMS — push notification for status change"
    description: >-
      Sends the current EMS mode and inverter operating status to the selected phone
      when either status changes.
    mode: restart
    triggers:
      - trigger: state
        entity_id: sensor.hoymiles_ems_hardware_mode
        id: ems_mode
        for: "00:00:45"
      - trigger: state
        entity_id: sensor.hoymiles_hit_inverter_work_status
        id: inverter_status
        for: "00:00:45"
    conditions:
      - condition: state
        entity_id: input_boolean.hoymiles_ems_push_notifications_enabled
        state: "on"
      - condition: template
        value_template: >-
          {% set target =
            states('input_text.hoymiles_ems_push_notify_target') | trim %}
          {{ target.startswith('notify.')
             and (expand(target) | list | count) > 0 }}
      - condition: template
        value_template: >-
          {{ trigger is not defined
             or trigger.to_state is not defined
             or trigger.to_state is none
             or trigger.to_state.state not in
               ['unknown', 'unavailable', 'none', ''] }}
      - condition: template
        value_template: >-
          {{ trigger is not defined
             or trigger.from_state is not defined
             or trigger.from_state is none
             or trigger.from_state.state != trigger.to_state.state }}
      # Suppress only an identical, repeated status for five minutes. A genuinely
      # different stable mode or inverter fault is delivered immediately.
      - condition: template
        value_template: >-
          {% set last = as_timestamp(states(
            'input_datetime.hoymiles_ems_last_push_at'), 0) %}
          {% set fingerprint =
            states('sensor.hoymiles_ems_hardware_mode') ~ '|' ~
            states('sensor.hoymiles_hit_inverter_work_status') %}
          {{ fingerprint != states(
               'input_text.hoymiles_ems_last_push_fingerprint')
             or last <= 0 or as_timestamp(now()) - last >= 300 }}
    actions:
      # Tryb EMS i inverter operating status mogą zaktualizować się niemal
      # jednocześnie. Restart automatyzacji scala je w jedno powiadomienie.
      - delay: "00:00:02"
      - variables:
          target_entity: >-
            {{ states('input_text.hoymiles_ems_push_notify_target') | trim }}
          ems_mode: >-
            {% set raw = states('sensor.hoymiles_ems_hardware_mode') %}
            {% set labels = {
              'self_use': 'Self-Use',
              'grid_discharge': 'Grid discharge',
              'grid_charge': 'Grid charge',
              'off_grid': 'Off-grid operation'
            } %}
            {{ labels.get(raw, raw) }}
          inverter_status: >-
            {{ states('sensor.hoymiles_hit_inverter_work_status') }}
          changed_status: >-
            {% if trigger is defined and trigger.id == 'ems_mode' %}
              EMS mode
            {% elif trigger is defined and trigger.id == 'inverter_status' %}
              inverter operating status
            {% else %}
              test
            {% endif %}
      - action: notify.send_message
        target:
          entity_id: "{{ target_entity }}"
        data:
          title: "Hoymiles — status change"
          message: |-
            EMS mode: {{ ems_mode }}
            Inverter status: {{ inverter_status }}
            Changed: {{ changed_status }}
      - action: input_datetime.set_datetime
        target:
          entity_id: input_datetime.hoymiles_ems_last_push_at
        data:
          timestamp: "{{ as_timestamp(now()) }}"
      - action: input_text.set_value
        target:
          entity_id: input_text.hoymiles_ems_last_push_fingerprint
        data:
          value: >-
            {{ states('sensor.hoymiles_ems_hardware_mode') ~ '|' ~
               states('sensor.hoymiles_hit_inverter_work_status') }}

  - id: hoymiles_initialize_solcast_forecast_entity
    alias: "EMS RCE — set default Solcast entity"
    description: >-
      Detects the English or Polish Forecast Today and Forecast Tomorrow entities
      from the BJReplay Solcast PV Forecast integration. Valid custom entities
      made by the user are preserved.
    mode: single
    triggers:
      - trigger: homeassistant
        event: start
    actions:
      - delay: "00:00:15"
      - if:
          - condition: template
            value_template: >-
              {% set configured =
                states('input_text.hoymiles_solcast_forecast_today_entity')
                | trim %}
              {% set candidates = [
                configured,
                'sensor.solcast_pv_forecast_forecast_today',
                'sensor.solcast_pv_forecast_prognoza_na_dzisiaj',
                'sensor.solcast_forecast_today'
              ] %}
              {% set ns = namespace(entity='') %}
              {% for entity in candidates if entity and not ns.entity %}
                {% if is_number(states(entity)) %}
                  {% set ns.entity = entity %}
                {% endif %}
              {% endfor %}
              {{ ns.entity != '' and ns.entity != configured }}
        then:
          - action: input_text.set_value
            target:
              entity_id: input_text.hoymiles_solcast_forecast_today_entity
            data:
              value: >-
                {% set configured =
                  states('input_text.hoymiles_solcast_forecast_today_entity')
                  | trim %}
                {% set candidates = [
                  configured,
                  'sensor.solcast_pv_forecast_forecast_today',
                  'sensor.solcast_pv_forecast_prognoza_na_dzisiaj',
                  'sensor.solcast_forecast_today'
                ] %}
                {% set ns = namespace(entity='') %}
                {% for entity in candidates if entity and not ns.entity %}
                  {% if is_number(states(entity)) %}
                    {% set ns.entity = entity %}
                  {% endif %}
                {% endfor %}
                {{ ns.entity }}
      - if:
          - condition: template
            value_template: >-
              {% set configured =
                states('input_text.hoymiles_solcast_forecast_tomorrow_entity')
                | trim %}
              {% set candidates = [
                configured,
                'sensor.solcast_pv_forecast_forecast_tomorrow',
                'sensor.solcast_pv_forecast_prognoza_na_jutro',
                'sensor.solcast_forecast_tomorrow'
              ] %}
              {% set ns = namespace(entity='') %}
              {% for entity in candidates if entity and not ns.entity %}
                {% if is_number(states(entity)) %}
                  {% set ns.entity = entity %}
                {% endif %}
              {% endfor %}
              {{ ns.entity != '' and ns.entity != configured }}
        then:
          - action: input_text.set_value
            target:
              entity_id: input_text.hoymiles_solcast_forecast_tomorrow_entity
            data:
              value: >-
                {% set configured =
                  states('input_text.hoymiles_solcast_forecast_tomorrow_entity')
                  | trim %}
                {% set candidates = [
                  configured,
                  'sensor.solcast_pv_forecast_forecast_tomorrow',
                  'sensor.solcast_pv_forecast_prognoza_na_jutro',
                  'sensor.solcast_forecast_tomorrow'
                ] %}
                {% set ns = namespace(entity='') %}
                {% for entity in candidates if entity and not ns.entity %}
                  {% if is_number(states(entity)) %}
                    {% set ns.entity = entity %}
                  {% endif %}
                {% endfor %}
                {{ ns.entity }}

  - id: hoymiles_rce_sync_dynamic_minimum_soc
    alias: "EMS RCE — write dynamic SOC reserve"
    description: >-
      Writes the calculated minimum discharge SOC to the inverter. The plan protects
      home supply from now through tonight, the next day, and the following
      night until 90 minutes after sunrise, then selects the most valuable RCE slots.
    mode: restart
    triggers:
      - trigger: state
        entity_id:
          - input_boolean.hoymiles_rce_discharge_enabled
          - input_boolean.hoymiles_rce_dynamic_soc_enabled
          - input_number.hoymiles_rce_soc_safety_margin
          - sensor.hoymiles_hit_ems_self_use_soc_readback
          - sensor.hoymiles_hit_battery_capacity
          - sensor.hoymiles_solcast_forecast_today
          - sensor.hoymiles_solcast_forecast_remaining_today
          - sensor.hoymiles_solcast_forecast_tomorrow
          - sensor.hoymiles_load_average_4_days
          - sensor.hoymiles_night_load_average_4_days
          - sensor.hoymiles_night_protection_window_remaining
          - sensor.hoymiles_protected_window_expected_load
          - sensor.hoymiles_rce_energy_deficit_tomorrow
          - sensor.hoymiles_rce_protected_home_energy
          - sensor.hoymiles_rce_dynamic_minimum_soc
          - binary_sensor.hoymiles_rce_reserve_ready
          - sensor.hoymiles_hit_rce_optimized_plan
      - trigger: time_pattern
        minutes: "/5"
      - trigger: homeassistant
        event: start
    conditions:
      - condition: state
        entity_id: input_boolean.hoymiles_battery_balancing_active
        state: "off"
      - condition: state
        entity_id: input_boolean.hoymiles_rce_discharge_enabled
        state: "on"
      - condition: state
        entity_id: input_boolean.hoymiles_rce_dynamic_soc_enabled
        state: "on"
      - condition: state
        entity_id: binary_sensor.hoymiles_rce_reserve_ready
        state: "on"
      # The Force Discharge register is owned only by an accepted RCE run.
      # Inactive planning remains read-only; the start transaction below
      # snapshots and writes its initial floor atomically.
      - condition: state
        entity_id: input_boolean.hoymiles_rce_discharge_active
        state: "on"
      - condition: state
        entity_id: sensor.hoymiles_ems_hardware_mode
        state: "grid_discharge"
      # This is a real Modbus writer, so it obeys the same ownership contract
      # as the RCE execution transaction. Shadow RCEm may observe in parallel;
      # every active/manual/other automatic owner blocks the register write.
      - condition: state
        entity_id: input_boolean.hoymiles_discharge_cycle_active
        state: "off"
      - condition: state
        entity_id: input_boolean.hoymiles_charge_cycle_active
        state: "off"
      - condition: template
        value_template: >-
          {{ not is_state('timer.hoymiles_discharge', 'active')
             and not is_state('timer.hoymiles_charge', 'active') }}
      - condition: state
        entity_id: input_boolean.hoymiles_tariff_charge_active
        state: "off"
      - condition: state
        entity_id: input_boolean.hoymiles_rcm_active
        state: "off"
      - condition: state
        entity_id: input_boolean.hoymiles_rcm_pre_discharge_active
        state: "off"
      - condition: template
        value_template: >-
          {{ is_state('input_boolean.hoymiles_rcm_enabled', 'off')
             or is_state('input_boolean.hoymiles_rcm_shadow_mode', 'on') }}
      - condition: template
        value_template: >-
          {{ is_number(states('sensor.hoymiles_rce_dynamic_minimum_soc'))
             and is_number(
               states('sensor.hoymiles_hit_ems_force_discharge_soc_readback')) }}
      - condition: template
        value_template: >-
          {% set current = states(
            'sensor.hoymiles_hit_ems_force_discharge_soc_readback') | float(0) %}
          {% set dynamic = states(
            'sensor.hoymiles_rce_dynamic_minimum_soc') | float(100) %}
          {% set latched = states(
            'input_number.hoymiles_rce_latched_minimum_soc') | float(0) %}
          {% set desired = [dynamic, latched, current] | max
               if is_state('input_boolean.hoymiles_rce_discharge_active', 'on')
               else dynamic %}
          {{ (current - desired) | abs >= 0.5 }}
    actions:
      - action: script.hoymiles_verified_set_ems_force_discharge_soc
        data:
          value: >-
            {% set current = states(
              'sensor.hoymiles_hit_ems_force_discharge_soc_readback') | float(0) %}
            {% set dynamic = states(
              'sensor.hoymiles_rce_dynamic_minimum_soc') | float(100) %}
            {% set latched = states(
              'input_number.hoymiles_rce_latched_minimum_soc') | float(0) %}
            {{ [dynamic, latched, current] | max
                 if is_state(
                   'input_boolean.hoymiles_rce_discharge_active', 'on')
                 else dynamic }}

  - id: hoymiles_enforce_sale_block
    alias: "EMS — enforce export lockout"
    description: >-
      During the lockout, stops every grid-discharge cycle and switches
      the inverter to Self-Use. Grid charging remains allowed.
    mode: restart
    triggers:
      - trigger: time_pattern
        minutes: "/1"
      - trigger: state
        entity_id: binary_sensor.hoymiles_sale_block_active
        to: "on"
      - trigger: state
        entity_id: sensor.hoymiles_ems_hardware_mode
        to: "grid_discharge"
      - trigger: homeassistant
        event: start
    conditions:
      - condition: state
        entity_id: binary_sensor.hoymiles_sale_block_active
        state: "on"
    actions:
      - action: timer.cancel
        target:
          entity_id: timer.hoymiles_discharge
      - wait_template: >-
          {{ states('sensor.hoymiles_ems_hardware_mode') not in
             ['unknown', 'unavailable', 'none', ''] }}
        timeout: "00:05:00"
        continue_on_timeout: false
      - if:
          - condition: state
            entity_id: sensor.hoymiles_ems_hardware_mode
            state: "grid_discharge"
        then:
          - action: script.hoymiles_verified_set_ems_mode
            data:
              option: "self_use"
          - wait_template: >-
              {{ states('sensor.hoymiles_ems_hardware_mode')
                 not in ['grid_discharge', 'unknown', 'unavailable',
                         'none', ''] }}
            timeout: "00:01:00"
            continue_on_timeout: true
      # A sale block may never forget an unconfirmed Grid Discharge owner.
      # Keep both markers until a positive neutral-mode readback; the state
      # trigger retries automatically when the select entity reconnects.
      - if:
          - condition: template
            value_template: >-
              {{ states('sensor.hoymiles_ems_hardware_mode')
                 not in ['grid_discharge', 'unknown', 'unavailable',
                         'none', ''] }}
        then:
          - if:
              - condition: state
                entity_id: input_boolean.hoymiles_rce_discharge_active
                state: "on"
            then:
              - action: script.hoymiles_rollback_rce_transaction
          - if:
              - condition: state
                entity_id: input_boolean.hoymiles_discharge_cycle_active
                state: "on"
            then:
              - action: input_boolean.turn_off
                target:
                  entity_id: input_boolean.hoymiles_discharge_cycle_active

  - id: hoymiles_rce_export_accounting
    alias: "EMS RCE — realized export accounting"
    description: >-
      Accounts for positive increments of the inverter grid-sell energy
      counter. Export during an active RCE cycle is stored separately from
      the natural Self-Use surplus. The RCE marker remains active
      during an ESP communication outage.
    mode: queued
    max: 20
    triggers:
      - trigger: state
        entity_id: sensor.hoymiles_hit_grid_energy_sell_today
      - trigger: homeassistant
        event: start
      - trigger: time
        at: "00:00:10"
    conditions:
      - condition: template
        value_template: >-
          {{ is_number(states('sensor.hoymiles_hit_grid_energy_sell_today')) }}
    actions:
      - variables:
          accounting_date: "{{ now().strftime('%Y-%m-%d') }}"
          stored_date: "{{ states('input_text.hoymiles_rce_accounting_date') }}"
          current_counter: >-
            {{ states('sensor.hoymiles_hit_grid_energy_sell_today') | float(0) }}
          checkpoint: >-
            {{ states('input_number.hoymiles_rce_grid_sell_checkpoint')
               | float(0) }}
          counter_delta: >-
            {% set current = states(
              'sensor.hoymiles_hit_grid_energy_sell_today') | float(0) %}
            {% set previous = states(
              'input_number.hoymiles_rce_grid_sell_checkpoint') | float(0) %}
            {{ ([current - previous, 0] | max) if current >= previous
               else current }}
          current_price: >-
            {{ states('sensor.hoymiles_rce_current_price') | float(0) }}
      - choose:
          # Przy zmianie daty punkt kontrolny może jeszcze zawierać końcową
          # value sprzętowego licznika z poprzedniego dnia. Nie wolno
          # przepisywać jej do bieżącego dnia jako eksport nierozpoznany.
          - conditions:
              - condition: template
                value_template: "{{ stored_date != accounting_date }}"
            sequence:
              - action: input_number.set_value
                target:
                  entity_id:
                    - input_number.hoymiles_rce_realized_controlled_export_store
                    - input_number.hoymiles_rce_realized_natural_export_store
                    - input_number.hoymiles_rce_realized_controlled_revenue_store
                    - input_number.hoymiles_rce_realized_natural_revenue_store
                data:
                  value: 0
              - action: input_number.set_value
                target:
                  entity_id: input_number.hoymiles_rce_unclassified_export_store
                data:
                  value: 0
              - action: input_number.set_value
                target:
                  entity_id: input_number.hoymiles_rce_grid_sell_checkpoint
                data:
                  value: "{{ current_counter }}"
              - action: input_text.set_value
                target:
                  entity_id: input_text.hoymiles_rce_accounting_date
                data:
                  value: "{{ accounting_date }}"

          - conditions:
              - condition: template
                value_template: "{{ counter_delta | float(0) > 0 }}"
            sequence:
              - action: input_number.set_value
                target:
                  entity_id: input_number.hoymiles_rce_grid_sell_checkpoint
                data:
                  value: "{{ current_counter }}"
              - choose:
                  - conditions:
                      - condition: state
                        entity_id: input_boolean.hoymiles_rce_discharge_active
                        state: "on"
                    sequence:
                      - action: input_number.set_value
                        target:
                          entity_id: >-
                            input_number.hoymiles_rce_realized_controlled_export_store
                        data:
                          value: >-
                            {{ ((states(
                              'input_number.hoymiles_rce_realized_controlled_export_store')
                              | float(0)) + (counter_delta | float(0))) }}
                      - action: input_number.set_value
                        target:
                          entity_id: >-
                            input_number.hoymiles_rce_realized_controlled_revenue_store
                        data:
                          value: >-
                            {{ ((states(
                              'input_number.hoymiles_rce_realized_controlled_revenue_store')
                              | float(0))
                               + (counter_delta | float(0))
                               * (current_price | float(0))) }}

                  - conditions:
                      - condition: state
                        entity_id: sensor.hoymiles_ems_hardware_mode
                        state: "self_use"
                    sequence:
                      - action: input_number.set_value
                        target:
                          entity_id: >-
                            input_number.hoymiles_rce_realized_natural_export_store
                        data:
                          value: >-
                            {{ ((states(
                              'input_number.hoymiles_rce_realized_natural_export_store')
                              | float(0)) + (counter_delta | float(0))) }}
                      - action: input_number.set_value
                        target:
                          entity_id: >-
                            input_number.hoymiles_rce_realized_natural_revenue_store
                        data:
                          value: >-
                            {{ ((states(
                              'input_number.hoymiles_rce_realized_natural_revenue_store')
                              | float(0))
                               + (counter_delta | float(0))
                               * (current_price | float(0))) }}

                default:
                  - action: input_number.set_value
                    target:
                      entity_id: input_number.hoymiles_rce_unclassified_export_store
                    data:
                      value: >-
                        {{ ((states(
                          'input_number.hoymiles_rce_unclassified_export_store')
                          | float(0)) + (counter_delta | float(0))) }}
        default:
          - action: input_number.set_value
            target:
              entity_id: input_number.hoymiles_rce_grid_sell_checkpoint
            data:
              value: "{{ current_counter }}"

  - id: hoymiles_automatic_ems_mode_interlock
    alias: "EMS — interlock for RCE, tariff and RCEm automation"
    description: >-
      Allows only one execution automation to run. RCE, tariff charging
      and active RCEm 253 V+ control are mutually exclusive.
      RCEm can collect data in observation mode without taking ownership of EMS.
    mode: restart
    triggers:
      - trigger: state
        entity_id: input_boolean.hoymiles_rce_discharge_enabled
        to: "on"
        id: rce_enabled
      - trigger: state
        entity_id: input_boolean.hoymiles_tariff_charge_enabled
        to: "on"
        id: tariff_enabled
      - trigger: state
        entity_id: input_boolean.hoymiles_rcm_enabled
        to: "on"
        id: rcm_enabled
      - trigger: state
        entity_id: input_boolean.hoymiles_rcm_shadow_mode
        to: "off"
        id: rcm_shadow_disabled
      - trigger: homeassistant
        event: start
        id: startup
    actions:
      - if:
          - condition: trigger
            id: startup
        then:
          - delay: "00:00:20"
      - choose:
          - conditions:
              - condition: template
                value_template: >-
                  {{ trigger.id == 'rce_enabled'
                     or (trigger.id == 'startup'
                         and is_state(
                           'input_boolean.hoymiles_rce_discharge_enabled', 'on')) }}
            sequence:
              - action: input_boolean.turn_off
                target:
                  entity_id: input_boolean.hoymiles_tariff_charge_enabled
              - if:
                  - condition: state
                    entity_id: input_boolean.hoymiles_rcm_shadow_mode
                    state: "off"
                then:
                  - action: input_boolean.turn_off
                    target:
                      entity_id: input_boolean.hoymiles_rcm_enabled
              - if:
                  - condition: state
                    entity_id: input_boolean.hoymiles_tariff_charge_active
                    state: "on"
                then:
                  - action: script.hoymiles_rollback_tariff_transaction

          - conditions:
              - condition: template
                value_template: >-
                  {{ trigger.id == 'tariff_enabled'
                     or (trigger.id == 'startup'
                         and is_state(
                           'input_boolean.hoymiles_tariff_charge_enabled', 'on')) }}
            sequence:
              - action: input_boolean.turn_off
                target:
                  entity_id: input_boolean.hoymiles_rce_discharge_enabled
              - if:
                  - condition: state
                    entity_id: input_boolean.hoymiles_rcm_shadow_mode
                    state: "off"
                then:
                  - action: input_boolean.turn_off
                    target:
                      entity_id: input_boolean.hoymiles_rcm_enabled
              - if:
                  - condition: state
                    entity_id: input_boolean.hoymiles_rce_discharge_active
                    state: "on"
                then:
                  - action: script.hoymiles_rollback_rce_transaction

          - conditions:
              - condition: template
                value_template: >-
                  {{ (trigger.id in ['rcm_enabled', 'rcm_shadow_disabled']
                      and is_state(
                        'input_boolean.hoymiles_rcm_shadow_mode', 'off'))
                     or (trigger.id == 'startup'
                         and is_state('input_boolean.hoymiles_rcm_enabled', 'on')
                         and is_state(
                           'input_boolean.hoymiles_rcm_shadow_mode', 'off')
                         and is_state(
                           'input_boolean.hoymiles_rce_discharge_enabled', 'off')
                         and is_state(
                           'input_boolean.hoymiles_tariff_charge_enabled', 'off')) }}
            sequence:
              - if:
                  - condition: template
                    value_template: >-
                      {{ (is_state(
                           'input_boolean.hoymiles_rce_discharge_active', 'on')
                          or is_state(
                           'input_boolean.hoymiles_tariff_charge_active', 'on'))
                         and states('sensor.hoymiles_ems_hardware_mode')
                           in ['grid_discharge', 'grid_charge'] }}
                then:
                  - action: script.hoymiles_verified_set_ems_mode
                    data:
                      option: "self_use"
                  - wait_template: >-
                      {{ is_state('sensor.hoymiles_ems_hardware_mode', 'self_use') }}
                    timeout: "00:01:00"
                    continue_on_timeout: true
              - action: input_boolean.turn_off
                target:
                  entity_id:
                    - input_boolean.hoymiles_rce_discharge_enabled
                    - input_boolean.hoymiles_tariff_charge_enabled
              - if:
                  - condition: state
                    entity_id: input_boolean.hoymiles_rce_discharge_active
                    state: "on"
                then:
                  - action: script.hoymiles_rollback_rce_transaction
              - if:
                  - condition: state
                    entity_id: input_boolean.hoymiles_tariff_charge_active
                    state: "on"
                then:
                  - action: script.hoymiles_rollback_tariff_transaction

  - id: hoymiles_tariff_grid_charge_control
    alias: "Tariff EMS — forecast-based charging in low-cost periods"
    description: >-
      Every minute it simulates the home, PV, and battery balance through tomorrow.
      It charges only in a planned low-cost slot before the forecast shortage.
      It cannot run together with RCE or manual EMS timers.
    mode: single
    max_exceeded: silent
    triggers:
      - trigger: time_pattern
        minutes: "/1"
      - trigger: state
        entity_id:
          - sensor.hoymiles_hit_tariff_charge_plan
          - binary_sensor.hoymiles_tariff_planned_charge_slot
          - input_boolean.hoymiles_tariff_charge_enabled
          - input_boolean.hoymiles_rce_discharge_enabled
          - input_boolean.hoymiles_rce_discharge_active
          - input_boolean.hoymiles_discharge_cycle_active
          - input_boolean.hoymiles_charge_cycle_active
          - input_boolean.hoymiles_rcm_active
          - input_boolean.hoymiles_rcm_pre_discharge_active
          - sensor.hoymiles_hit_overview_battery_soc
          - sensor.hoymiles_tariff_target_soc
          - input_number.hoymiles_tariff_maximum_soc
          - number.hoymiles_hit_force_charge_soc
          - number.hoymiles_hit_maximum_charge_power
          - sensor.hoymiles_ems_hardware_mode
          - binary_sensor.hoymiles_tariff_control_data_ready
          - input_boolean.hoymiles_rcm_enabled
          - input_boolean.hoymiles_battery_balancing_active
      - trigger: homeassistant
        event: start
    actions:
      - choose:
          # Wyrównywanie ma bezwzględne pierwszeństwo. Zwalniamy jedynie
          # wewnętrzny znacznik taryfowy po odtworzeniu jego nastaw; sterownik
          # serwisowy pozostaje w fazie handover i czeka na ten readback.
          - conditions:
              - condition: state
                entity_id: input_boolean.hoymiles_battery_balancing_active
                state: "on"
            sequence:
              - if:
                  - condition: state
                    entity_id: input_boolean.hoymiles_tariff_charge_active
                    state: "on"
                then:
                  - action: script.hoymiles_rollback_tariff_transaction

          # Ręczne harmonogramy mają pierwszeństwo. Automat przestaje uznawać
          # cykl za własny i nie nadpisuje trybu wybranego przez użytkownika.
          - conditions:
              - condition: state
                entity_id: input_boolean.hoymiles_tariff_charge_active
                state: "on"
              - condition: or
                conditions:
                  - condition: state
                    entity_id: input_boolean.hoymiles_discharge_cycle_active
                    state: "on"
                  - condition: state
                    entity_id: input_boolean.hoymiles_charge_cycle_active
                    state: "on"
            sequence:
              - action: script.hoymiles_rollback_tariff_transaction

          # A lower maximum SOC chosen during an active required-charge run
          # takes effect immediately. A value below the protected reserve first
          # neutralizes the cycle; otherwise the following branch clamps the
          # frozen target and the next minute updates Force Charge.
          - conditions:
              - condition: state
                entity_id: input_boolean.hoymiles_tariff_charge_active
                state: "on"
              - condition: template
                value_template: >-
                  {% set maximum = states(
                    'input_number.hoymiles_tariff_maximum_soc') %}
                  {% set reserve = state_attr(
                    'sensor.hoymiles_hit_tariff_charge_plan',
                    'reserve_soc_percent') %}
                  {{ states('input_text.hoymiles_tariff_active_action')
                       in ['battery_charge', 'grid_support_and_charge']
                     and is_number(maximum) and is_number(reserve)
                     and (maximum | float(0)) < (reserve | float(0)) }}
            sequence:
              - action: script.hoymiles_rollback_tariff_transaction

          - conditions:
              - condition: state
                entity_id: input_boolean.hoymiles_tariff_charge_active
                state: "on"
              - condition: template
                value_template: >-
                  {% set active = states(
                    'input_text.hoymiles_tariff_active_action') %}
                  {% set maximum = states(
                    'input_number.hoymiles_tariff_maximum_soc') %}
                  {% set latched = states(
                    'input_number.hoymiles_tariff_latched_target_soc') %}
                  {% set reserve = state_attr(
                    'sensor.hoymiles_hit_tariff_charge_plan',
                    'reserve_soc_percent') %}
                  {{ active in ['battery_charge', 'grid_support_and_charge']
                     and is_number(maximum) and is_number(latched)
                     and is_number(reserve)
                     and (maximum | float(0)) >= (reserve | float(0))
                     and (maximum | float(0)) < (latched | float(0)) }}
            sequence:
              - action: input_number.set_value
                target:
                  entity_id: input_number.hoymiles_tariff_latched_target_soc
                data:
                  value: >-
                    {{ states('input_number.hoymiles_tariff_maximum_soc')
                       | float(100) | round(0, 'floor') }}

          # Start: plan i wszystkie dane są ważne, bieżący blok został wybrany,
          # a magazyn nie osiągnął jeszcze wyliczonego celu SOC. Pełny 1% próg
          # startu oddziela się od progu zatrzymania i zapobiega oscylacji.
          # Using low-cost grid power solely to supply the home has an additional execution contract:
          # the optimizer must accept the whole continuous run and its intent
          # must remain unchanged for 120 s. Urgent battery charging does not
          # wait for this micro-cycle filter.
          - conditions:
              - condition: state
                entity_id: input_boolean.hoymiles_tariff_charge_enabled
                state: "on"
              - condition: state
                entity_id: input_boolean.hoymiles_rce_discharge_enabled
                state: "off"
              - condition: state
                entity_id: input_boolean.hoymiles_rce_discharge_active
                state: "off"
              - condition: template
                value_template: >-
                  {{ is_state('input_boolean.hoymiles_rcm_enabled', 'off')
                     or is_state(
                       'input_boolean.hoymiles_rcm_shadow_mode', 'on') }}
              - condition: state
                entity_id: input_boolean.hoymiles_tariff_charge_active
                state: "off"
              - condition: state
                entity_id: input_boolean.hoymiles_rcm_active
                state: "off"
              - condition: state
                entity_id: input_boolean.hoymiles_rcm_pre_discharge_active
                state: "off"
              - condition: state
                entity_id: input_boolean.hoymiles_rcm_export_control_active
                state: "off"
              - condition: state
                entity_id: input_boolean.hoymiles_battery_balancing_active
                state: "off"
              - condition: state
                entity_id: binary_sensor.hoymiles_tariff_control_data_ready
                state: "on"
              - condition: state
                entity_id: binary_sensor.hoymiles_tariff_planned_charge_slot
                state: "on"
              - condition: template
                value_template: >-
                  {{ state_attr('sensor.hoymiles_hit_tariff_charge_plan',
                                'status_code')
                     in ['ready', 'insufficient_cheap_window'] }}
              - condition: template
                value_template: >-
                  {% set action = state_attr(
                    'sensor.hoymiles_hit_tariff_charge_plan',
                    'current_action') %}
                  {% set plan = 'sensor.hoymiles_hit_tariff_charge_plan' %}
                  {% set soc = states(
                    'sensor.hoymiles_hit_overview_battery_soc') %}
                  {% if action == 'grid_support' %}
                    {{ state_attr(plan, 'current_run_start_eligible')
                         is sameas true
                       and is_number(state_attr(
                         plan, 'current_run_intent_stable_seconds'))
                       and (state_attr(
                         plan, 'current_run_intent_stable_seconds')
                           | float(0)) >= 120
                       and is_number(state_attr(plan, 'reserve_soc_percent'))
                       and is_number(states(
                         'input_number.hoymiles_tariff_maximum_soc'))
                       and is_number(soc)
                       and (states(
                         'input_number.hoymiles_tariff_maximum_soc')
                           | float(0))
                           >= (state_attr(plan, 'reserve_soc_percent')
                                | float(0))
                       and (soc | float(0))
                           > (state_attr(plan, 'reserve_soc_percent')
                                | float(0)) + 1.0 }}
                  {% elif action in
                       ['battery_charge', 'grid_support_and_charge'] %}
                    {% set target = states('sensor.hoymiles_tariff_target_soc') %}
                    {% set capacity = states(
                      'sensor.hoymiles_hit_battery_capacity') %}
                    {% set reserve = state_attr(plan, 'reserve_soc_percent') %}
                    {% if is_number(target) and is_number(soc)
                          and is_number(capacity) and (capacity | float(0)) > 0
                          and is_number(reserve)
                          and is_number(states(
                            'input_number.hoymiles_tariff_maximum_soc'))
                          and (states(
                            'input_number.hoymiles_tariff_maximum_soc')
                              | float(0)) >= (reserve | float(0)) %}
                      {% set headroom_kwh =
                        ((target | float(0)) - (soc | float(0)))
                        * (capacity | float(0)) / 100 %}
                      {% set minimum_headroom_kwh =
                        [[(capacity | float(0)) * 0.005, 0.20] | max, 0.50]
                        | min %}
                      {% set reserve_recovery =
                        (soc | float(0)) < (reserve | float(0))
                        and ((target | float(0)) - (soc | float(0))) >= 0.2
                        and headroom_kwh >= 0.10 %}
                      {{ (target | float(0)) > (soc | float(0))
                         and (reserve_recovery
                              or headroom_kwh >= minimum_headroom_kwh) }}
                    {% else %}
                      false
                    {% endif %}
                  {% else %}
                    false
                  {% endif %}
              - condition: template
                value_template: >-
                  {{ is_number(state_attr(
                       'sensor.hoymiles_hit_tariff_charge_plan',
                       'command_charge_power_percent'))
                     and (state_attr(
                       'sensor.hoymiles_hit_tariff_charge_plan',
                       'command_charge_power_percent') | float(0)) > 0
                     and states('sensor.hoymiles_ems_hardware_mode')
                       not in ['unknown', 'unavailable', 'none'] }}
              - condition: template
                value_template: >-
                  {% set slot_end = state_attr(
                    'sensor.hoymiles_hit_tariff_charge_plan',
                    'current_slot_end') %}
                  {{ slot_end is not none
                     and as_timestamp(slot_end, 0) - as_timestamp(now())
                       >= 420 }}
              - condition: state
                entity_id: input_boolean.hoymiles_discharge_cycle_active
                state: "off"
              - condition: state
                entity_id: input_boolean.hoymiles_charge_cycle_active
                state: "off"
              - condition: template
                value_template: >-
                  {{ not is_state('timer.hoymiles_discharge', 'active')
                     and not is_state('timer.hoymiles_charge', 'active') }}
            sequence:
              # Freeze the accepted intent before the first Modbus wait. The
              # sensor may recalculate while the inverter confirms settings;
              # this transaction must nevertheless remain internally coherent.
              - variables:
                  tariff_start_action: >-
                    {{ state_attr('sensor.hoymiles_hit_tariff_charge_plan',
                                  'current_action') }}
                  tariff_start_soc: >-
                    {{ states('sensor.hoymiles_hit_overview_battery_soc')
                       | float(0) }}
                  tariff_start_target_soc: >-
                    {{ states('sensor.hoymiles_tariff_target_soc')
                       | float(100) }}
                  tariff_start_reserve_soc: >-
                    {{ state_attr('sensor.hoymiles_hit_tariff_charge_plan',
                                  'reserve_soc_percent') | float(0) }}
                  tariff_start_maximum_soc: >-
                    {{ states('input_number.hoymiles_tariff_maximum_soc')
                       | float(100) }}
                  tariff_start_power: >-
                    {{ state_attr('sensor.hoymiles_hit_tariff_charge_plan',
                                  'command_charge_power_percent')
                       | float(0) }}
                  tariff_start_slot_end: >-
                    {{ state_attr('sensor.hoymiles_hit_tariff_charge_plan',
                                  'current_slot_end') }}
              # Zamrożony cel pozostaje stały do końca rozpoczętego cyklu.
              # Kolejne przeliczenia pogody i obciążenia nie mogą wywołać
              # naprzemiennego Grid Charge / Self-Use.
              - action: input_number.set_value
                target:
                  entity_id: input_number.hoymiles_tariff_latched_target_soc
                data:
                  value: >-
                    {% if tariff_start_action == 'grid_support' %}
                      {# Force Charge uses an integer SOC. Keep the target
                         below live SOC and at/below the configured maximum,
                         but never below the protected Self-Use reserve. #}
                      {% set below_live =
                        (tariff_start_soc | round(0, 'floor')) - 1 %}
                      {% set maximum = tariff_start_maximum_soc
                        | round(0, 'floor') %}
                      {% set reserve = tariff_start_reserve_soc
                        | round(0, 'ceil') %}
                      {{ [[[below_live, maximum] | min, reserve] | max, 0]
                           | max | round(0) }}
                    {% else %}
                      {{ tariff_start_target_soc | float(100)
                         | round(0, 'ceil') }}
                    {% endif %}
              - action: input_datetime.set_datetime
                target:
                  entity_id: input_datetime.hoymiles_tariff_latched_slot_end
                data:
                  timestamp: >-
                    {{ as_timestamp(tariff_start_slot_end) }}
              # Snapshot both shared registers, freeze the accepted action and
              # claim durable ownership before the first Modbus setting write.
              # A concurrent controller therefore sees this transaction even
              # while its first acknowledgement is still pending.
              - action: input_number.set_value
                target:
                  entity_id: input_number.hoymiles_tariff_saved_max_charge_power
                data:
                  value: >-
                    {{ states(
                      'sensor.hoymiles_hit_ems_maximum_charge_power_readback')
                       | float(100) | round(1) }}
              - action: input_number.set_value
                target:
                  entity_id: input_number.hoymiles_tariff_saved_force_charge_soc
                data:
                  value: >-
                    {{ states('sensor.hoymiles_hit_ems_force_charge_soc_readback')
                       | float(100) | round(0) }}
              - action: input_text.set_value
                target:
                  entity_id: input_text.hoymiles_tariff_active_action
                data:
                  value: >-
                    {{ tariff_start_action | default('none', true) }}
              - action: input_boolean.turn_on
                target:
                  entity_id: input_boolean.hoymiles_tariff_charge_active
              # Idempotent setting writes: a value already confirmed by the
              # inverter is never sent to Modbus again.
              - if:
                  - condition: template
                    value_template: >-
                      {% set wanted = tariff_start_power | float(0) %}
                      {{ ((states(
                        'sensor.hoymiles_hit_ems_maximum_charge_power_readback') | float(0))
                           - wanted) | abs >= 0.5 }}
                then:
                  - action: script.hoymiles_verified_set_ems_maximum_charge_power
                    data:
                      value: >-
                        {{ tariff_start_power | float(0) | round(1) }}
                  - wait_template: >-
                      {% set wanted = tariff_start_power | float(0) %}
                      {{ ((states(
                        'sensor.hoymiles_hit_ems_maximum_charge_power_readback') | float(0))
                           - wanted) | abs < 0.5 }}
                    timeout: "00:01:00"
                    continue_on_timeout: true
                  - if:
                      - condition: template
                        value_template: >-
                          {% set wanted = tariff_start_power | float(0) %}
                          {{ ((states(
                            'sensor.hoymiles_hit_ems_maximum_charge_power_readback')
                              | float(0)) - wanted) | abs >= 0.5 }}
                    then:
                      - action: script.hoymiles_rollback_tariff_transaction
                      - stop: "The inverter did not confirm the charging limit"
              - if:
                  - condition: template
                    value_template: >-
                      {% set wanted = states(
                        'input_number.hoymiles_tariff_latched_target_soc')
                         | float(100) %}
                      {{ ((states('sensor.hoymiles_hit_ems_force_charge_soc_readback')
                            | float(0)) - wanted) | abs >= 1.0 }}
                then:
                  - action: script.hoymiles_verified_set_ems_force_charge_soc
                    data:
                      value: >-
                        {{ states(
                             'input_number.hoymiles_tariff_latched_target_soc')
                           | float(100) | round(0) }}
                  - wait_template: >-
                      {% set wanted = states(
                        'input_number.hoymiles_tariff_latched_target_soc')
                         | float(100) %}
                      {{ ((states('sensor.hoymiles_hit_ems_force_charge_soc_readback')
                            | float(0)) - wanted) | abs < 1.0 }}
                    timeout: "00:01:00"
                    continue_on_timeout: true
                  - if:
                      - condition: template
                        value_template: >-
                          {% set wanted = states(
                            'input_number.hoymiles_tariff_latched_target_soc')
                             | float(100) %}
                          {{ ((states('sensor.hoymiles_hit_ems_force_charge_soc_readback')
                                | float(0)) - wanted) | abs >= 1.0 }}
                    then:
                      - action: script.hoymiles_rollback_tariff_transaction
                      - stop: "The inverter did not confirm the target SOC before start"
              # Setting readbacks may take up to two minutes. Revalidate the
              # immutable window immediately before changing EMS mode, so a
              # late response can never start Grid Charge after the cheap zone.
              - if:
                  - condition: template
                    value_template: >-
                      {% set live_plan =
                        states.sensor.hoymiles_hit_tariff_charge_plan %}
                      {% set reported = live_plan.last_reported
                        if live_plan.last_reported is defined
                        else live_plan.last_updated %}
                      {% set plan_age = as_timestamp(now())
                        - as_timestamp(reported, 0) %}
                      {{ state_attr(
                           'sensor.hoymiles_hit_tariff_charge_plan',
                           'current_zone') == 'low'
                         and state_attr(
                           'sensor.hoymiles_hit_tariff_charge_plan',
                           'control_inputs_fresh') is sameas true
                         and state_attr(
                           'sensor.hoymiles_hit_tariff_charge_plan',
                           'current_slot_planned') is sameas true
                         and state_attr(
                           'sensor.hoymiles_hit_tariff_charge_plan',
                           'current_action') == tariff_start_action
                         and is_number(state_attr(
                           'sensor.hoymiles_hit_tariff_charge_plan',
                           'soc_age_seconds'))
                         and (state_attr(
                           'sensor.hoymiles_hit_tariff_charge_plan',
                           'soc_age_seconds') | float(9999)) <= 120
                         and is_number(state_attr(
                           'sensor.hoymiles_hit_tariff_charge_plan',
                           'bms_charge_age_seconds'))
                         and (state_attr(
                           'sensor.hoymiles_hit_tariff_charge_plan',
                           'bms_charge_age_seconds') | float(9999)) <= 300
                         and plan_age >= 0 and plan_age <= 120
                         and is_state(
                           'input_boolean.hoymiles_tariff_charge_enabled', 'on')
                         and is_state(
                           'input_boolean.hoymiles_tariff_charge_active', 'on')
                         and states(
                           'input_text.hoymiles_tariff_active_action')
                           == tariff_start_action
                         and is_state(
                           'input_boolean.hoymiles_rce_discharge_enabled', 'off')
                         and is_state(
                           'input_boolean.hoymiles_rce_discharge_active', 'off')
                         and (is_state(
                           'input_boolean.hoymiles_rcm_enabled', 'off')
                           or is_state(
                             'input_boolean.hoymiles_rcm_shadow_mode', 'on'))
                         and is_state(
                           'input_boolean.hoymiles_rcm_active', 'off')
                         and is_state(
                           'input_boolean.hoymiles_rcm_pre_discharge_active',
                           'off')
                         and is_state(
                           'input_boolean.hoymiles_battery_balancing_active',
                           'off')
                         and is_state(
                           'input_boolean.hoymiles_discharge_cycle_active', 'off')
                         and is_state(
                           'input_boolean.hoymiles_charge_cycle_active', 'off')
                         and not is_state('timer.hoymiles_discharge', 'active')
                         and not is_state('timer.hoymiles_charge', 'active')
                         and is_state(
                           'binary_sensor.hoymiles_ems_execution_ready', 'on')
                         and is_state(
                           'binary_sensor.hoymiles_tariff_control_data_ready',
                           'on')
                         and is_number(state_attr(
                           'sensor.hoymiles_hit_tariff_charge_plan',
                           'command_charge_power_percent'))
                         and ((state_attr(
                           'sensor.hoymiles_hit_tariff_charge_plan',
                           'command_charge_power_percent') | float(-999))
                           - (tariff_start_power | float(0))) | abs < 0.5
                         and is_number(states(
                           'input_number.hoymiles_tariff_maximum_soc'))
                         and (states(
                           'input_number.hoymiles_tariff_maximum_soc')
                             | float(0)) >= tariff_start_reserve_soc
                         and as_timestamp(states(
                           'input_datetime.hoymiles_tariff_latched_slot_end'), 0)
                           - as_timestamp(now()) >= 300 }}
                then:
                  - delay: "00:00:01"
                else:
                  - action: script.hoymiles_rollback_tariff_transaction
                  - stop: "Safe Grid Charge start conditions expired"
              - if:
                  - condition: template
                    value_template: >-
                      {{ not is_state(
                        'sensor.hoymiles_ems_hardware_mode', 'grid_charge') }}
                then:
                  - action: script.hoymiles_verified_set_ems_mode
                    data:
                      option: "grid_charge"
              # The select entity may publish optimistically. Wait for a normal
              # Modbus propagation pass before evaluating the readback.
              - delay: "00:00:05"
              - wait_template: >-
                  {{ is_state('sensor.hoymiles_ems_hardware_mode', 'grid_charge') }}
                timeout: "00:02:00"
                continue_on_timeout: true
              - choose:
                  - conditions:
                      - condition: state
                        entity_id: sensor.hoymiles_ems_hardware_mode
                        state: "grid_charge"
                      - condition: state
                        entity_id: binary_sensor.hoymiles_tariff_control_data_ready
                        state: "on"
                      - condition: template
                        value_template: >-
                          {% set wanted_power = tariff_start_power | float(0) %}
                          {% set wanted_soc = states(
                            'input_number.hoymiles_tariff_latched_target_soc')
                             | float(100) %}
                          {{ ((states(
                            'sensor.hoymiles_hit_ems_maximum_charge_power_readback')
                              | float(0)) - wanted_power) | abs < 0.5
                             and ((states(
                               'sensor.hoymiles_hit_ems_force_charge_soc_readback')
                                | float(0)) - wanted_soc) | abs < 1.1 }}
                    sequence:
                      - delay: "00:00:01"
                default:
                  # The inverter did not acknowledge the complete transaction.
                  # Roll back both writes; an unavailable readback keeps the
                  # pending owner for the periodic retry.
                  - action: script.hoymiles_rollback_tariff_transaction

          # Aktualizacja ograniczeń BMS podczas bieżącego bloku. Cel SOC nie
          # podąża już za ruchomym planem — używany jest cel zapamiętany przy
          # starcie cyklu.
          - conditions:
              - condition: state
                entity_id: input_boolean.hoymiles_tariff_charge_active
                state: "on"
              - condition: state
                entity_id: input_boolean.hoymiles_tariff_charge_enabled
                state: "on"
              - condition: state
                entity_id: input_boolean.hoymiles_rce_discharge_enabled
                state: "off"
              - condition: state
                entity_id: sensor.hoymiles_ems_hardware_mode
                state: "grid_charge"
              - condition: state
                entity_id: binary_sensor.hoymiles_tariff_planned_charge_slot
                state: "on"
              - condition: template
                value_template: >-
                  {{ state_attr('sensor.hoymiles_hit_tariff_charge_plan',
                                'status_code')
                     in ['ready', 'insufficient_cheap_window'] }}
              - condition: template
                value_template: >-
                  {{ is_number(states(
                       'input_number.hoymiles_tariff_latched_target_soc')) }}
              - condition: template
                value_template: >-
                  {% set active = states(
                    'input_text.hoymiles_tariff_active_action') %}
                  {% set current = state_attr(
                    'sensor.hoymiles_hit_tariff_charge_plan',
                    'current_action') %}
                  {{ (active == 'grid_support'
                       and current == 'grid_support')
                     or (active in
                           ['battery_charge', 'grid_support_and_charge']
                         and current in
                           ['battery_charge', 'grid_support_and_charge']) }}
              - condition: template
                value_template: >-
                  {{ not (
                    state_attr(
                      'sensor.hoymiles_hit_tariff_charge_plan',
                      'current_run_continue_eligible') is not sameas true
                    and is_number(state_attr(
                      'sensor.hoymiles_hit_tariff_charge_plan',
                      'current_run_intent_stable_seconds'))
                    and (state_attr(
                      'sensor.hoymiles_hit_tariff_charge_plan',
                      'current_run_intent_stable_seconds') | float(0)) >= 120
                    and (as_timestamp(now()) - as_timestamp(
                      states.input_boolean.hoymiles_tariff_charge_active
                        .last_changed)) >= 120) }}
            sequence:
              - if:
                  - condition: template
                    value_template: >-
                      {{ is_number(state_attr(
                           'sensor.hoymiles_hit_tariff_charge_plan',
                           'command_charge_power_percent'))
                         and ((states(
                           'sensor.hoymiles_hit_ems_maximum_charge_power_readback')
                           | float(0))
                           - (state_attr(
                             'sensor.hoymiles_hit_tariff_charge_plan',
                             'command_charge_power_percent')
                              | float(0))) | abs >= 0.5 }}
                then:
                  - action: script.hoymiles_verified_set_ems_maximum_charge_power
                    data:
                      value: >-
                        {{ state_attr(
                             'sensor.hoymiles_hit_tariff_charge_plan',
                             'command_charge_power_percent')
                           | float(0) | round(1) }}
                  - wait_template: >-
                      {% set wanted = state_attr(
                        'sensor.hoymiles_hit_tariff_charge_plan',
                        'command_charge_power_percent') | float(0) %}
                      {{ ((states(
                        'sensor.hoymiles_hit_ems_maximum_charge_power_readback') | float(0))
                           - wanted) | abs < 0.5 }}
                    timeout: "00:01:00"
                    continue_on_timeout: true
                  - if:
                      - condition: template
                        value_template: >-
                          {% set wanted = state_attr(
                            'sensor.hoymiles_hit_tariff_charge_plan',
                            'command_charge_power_percent') | float(0) %}
                          {{ ((states(
                            'sensor.hoymiles_hit_ems_maximum_charge_power_readback')
                              | float(0)) - wanted) | abs >= 0.5 }}
                    then:
                      - action: script.hoymiles_rollback_tariff_transaction
                      - stop: "The inverter did not confirm the new charging limit"
              - if:
                  - condition: template
                    value_template: >-
                      {% set slot_end = state_attr(
                        'sensor.hoymiles_hit_tariff_charge_plan',
                        'current_slot_end') %}
                      {{ slot_end is not none
                         and as_timestamp(slot_end, 0)
                           > as_timestamp(states(
                             'input_datetime.hoymiles_tariff_latched_slot_end'), 0)
                             + 5 }}
                then:
                  - action: input_datetime.set_datetime
                    target:
                      entity_id: input_datetime.hoymiles_tariff_latched_slot_end
                    data:
                      timestamp: >-
                        {{ as_timestamp(state_attr(
                          'sensor.hoymiles_hit_tariff_charge_plan',
                          'current_slot_end')) }}
              - if:
                  - condition: template
                    value_template: >-
                      {% set wanted = states(
                        'input_number.hoymiles_tariff_latched_target_soc')
                         | float(100) | round(0) %}
                      {{ ((states('sensor.hoymiles_hit_ems_force_charge_soc_readback')
                           | float(0)) - wanted) | abs >= 1.0 }}
                then:
                  - action: script.hoymiles_verified_set_ems_force_charge_soc
                    data:
                      value: >-
                        {{ states(
                             'input_number.hoymiles_tariff_latched_target_soc')
                           | float(100) | round(0) }}
                  - wait_template: >-
                      {% set wanted = states(
                        'input_number.hoymiles_tariff_latched_target_soc')
                         | float(100) %}
                      {{ ((states('sensor.hoymiles_hit_ems_force_charge_soc_readback')
                            | float(0)) - wanted) | abs < 1.0 }}
                    timeout: "00:01:00"
                    continue_on_timeout: true
                  - if:
                      - condition: template
                        value_template: >-
                          {% set wanted = states(
                            'input_number.hoymiles_tariff_latched_target_soc')
                             | float(100) %}
                          {{ ((states('sensor.hoymiles_hit_ems_force_charge_soc_readback')
                                | float(0)) - wanted) | abs >= 1.0 }}
                    then:
                      - action: script.hoymiles_rollback_tariff_transaction
                      - stop: "The inverter did not confirm the target SOC"

          # Stop: end zapamiętanego ciągłego okna, osiągnięcie zamrożonego
          # celu, wyłączenie automatu albo trwała utrata wymaganych danych.
          # Chwilowe zniknięcie bieżącego bloku z ponownie przeliczonego planu
          # nie przerywa rozpoczętego ładowania. Minimalny czas 120 s pozwala
          # potwierdzić SOC i wykonanie zapisu Modbus przed komendą Self-Use.
          - conditions:
              - condition: state
                entity_id: input_boolean.hoymiles_tariff_charge_active
                state: "on"
              - condition: template
                value_template: >-
                  {{ is_state('input_boolean.hoymiles_tariff_charge_enabled', 'off')
                     or is_state('input_boolean.hoymiles_rce_discharge_enabled', 'on')
                     or state_attr('sensor.hoymiles_hit_tariff_charge_plan',
                                   'status_code')
                        in ['missing_data', 'optimizer_error', 'learning',
                            'no_charge_needed', 'soc_limits_conflict',
                            'hard_reserve_unavailable']
                     or (state_attr(
                           'sensor.hoymiles_hit_tariff_charge_plan',
                           'bms_charge_data_fresh') is sameas true
                         and state_attr(
                           'sensor.hoymiles_hit_tariff_charge_plan',
                           'bms_charge_available') is not sameas true)
                     or states('input_text.hoymiles_tariff_active_action')
                        not in
                          ['battery_charge', 'grid_support',
                           'grid_support_and_charge']
                     or not is_number(states(
                       'input_number.hoymiles_tariff_latched_target_soc'))
                     or not is_number(states(
                       'sensor.hoymiles_hit_overview_battery_soc'))
                     or (states('input_text.hoymiles_tariff_active_action')
                           in ['battery_charge', 'grid_support_and_charge']
                         and is_number(states(
                           'input_number.hoymiles_tariff_maximum_soc'))
                         and is_number(state_attr(
                           'sensor.hoymiles_hit_tariff_charge_plan',
                           'reserve_soc_percent'))
                         and (states(
                           'input_number.hoymiles_tariff_maximum_soc')
                              | float(0))
                           < (state_attr(
                             'sensor.hoymiles_hit_tariff_charge_plan',
                             'reserve_soc_percent') | float(0)))
                     or as_timestamp(states(
                          'input_datetime.hoymiles_tariff_latched_slot_end'), 0)
                        <= as_timestamp(now())
                     or (states('input_text.hoymiles_tariff_active_action')
                           in ['battery_charge', 'grid_support_and_charge']
                         and (as_timestamp(now()) - as_timestamp(
                           states.input_boolean.hoymiles_tariff_charge_active
                             .last_changed)) >= 120
                         and (states(
                           'sensor.hoymiles_hit_overview_battery_soc')
                              | float(0))
                              >= (states(
                                'input_number.hoymiles_tariff_latched_target_soc')
                                  | float(100)) - 0.1)
                     or ((as_timestamp(now()) - as_timestamp(
                           states.input_boolean.hoymiles_tariff_charge_active
                             .last_changed)) >= 120
                         and is_number(state_attr(
                           'sensor.hoymiles_hit_tariff_charge_plan',
                           'current_run_intent_stable_seconds'))
                         and (state_attr(
                           'sensor.hoymiles_hit_tariff_charge_plan',
                           'current_run_intent_stable_seconds') | float(0))
                           >= 120
                         and state_attr(
                           'sensor.hoymiles_hit_tariff_charge_plan',
                           'current_run_continue_eligible')
                           is not sameas true)
                     or (not is_state(
                           'sensor.hoymiles_ems_hardware_mode', 'grid_charge')
                         and (as_timestamp(now()) - as_timestamp(
                           states.sensor.hoymiles_ems_hardware_mode.last_changed))
                           >= 60) }}
              - condition: template
                value_template: >-
                  {{ states('sensor.hoymiles_ems_hardware_mode')
                     not in ['unknown', 'unavailable', 'none'] }}
            sequence:
              - action: script.hoymiles_rollback_tariff_transaction

  - id: hoymiles_rce_grid_discharge_control
    alias: "EMS RCE — optimized-plan discharge control"
    description: >-
      Every minute, checks the optimizer's two-day plan. It discharges only in
      the selected most profitable slots and only above the SOC required to
      supply the home. Manual timers take priority.
    mode: single
    max_exceeded: silent
    triggers:
      - trigger: time_pattern
        minutes: "/1"
      - trigger: state
        entity_id:
          - sensor.hoymiles_rce_current_price
          - sensor.hoymiles_hit_rce_optimized_plan
          - binary_sensor.hoymiles_rce_price_above_threshold
          - input_boolean.hoymiles_rce_discharge_enabled
          - input_boolean.hoymiles_tariff_charge_enabled
          - input_boolean.hoymiles_sale_block_enabled
          - input_datetime.hoymiles_sale_block_start
          - input_datetime.hoymiles_sale_block_end
          - binary_sensor.hoymiles_sale_block_active
          - input_boolean.hoymiles_discharge_cycle_active
          - input_boolean.hoymiles_charge_cycle_active
          - timer.hoymiles_discharge
          - timer.hoymiles_charge
          - sensor.hoymiles_hit_overview_battery_soc
          - number.hoymiles_hit_force_discharge_soc
          - number.hoymiles_hit_maximum_discharge_power
          - sensor.hoymiles_hit_maximum_discharge_current
          - sensor.hoymiles_hit_battery_voltage_bms
          - sensor.hoymiles_rce_effective_discharge_power_percent
          - input_number.hoymiles_rce_requested_discharge_power
          - input_select.hoymiles_rce_inverter_rated_power
          - sensor.hoymiles_hit_number_of_machines_master_and_slave
          - input_boolean.hoymiles_rce_dynamic_soc_enabled
          - input_number.hoymiles_rce_soc_safety_margin
          - sensor.hoymiles_rce_effective_minimum_soc
          - sensor.hoymiles_rce_dynamic_minimum_soc
          - binary_sensor.hoymiles_rce_reserve_ready
          - binary_sensor.hoymiles_rce_control_data_ready
          - binary_sensor.hoymiles_ems_export_allowed
          - input_boolean.hoymiles_rcm_enabled
          - input_boolean.hoymiles_rcm_active
          - input_boolean.hoymiles_rcm_pre_discharge_active
          - input_boolean.hoymiles_tariff_charge_active
          - input_boolean.hoymiles_battery_balancing_active
      - trigger: homeassistant
        event: start
    actions:
      # Inactive RCE never pre-writes a shared register. The complete setting
      # transaction is performed only inside the owned start branch below.
      - if:
          - condition: state
            entity_id: input_boolean.hoymiles_rce_discharge_active
            state: "on"
          - condition: state
            entity_id: sensor.hoymiles_ems_hardware_mode
            state: "grid_discharge"
          - condition: state
            entity_id: input_boolean.hoymiles_battery_balancing_active
            state: "off"
          - condition: state
            entity_id: input_boolean.hoymiles_discharge_cycle_active
            state: "off"
          - condition: state
            entity_id: input_boolean.hoymiles_charge_cycle_active
            state: "off"
          - condition: state
            entity_id: input_boolean.hoymiles_tariff_charge_active
            state: "off"
          - condition: state
            entity_id: input_boolean.hoymiles_tariff_charge_enabled
            state: "off"
          - condition: state
            entity_id: input_boolean.hoymiles_rcm_active
            state: "off"
          - condition: state
            entity_id: input_boolean.hoymiles_rcm_pre_discharge_active
            state: "off"
          - condition: template
            value_template: >-
              {{ is_state('input_boolean.hoymiles_rcm_enabled', 'off')
                 or is_state('input_boolean.hoymiles_rcm_shadow_mode', 'on') }}
          - condition: template
            value_template: >-
              {{ not is_state('timer.hoymiles_discharge', 'active')
                 and not is_state('timer.hoymiles_charge', 'active') }}
          - condition: state
            entity_id: binary_sensor.hoymiles_rce_control_data_ready
            state: "on"
          - condition: template
            value_template: >-
              {{ is_number(states(
                   'sensor.hoymiles_rce_effective_discharge_power_percent'))
                 and ((states(
                   'sensor.hoymiles_hit_ems_maximum_discharge_power_readback') | float(0))
                  - (states(
                    'sensor.hoymiles_rce_effective_discharge_power_percent')
                      | float(0))) | abs >= 0.5 }}
        then:
          - action: script.hoymiles_verified_set_ems_maximum_discharge_power
            data:
              value: >-
                {{ states(
                     'sensor.hoymiles_rce_effective_discharge_power_percent')
                   | float(0) | round(1) }}
          - wait_template: >-
              {{ ((states('sensor.hoymiles_hit_ems_maximum_discharge_power_readback')
                    | float(-999)) - (states(
                    'sensor.hoymiles_rce_effective_discharge_power_percent')
                    | float(0))) | abs < 0.5 }}
            timeout: "00:01:00"
            continue_on_timeout: true
          - if:
              - condition: template
                value_template: >-
                  {{ ((states('sensor.hoymiles_hit_ems_maximum_discharge_power_readback')
                        | float(-999)) - (states(
                        'sensor.hoymiles_rce_effective_discharge_power_percent')
                        | float(0))) | abs >= 0.5 }}
            then:
              - action: script.hoymiles_rollback_rce_transaction
      # Latch the complete contiguous run, not one half-hour row. This avoids
      # a Self-Use/Grid Discharge rollover at the boundary of adjacent slots.
      - if:
          - condition: state
            entity_id: input_boolean.hoymiles_rce_discharge_active
            state: "on"
          - condition: state
            entity_id: input_boolean.hoymiles_battery_balancing_active
            state: "off"
          - condition: state
            entity_id: input_boolean.hoymiles_discharge_cycle_active
            state: "off"
          - condition: state
            entity_id: input_boolean.hoymiles_charge_cycle_active
            state: "off"
          - condition: state
            entity_id: input_boolean.hoymiles_tariff_charge_active
            state: "off"
          - condition: state
            entity_id: input_boolean.hoymiles_rcm_active
            state: "off"
          - condition: state
            entity_id: input_boolean.hoymiles_rcm_pre_discharge_active
            state: "off"
          - condition: template
            value_template: >-
              {{ not is_state('timer.hoymiles_discharge', 'active')
                 and not is_state('timer.hoymiles_charge', 'active') }}
          - condition: template
            value_template: >-
              {{ state_attr('sensor.hoymiles_hit_rce_optimized_plan',
                            'current_slot_planned')
                 | default(false, true) }}
          - condition: template
            value_template: >-
              {% set end = as_timestamp(
                   state_attr('sensor.hoymiles_hit_rce_optimized_plan',
                              'current_run_end'), 0) %}
              {{ end > as_timestamp(states(
                'input_datetime.hoymiles_rce_latched_slot_end'), 0) }}
        then:
          - action: input_datetime.set_datetime
            target:
              entity_id: input_datetime.hoymiles_rce_latched_slot_end
            data:
              timestamp: >-
                {{ as_timestamp(
                     state_attr('sensor.hoymiles_hit_rce_optimized_plan',
                                'current_run_end')) }}

      # The Force Discharge floor is monotonic for the complete accepted run.
      # A colder LOAD/PV refresh may raise the protected SOC, but a later
      # optimistic refresh can never lower it before the latched deadline.
      - if:
          - condition: state
            entity_id: input_boolean.hoymiles_rce_discharge_active
            state: "on"
          - condition: state
            entity_id: input_boolean.hoymiles_battery_balancing_active
            state: "off"
          - condition: state
            entity_id: input_boolean.hoymiles_discharge_cycle_active
            state: "off"
          - condition: state
            entity_id: input_boolean.hoymiles_charge_cycle_active
            state: "off"
          - condition: state
            entity_id: input_boolean.hoymiles_tariff_charge_active
            state: "off"
          - condition: state
            entity_id: input_boolean.hoymiles_tariff_charge_enabled
            state: "off"
          - condition: state
            entity_id: input_boolean.hoymiles_rcm_active
            state: "off"
          - condition: state
            entity_id: input_boolean.hoymiles_rcm_pre_discharge_active
            state: "off"
          - condition: template
            value_template: >-
              {{ is_state('input_boolean.hoymiles_rcm_enabled', 'off')
                 or is_state('input_boolean.hoymiles_rcm_shadow_mode', 'on') }}
          - condition: template
            value_template: >-
              {{ not is_state('timer.hoymiles_discharge', 'active')
                 and not is_state('timer.hoymiles_charge', 'active') }}
          - condition: template
            value_template: >-
              {% set latched = states(
                   'input_number.hoymiles_rce_latched_minimum_soc') | float(0) %}
              {% set register = states(
                   'sensor.hoymiles_hit_ems_force_discharge_soc_readback') | float(0) %}
              {% set required = state_attr(
                   'sensor.hoymiles_hit_rce_optimized_plan',
                   'current_required_minimum_soc_percent') %}
              {% set safe = [latched, register,
                   required | float(latched)] | max | round(0, 'ceil') %}
              {{ is_number(states('sensor.hoymiles_hit_ems_force_discharge_soc_readback'))
                 and safe > register + 0.5 }}
        then:
          - variables:
              rce_monotonic_minimum_soc: >-
                {% set latched = states(
                     'input_number.hoymiles_rce_latched_minimum_soc') | float(0) %}
                {% set register = states(
                     'sensor.hoymiles_hit_ems_force_discharge_soc_readback') | float(0) %}
                {% set required = state_attr(
                     'sensor.hoymiles_hit_rce_optimized_plan',
                     'current_required_minimum_soc_percent') %}
                {{ [latched, register,
                    required | float(latched)] | max | round(0, 'ceil') }}
          - action: input_number.set_value
            target:
              entity_id: input_number.hoymiles_rce_latched_minimum_soc
            data:
              value: "{{ rce_monotonic_minimum_soc | float(100) }}"
          - action: script.hoymiles_verified_set_ems_force_discharge_soc
            data:
              value: "{{ rce_monotonic_minimum_soc | float(100) }}"
          - wait_template: >-
              {{ ((states('sensor.hoymiles_hit_ems_force_discharge_soc_readback') | float(0))
                   - (rce_monotonic_minimum_soc | float(100))) | abs < 1.0 }}
            timeout: "00:01:00"
            continue_on_timeout: true
          - if:
              - condition: template
                value_template: >-
                  {{ ((states('sensor.hoymiles_hit_ems_force_discharge_soc_readback')
                       | float(0))
                      - (rce_monotonic_minimum_soc | float(100))) | abs >= 1.0 }}
            then:
              - if:
                  - condition: state
                    entity_id: sensor.hoymiles_ems_hardware_mode
                    state: "grid_discharge"
                then:
                  - action: script.hoymiles_verified_set_ems_mode
                    data:
                      option: "self_use"
              - wait_template: >-
                  {{ states('sensor.hoymiles_ems_hardware_mode')
                     not in ['grid_discharge', 'unknown', 'unavailable',
                             'none', ''] }}
                timeout: "00:01:00"
                continue_on_timeout: true
              - if:
                  - condition: template
                    value_template: >-
                      {{ states('sensor.hoymiles_ems_hardware_mode')
                         not in ['grid_discharge', 'unknown', 'unavailable',
                                 'none', ''] }}
                then:
                  - action: script.hoymiles_rollback_rce_transaction
      - choose:
          # Battery balancing ustawia własny tryb i nie może zostać
          # przerwane przez aktywny wcześniej blok RCE.
          - conditions:
              - condition: state
                entity_id: input_boolean.hoymiles_battery_balancing_active
                state: "on"
            sequence:
              - if:
                  - condition: state
                    entity_id: input_boolean.hoymiles_rce_discharge_active
                    state: "on"
                then:
                  - action: script.hoymiles_rollback_rce_transaction

          # Jeśli w trakcie pracy RCE uruchomiono ręczny timer, automatyka RCE
          # oddaje mu control i nie zmienia ustawionego przez niego trybu.
          - conditions:
              - condition: state
                entity_id: input_boolean.hoymiles_rce_discharge_active
                state: "on"
              - condition: or
                conditions:
                  - condition: state
                    entity_id: input_boolean.hoymiles_discharge_cycle_active
                    state: "on"
                  - condition: state
                    entity_id: input_boolean.hoymiles_charge_cycle_active
                    state: "on"
            sequence:
              - action: script.hoymiles_rollback_rce_transaction

          # Start RCE: the current slot is planned, SOC reserve is available, and
          # no manual cycle is active.
          - conditions:
              - condition: state
                entity_id: input_boolean.hoymiles_rce_discharge_enabled
                state: "on"
              - condition: state
                entity_id: input_boolean.hoymiles_rce_discharge_active
                state: "off"
              - condition: state
                entity_id: input_boolean.hoymiles_battery_balancing_active
                state: "off"
              - condition: state
                entity_id: input_boolean.hoymiles_tariff_charge_enabled
                state: "off"
              - condition: state
                entity_id: input_boolean.hoymiles_tariff_charge_active
                state: "off"
              - condition: state
                entity_id: input_boolean.hoymiles_rcm_active
                state: "off"
              - condition: state
                entity_id: input_boolean.hoymiles_rcm_pre_discharge_active
                state: "off"
              - condition: state
                entity_id: input_boolean.hoymiles_rcm_export_control_active
                state: "off"
              - condition: template
                value_template: >-
                  {{ is_state('input_boolean.hoymiles_rcm_enabled', 'off')
                     or is_state(
                       'input_boolean.hoymiles_rcm_shadow_mode', 'on') }}
              - condition: state
                entity_id: binary_sensor.hoymiles_rce_control_data_ready
                state: "on"
              - condition: state
                entity_id: binary_sensor.hoymiles_rce_price_above_threshold
                state: "on"
              - condition: template
                value_template: >-
                  {{ state_attr('sensor.hoymiles_hit_rce_optimized_plan',
                                'current_slot_planned')
                     | default(false, true)
                     and state_attr('sensor.hoymiles_hit_rce_optimized_plan',
                                    'current_slot_start_eligible')
                     | default(false, true) }}
              - condition: state
                entity_id: binary_sensor.hoymiles_sale_block_active
                state: "off"
              - condition: state
                entity_id: binary_sensor.hoymiles_rce_reserve_ready
                state: "on"
              - condition: template
                value_template: >-
                  {{ is_number(states(
                    'sensor.hoymiles_rce_effective_discharge_power_percent'))
                     and (states(
                       'sensor.hoymiles_rce_effective_discharge_power_percent')
                       | float(0)) > 0
                     and is_number(states(
                       'sensor.hoymiles_hit_ems_maximum_discharge_power_readback'))
                     and is_number(states(
                       'sensor.hoymiles_hit_ems_force_discharge_soc_readback')) }}
              - condition: template
                value_template: >-
                  {{ (states('sensor.hoymiles_hit_overview_battery_soc') | float(0))
                     > (states('sensor.hoymiles_rce_effective_minimum_soc') | float(100)) }}
              - condition: state
                entity_id: input_boolean.hoymiles_discharge_cycle_active
                state: "off"
              - condition: state
                entity_id: input_boolean.hoymiles_charge_cycle_active
                state: "off"
              - condition: template
                value_template: >-
                  {{ not is_state('timer.hoymiles_discharge', 'active')
                     and not is_state('timer.hoymiles_charge', 'active')
                     and states('sensor.hoymiles_ems_hardware_mode')
                       not in ['unknown', 'unavailable', 'none'] }}
              # Never start a late, sub-five-minute fragment after a restart or
              # delayed plan refresh. This supplies the minimum EMS dwell time.
              - condition: template
                value_template: >-
                  {% set end = as_timestamp(state_attr(
                       'sensor.hoymiles_hit_rce_optimized_plan',
                       'current_slot_end'), 0) %}
                  {% set remaining = state_attr(
                       'sensor.hoymiles_hit_rce_optimized_plan',
                       'current_slot_remaining_minutes') | float(0) %}
                  {{ end - as_timestamp(now()) >= 300 and remaining >= 5 }}
            sequence:
              - variables:
                  rce_start_minimum_soc: >-
                    {% set required = state_attr(
                         'sensor.hoymiles_hit_rce_optimized_plan',
                         'current_required_minimum_soc_percent')
                         | float(states(
                           'sensor.hoymiles_rce_effective_minimum_soc')) %}
                    {% set register = states(
                         'sensor.hoymiles_hit_ems_force_discharge_soc_readback') | float(0) %}
                    {{ [required, register] | max | round(0, 'ceil') }}
                  rce_start_run_end: >-
                    {{ state_attr('sensor.hoymiles_hit_rce_optimized_plan',
                                  'current_run_end') }}
                  rce_start_power: >-
                    {{ states(
                      'sensor.hoymiles_rce_effective_discharge_power_percent')
                       | float(0) }}
              - action: input_datetime.set_datetime
                target:
                  entity_id: input_datetime.hoymiles_rce_latched_slot_end
                data:
                  timestamp: >-
                    {{ as_timestamp(rce_start_run_end) }}
              - action: input_number.set_value
                target:
                  entity_id: input_number.hoymiles_rce_latched_minimum_soc
                data:
                  value: "{{ rce_start_minimum_soc | float(100) }}"
              # Snapshot both shared registers and claim durable RCE ownership
              # before the first Modbus setting write. An abort restores this
              # exact baseline and never exposes an unowned changed register.
              - action: input_number.set_value
                target:
                  entity_id: input_number.hoymiles_rce_saved_max_discharge_power
                data:
                  value: >-
                    {{ states(
                      'sensor.hoymiles_hit_ems_maximum_discharge_power_readback')
                       | float(100) | round(1) }}
              - action: input_number.set_value
                target:
                  entity_id: input_number.hoymiles_rce_saved_force_discharge_soc
                data:
                  value: >-
                    {{ states(
                      'sensor.hoymiles_hit_ems_force_discharge_soc_readback')
                       | float(20) | round(0) }}
              - action: input_boolean.turn_on
                target:
                  entity_id: input_boolean.hoymiles_rce_discharge_active
              - if:
                  - condition: template
                    value_template: >-
                      {{ ((states(
                           'sensor.hoymiles_hit_ems_maximum_discharge_power_readback') | float(0))
                           - (rce_start_power | float(0))) | abs >= 0.5 }}
                then:
                  - action: script.hoymiles_verified_set_ems_maximum_discharge_power
                    data:
                      value: "{{ rce_start_power | float(0) | round(1) }}"
                  - wait_template: >-
                      {{ ((states(
                           'sensor.hoymiles_hit_ems_maximum_discharge_power_readback')
                           | float(-999)) - (rce_start_power | float(0)))
                           | abs < 0.5 }}
                    timeout: "00:01:00"
                    continue_on_timeout: true
                  - if:
                      - condition: template
                        value_template: >-
                          {{ ((states(
                               'sensor.hoymiles_hit_ems_maximum_discharge_power_readback')
                               | float(-999)) - (rce_start_power | float(0)))
                               | abs >= 0.5 }}
                    then:
                      - action: script.hoymiles_rollback_rce_transaction
                      - stop: "The inverter did not confirm the RCE discharging limit"
              - if:
                  - condition: template
                    value_template: >-
                      {{ ((states(
                        'sensor.hoymiles_hit_ems_force_discharge_soc_readback') | float(0))
                         - (rce_start_minimum_soc | float(100))) | abs >= 1.0 }}
                then:
                  - action: script.hoymiles_verified_set_ems_force_discharge_soc
                    data:
                      value: >-
                        {{ rce_start_minimum_soc | float(100) }}
                  - wait_template: >-
                      {{ ((states(
                           'sensor.hoymiles_hit_ems_force_discharge_soc_readback')
                           | float(0))
                          - (rce_start_minimum_soc | float(100))) | abs < 1.0 }}
                    timeout: "00:01:00"
                    continue_on_timeout: true
                  - if:
                      - condition: template
                        value_template: >-
                          {{ ((states(
                               'sensor.hoymiles_hit_ems_force_discharge_soc_readback')
                               | float(-999))
                              - (rce_start_minimum_soc | float(100)))
                              | abs >= 1.0 }}
                    then:
                      - action: script.hoymiles_rollback_rce_transaction
                      - stop: "The inverter did not confirm the RCE SOC threshold"
              # Final, fresh interlock after every owned Modbus setting
              # readback. Failure is a rollback transaction, never an implicit
              # condition abort that could orphan changed registers.
              - choose:
                  - conditions:
                      - condition: template
                        value_template: >-
                          {% set plan = states.sensor.hoymiles_hit_rce_optimized_plan %}
                          {% set plan_reported = plan.last_reported
                               if plan.last_reported is defined else plan.last_updated %}
                          {% set soc = states.sensor.hoymiles_hit_overview_battery_soc %}
                          {% set soc_reported = soc.last_reported
                               if soc.last_reported is defined else soc.last_updated %}
                          {% set floor = states.sensor.hoymiles_hit_ems_force_discharge_soc_readback %}
                          {% set floor_reported = floor.last_reported
                               if floor.last_reported is defined else floor.last_updated %}
                          {% set plan_age = as_timestamp(now())
                               - as_timestamp(plan_reported, 0) %}
                          {% set soc_age = as_timestamp(now())
                               - as_timestamp(soc_reported, 0) %}
                          {% set floor_age = as_timestamp(now())
                               - as_timestamp(floor_reported, 0) %}
                          {% set fresh_required = state_attr(
                               'sensor.hoymiles_hit_rce_optimized_plan',
                               'current_required_minimum_soc_percent') %}
                          {{ plan_age >= 0 and plan_age <= 120
                             and soc_age >= 0 and soc_age <= 120
                             and floor_age >= 0 and floor_age <= 120
                             and is_number(fresh_required)
                             and is_state(
                               'input_boolean.hoymiles_rce_discharge_active', 'on')
                             and is_state(
                               'input_boolean.hoymiles_rce_discharge_enabled', 'on')
                             and is_state(
                               'input_boolean.hoymiles_tariff_charge_active', 'off')
                             and is_state('input_boolean.hoymiles_rcm_active', 'off')
                             and is_state(
                               'input_boolean.hoymiles_rcm_pre_discharge_active', 'off')
                             and is_state(
                               'input_boolean.hoymiles_tariff_charge_enabled', 'off')
                             and (is_state(
                               'input_boolean.hoymiles_rcm_enabled', 'off')
                                  or is_state(
                                    'input_boolean.hoymiles_rcm_shadow_mode', 'on'))
                             and is_state(
                               'input_boolean.hoymiles_battery_balancing_active', 'off')
                             and is_state(
                               'input_boolean.hoymiles_discharge_cycle_active', 'off')
                             and is_state(
                               'input_boolean.hoymiles_charge_cycle_active', 'off')
                             and is_state(
                               'binary_sensor.hoymiles_rce_control_data_ready', 'on')
                             and is_state(
                               'binary_sensor.hoymiles_ems_export_allowed', 'on')
                             and is_state(
                               'binary_sensor.hoymiles_sale_block_active', 'off')
                             and is_state(
                               'binary_sensor.hoymiles_rce_reserve_ready', 'on')
                             and state_attr(
                               'sensor.hoymiles_hit_rce_optimized_plan',
                               'current_slot_planned') | default(false, true)
                             and state_attr(
                               'sensor.hoymiles_hit_rce_optimized_plan',
                               'current_slot_start_eligible')
                               | default(false, true)
                             and as_timestamp(state_attr(
                               'sensor.hoymiles_hit_rce_optimized_plan',
                               'current_slot_end'), 0) - as_timestamp(now()) >= 300
                             and as_timestamp(state_attr(
                               'sensor.hoymiles_hit_rce_optimized_plan',
                               'current_run_end'), 0) >= as_timestamp(state_attr(
                               'sensor.hoymiles_hit_rce_optimized_plan',
                               'current_slot_end'), 0)
                             and is_number(states(
                               'sensor.hoymiles_rce_effective_discharge_power_percent'))
                             and (states(
                               'sensor.hoymiles_rce_effective_discharge_power_percent')
                               | float(0)) > 0
                             and ((states(
                               'sensor.hoymiles_rce_effective_discharge_power_percent')
                               | float(-999)) - (rce_start_power | float(0)))
                               | abs < 0.5
                             and ((states(
                               'sensor.hoymiles_hit_ems_maximum_discharge_power_readback')
                               | float(0)) - (rce_start_power | float(0)))
                               | abs < 0.5
                             and is_number(states(
                               'sensor.hoymiles_hit_ems_force_discharge_soc_readback'))
                             and (states(
                               'sensor.hoymiles_hit_ems_force_discharge_soc_readback')
                               | float(-1)) >= (fresh_required | float(100))
                             and is_number(states(
                               'sensor.hoymiles_hit_overview_battery_soc'))
                             and (states(
                               'sensor.hoymiles_hit_overview_battery_soc')
                               | float(0)) > (fresh_required | float(100))
                             and not is_state(
                               'timer.hoymiles_discharge', 'active')
                             and not is_state('timer.hoymiles_charge', 'active')
                             and states('sensor.hoymiles_ems_hardware_mode')
                               not in ['unknown', 'unavailable', 'none', ''] }}
                    sequence:
                      - delay: "00:00:01"
                default:
                  - action: script.hoymiles_rollback_rce_transaction
                  - stop: "Safe Grid Discharge start conditions expired"
              # Ownership is already active, so the first export sample and
              # every setting written above belong to the same transaction.
              - if:
                  - condition: template
                    value_template: >-
                      {{ not is_state(
                           'sensor.hoymiles_ems_hardware_mode', 'grid_discharge') }}
                then:
                  - action: script.hoymiles_verified_set_ems_mode
                    data:
                      option: "grid_discharge"
              - delay: "00:00:05"
              - wait_template: >-
                  {{ is_state('sensor.hoymiles_ems_hardware_mode', 'grid_discharge') }}
                timeout: "00:01:00"
                continue_on_timeout: true
              - if:
                  - condition: template
                    value_template: >-
                      {{ not is_state(
                           'sensor.hoymiles_ems_hardware_mode', 'grid_discharge') }}
                then:
                  - action: script.hoymiles_rollback_rce_transaction

          # Stop RCE: the slot left the plan, minimum SOC was reached, automation
          # was disabled, or PSE data became unavailable.
          - conditions:
              - condition: state
                entity_id: input_boolean.hoymiles_rce_discharge_active
                state: "on"
              - condition: template
                value_template: >-
                  {{ is_state('input_boolean.hoymiles_rce_discharge_enabled', 'off')
                     or is_state('input_boolean.hoymiles_tariff_charge_enabled', 'on')
                     or is_state('binary_sensor.hoymiles_sale_block_active', 'on')
                     or is_state('binary_sensor.hoymiles_rce_reserve_ready', 'off')
                     or not is_number(states(
                       'sensor.hoymiles_rce_effective_discharge_power_percent'))
                     or (states(
                       'sensor.hoymiles_rce_effective_discharge_power_percent')
                       | float(0)) <= 0
                     or (state_attr(
                           'sensor.hoymiles_hit_rce_optimized_plan',
                           'current_slot_continue_eligible') is sameas false
                         and is_number(state_attr(
                           'sensor.hoymiles_hit_rce_optimized_plan',
                           'current_slot_continue_stable_seconds'))
                         and (state_attr(
                           'sensor.hoymiles_hit_rce_optimized_plan',
                           'current_slot_continue_stable_seconds')
                           | float(0)) >= 60)
                     or (is_number(state_attr(
                           'sensor.hoymiles_hit_rce_optimized_plan',
                           'current_price_pln_kwh'))
                         and is_number(state_attr(
                           'sensor.hoymiles_hit_rce_optimized_plan',
                           'automatic_price_floor_pln_kwh'))
                         and (state_attr(
                           'sensor.hoymiles_hit_rce_optimized_plan',
                           'current_price_pln_kwh') | float(0))
                           < (state_attr(
                             'sensor.hoymiles_hit_rce_optimized_plan',
                             'automatic_price_floor_pln_kwh') | float(0)))
                     or as_timestamp(now()) >= as_timestamp(states(
                          'input_datetime.hoymiles_rce_latched_slot_end'), 0)
                     or (states('sensor.hoymiles_hit_overview_battery_soc') | float(0))
                        <= (states(
                          'input_number.hoymiles_rce_latched_minimum_soc')
                          | float(100))
                     or (not is_state(
                           'sensor.hoymiles_ems_hardware_mode', 'grid_discharge')
                         and (as_timestamp(now()) - as_timestamp(
                           states.sensor.hoymiles_ems_hardware_mode.last_changed))
                           >= 60) }}
              - condition: template
                value_template: >-
                  {{ states('sensor.hoymiles_ems_hardware_mode')
                     not in ['unknown', 'unavailable', 'none'] }}
            sequence:
              - action: script.hoymiles_rollback_rce_transaction

  - id: hoymiles_automatic_ems_control_failsafe
    alias: "EMS — safe exit after data or acknowledgement loss"
    description: >-
      An active RCE or tariff cycle returns to Self-Use after two minutes
      of continuous loss of data, Master/Slave readiness, or export permission.
      When the EMS entity is unavailable, ownership remains active and the attempt is
      retried every minute after connectivity is restored.
    mode: single
    max_exceeded: silent
    triggers:
      - trigger: time_pattern
        minutes: "/1"
      - trigger: state
        entity_id: binary_sensor.hoymiles_ems_execution_ready
        to: "off"
        for: "00:02:00"
      - trigger: state
        entity_id: binary_sensor.hoymiles_rce_control_data_ready
        to: "off"
        for: "00:02:00"
      - trigger: state
        entity_id: binary_sensor.hoymiles_tariff_control_data_ready
        to: "off"
        for: "00:02:00"
      - trigger: state
        entity_id: binary_sensor.hoymiles_ems_export_allowed
        to: "off"
        for: "00:00:15"
    conditions:
      - condition: or
        conditions:
          - condition: state
            entity_id: input_boolean.hoymiles_rce_discharge_active
            state: "on"
          - condition: state
            entity_id: input_boolean.hoymiles_tariff_charge_active
            state: "on"
    actions:
      - choose:
          - conditions:
              - condition: state
                entity_id: input_boolean.hoymiles_rce_discharge_active
                state: "on"
              - condition: template
                value_template: >-
                  {{ not is_state(
                       'binary_sensor.hoymiles_ems_export_allowed', 'on')
                     or (not is_state(
                           'binary_sensor.hoymiles_rce_control_data_ready', 'on')
                         and (as_timestamp(now()) - as_timestamp(
                           states.binary_sensor.hoymiles_rce_control_data_ready
                             .last_changed)) >= 120) }}
              - condition: template
                value_template: >-
                  {{ states('sensor.hoymiles_ems_hardware_mode')
                     not in ['unknown', 'unavailable', 'none', ''] }}
            sequence:
              - action: script.hoymiles_rollback_rce_transaction

          - conditions:
              - condition: state
                entity_id: input_boolean.hoymiles_tariff_charge_active
                state: "on"
              - condition: template
                value_template: >-
                  {{ not is_state(
                       'binary_sensor.hoymiles_tariff_control_data_ready', 'on')
                     and (as_timestamp(now()) - as_timestamp(
                       states.binary_sensor.hoymiles_tariff_control_data_ready
                         .last_changed)) >= 120 }}
              - condition: template
                value_template: >-
                  {{ states('sensor.hoymiles_ems_hardware_mode')
                     not in ['unknown', 'unavailable', 'none', ''] }}
            sequence:
              - action: script.hoymiles_rollback_tariff_transaction

  - id: hoymiles_daily_grid_discharge
    alias: "EMS — daily discharge do sieci"
    description: "Uruchamia discharge codziennie o godzinie ustawionej na dashboardzie."
    mode: single
    triggers:
      - trigger: time
        at: input_datetime.hoymiles_discharge_start
    conditions:
      - condition: state
        entity_id: input_boolean.hoymiles_battery_balancing_active
        state: "off"
      - condition: state
        entity_id: input_boolean.hoymiles_discharge_schedule_enabled
        state: "on"
      - condition: state
        entity_id: binary_sensor.hoymiles_sale_block_active
        state: "off"
    actions:
      - action: script.hoymiles_start_grid_discharge

  - id: hoymiles_daily_grid_charge
    alias: "EMS — daily charge z sieci"
    description: "Uruchamia charge codziennie o godzinie ustawionej na dashboardzie."
    mode: single
    triggers:
      - trigger: time
        at: input_datetime.hoymiles_charge_start
    conditions:
      - condition: state
        entity_id: input_boolean.hoymiles_battery_balancing_active
        state: "off"
      - condition: state
        entity_id: input_boolean.hoymiles_charge_schedule_enabled
        state: "on"
    actions:
      - action: script.hoymiles_start_grid_charge

  - id: hoymiles_finish_grid_discharge
    alias: "EMS — finish discharge i return do Self-Use"
    description: >-
      Ends a manual cycle only after a confirmed Self-Use readback.
      A one-minute watchdog retries unfinished finalization after API loss
      or a Home Assistant restart without releasing ownership early.
    mode: single
    triggers:
      - trigger: timer.finished
        target:
          entity_id: timer.hoymiles_discharge
        id: timer_finished
      - trigger: time_pattern
        minutes: "/1"
        id: watchdog
    conditions:
      - condition: state
        entity_id: input_boolean.hoymiles_discharge_cycle_active
        state: "on"
      - condition: template
        value_template: >-
          {{ is_state('timer.hoymiles_discharge', 'idle') }}
      # Ownership is claimed before the start write. This grace keeps the
      # watchdog out of that short owner=on/timer=idle start phase.
      - condition: template
        value_template: >-
          {{ trigger.id == 'timer_finished'
             or (as_timestamp(now())
                 - as_timestamp(states.input_boolean.hoymiles_discharge_cycle_active.last_changed, 0))
                >= 60 }}
    actions:
      - condition: state
        entity_id: input_boolean.hoymiles_battery_balancing_active
        state: "off"
      - wait_template: >-
          {{ states('sensor.hoymiles_ems_hardware_mode') not in
             ['unknown', 'unavailable', 'none'] }}
        timeout: "00:00:10"
        continue_on_timeout: false
      # Re-check the frozen owner and idle timer immediately before the write;
      # a new cycle may have started while the select was unavailable.
      - condition: state
        entity_id: input_boolean.hoymiles_discharge_cycle_active
        state: "on"
      - condition: template
        value_template: >-
          {{ is_state('timer.hoymiles_discharge', 'idle') }}
      - if:
          - condition: template
            value_template: >-
              {{ not is_state('sensor.hoymiles_ems_hardware_mode', 'self_use') }}
        then:
          - action: script.hoymiles_verified_set_ems_mode
            data:
              option: "self_use"
      # ESPHome publishes the template select optimistically. Allow the fast
      # control poll to overwrite it before accepting the state as readback.
      - delay: "00:00:05"
      - wait_template: >-
          {{ is_state('sensor.hoymiles_ems_hardware_mode', 'self_use') }}
        timeout: "00:00:35"
        continue_on_timeout: false
      # Clear ownership only after positive readback and a final idle check.
      - condition: state
        entity_id: sensor.hoymiles_ems_hardware_mode
        state: "self_use"
      - condition: state
        entity_id: input_boolean.hoymiles_discharge_cycle_active
        state: "on"
      - condition: template
        value_template: >-
          {{ is_state('timer.hoymiles_discharge', 'idle') }}
      - action: input_boolean.turn_off
        target:
          entity_id: input_boolean.hoymiles_discharge_cycle_active

  - id: hoymiles_finish_grid_charge
    alias: "EMS — finish charge i return do Self-Use"
    description: >-
      Ends a manual cycle only after a confirmed Self-Use readback.
      A one-minute watchdog retries unfinished finalization after API loss
      or a Home Assistant restart without releasing ownership early.
    mode: single
    triggers:
      - trigger: timer.finished
        target:
          entity_id: timer.hoymiles_charge
        id: timer_finished
      - trigger: time_pattern
        minutes: "/1"
        id: watchdog
    conditions:
      - condition: state
        entity_id: input_boolean.hoymiles_charge_cycle_active
        state: "on"
      - condition: template
        value_template: >-
          {{ is_state('timer.hoymiles_charge', 'idle') }}
      # Ownership is claimed before the start write. This grace keeps the
      # watchdog out of that short owner=on/timer=idle start phase.
      - condition: template
        value_template: >-
          {{ trigger.id == 'timer_finished'
             or (as_timestamp(now())
                 - as_timestamp(states.input_boolean.hoymiles_charge_cycle_active.last_changed, 0))
                >= 60 }}
    actions:
      - condition: state
        entity_id: input_boolean.hoymiles_battery_balancing_active
        state: "off"
      - wait_template: >-
          {{ states('sensor.hoymiles_ems_hardware_mode') not in
             ['unknown', 'unavailable', 'none'] }}
        timeout: "00:00:10"
        continue_on_timeout: false
      # Re-check the frozen owner and idle timer immediately before the write;
      # a new cycle may have started while the select was unavailable.
      - condition: state
        entity_id: input_boolean.hoymiles_charge_cycle_active
        state: "on"
      - condition: template
        value_template: >-
          {{ is_state('timer.hoymiles_charge', 'idle') }}
      - if:
          - condition: template
            value_template: >-
              {{ not is_state('sensor.hoymiles_ems_hardware_mode', 'self_use') }}
        then:
          - action: script.hoymiles_verified_set_ems_mode
            data:
              option: "self_use"
      # ESPHome publishes the template select optimistically. Allow the fast
      # control poll to overwrite it before accepting the state as readback.
      - delay: "00:00:05"
      - wait_template: >-
          {{ is_state('sensor.hoymiles_ems_hardware_mode', 'self_use') }}
        timeout: "00:00:35"
        continue_on_timeout: false
      # Clear ownership only after positive readback and a final idle check.
      - condition: state
        entity_id: sensor.hoymiles_ems_hardware_mode
        state: "self_use"
      - condition: state
        entity_id: input_boolean.hoymiles_charge_cycle_active
        state: "on"
      - condition: template
        value_template: >-
          {{ is_state('timer.hoymiles_charge', 'idle') }}
      - action: input_boolean.turn_off
        target:
          entity_id: input_boolean.hoymiles_charge_cycle_active

  - id: hoymiles_restore_ems_cycle_after_ha_restart
    alias: "EMS — restore cycle after Home Assistant restart"
    description: "Restores an active cycle or returns to Self-Use if its timer expired while HA was offline."
    mode: single
    triggers:
      - trigger: homeassistant
        event: start
    actions:
      - delay: "00:00:15"
      - condition: state
        entity_id: input_boolean.hoymiles_battery_balancing_active
        state: "off"
      - choose:
          - conditions:
              - condition: state
                entity_id: input_boolean.hoymiles_discharge_cycle_active
                state: "on"
              - condition: state
                entity_id: timer.hoymiles_discharge
                state: "active"
              - condition: state
                entity_id: binary_sensor.hoymiles_sale_block_active
                state: "off"
            sequence:
              - wait_template: >-
                  {{ states('sensor.hoymiles_ems_hardware_mode') not in
                     ['unknown', 'unavailable', 'none'] }}
                timeout: "00:05:00"
                continue_on_timeout: false
              - condition: state
                entity_id: input_boolean.hoymiles_discharge_cycle_active
                state: "on"
              - condition: state
                entity_id: timer.hoymiles_discharge
                state: "active"
              - if:
                  - condition: template
                    value_template: >-
                      {{ not is_state('sensor.hoymiles_ems_hardware_mode', 'grid_discharge') }}
                then:
                  - action: script.hoymiles_verified_set_ems_mode
                    data:
                      option: "grid_discharge"
              - wait_template: >-
                  {{ is_state('sensor.hoymiles_ems_hardware_mode', 'grid_discharge') }}
                timeout: "00:02:00"
                continue_on_timeout: false
          - conditions:
              - condition: state
                entity_id: input_boolean.hoymiles_discharge_cycle_active
                state: "on"
            sequence:
              # An active discharge that cannot continue because the sale
              # block is now active is finalized through the same safe path.
              - if:
                  - condition: state
                    entity_id: timer.hoymiles_discharge
                    state: "active"
                then:
                  - action: timer.cancel
                    target:
                      entity_id: timer.hoymiles_discharge
              - wait_template: >-
                  {{ states('sensor.hoymiles_ems_hardware_mode') not in
                     ['unknown', 'unavailable', 'none'] }}
                timeout: "00:05:00"
                continue_on_timeout: false
              - condition: state
                entity_id: input_boolean.hoymiles_discharge_cycle_active
                state: "on"
              - condition: template
                value_template: >-
                  {{ is_state('timer.hoymiles_discharge', 'idle') }}
              - if:
                  - condition: template
                    value_template: >-
                      {{ not is_state('sensor.hoymiles_ems_hardware_mode', 'self_use') }}
                then:
                  - action: script.hoymiles_verified_set_ems_mode
                    data:
                      option: "self_use"
              - delay: "00:00:05"
              - wait_template: >-
                  {{ is_state('sensor.hoymiles_ems_hardware_mode', 'self_use') }}
                timeout: "00:02:00"
                continue_on_timeout: false
              - condition: state
                entity_id: sensor.hoymiles_ems_hardware_mode
                state: "self_use"
              - condition: state
                entity_id: input_boolean.hoymiles_discharge_cycle_active
                state: "on"
              - condition: template
                value_template: >-
                  {{ is_state('timer.hoymiles_discharge', 'idle') }}
              - action: input_boolean.turn_off
                target:
                  entity_id: input_boolean.hoymiles_discharge_cycle_active
      - choose:
          - conditions:
              - condition: state
                entity_id: input_boolean.hoymiles_charge_cycle_active
                state: "on"
              - condition: state
                entity_id: timer.hoymiles_charge
                state: "active"
            sequence:
              - wait_template: >-
                  {{ states('sensor.hoymiles_ems_hardware_mode') not in
                     ['unknown', 'unavailable', 'none'] }}
                timeout: "00:05:00"
                continue_on_timeout: false
              - condition: state
                entity_id: input_boolean.hoymiles_charge_cycle_active
                state: "on"
              - condition: state
                entity_id: timer.hoymiles_charge
                state: "active"
              - if:
                  - condition: template
                    value_template: >-
                      {{ not is_state('sensor.hoymiles_ems_hardware_mode', 'grid_charge') }}
                then:
                  - action: script.hoymiles_verified_set_ems_mode
                    data:
                      option: "grid_charge"
              - delay: "00:00:05"
              - wait_template: >-
                  {{ is_state('sensor.hoymiles_ems_hardware_mode', 'grid_charge') }}
                timeout: "00:02:00"
                continue_on_timeout: false
          - conditions:
              - condition: state
                entity_id: input_boolean.hoymiles_charge_cycle_active
                state: "on"
              - condition: template
                value_template: >-
                  {{ is_state('timer.hoymiles_charge', 'idle') }}
            sequence:
              - wait_template: >-
                  {{ states('sensor.hoymiles_ems_hardware_mode') not in
                     ['unknown', 'unavailable', 'none'] }}
                timeout: "00:05:00"
                continue_on_timeout: false
              - condition: state
                entity_id: input_boolean.hoymiles_charge_cycle_active
                state: "on"
              - condition: template
                value_template: >-
                  {{ is_state('timer.hoymiles_charge', 'idle') }}
              - if:
                  - condition: template
                    value_template: >-
                      {{ not is_state('sensor.hoymiles_ems_hardware_mode', 'self_use') }}
                then:
                  - action: script.hoymiles_verified_set_ems_mode
                    data:
                      option: "self_use"
              - delay: "00:00:05"
              - wait_template: >-
                  {{ is_state('sensor.hoymiles_ems_hardware_mode', 'self_use') }}
                timeout: "00:02:00"
                continue_on_timeout: false
              - condition: state
                entity_id: sensor.hoymiles_ems_hardware_mode
                state: "self_use"
              - condition: state
                entity_id: input_boolean.hoymiles_charge_cycle_active
                state: "on"
              - condition: template
                value_template: >-
                  {{ is_state('timer.hoymiles_charge', 'idle') }}
              - action: input_boolean.turn_off
                target:
                  entity_id: input_boolean.hoymiles_charge_cycle_active

  - id: hoymiles_rcm_voltage_charge_control
    alias: "RCEm 253 V+ — battery and safe-export control"
    description: >-
      Applies the voltage planner recommendation to the global limit every minute
      Battery Max Charge Power and, when separately enabled, the maximum
      export limit. Observation mode never writes to the inverter. RCEm does not
      switch GCF, Grid Charge, unbalance or protection settings.
    # A 253 V transition must interrupt normal readback waits immediately.
    # Every write path claims ownership before its first actuator change, so a
    # restarted run can safely continue emergency control or restore pending
    # user settings without losing the transaction.
    mode: restart
    max_exceeded: silent
    triggers:
      - trigger: time_pattern
        minutes: "/1"
      - trigger: state
        entity_id:
          - input_boolean.hoymiles_rcm_enabled
          - input_boolean.hoymiles_rcm_shadow_mode
          - input_boolean.hoymiles_rcm_export_control_enabled
          - input_number.hoymiles_rcm_export_cap_percent
          - input_boolean.hoymiles_rce_discharge_enabled
          - input_boolean.hoymiles_tariff_charge_enabled
          - input_boolean.hoymiles_battery_balancing_active
          - input_boolean.hoymiles_discharge_cycle_active
          - input_boolean.hoymiles_charge_cycle_active
          - sensor.hoymiles_ems_hardware_mode
          - select.hoymiles_hit_generation_control_function
      - trigger: numeric_state
        entity_id: sensor.hoymiles_rcem_maximum_grid_voltage
        # Trigger exactly at the emergency contract boundary. A lower crossing
        # can be consumed by a non-emergency run and HA would not fire again at
        # 253 V while the value remains above that lower threshold.
        above: 252.99
        id: voltage_emergency
      - trigger: homeassistant
        event: start
    actions:
      - variables:
          plan_status: >-
            {{ state_attr('sensor.hoymiles_hit_rcm_voltage_plan',
                          'status_code') | default('missing_data', true) }}
          result_current: >-
            {{ state_attr('sensor.hoymiles_hit_rcm_voltage_plan',
                          'result_current') | default(false, true) }}
          recommended_limit: >-
            {{ state_attr('sensor.hoymiles_hit_rcm_voltage_plan',
                          'recommended_charge_limit_percent') | float(0) }}
          recommended_export_limit: >-
            {{ state_attr('sensor.hoymiles_hit_rcm_voltage_plan',
                          'recommended_export_limit_percent') | float(-1) }}
          maximum_voltage: >-
            {{ state_attr('sensor.hoymiles_hit_rcm_voltage_plan',
                          'maximum_voltage_v') | float(999) }}
          live_emergency: >-
            {{ state_attr('sensor.hoymiles_hit_rcm_voltage_plan',
                          'live_emergency') | default(false, true) }}
          emergency_action_ready: >-
            {{ state_attr('sensor.hoymiles_hit_rcm_voltage_plan',
                          'emergency_action_ready') | default(false, true) }}
          prediction_ready: >-
            {{ state_attr('sensor.hoymiles_hit_rcm_voltage_plan',
                          'prediction_ready') | default(false, true) }}
          voltage_data_fresh: >-
            {{ state_attr('sensor.hoymiles_hit_rcm_voltage_plan',
                          'voltage_data_fresh') | default(false, true) }}
          emergency_voltage_data_fresh: >-
            {{ state_attr('sensor.hoymiles_hit_rcm_voltage_plan',
                          'emergency_voltage_data_fresh')
               | default(false, true) }}
          actuator_data_fresh: >-
            {{ state_attr('sensor.hoymiles_hit_rcm_voltage_plan',
                          'actuator_data_fresh') | default(false, true) }}
          charge_actuator_data_fresh: >-
            {{ state_attr('sensor.hoymiles_hit_rcm_voltage_plan',
                          'charge_actuator_data_fresh')
               | default(false, true) }}
          export_actuator_data_fresh: >-
            {{ state_attr('sensor.hoymiles_hit_rcm_voltage_plan',
                          'export_actuator_data_fresh')
               | default(false, true) }}
          export_register_data_fresh: >-
            {{ state_attr('sensor.hoymiles_hit_rcm_voltage_plan',
                          'export_register_data_fresh')
               | default(false, true) }}
          pre_discharge_actuator_data_fresh: >-
            {{ state_attr('sensor.hoymiles_hit_rcm_voltage_plan',
                          'pre_discharge_actuator_data_fresh')
               | default(false, true) }}
          ems_mode_data_fresh: >-
            {{ state_attr('sensor.hoymiles_hit_rcm_voltage_plan',
                          'ems_mode_data_fresh') | default(false, true) }}
          rcm_plan_age_seconds: >-
            {% set item = states.sensor.hoymiles_hit_rcm_voltage_plan %}
            {% set reported = item.last_reported
              if item.last_reported is defined else item.last_updated %}
            {{ as_timestamp(now()) - as_timestamp(reported, 0) }}
          forecast_data_fresh: >-
            {{ state_attr('sensor.hoymiles_hit_rcm_voltage_plan',
                          'forecast_data_fresh') | default(false, true) }}
          history_data_fresh: >-
            {{ state_attr('sensor.hoymiles_hit_rcm_voltage_plan',
                          'history_data_fresh') | default(false, true) }}
          live_power_data_fresh: >-
            {{ state_attr('sensor.hoymiles_hit_rcm_voltage_plan',
                          'live_power_data_fresh') | default(false, true) }}
          bms_charge_available: >-
            {{ state_attr('sensor.hoymiles_hit_rcm_voltage_plan',
                          'bms_charge_available') | default(false, true) }}
          bms_charge_data_fresh: >-
            {{ state_attr('sensor.hoymiles_hit_rcm_voltage_plan',
                          'bms_charge_data_fresh') | default(false, true) }}
          system_power_data_valid: >-
            {{ state_attr('sensor.hoymiles_hit_rcm_voltage_plan',
                          'system_power_data_valid')
               | default(false, true) }}
          gcf_data_fresh: >-
            {{ state_attr('sensor.hoymiles_hit_rcm_voltage_plan',
                          'gcf_data_fresh') | default(false, true) }}
          export_control_requested: >-
            {{ is_state('input_boolean.hoymiles_rcm_export_control_enabled',
                        'on') }}
          export_control_available: >-
            {{ gcf_data_fresh
               and is_number(states(
                  'sensor.hoymiles_hit_gcf_maximum_export_power_readback'))
               and (states(
                    'sensor.hoymiles_hit_gcf_maximum_export_power_readback')
                    | float(-1)) >= 0
               and (states('sensor.hoymiles_hit_gcf_enable_readback_code')
                    | int(-1)) == 1 }}
          rcm_blocked: >-
            {{ is_state('input_boolean.hoymiles_rce_discharge_enabled', 'on')
               or is_state('input_boolean.hoymiles_tariff_charge_enabled', 'on')
               or is_state('input_boolean.hoymiles_rce_discharge_active', 'on')
               or is_state('input_boolean.hoymiles_tariff_charge_active', 'on')
               or is_state('input_boolean.hoymiles_battery_balancing_active', 'on')
               or is_state('input_boolean.hoymiles_discharge_cycle_active', 'on')
               or is_state('input_boolean.hoymiles_charge_cycle_active', 'on')
               or is_state('timer.hoymiles_discharge', 'active')
               or is_state('timer.hoymiles_charge', 'active') }}
          emergency_charge_path: >-
            {{ charge_actuator_data_fresh
               and ems_mode_data_fresh
               and system_power_data_valid
               and bms_charge_available
               and bms_charge_data_fresh
               and recommended_limit >= 10
               and is_number(states(
                 'sensor.hoymiles_hit_battery_max_charge_power_readback')) }}
          emergency_export_path: >-
            {{ export_control_requested
               and export_control_available
               and export_actuator_data_fresh
               and recommended_export_limit >= 0 }}
          normal_export_path: >-
            {{ export_control_requested
               and export_control_available
               and export_actuator_data_fresh
               and recommended_export_limit >= 0 }}
      - choose:
          # Voltage >=253 V jest zdarzeniem wykonawczym, nie prognozą. Ta
          # ścieżka ma najwyższy priorytet i działa także podczas uczenia lub
          # chwilowego braku Solcast/historii. Nadal wymaga świeżego napięcia,
          # odczytu nastaw i co najmniej jednego fizycznie dostępnego aktuatora.
          - conditions:
              - condition: state
                entity_id: input_boolean.hoymiles_rcm_enabled
                state: "on"
              - condition: state
                entity_id: input_boolean.hoymiles_rcm_shadow_mode
                state: "off"
              - condition: template
                value_template: >-
                  {{ not rcm_blocked
                     and result_current
                     and rcm_plan_age_seconds >= 0
                     and rcm_plan_age_seconds <= 60
                     and live_emergency
                     and emergency_action_ready
                     and maximum_voltage >= 253.0
                     and emergency_voltage_data_fresh
                     and (emergency_charge_path or emergency_export_path) }}
            sequence:
              # Emergency always cancels an in-flight morning export before
              # attempting to absorb PV or clamp export.
              - if:
                  - condition: state
                    entity_id: input_boolean.hoymiles_rcm_pre_discharge_active
                    state: "on"
                then:
                  - if:
                      - condition: template
                        value_template: >-
                          {{ ems_mode_data_fresh }}
                    then:
                      - if:
                          - condition: state
                            entity_id: sensor.hoymiles_ems_hardware_mode
                            state: "grid_discharge"
                        then:
                          - action: script.hoymiles_verified_set_ems_mode
                            data:
                              option: "self_use"
                          - wait_template: >-
                              {{ is_state(
                                'sensor.hoymiles_ems_hardware_mode', 'self_use') }}
                            timeout: "00:01:00"
                            continue_on_timeout: true

              # Charge and export ownership are independent. In an export-only
              # emergency, never snapshot or restore an unavailable charge
              # register with a synthetic fallback value.
              - if:
                  - condition: template
                    value_template: >-
                      {{ emergency_charge_path
                         and is_state(
                           'input_boolean.hoymiles_rcm_active', 'off') }}
                then:
                  - action: input_number.set_value
                    target:
                      entity_id: input_number.hoymiles_rcm_saved_battery_charge_power
                    data:
                      value: >-
                        {{ states(
                          'sensor.hoymiles_hit_battery_max_charge_power_readback')
                           | float(100) | round(1) }}
                  - action: input_boolean.turn_on
                    target:
                      entity_id: input_boolean.hoymiles_rcm_active
              - if:
                  - condition: template
                    value_template: >-
                      {{ emergency_charge_path
                         and not is_state(
                           'sensor.hoymiles_ems_hardware_mode', 'self_use') }}
                then:
                  - action: script.hoymiles_verified_set_ems_mode
                    continue_on_error: true
                    data:
                      option: "self_use"
                  - wait_template: >-
                      {{ is_state('sensor.hoymiles_ems_hardware_mode', 'self_use') }}
                    timeout: "00:01:00"
                    continue_on_timeout: true

              # A zero/stale BMS charge limit never produces a charge write.
              - if:
                  - condition: template
                    value_template: "{{ emergency_charge_path }}"
                then:
                  - action: script.hoymiles_verified_set_battery_max_charge_power
                    continue_on_error: true
                    data:
                      value: "{{ recommended_limit | round(1) }}"
                  - wait_template: >-
                      {{ ((states(
                           'sensor.hoymiles_hit_battery_max_charge_power_readback')
                           | float(-999)) - (recommended_limit | float(0)))
                           | abs < 1.0 }}
                    timeout: "00:01:00"
                    continue_on_timeout: true

              - if:
                  - condition: template
                    value_template: "{{ emergency_export_path }}"
                then:
                  - if:
                      - condition: state
                        entity_id: input_boolean.hoymiles_rcm_export_control_active
                        state: "off"
                    then:
                      - action: input_number.set_value
                        target:
                          entity_id: input_number.hoymiles_rcm_saved_export_limit
                        data:
                          value: >-
                            {{ states(
                              'sensor.hoymiles_hit_gcf_maximum_export_power_readback')
                               | float(0) | round(1) }}
                  - action: input_boolean.turn_on
                    target:
                      entity_id: input_boolean.hoymiles_rcm_export_control_active
                  - action: script.hoymiles_verified_set_gcf_export_limit
                    continue_on_error: true
                    data:
                      value: "{{ recommended_export_limit | round(1) }}"
                  - wait_template: >-
                      {{ ((states(
                           'sensor.hoymiles_hit_gcf_maximum_export_power_readback')
                           | float(-999))
                          - (recommended_export_limit | float(0))) | abs < 1.0 }}
                    timeout: "00:01:00"
                    continue_on_timeout: true

              # Final emergency interlocks are actuator-local. A failed charge
              # acknowledgement must never roll back a successful export clamp,
              # and a failed export acknowledgement must never undo absorption.
              # Each transaction retains only its own durable owner until its
              # previous physical value is positively read back.
              # Charge emergency finalization (independent actuator path).
              - if:
                  - condition: template
                    value_template: >-
                      {% set plan = 'sensor.hoymiles_hit_rcm_voltage_plan' %}
                      {% set plan_state = states.sensor
                           .hoymiles_hit_rcm_voltage_plan %}
                      {% set plan_reported = plan_state.last_reported
                           if plan_state.last_reported is defined
                           else plan_state.last_updated %}
                      {% set plan_age = as_timestamp(now())
                           - as_timestamp(plan_reported, 0) %}
                      {% set recommendation_same =
                           ((state_attr(plan,
                              'recommended_charge_limit_percent') | float(-999))
                            - (recommended_limit | float(0))) | abs < 1.0 %}
                      {% set charge_ack =
                           ((states(
                              'sensor.hoymiles_hit_battery_max_charge_power_readback')
                              | float(-999))
                            - (recommended_limit | float(0))) | abs < 1.0 %}
                      {{ emergency_charge_path
                         and (state_attr(plan, 'result_current')
                              | default(false, true))
                         and is_state('input_boolean.hoymiles_rcm_enabled', 'on')
                         and is_state(
                           'input_boolean.hoymiles_rcm_shadow_mode', 'off')
                         and plan_age >= 0 and plan_age <= 60
                         and not rcm_blocked
                         and (state_attr(plan, 'live_emergency')
                              | default(false, true))
                         and (state_attr(plan, 'emergency_action_ready')
                              | default(false, true))
                         and (state_attr(plan, 'emergency_voltage_data_fresh')
                              | default(false, true))
                         and is_state(
                           'sensor.hoymiles_ems_hardware_mode', 'self_use')
                         and (state_attr(plan, 'charge_actuator_data_fresh')
                              | default(false, true))
                         and (state_attr(plan, 'bms_charge_data_fresh')
                              | default(false, true))
                         and (state_attr(plan, 'bms_charge_available')
                              | default(false, true))
                         and recommendation_same
                         and charge_ack }}
                then:
                  - action: input_boolean.turn_on
                    target:
                      entity_id: input_boolean.hoymiles_rcm_active
                else:
                  - if:
                      - condition: template
                        value_template: "{{ emergency_charge_path }}"
                    then:
                      - action: input_boolean.turn_on
                        target:
                          entity_id: input_boolean.hoymiles_rcm_active
                      - if:
                          - condition: template
                            value_template: >-
                              {{ state_attr(
                                   'sensor.hoymiles_hit_rcm_voltage_plan',
                                   'charge_actuator_data_fresh')
                                   | default(false, true)
                                 and is_number(states(
                                   'input_number.hoymiles_rcm_saved_battery_charge_power'))
                                 and is_number(states(
                                   'sensor.hoymiles_hit_battery_max_charge_power_readback')) }}
                        then:
                          - action: script.hoymiles_verified_set_battery_max_charge_power
                            continue_on_error: true
                            data:
                              value: >-
                                {{ states(
                                  'input_number.hoymiles_rcm_saved_battery_charge_power')
                                   | float(100) | round(1) }}
                          - wait_template: >-
                              {{ ((states(
                                   'sensor.hoymiles_hit_battery_max_charge_power_readback')
                                   | float(-999)) - (states(
                                   'input_number.hoymiles_rcm_saved_battery_charge_power')
                                   | float(100))) | abs < 1.0 }}
                            timeout: "00:01:00"
                            continue_on_timeout: true
                          - if:
                              - condition: template
                                value_template: >-
                                  {{ ((states(
                                       'sensor.hoymiles_hit_battery_max_charge_power_readback')
                                       | float(-999)) - (states(
                                       'input_number.hoymiles_rcm_saved_battery_charge_power')
                                       | float(100))) | abs < 1.0 }}
                            then:
                              - action: input_boolean.turn_off
                                target:
                                  entity_id: input_boolean.hoymiles_rcm_active

              # Export emergency finalization (independent actuator path).
              - if:
                  - condition: template
                    value_template: >-
                      {% set plan = 'sensor.hoymiles_hit_rcm_voltage_plan' %}
                      {% set plan_state = states.sensor
                           .hoymiles_hit_rcm_voltage_plan %}
                      {% set plan_reported = plan_state.last_reported
                           if plan_state.last_reported is defined
                           else plan_state.last_updated %}
                      {% set plan_age = as_timestamp(now())
                           - as_timestamp(plan_reported, 0) %}
                      {% set recommendation_same =
                           ((state_attr(plan,
                              'recommended_export_limit_percent') | float(-999))
                            - (recommended_export_limit | float(0))) | abs < 1.0 %}
                      {% set export_ack =
                           ((states(
                              'sensor.hoymiles_hit_gcf_maximum_export_power_readback')
                              | float(-999))
                            - (recommended_export_limit | float(0))) | abs < 1.0 %}
                      {{ emergency_export_path
                         and (state_attr(plan, 'result_current')
                              | default(false, true))
                         and is_state('input_boolean.hoymiles_rcm_enabled', 'on')
                         and is_state(
                           'input_boolean.hoymiles_rcm_shadow_mode', 'off')
                         and plan_age >= 0 and plan_age <= 60
                         and not rcm_blocked
                         and (state_attr(plan, 'live_emergency')
                              | default(false, true))
                         and (state_attr(plan, 'emergency_action_ready')
                              | default(false, true))
                         and (state_attr(plan, 'emergency_voltage_data_fresh')
                              | default(false, true))
                         and (state_attr(plan, 'export_actuator_data_fresh')
                              | default(false, true))
                         and recommendation_same
                         and export_ack }}
                then:
                  - action: input_boolean.turn_on
                    target:
                      entity_id: input_boolean.hoymiles_rcm_export_control_active
                else:
                  - if:
                      - condition: template
                        value_template: >-
                          {{ emergency_export_path
                             or is_state(
                               'input_boolean.hoymiles_rcm_export_control_active',
                               'on') }}
                    then:
                      - action: input_boolean.turn_on
                        target:
                          entity_id: input_boolean.hoymiles_rcm_export_control_active
                      - if:
                          - condition: template
                            value_template: >-
                              {{ state_attr(
                                   'sensor.hoymiles_hit_rcm_voltage_plan',
                                   'export_register_data_fresh')
                                   | default(false, true)
                                 and is_number(states(
                                   'input_number.hoymiles_rcm_saved_export_limit'))
                                 and is_number(states(
                                   'sensor.hoymiles_hit_gcf_maximum_export_power_readback')) }}
                        then:
                          - action: script.hoymiles_verified_set_gcf_export_limit
                            continue_on_error: true
                            data:
                              value: >-
                                {{ states(
                                     'input_number.hoymiles_rcm_saved_export_limit')
                                      | float(0) | round(1) }}
                          - wait_template: >-
                              {{ ((states(
                                   'sensor.hoymiles_hit_gcf_maximum_export_power_readback')
                                   | float(-999)) - (states(
                                   'input_number.hoymiles_rcm_saved_export_limit')
                                   | float(0))) | abs < 1.0 }}
                            timeout: "00:01:00"
                            continue_on_timeout: true
                          - if:
                              - condition: template
                                value_template: >-
                                  {{ ((states(
                                       'sensor.hoymiles_hit_gcf_maximum_export_power_readback')
                                       | float(-999)) - (states(
                                       'input_number.hoymiles_rcm_saved_export_limit')
                                       | float(0))) | abs < 1.0 }}
                            then:
                              - action: input_boolean.turn_off
                                target:
                                  entity_id: >-
                                    input_boolean.hoymiles_rcm_export_control_active

          # Zwolnienie własności parametru zawsze odtwarza ustawienie użytkownika.
          - conditions:
              - condition: state
                entity_id: input_boolean.hoymiles_rcm_active
                state: "on"
              - condition: template
                value_template: >-
                  {{ is_state('input_boolean.hoymiles_rcm_enabled', 'off')
                     or is_state('input_boolean.hoymiles_rcm_shadow_mode', 'on')
                      or rcm_blocked
                      or not is_state(
                        'binary_sensor.hoymiles_ems_execution_ready', 'on')
                      or not system_power_data_valid
                     or rcm_plan_age_seconds < 0
                     or rcm_plan_age_seconds > 60
                     or (is_state(
                           'input_boolean.hoymiles_rcm_pre_discharge_active', 'off')
                         and (not prediction_ready
                              or not voltage_data_fresh
                              or not charge_actuator_data_fresh
                              or not forecast_data_fresh
                              or not history_data_fresh
                              or not live_power_data_fresh
                              or not bms_charge_data_fresh
                              or not bms_charge_available
                              or plan_status in
                                ['missing_data', 'optimizer_error', 'learning'])) }}
            sequence:
              - if:
                  - condition: template
                    value_template: >-
                      {{ charge_actuator_data_fresh
                         and is_number(states(
                           'input_number.hoymiles_rcm_saved_battery_charge_power'))
                         and is_number(states(
                           'sensor.hoymiles_hit_battery_max_charge_power_readback')) }}
                then:
                  - action: script.hoymiles_verified_set_battery_max_charge_power
                    data:
                      value: >-
                        {{ states(
                          'input_number.hoymiles_rcm_saved_battery_charge_power')
                           | float(100) | round(1) }}
                  - wait_template: >-
                      {{ ((states(
                           'sensor.hoymiles_hit_battery_max_charge_power_readback')
                           | float(-999))
                          - (states(
                           'input_number.hoymiles_rcm_saved_battery_charge_power')
                           | float(100))) | abs < 1.0 }}
                    timeout: "00:01:00"
                    continue_on_timeout: true
              - if:
                  - condition: state
                    entity_id: input_boolean.hoymiles_rcm_export_control_active
                    state: "on"
                  - condition: template
                    value_template: >-
                      {{ export_register_data_fresh
                         and is_number(states(
                           'sensor.hoymiles_hit_gcf_maximum_export_power_readback')) }}
                then:
                  - action: script.hoymiles_verified_set_gcf_export_limit
                    data:
                      value: >-
                            {{ states(
                                 'input_number.hoymiles_rcm_saved_export_limit')
                                  | float(0) | round(1) }}
                  - wait_template: >-
                      {{ ((states(
                               'sensor.hoymiles_hit_gcf_maximum_export_power_readback')
                               | float(-999)) - (states(
                               'input_number.hoymiles_rcm_saved_export_limit')
                               | float(0))) | abs < 1.0 }}
                    timeout: "00:01:00"
                    continue_on_timeout: true
                  - if:
                      - condition: template
                        value_template: >-
                          {{ ((states(
                               'sensor.hoymiles_hit_gcf_maximum_export_power_readback')
                               | float(-999)) - (states(
                               'input_number.hoymiles_rcm_saved_export_limit')
                               | float(0))) | abs < 1.0 }}
                    then:
                      - action: input_boolean.turn_off
                        target:
                          entity_id: input_boolean.hoymiles_rcm_export_control_active
              # Ownership is retained when a register is stale or a restore
              # write is not acknowledged. A later minute retries safely.
              - if:
                  - condition: template
                    value_template: >-
                      {{ charge_actuator_data_fresh
                         and ((states(
                           'sensor.hoymiles_hit_battery_max_charge_power_readback')
                           | float(-999)) - (states(
                           'input_number.hoymiles_rcm_saved_battery_charge_power')
                           | float(100))) | abs < 1.0
                         and is_state(
                           'input_boolean.hoymiles_rcm_export_control_active',
                           'off') }}
                then:
                  - action: input_boolean.turn_off
                    target:
                      entity_id: input_boolean.hoymiles_rcm_active

          # Odtwórz limit eksportu także po restarcie lub wyłączeniu samego
          # regulatora eksportu, bez zatrzymywania części magazynowej RCEm.
          - conditions:
              - condition: state
                entity_id: input_boolean.hoymiles_rcm_export_control_active
                state: "on"
              - condition: template
                value_template: >-
                  {{ is_state('input_boolean.hoymiles_rcm_active', 'off')
                     or not export_control_requested
                     or not export_control_available }}
            sequence:
              - if:
                  - condition: template
                    value_template: >-
                      {{ export_register_data_fresh
                         and is_number(states(
                           'sensor.hoymiles_hit_gcf_maximum_export_power_readback')) }}
                then:
                  - action: script.hoymiles_verified_set_gcf_export_limit
                    data:
                      value: >-
                            {{ states(
                                 'input_number.hoymiles_rcm_saved_export_limit')
                                  | float(0) | round(1) }}
                  - wait_template: >-
                      {{ ((states(
                               'sensor.hoymiles_hit_gcf_maximum_export_power_readback')
                               | float(-999)) - (states(
                               'input_number.hoymiles_rcm_saved_export_limit')
                               | float(0))) | abs < 1.0 }}
                    timeout: "00:01:00"
                    continue_on_timeout: true
                  - if:
                      - condition: template
                        value_template: >-
                          {{ ((states(
                               'sensor.hoymiles_hit_gcf_maximum_export_power_readback')
                               | float(-999)) - (states(
                               'input_number.hoymiles_rcm_saved_export_limit')
                               | float(0))) | abs < 1.0 }}
                    then:
                      - action: input_boolean.turn_off
                        target:
                          entity_id: input_boolean.hoymiles_rcm_export_control_active

          # Normalny regulator zaczyna dopiero po pełnej gotowości predykcji i
          # wszystkich odczytów. Nastawy, readback oraz przejęcie własności są
          # jednym fail-closed przebiegiem transakcyjnym.
          - conditions:
              - condition: state
                entity_id: input_boolean.hoymiles_rcm_enabled
                state: "on"
              - condition: state
                entity_id: input_boolean.hoymiles_rcm_shadow_mode
                state: "off"
              - condition: state
                entity_id: input_boolean.hoymiles_rcm_active
                state: "off"
              - condition: template
                value_template: >-
                  {{ not rcm_blocked
                     and result_current
                     and is_state(
                       'binary_sensor.hoymiles_ems_execution_ready', 'on')
                     and rcm_plan_age_seconds >= 0
                     and rcm_plan_age_seconds <= 60
                     and prediction_ready
                     and voltage_data_fresh
                     and charge_actuator_data_fresh
                     and forecast_data_fresh
                     and history_data_fresh
                     and live_power_data_fresh
                     and bms_charge_data_fresh
                     and bms_charge_available
                     and plan_status not in
                       ['missing_data', 'optimizer_error', 'learning']
                     and recommended_limit >= 10
                     and is_number(states(
                       'sensor.hoymiles_hit_battery_max_charge_power_readback')) }}
            sequence:
              - action: input_number.set_value
                target:
                  entity_id: input_number.hoymiles_rcm_saved_battery_charge_power
                data:
                  value: >-
                    {{ states(
                      'sensor.hoymiles_hit_battery_max_charge_power_readback')
                       | float(100) | round(1) }}
              - action: input_boolean.turn_on
                target:
                  entity_id: input_boolean.hoymiles_rcm_active
              - if:
                  - condition: template
                    value_template: >-
                      {{ not is_state('sensor.hoymiles_ems_hardware_mode', 'self_use') }}
                then:
                  - action: script.hoymiles_verified_set_ems_mode
                    data:
                      option: "self_use"
                  - wait_template: >-
                      {{ is_state('sensor.hoymiles_ems_hardware_mode', 'self_use') }}
                    timeout: "00:01:00"
                    continue_on_timeout: true
              - if:
                  - condition: template
                    value_template: "{{ normal_export_path }}"
                then:
                  - action: input_number.set_value
                    target:
                      entity_id: input_number.hoymiles_rcm_saved_export_limit
                    data:
                      value: >-
                        {{ states(
                          'sensor.hoymiles_hit_gcf_maximum_export_power_readback')
                           | float(0) | round(1) }}
                  - action: input_boolean.turn_on
                    target:
                      entity_id: input_boolean.hoymiles_rcm_export_control_active
              - action: script.hoymiles_verified_set_battery_max_charge_power
                data:
                  value: "{{ recommended_limit | round(1) }}"
              - wait_template: >-
                  {{ ((states('sensor.hoymiles_hit_battery_max_charge_power_readback')
                       | float(-999)) - (recommended_limit | float(0)))
                       | abs < 1.0 }}
                timeout: "00:01:00"
                continue_on_timeout: true
              - if:
                  - condition: template
                    value_template: "{{ normal_export_path }}"
                then:
                  - action: script.hoymiles_verified_set_gcf_export_limit
                    data:
                      value: "{{ recommended_export_limit | round(1) }}"
                  - wait_template: >-
                      {{ ((states(
                           'sensor.hoymiles_hit_gcf_maximum_export_power_readback')
                           | float(-999))
                          - (recommended_export_limit | float(0))) | abs < 1.0 }}
                    timeout: "00:01:00"
                    continue_on_timeout: true
              # Final normal-control interlock: fresh inputs and identical
              # recommendation are checked again after Modbus readbacks.
              - if:
                  - condition: template
                    value_template: >-
                      {% set plan = states.sensor.hoymiles_hit_rcm_voltage_plan %}
                      {% set reported = plan.last_reported
                           if plan.last_reported is defined else plan.last_updated %}
                      {% set age = as_timestamp(now())
                           - as_timestamp(reported, 0) %}
                      {{ age >= 0 and age <= 60
                          and is_state('input_boolean.hoymiles_rcm_enabled', 'on')
                         and is_state(
                           'input_boolean.hoymiles_rcm_shadow_mode', 'off')
                          and not rcm_blocked
                          and is_state(
                            'binary_sensor.hoymiles_ems_execution_ready', 'on')
                          and state_attr(
                            'sensor.hoymiles_hit_rcm_voltage_plan',
                            'system_power_data_valid') | default(false, true)
                         and state_attr(
                           'sensor.hoymiles_hit_rcm_voltage_plan',
                           'prediction_ready') | default(false, true)
                         and state_attr(
                           'sensor.hoymiles_hit_rcm_voltage_plan',
                           'voltage_data_fresh') | default(false, true)
                         and state_attr(
                           'sensor.hoymiles_hit_rcm_voltage_plan',
                           'charge_actuator_data_fresh') | default(false, true)
                         and state_attr(
                           'sensor.hoymiles_hit_rcm_voltage_plan',
                           'forecast_data_fresh') | default(false, true)
                         and state_attr(
                           'sensor.hoymiles_hit_rcm_voltage_plan',
                           'history_data_fresh') | default(false, true)
                         and state_attr(
                           'sensor.hoymiles_hit_rcm_voltage_plan',
                           'live_power_data_fresh') | default(false, true)
                         and state_attr(
                           'sensor.hoymiles_hit_rcm_voltage_plan',
                           'bms_charge_data_fresh') | default(false, true)
                         and state_attr(
                           'sensor.hoymiles_hit_rcm_voltage_plan',
                           'bms_charge_available') | default(false, true)
                         and is_state('sensor.hoymiles_ems_hardware_mode', 'self_use')
                         and ((states(
                           'sensor.hoymiles_hit_battery_max_charge_power_readback')
                           | float(-999)) - (recommended_limit | float(0)))
                           | abs < 1.0
                         and ((state_attr(
                           'sensor.hoymiles_hit_rcm_voltage_plan',
                           'recommended_charge_limit_percent') | float(-999))
                           - (recommended_limit | float(0))) | abs < 1.0
                         and ((not normal_export_path)
                              or (((states(
                                'sensor.hoymiles_hit_gcf_maximum_export_power_readback')
                                | float(-999))
                               - (recommended_export_limit | float(0)))
                               | abs < 1.0
                              and ((state_attr(
                                'sensor.hoymiles_hit_rcm_voltage_plan',
                                'recommended_export_limit_percent')
                                | float(-999))
                               - (recommended_export_limit | float(0)))
                               | abs < 1.0)) }}
                then:
                  - action: input_boolean.turn_on
                    target:
                      entity_id: input_boolean.hoymiles_rcm_active
                  - if:
                      - condition: template
                        value_template: "{{ normal_export_path }}"
                    then:
                      - action: input_boolean.turn_on
                        target:
                          entity_id: input_boolean.hoymiles_rcm_export_control_active
                else:
                  - action: input_boolean.turn_on
                    target:
                      entity_id: input_boolean.hoymiles_rcm_active
                  - if:
                      - condition: template
                        value_template: >-
                          {{ normal_export_path
                             or is_state(
                               'input_boolean.hoymiles_rcm_export_control_active',
                               'on') }}
                    then:
                      - action: input_boolean.turn_on
                        target:
                          entity_id: >-
                            input_boolean.hoymiles_rcm_export_control_active
                  - if:
                      - condition: template
                        value_template: >-
                          {{ state_attr(
                               'sensor.hoymiles_hit_rcm_voltage_plan',
                               'charge_actuator_data_fresh')
                               | default(false, true) }}
                    then:
                      - action: script.hoymiles_verified_set_battery_max_charge_power
                        data:
                          value: >-
                            {{ states(
                              'input_number.hoymiles_rcm_saved_battery_charge_power')
                               | float(100) | round(1) }}
                      - wait_template: >-
                          {{ ((states(
                               'sensor.hoymiles_hit_battery_max_charge_power_readback')
                               | float(-999)) - (states(
                               'input_number.hoymiles_rcm_saved_battery_charge_power')
                               | float(100))) | abs < 1.0 }}
                        timeout: "00:01:00"
                        continue_on_timeout: true
                  - if:
                      - condition: state
                        entity_id: input_boolean.hoymiles_rcm_export_control_active
                        state: "on"
                      - condition: template
                        value_template: >-
                          {{ state_attr(
                               'sensor.hoymiles_hit_rcm_voltage_plan',
                               'export_actuator_data_fresh')
                               | default(false, true) }}
                    then:
                      - action: script.hoymiles_verified_set_gcf_export_limit
                        data:
                          value: >-
                            {{ states(
                                 'input_number.hoymiles_rcm_saved_export_limit')
                                  | float(0) | round(1) }}
                      - wait_template: >-
                          {{ ((states(
                               'sensor.hoymiles_hit_gcf_maximum_export_power_readback')
                               | float(-999)) - (states(
                               'input_number.hoymiles_rcm_saved_export_limit')
                               | float(0))) | abs < 1.0 }}
                        timeout: "00:01:00"
                        continue_on_timeout: true
                      - if:
                          - condition: template
                            value_template: >-
                              {{ ((states(
                               'sensor.hoymiles_hit_gcf_maximum_export_power_readback')
                               | float(-999)) - (states(
                               'input_number.hoymiles_rcm_saved_export_limit')
                               | float(0))) | abs < 1.0 }}
                        then:
                          - action: input_boolean.turn_off
                            target:
                              entity_id: >-
                                input_boolean.hoymiles_rcm_export_control_active
                  - if:
                      - condition: template
                        value_template: >-
                          {{ state_attr(
                               'sensor.hoymiles_hit_rcm_voltage_plan',
                               'charge_actuator_data_fresh')
                               | default(false, true)
                             and ((states(
                               'sensor.hoymiles_hit_battery_max_charge_power_readback')
                               | float(-999)) - (states(
                               'input_number.hoymiles_rcm_saved_battery_charge_power')
                               | float(100))) | abs < 1.0
                             and is_state(
                               'input_boolean.hoymiles_rcm_export_control_active',
                               'off') }}
                    then:
                      - action: input_boolean.turn_off
                        target:
                          entity_id: input_boolean.hoymiles_rcm_active

          # Po przejęciu własności regulator pozostaje płynny. Każdy nowy krok
          # jest jednak potwierdzony readbackiem; utrata BMS/freshness kończy
          # cykl zamiast pozostawić niepotwierdzoną nastawę.
          - conditions:
              - condition: state
                entity_id: input_boolean.hoymiles_rcm_active
                state: "on"
              - condition: template
                value_template: >-
                  {{ not rcm_blocked
                     and result_current
                     and is_state(
                       'binary_sensor.hoymiles_ems_execution_ready', 'on')
                     and system_power_data_valid
                     and rcm_plan_age_seconds >= 0
                     and rcm_plan_age_seconds <= 60
                     and is_state(
                       'input_boolean.hoymiles_rcm_pre_discharge_active', 'off')
                     and prediction_ready
                     and voltage_data_fresh
                     and charge_actuator_data_fresh
                     and forecast_data_fresh
                     and history_data_fresh
                     and live_power_data_fresh
                     and bms_charge_data_fresh
                     and bms_charge_available
                     and plan_status not in
                       ['missing_data', 'optimizer_error', 'learning']
                     and recommended_limit >= 10
                     and is_number(states(
                       'sensor.hoymiles_hit_battery_max_charge_power_readback')) }}
              - condition: state
                entity_id: sensor.hoymiles_ems_hardware_mode
                state: "self_use"
            sequence:
              - if:
                  - condition: template
                    value_template: >-
                      {{ export_control_requested
                         and export_control_available
                         and is_state(
                           'input_boolean.hoymiles_rcm_export_control_active',
                           'off') }}
                then:
                  - action: input_number.set_value
                    target:
                      entity_id: input_number.hoymiles_rcm_saved_export_limit
                    data:
                      value: >-
                        {{ states(
                          'sensor.hoymiles_hit_gcf_maximum_export_power_readback')
                           | float(0) | round(1) }}

              - if:
                  - condition: template
                    value_template: >-
                      {{ (recommended_limit
                           - (states(
                             'sensor.hoymiles_hit_battery_max_charge_power_readback')
                              | float(0))) | abs >= 1.0 }}
                then:
                  - action: script.hoymiles_verified_set_battery_max_charge_power
                    data:
                      value: "{{ recommended_limit | round(1) }}"
                  - wait_template: >-
                      {{ ((states(
                           'sensor.hoymiles_hit_battery_max_charge_power_readback')
                           | float(-999)) - (recommended_limit | float(0)))
                           | abs < 1.0 }}
                    timeout: "00:01:00"
                    continue_on_timeout: true

              - if:
                  - condition: template
                    value_template: >-
                      {{ normal_export_path
                         and is_number(states(
                           'sensor.hoymiles_hit_gcf_maximum_export_power_readback'))
                         and (recommended_export_limit
                              - (states(
                                 'sensor.hoymiles_hit_gcf_maximum_export_power_readback')
                                 | float(0))) | abs >= 1.0 }}
                then:
                  - action: input_boolean.turn_on
                    target:
                      entity_id: input_boolean.hoymiles_rcm_export_control_active
                  - action: script.hoymiles_verified_set_gcf_export_limit
                    data:
                      value: "{{ recommended_export_limit | round(1) }}"
                  - wait_template: >-
                      {{ ((states(
                           'sensor.hoymiles_hit_gcf_maximum_export_power_readback')
                           | float(-999))
                          - (recommended_export_limit | float(0))) | abs < 1.0 }}
                    timeout: "00:01:00"
                    continue_on_timeout: true
              - if:
                  - condition: template
                    value_template: >-
                      {{ state_attr('sensor.hoymiles_hit_rcm_voltage_plan',
                                    'prediction_ready')
                           | default(false, true)
                         and state_attr(
                           'sensor.hoymiles_hit_rcm_voltage_plan',
                           'voltage_data_fresh') | default(false, true)
                         and state_attr(
                           'sensor.hoymiles_hit_rcm_voltage_plan',
                           'charge_actuator_data_fresh') | default(false, true)
                         and state_attr(
                           'sensor.hoymiles_hit_rcm_voltage_plan',
                           'bms_charge_data_fresh') | default(false, true)
                         and state_attr(
                           'sensor.hoymiles_hit_rcm_voltage_plan',
                           'bms_charge_available') | default(false, true)
                         and ((states(
                           'sensor.hoymiles_hit_battery_max_charge_power_readback')
                           | float(-999)) - (recommended_limit | float(0)))
                           | abs < 1.0
                         and ((not normal_export_path)
                              or (((states(
                                'sensor.hoymiles_hit_gcf_maximum_export_power_readback')
                                | float(-999))
                               - (recommended_export_limit | float(0)))
                               | abs < 1.0)) }}
                then:
                  - if:
                      - condition: template
                        value_template: >-
                          {{ normal_export_path
                             and is_state(
                               'input_boolean.hoymiles_rcm_export_control_active',
                               'off') }}
                    then:
                      - action: input_boolean.turn_on
                        target:
                          entity_id: input_boolean.hoymiles_rcm_export_control_active
                else:
                  - if:
                      - condition: template
                        value_template: >-
                          {{ normal_export_path
                             or is_state(
                               'input_boolean.hoymiles_rcm_export_control_active',
                               'on') }}
                    then:
                      - action: input_boolean.turn_on
                        target:
                          entity_id: >-
                            input_boolean.hoymiles_rcm_export_control_active
                  - if:
                      - condition: template
                        value_template: >-
                          {{ state_attr(
                               'sensor.hoymiles_hit_rcm_voltage_plan',
                               'charge_actuator_data_fresh')
                               | default(false, true) }}
                    then:
                      - action: script.hoymiles_verified_set_battery_max_charge_power
                        data:
                          value: >-
                            {{ states(
                              'input_number.hoymiles_rcm_saved_battery_charge_power')
                               | float(100) | round(1) }}
                      - wait_template: >-
                          {{ ((states(
                               'sensor.hoymiles_hit_battery_max_charge_power_readback')
                               | float(-999)) - (states(
                               'input_number.hoymiles_rcm_saved_battery_charge_power')
                               | float(100))) | abs < 1.0 }}
                        timeout: "00:01:00"
                        continue_on_timeout: true
                  - if:
                      - condition: state
                        entity_id: input_boolean.hoymiles_rcm_export_control_active
                        state: "on"
                      - condition: template
                        value_template: >-
                          {{ state_attr(
                               'sensor.hoymiles_hit_rcm_voltage_plan',
                               'export_actuator_data_fresh')
                               | default(false, true) }}
                    then:
                      - action: script.hoymiles_verified_set_gcf_export_limit
                        data:
                          value: >-
                            {{ states(
                                 'input_number.hoymiles_rcm_saved_export_limit')
                                  | float(0) | round(1) }}
                      - wait_template: >-
                          {{ ((states(
                               'sensor.hoymiles_hit_gcf_maximum_export_power_readback')
                               | float(-999)) - (states(
                               'input_number.hoymiles_rcm_saved_export_limit')
                               | float(0))) | abs < 1.0 }}
                        timeout: "00:01:00"
                        continue_on_timeout: true
                      - if:
                          - condition: template
                            value_template: >-
                              {{ ((states(
                               'sensor.hoymiles_hit_gcf_maximum_export_power_readback')
                               | float(-999)) - (states(
                               'input_number.hoymiles_rcm_saved_export_limit')
                               | float(0))) | abs < 1.0 }}
                        then:
                          - action: input_boolean.turn_off
                            target:
                              entity_id: >-
                                input_boolean.hoymiles_rcm_export_control_active
                  - if:
                      - condition: template
                        value_template: >-
                          {{ state_attr(
                               'sensor.hoymiles_hit_rcm_voltage_plan',
                               'charge_actuator_data_fresh')
                               | default(false, true)
                             and ((states(
                               'sensor.hoymiles_hit_battery_max_charge_power_readback')
                               | float(-999)) - (states(
                               'input_number.hoymiles_rcm_saved_battery_charge_power')
                               | float(100))) | abs < 1.0
                             and is_state(
                               'input_boolean.hoymiles_rcm_export_control_active',
                               'off') }}
                    then:
                      - action: input_boolean.turn_off
                        target:
                          entity_id: input_boolean.hoymiles_rcm_active

  - id: hoymiles_rcm_pre_discharge_control
    alias: "RCEm 253 V+ — morning battery-headroom preparation"
    description: >-
      Before today's high-voltage window, it discharges to the grid only
      the energy that the home will not consume beforehand and that is required as
      headroom for the forecast PV surplus. Power is selected from the energy amount
      and available time. It never goes below protected SOC and respects
      the export lockout, BMS limit and existing export cap. It changes neither
      GCF nor Maximum Export Power Limit.
    mode: single
    max_exceeded: silent
    triggers:
      - trigger: time_pattern
        minutes: "/1"
      - trigger: state
        entity_id:
          - input_boolean.hoymiles_rcm_enabled
          - input_boolean.hoymiles_rcm_shadow_mode
          - input_boolean.hoymiles_rcm_pre_discharge_enabled
          - input_boolean.hoymiles_rcm_active
          - input_boolean.hoymiles_rce_discharge_enabled
          - input_boolean.hoymiles_tariff_charge_enabled
          - input_boolean.hoymiles_battery_balancing_active
          - input_boolean.hoymiles_discharge_cycle_active
          - input_boolean.hoymiles_charge_cycle_active
          - binary_sensor.hoymiles_sale_block_active
          - sensor.hoymiles_ems_hardware_mode
          - sensor.hoymiles_hit_overview_battery_soc
          - sensor.hoymiles_hit_rcm_voltage_plan
          - number.hoymiles_hit_maximum_export_power_limit
      - trigger: homeassistant
        event: start
    actions:
      - variables:
          plan_status: >-
            {{ state_attr('sensor.hoymiles_hit_rcm_voltage_plan',
                          'status_code') | default('missing_data', true) }}
          result_current: >-
            {{ state_attr('sensor.hoymiles_hit_rcm_voltage_plan',
                          'result_current') | default(false, true) }}
          pre_discharge_ready: >-
            {{ state_attr('sensor.hoymiles_hit_rcm_voltage_plan',
                          'pre_discharge_ready') | default(false, true) }}
          pre_discharge_start_eligible: >-
            {{ state_attr('sensor.hoymiles_hit_rcm_voltage_plan',
                          'pre_discharge_start_eligible')
               | default(false, true) }}
          pre_discharge_continue_eligible: >-
            {{ state_attr('sensor.hoymiles_hit_rcm_voltage_plan',
                          'pre_discharge_continue_eligible')
               | default(false, true) }}
          pre_discharge_transaction_ready: >-
            {{ state_attr('sensor.hoymiles_hit_rcm_voltage_plan',
                          'pre_discharge_transaction_ready')
               | default(false, true) }}
          pre_discharge_deadline: >-
            {{ state_attr('sensor.hoymiles_hit_rcm_voltage_plan',
                          'pre_discharge_deadline') }}
          target_soc: >-
            {{ state_attr('sensor.hoymiles_hit_rcm_voltage_plan',
                          'pre_discharge_target_soc_percent') | float(100) }}
          power_percent: >-
            {{ state_attr('sensor.hoymiles_hit_rcm_voltage_plan',
                          'pre_discharge_power_percent') | float(0) }}
          maximum_voltage: >-
            {{ state_attr('sensor.hoymiles_hit_rcm_voltage_plan',
                          'maximum_voltage_v') | float(999) }}
          rolling_voltage: >-
            {{ state_attr('sensor.hoymiles_hit_rcm_voltage_plan',
                          'rolling_10m_voltage_v') | float(999) }}
          prediction_ready: >-
            {{ state_attr('sensor.hoymiles_hit_rcm_voltage_plan',
                          'prediction_ready') | default(false, true) }}
          voltage_data_fresh: >-
            {{ state_attr('sensor.hoymiles_hit_rcm_voltage_plan',
                          'voltage_data_fresh') | default(false, true) }}
          pre_discharge_actuator_data_fresh: >-
            {{ state_attr('sensor.hoymiles_hit_rcm_voltage_plan',
                          'pre_discharge_actuator_data_fresh')
               | default(false, true) }}
          discharge_registers_data_fresh: >-
            {{ state_attr('sensor.hoymiles_hit_rcm_voltage_plan',
                          'discharge_registers_data_fresh')
               | default(false, true) }}
          ems_mode_data_fresh: >-
            {{ state_attr('sensor.hoymiles_hit_rcm_voltage_plan',
                          'ems_mode_data_fresh') | default(false, true) }}
          rcm_plan_age_seconds: >-
            {% set item = states.sensor.hoymiles_hit_rcm_voltage_plan %}
            {% set reported = item.last_reported
              if item.last_reported is defined else item.last_updated %}
            {{ as_timestamp(now()) - as_timestamp(reported, 0) }}
          forecast_data_fresh: >-
            {{ state_attr('sensor.hoymiles_hit_rcm_voltage_plan',
                          'forecast_data_fresh') | default(false, true) }}
          history_data_fresh: >-
            {{ state_attr('sensor.hoymiles_hit_rcm_voltage_plan',
                          'history_data_fresh') | default(false, true) }}
          live_power_data_fresh: >-
            {{ state_attr('sensor.hoymiles_hit_rcm_voltage_plan',
                          'live_power_data_fresh') | default(false, true) }}
          bms_discharge_available: >-
            {{ state_attr('sensor.hoymiles_hit_rcm_voltage_plan',
                          'bms_discharge_available') | default(false, true) }}
          bms_discharge_data_fresh: >-
            {{ state_attr('sensor.hoymiles_hit_rcm_voltage_plan',
                          'bms_discharge_data_fresh') | default(false, true) }}
          gcf_data_fresh: >-
            {{ state_attr('sensor.hoymiles_hit_rcm_voltage_plan',
                          'gcf_data_fresh') | default(false, true) }}
          export_available: >-
            {% set gcf = states(
              'sensor.hoymiles_hit_gcf_enable_readback_code') %}
            {% set limit = states(
              'sensor.hoymiles_hit_gcf_maximum_export_power_readback') %}
            {{ gcf_data_fresh
               and is_state('binary_sensor.hoymiles_ems_export_allowed', 'on')
               and ((gcf | int(-1)) == 0
                    or ((gcf | int(-1)) == 1
                        and is_number(limit)
                        and (limit | float(0)) > 0)) }}
          pre_discharge_blocked: >-
            {{ is_state('input_boolean.hoymiles_rce_discharge_enabled', 'on')
               or is_state('input_boolean.hoymiles_tariff_charge_enabled', 'on')
               or is_state('input_boolean.hoymiles_rce_discharge_active', 'on')
               or is_state('input_boolean.hoymiles_tariff_charge_active', 'on')
               or is_state('input_boolean.hoymiles_battery_balancing_active', 'on')
               or is_state('input_boolean.hoymiles_discharge_cycle_active', 'on')
               or is_state('input_boolean.hoymiles_charge_cycle_active', 'on')
               or is_state('timer.hoymiles_discharge', 'active')
               or is_state('timer.hoymiles_charge', 'active') }}
      - choose:
          # Każde naruszenie warunków natychmiast kończy tylko cykl należący do
          # RCEm i odtwarza dokładnie nastawy zastane przed jego rozpoczęciem.
          - conditions:
              - condition: state
                entity_id: input_boolean.hoymiles_rcm_pre_discharge_active
                state: "on"
              - condition: template
                value_template: >-
                  {{ is_state('input_boolean.hoymiles_rcm_enabled', 'off')
                     or is_state('input_boolean.hoymiles_rcm_shadow_mode', 'on')
                     or is_state(
                       'input_boolean.hoymiles_rcm_pre_discharge_enabled', 'off')
                     or is_state('input_boolean.hoymiles_rcm_active', 'off')
                     or pre_discharge_blocked
                     or is_state('binary_sensor.hoymiles_sale_block_active', 'on')
                     or rcm_plan_age_seconds < 0
                     or rcm_plan_age_seconds > 60
                     or not pre_discharge_continue_eligible
                     or not voltage_data_fresh
                     or not pre_discharge_actuator_data_fresh
                     or not bms_discharge_data_fresh
                     or not bms_discharge_available
                     or not export_available
                     or maximum_voltage >= 248.4
                     or as_timestamp(now()) >= as_timestamp(states(
                       'input_datetime.hoymiles_rcm_latched_pre_discharge_deadline'),
                       0)
                     or (states('sensor.hoymiles_hit_overview_battery_soc')
                         | float(0)) <= (states(
                           'input_number.hoymiles_rcm_latched_pre_discharge_target_soc')
                           | float(100)) + 0.5
                     or ((states(
                           'sensor.hoymiles_hit_ems_maximum_discharge_power_readback')
                           | float(-999)) - (states(
                           'input_number.hoymiles_rcm_latched_pre_discharge_power')
                           | float(0))) | abs >= 1.0
                     or ((states('sensor.hoymiles_hit_ems_force_discharge_soc_readback')
                           | float(-999)) - (states(
                           'input_number.hoymiles_rcm_latched_pre_discharge_target_soc')
                           | float(100))) | abs >= 1.0
                     or not is_state(
                       'sensor.hoymiles_ems_hardware_mode', 'grid_discharge') }}
            sequence:
              - if:
                  - condition: state
                    entity_id: sensor.hoymiles_ems_hardware_mode
                    state: "grid_discharge"
                  - condition: template
                    value_template: >-
                      {{ ems_mode_data_fresh
                         and is_state(
                           'input_boolean.hoymiles_discharge_cycle_active', 'off')
                         and is_state(
                           'input_boolean.hoymiles_rce_discharge_active', 'off') }}
                then:
                  - action: script.hoymiles_verified_set_ems_mode
                    data:
                      option: "self_use"
                  - wait_template: >-
                      {{ is_state('sensor.hoymiles_ems_hardware_mode', 'self_use') }}
                    timeout: "00:01:00"
                    continue_on_timeout: true
              - if:
                  - condition: template
                    value_template: >-
                      {{ discharge_registers_data_fresh
                         and is_number(states(
                           'sensor.hoymiles_hit_ems_maximum_discharge_power_readback')) }}
                then:
                  - action: script.hoymiles_verified_set_ems_maximum_discharge_power
                    data:
                      value: >-
                        {{ states(
                          'input_number.hoymiles_rcm_saved_max_discharge_power')
                           | float(100) | round(1) }}
                  - wait_template: >-
                      {{ ((states(
                           'sensor.hoymiles_hit_ems_maximum_discharge_power_readback')
                           | float(-999)) - (states(
                           'input_number.hoymiles_rcm_saved_max_discharge_power')
                           | float(100))) | abs < 1.0 }}
                    timeout: "00:01:00"
                    continue_on_timeout: true
              - if:
                  - condition: template
                    value_template: >-
                      {{ discharge_registers_data_fresh
                         and is_number(states(
                           'sensor.hoymiles_hit_ems_force_discharge_soc_readback')) }}
                then:
                  - action: script.hoymiles_verified_set_ems_force_discharge_soc
                    data:
                      value: >-
                        {{ states(
                          'input_number.hoymiles_rcm_saved_force_discharge_soc')
                           | float(20) | round(0) }}
                  - wait_template: >-
                      {{ ((states('sensor.hoymiles_hit_ems_force_discharge_soc_readback')
                           | float(-999)) - (states(
                           'input_number.hoymiles_rcm_saved_force_discharge_soc')
                           | float(20))) | abs < 1.0 }}
                    timeout: "00:01:00"
                    continue_on_timeout: true
              # Keep ownership until mode and both Modbus values are positively
              # read back. A stale/unavailable actuator is retried next minute.
              - if:
                  - condition: template
                    value_template: >-
                      {{ discharge_registers_data_fresh
                         and is_state(
                           'sensor.hoymiles_ems_hardware_mode', 'self_use')
                         and ((states(
                           'sensor.hoymiles_hit_ems_maximum_discharge_power_readback')
                           | float(-999)) - (states(
                           'input_number.hoymiles_rcm_saved_max_discharge_power')
                           | float(100))) | abs < 1.0
                         and ((states(
                           'sensor.hoymiles_hit_ems_force_discharge_soc_readback')
                           | float(-999)) - (states(
                           'input_number.hoymiles_rcm_saved_force_discharge_soc')
                           | float(20))) | abs < 1.0 }}
                then:
                  - action: input_boolean.turn_off
                    target:
                      entity_id: >-
                        input_boolean.hoymiles_rcm_pre_discharge_active

          # Rozpoczęcie jest dozwolone wyłącznie dla dzisiejszego okna ryzyka,
          # przy bezpiecznym napięciu, aktywnym eksporcie i poza blokadą sprzedaży.
          - conditions:
              - condition: state
                entity_id: input_boolean.hoymiles_rcm_enabled
                state: "on"
              - condition: state
                entity_id: input_boolean.hoymiles_rcm_shadow_mode
                state: "off"
              - condition: state
                entity_id: input_boolean.hoymiles_rcm_pre_discharge_enabled
                state: "on"
              - condition: state
                entity_id: input_boolean.hoymiles_rcm_active
                state: "on"
              - condition: state
                entity_id: input_boolean.hoymiles_rcm_pre_discharge_active
                state: "off"
              - condition: state
                entity_id: binary_sensor.hoymiles_sale_block_active
                state: "off"
              - condition: state
                entity_id: sun.sun
                state: "above_horizon"
              - condition: state
                entity_id: sensor.hoymiles_ems_hardware_mode
                state: "self_use"
              - condition: template
                value_template: >-
                  {{ not pre_discharge_blocked
                     and result_current
                     and rcm_plan_age_seconds >= 0
                     and rcm_plan_age_seconds <= 60
                     and pre_discharge_start_eligible
                     and pre_discharge_transaction_ready
                     and prediction_ready
                     and voltage_data_fresh
                     and pre_discharge_actuator_data_fresh
                     and forecast_data_fresh
                     and history_data_fresh
                     and live_power_data_fresh
                     and bms_discharge_data_fresh
                     and bms_discharge_available
                     and export_available
                     and maximum_voltage < 248.4
                     and power_percent >= 1
                     and target_soc >= 0
                     and as_timestamp(pre_discharge_deadline, 0)
                         - as_timestamp(now()) >= 300
                     and is_number(states(
                       'sensor.hoymiles_hit_ems_maximum_discharge_power_readback'))
                     and is_number(states(
                       'sensor.hoymiles_hit_ems_force_discharge_soc_readback')) }}
            sequence:
              # Freeze the complete accepted run before the first Modbus
              # write. Later forecast refreshes cannot move its SOC/deadline.
              - action: input_number.set_value
                target:
                  entity_id: input_number.hoymiles_rcm_latched_pre_discharge_target_soc
                data:
                  value: "{{ target_soc | round(0, 'ceil') }}"
              - action: input_number.set_value
                target:
                  entity_id: input_number.hoymiles_rcm_latched_pre_discharge_power
                data:
                  value: "{{ power_percent | round(1) }}"
              - action: input_datetime.set_datetime
                target:
                  entity_id: input_datetime.hoymiles_rcm_latched_pre_discharge_deadline
                data:
                  timestamp: "{{ as_timestamp(pre_discharge_deadline) }}"
              - action: input_number.set_value
                target:
                  entity_id: input_number.hoymiles_rcm_saved_max_discharge_power
                data:
                  value: >-
                    {{ states(
                      'sensor.hoymiles_hit_ems_maximum_discharge_power_readback')
                       | float(100) | round(1) }}
              - action: input_number.set_value
                target:
                  entity_id: input_number.hoymiles_rcm_saved_force_discharge_soc
                data:
                  value: >-
                    {{ states(
                      'sensor.hoymiles_hit_ems_force_discharge_soc_readback')
                       | float(20) | round(0) }}
              # Ownership begins before the first Modbus write. If any later
              # interlock/readback fails, the restore is retried on every run.
              - action: input_boolean.turn_on
                target:
                  entity_id: input_boolean.hoymiles_rcm_pre_discharge_active
              - action: script.hoymiles_verified_set_ems_maximum_discharge_power
                data:
                  value: >-
                    {{ states(
                      'input_number.hoymiles_rcm_latched_pre_discharge_power')
                       | float(0) | round(1) }}
              - wait_template: >-
                  {{ ((states(
                       'sensor.hoymiles_hit_ems_maximum_discharge_power_readback')
                       | float(-999)) - (states(
                       'input_number.hoymiles_rcm_latched_pre_discharge_power')
                       | float(0))) | abs < 1.0 }}
                timeout: "00:01:00"
                continue_on_timeout: true
              - action: script.hoymiles_verified_set_ems_force_discharge_soc
                data:
                  value: >-
                    {{ states(
                      'input_number.hoymiles_rcm_latched_pre_discharge_target_soc')
                       | float(100) | round(0) }}
              - wait_template: >-
                  {{ ((states('sensor.hoymiles_hit_ems_force_discharge_soc_readback')
                       | float(-999)) - (states(
                       'input_number.hoymiles_rcm_latched_pre_discharge_target_soc')
                       | float(100))) | abs < 1.0 }}
                timeout: "00:01:00"
                continue_on_timeout: true

              # Ownership is already active here, so the sensor intentionally
              # exposes continue_eligible (not start_eligible). The frozen
              # target/deadline and live register readbacks remain authoritative.
              - if:
                  - condition: template
                    value_template: >-
                      {% set plan = states.sensor.hoymiles_hit_rcm_voltage_plan %}
                      {% set reported = plan.last_reported
                           if plan.last_reported is defined else plan.last_updated %}
                      {% set age = as_timestamp(now())
                           - as_timestamp(reported, 0) %}
                      {{ age >= 0 and age <= 60
                         and state_attr(
                           'sensor.hoymiles_hit_rcm_voltage_plan',
                           'result_current') | default(false, true)
                         and is_state('input_boolean.hoymiles_rcm_enabled', 'on')
                         and is_state(
                           'input_boolean.hoymiles_rcm_shadow_mode', 'off')
                         and is_state(
                           'input_boolean.hoymiles_rcm_pre_discharge_enabled',
                           'on')
                         and is_state('input_boolean.hoymiles_rcm_active', 'on')
                         and not pre_discharge_blocked
                         and is_state(
                           'binary_sensor.hoymiles_sale_block_active', 'off')
                         and state_attr(
                           'sensor.hoymiles_hit_rcm_voltage_plan',
                           'pre_discharge_continue_eligible')
                           | default(false, true)
                         and state_attr(
                           'sensor.hoymiles_hit_rcm_voltage_plan',
                           'voltage_data_fresh') | default(false, true)
                         and state_attr(
                           'sensor.hoymiles_hit_rcm_voltage_plan',
                           'pre_discharge_actuator_data_fresh')
                           | default(false, true)
                         and state_attr(
                           'sensor.hoymiles_hit_rcm_voltage_plan',
                           'bms_discharge_data_fresh') | default(false, true)
                         and state_attr(
                           'sensor.hoymiles_hit_rcm_voltage_plan',
                           'bms_discharge_available') | default(false, true)
                         and (state_attr(
                           'sensor.hoymiles_hit_rcm_voltage_plan',
                           'maximum_voltage_v') | float(999)) < 248.4
                         and as_timestamp(states(
                           'input_datetime.hoymiles_rcm_latched_pre_discharge_deadline'),
                           0) - as_timestamp(now()) >= 300
                         and (states('sensor.hoymiles_hit_overview_battery_soc')
                           | float(0)) > (states(
                           'input_number.hoymiles_rcm_latched_pre_discharge_target_soc')
                           | float(100)) + 0.5
                         and ((states(
                           'sensor.hoymiles_hit_ems_maximum_discharge_power_readback')
                           | float(-999)) - (states(
                           'input_number.hoymiles_rcm_latched_pre_discharge_power')
                           | float(0))) | abs < 1.0
                         and ((states('sensor.hoymiles_hit_ems_force_discharge_soc_readback')
                           | float(-999)) - (states(
                           'input_number.hoymiles_rcm_latched_pre_discharge_target_soc')
                           | float(100))) | abs < 1.0
                         and is_state('sensor.hoymiles_ems_hardware_mode', 'self_use') }}
                then:
                  - action: script.hoymiles_verified_set_ems_mode
                    data:
                      option: "grid_discharge"
                  - wait_template: >-
                      {{ is_state(
                        'sensor.hoymiles_ems_hardware_mode', 'grid_discharge') }}
                    timeout: "00:01:00"
                    continue_on_timeout: true

              # A failed final interlock or mode readback is a pending restore,
              # never a reason to forget ownership of the two discharge writes.
              - if:
                  - condition: state
                    entity_id: input_boolean.hoymiles_rcm_pre_discharge_active
                    state: "on"
                  - condition: template
                    value_template: >-
                      {% set plan = states.sensor.hoymiles_hit_rcm_voltage_plan %}
                      {% set reported = plan.last_reported
                           if plan.last_reported is defined else plan.last_updated %}
                      {% set age = as_timestamp(now())
                           - as_timestamp(reported, 0) %}
                      {% set target = states(
                           'input_number.hoymiles_rcm_latched_pre_discharge_target_soc')
                           | float(100) %}
                      {% set power = states(
                           'input_number.hoymiles_rcm_latched_pre_discharge_power')
                           | float(0) %}
                      {{ not (age >= 0 and age <= 60
                         and is_state('input_boolean.hoymiles_rcm_enabled', 'on')
                         and is_state(
                           'input_boolean.hoymiles_rcm_shadow_mode', 'off')
                         and is_state(
                           'input_boolean.hoymiles_rcm_pre_discharge_enabled',
                           'on')
                         and is_state('input_boolean.hoymiles_rcm_active', 'on')
                         and not pre_discharge_blocked
                         and is_state(
                           'binary_sensor.hoymiles_sale_block_active', 'off')
                         and state_attr(
                           'sensor.hoymiles_hit_rcm_voltage_plan',
                           'pre_discharge_continue_eligible')
                           | default(false, true)
                         and state_attr(
                           'sensor.hoymiles_hit_rcm_voltage_plan',
                           'voltage_data_fresh') | default(false, true)
                         and state_attr(
                           'sensor.hoymiles_hit_rcm_voltage_plan',
                           'pre_discharge_actuator_data_fresh')
                           | default(false, true)
                         and state_attr(
                           'sensor.hoymiles_hit_rcm_voltage_plan',
                           'bms_discharge_data_fresh') | default(false, true)
                         and state_attr(
                           'sensor.hoymiles_hit_rcm_voltage_plan',
                           'bms_discharge_available') | default(false, true)
                         and (state_attr(
                           'sensor.hoymiles_hit_rcm_voltage_plan',
                           'maximum_voltage_v') | float(999)) < 248.4
                         and as_timestamp(states(
                           'input_datetime.hoymiles_rcm_latched_pre_discharge_deadline'),
                           0) - as_timestamp(now()) >= 300
                         and (states('sensor.hoymiles_hit_overview_battery_soc')
                           | float(0)) > target + 0.5
                         and ((states(
                           'sensor.hoymiles_hit_ems_maximum_discharge_power_readback')
                           | float(-999)) - power) | abs < 1.0
                         and ((states('sensor.hoymiles_hit_ems_force_discharge_soc_readback')
                           | float(-999)) - target) | abs < 1.0
                         and is_state(
                           'sensor.hoymiles_ems_hardware_mode', 'grid_discharge')) }}
                then:
                  - if:
                      - condition: template
                        value_template: >-
                          {{ state_attr(
                               'sensor.hoymiles_hit_rcm_voltage_plan',
                               'ems_mode_data_fresh')
                               | default(false, true) }}
                    then:
                      - if:
                          - condition: template
                            value_template: >-
                              {{ not is_state(
                                'sensor.hoymiles_ems_hardware_mode', 'self_use') }}
                        then:
                          - action: script.hoymiles_verified_set_ems_mode
                            data:
                              option: "self_use"
                          - wait_template: >-
                              {{ is_state(
                                'sensor.hoymiles_ems_hardware_mode', 'self_use') }}
                            timeout: "00:01:00"
                            continue_on_timeout: true
                  - if:
                      - condition: template
                        value_template: >-
                          {{ state_attr(
                               'sensor.hoymiles_hit_rcm_voltage_plan',
                               'discharge_registers_data_fresh')
                               | default(false, true) }}
                    then:
                      - action: script.hoymiles_verified_set_ems_maximum_discharge_power
                        data:
                          value: >-
                            {{ states(
                              'input_number.hoymiles_rcm_saved_max_discharge_power')
                               | float(100) | round(1) }}
                      - wait_template: >-
                          {{ ((states(
                               'sensor.hoymiles_hit_ems_maximum_discharge_power_readback')
                               | float(-999)) - (states(
                               'input_number.hoymiles_rcm_saved_max_discharge_power')
                               | float(100))) | abs < 1.0 }}
                        timeout: "00:01:00"
                        continue_on_timeout: true
                      - action: script.hoymiles_verified_set_ems_force_discharge_soc
                        data:
                          value: >-
                            {{ states(
                              'input_number.hoymiles_rcm_saved_force_discharge_soc')
                               | float(20) | round(0) }}
                      - wait_template: >-
                          {{ ((states(
                               'sensor.hoymiles_hit_ems_force_discharge_soc_readback')
                               | float(-999)) - (states(
                               'input_number.hoymiles_rcm_saved_force_discharge_soc')
                               | float(20))) | abs < 1.0 }}
                        timeout: "00:01:00"
                        continue_on_timeout: true
                      - if:
                          - condition: template
                            value_template: >-
                              {{ is_state(
                                   'sensor.hoymiles_ems_hardware_mode', 'self_use')
                                 and ((states(
                                   'sensor.hoymiles_hit_ems_maximum_discharge_power_readback')
                                   | float(-999)) - (states(
                                   'input_number.hoymiles_rcm_saved_max_discharge_power')
                                   | float(100))) | abs < 1.0
                                 and ((states(
                                   'sensor.hoymiles_hit_ems_force_discharge_soc_readback')
                                   | float(-999)) - (states(
                                   'input_number.hoymiles_rcm_saved_force_discharge_soc')
                                   | float(20))) | abs < 1.0 }}
                        then:
                          - action: input_boolean.turn_off
                            target:
                              entity_id: >-
                                input_boolean.hoymiles_rcm_pre_discharge_active
