# Oficjalne API PSE publikuje RCE w PLN/MWh w 96 okresach po 15 minut.
# Automatyka oraz dashboard łączą każde dwa kolejne okresy w 48 bloków
# półgodzinnych i przeliczają cenę na PLN/kWh.
rest:
  - resource_template: >-
      https://api.raporty.pse.pl/api/rce-pln?%24select=rce_pln%2Cperiod%2Cbusiness_date&%24filter=business_date%20eq%20%27{{ now().strftime('%Y-%m-%d') }}%27
    method: GET
    scan_interval: 900
    timeout: 30
    headers:
      Accept: application/json
    sensor:
      - name: "Hoymiles RCE Day"
        unique_id: hoymiles_rce_day
        icon: mdi:chart-areaspline
        value_template: "{{ value_json.value | count }}"
        json_attributes:
          - value

  - resource_template: >-
      https://api.raporty.pse.pl/api/rce-pln?%24select=rce_pln%2Cperiod%2Cbusiness_date&%24filter=business_date%20eq%20%27{{ (now() + timedelta(days=1)).strftime('%Y-%m-%d') }}%27
    method: GET
    scan_interval: 900
    timeout: 30
    headers:
      Accept: application/json
    sensor:
      - name: "Hoymiles RCE Day Tomorrow"
        unique_id: hoymiles_rce_day_tomorrow
        icon: mdi:chart-areaspline
        value_template: "{{ value_json.value | count }}"
        json_attributes:
          - value

template:
  - sensor:
      # Rejestr zbiorczy LOAD 2169/30015 obejmuje również zużycie własne
      # falowników i straty przetwarzania. Suma faz 2170-2172 odpowiada
      # rzeczywistemu obciążeniu odbiorników i jest odpytywana szybkim blokiem.
      - name: "Hoymiles Actual Load Power"
        unique_id: hoymiles_actual_load_power
        icon: mdi:home-lightning-bolt-outline
        unit_of_measurement: "W"
        device_class: power
        state_class: measurement
        availability: >-
          {{ is_number(states('sensor.hoymiles_hit_load_power_l1n'))
             and is_number(states('sensor.hoymiles_hit_load_power_l2n'))
             and is_number(states('sensor.hoymiles_hit_load_power_l3n')) }}
        state: >-
          {% set l1 = [states('sensor.hoymiles_hit_load_power_l1n')
                       | float(0), 0] | max %}
          {% set l2 = [states('sensor.hoymiles_hit_load_power_l2n')
                       | float(0), 0] | max %}
          {% set l3 = [states('sensor.hoymiles_hit_load_power_l3n')
                       | float(0), 0] | max %}
          {{ (l1 + l2 + l3) | round(0) }}
        attributes:
          source_registers: "2170 + 2171 + 2172"
          excludes_inverter_self_consumption: true

      - name: "Hoymiles Actual Load Energy Today"
        unique_id: hoymiles_actual_load_energy_today
        icon: mdi:home-lightning-bolt-outline
        unit_of_measurement: "kWh"
        device_class: energy
        state_class: total_increasing
        availability: >-
          {{ is_number(states('sensor.hoymiles_actual_load_energy_daily')) }}
        state: >-
          {{ states('sensor.hoymiles_actual_load_energy_daily')
             | float(0) | round(3) }}
        attributes:
          source_entity: sensor.hoymiles_actual_load_power
          integration_method: left
          excludes_inverter_self_consumption: true

      - name: "Hoymiles EMS Push Notification Status"
        unique_id: hoymiles_ems_push_notification_status
        icon: >-
          {% set target =
            states('input_text.hoymiles_ems_push_notify_target') | trim %}
          {% if not
            is_state('input_boolean.hoymiles_ems_push_notifications_enabled', 'on') %}
            mdi:bell-off-outline
          {% elif target.startswith('notify.')
            and (expand(target) | list | count) > 0 %}
            mdi:bell-check-outline
          {% else %}
            mdi:bell-alert-outline
          {% endif %}
        state: >-
          {% set target =
            states('input_text.hoymiles_ems_push_notify_target') | trim %}
          {% if not
            is_state('input_boolean.hoymiles_ems_push_notifications_enabled', 'on') %}
            Disabled
          {% elif target.startswith('notify.')
            and (expand(target) | list | count) > 0 %}
            Ready
          {% else %}
            No valid notify entity
          {% endif %}

  # Okno ochronne trwa od 90 minut przed zachodem do 90 minut po wschodzie.
  # Próbkowanie co minutę ogranicza liczbę samples statystycznych, zachowując
  # wystarczającą dokładność prognozy zużycia nocnego.
  - triggers:
      - trigger: time_pattern
        minutes: "/1"
      - trigger: homeassistant
        event: start
      - trigger: state
        entity_id: sun.sun
    binary_sensor:
      - name: "Hoymiles Night Protection Window"
        unique_id: hoymiles_night_protection_window
        icon: mdi:weather-night
        availability: >-
          {{ as_timestamp(state_attr('sun.sun', 'next_rising'), 0) > 0
             and as_timestamp(state_attr('sun.sun', 'next_setting'), 0) > 0 }}
        state: >-
          {% set current = as_timestamp(now()) %}
          {% set rising =
            as_timestamp(state_attr('sun.sun', 'next_rising'), 0) %}
          {% set setting =
            as_timestamp(state_attr('sun.sun', 'next_setting'), 0) %}
          {% set buffer = 90 * 60 %}
          {% set previous_rising = rising - 24 * 60 * 60 %}
          {% set shortly_after_rising =
            is_state('sun.sun', 'above_horizon')
            and 0 <= current - previous_rising <= buffer %}
          {% set shortly_before_setting =
            is_state('sun.sun', 'above_horizon')
            and 0 <= setting - current <= buffer %}
          {{ is_state('sun.sun', 'below_horizon')
             or shortly_after_rising
             or shortly_before_setting }}

    sensor:
      - name: "Hoymiles Night Protection Window Duration"
        unique_id: hoymiles_night_protection_window_duration
        icon: mdi:weather-sunset-down
        unit_of_measurement: "h"
        state_class: measurement
        availability: >-
          {{ as_timestamp(state_attr('sun.sun', 'next_rising'), 0) > 0
             and as_timestamp(state_attr('sun.sun', 'next_setting'), 0) > 0 }}
        state: >-
          {% set rising =
            as_timestamp(state_attr('sun.sun', 'next_rising'), 0) %}
          {% set setting =
            as_timestamp(state_attr('sun.sun', 'next_setting'), 0) %}
          {% set night_start =
            setting if setting < rising else setting - 24 * 60 * 60 %}
          {% set duration = (rising - night_start + 3 * 60 * 60) / 3600 %}
          {{ ([[duration, 0] | max, 24] | min) | round(2) }}

      - name: "Hoymiles Night Protection Window Remaining"
        unique_id: hoymiles_night_protection_window_remaining
        icon: mdi:weather-sunset-up
        unit_of_measurement: "h"
        state_class: measurement
        availability: >-
          {{ as_timestamp(state_attr('sun.sun', 'next_rising'), 0) > 0
             and as_timestamp(state_attr('sun.sun', 'next_setting'), 0) > 0 }}
        state: >-
          {% set current = as_timestamp(now()) %}
          {% set rising =
            as_timestamp(state_attr('sun.sun', 'next_rising'), 0) %}
          {% set setting =
            as_timestamp(state_attr('sun.sun', 'next_setting'), 0) %}
          {% set buffer = 90 * 60 %}
          {% set previous_rising = rising - 24 * 60 * 60 %}
          {% set shortly_after_rising =
            is_state('sun.sun', 'above_horizon')
            and 0 <= current - previous_rising <= buffer %}
          {% set upcoming_start = setting - buffer %}
          {% set upcoming_end = rising + buffer %}
          {% if shortly_after_rising %}
            {{ (([previous_rising + buffer - current, 0] | max) / 3600)
               | round(2) }}
          {% elif is_state('sun.sun', 'below_horizon') %}
            {{ (([upcoming_end - current, 0] | max) / 3600) | round(2) }}
          {% elif current >= upcoming_start %}
            {{ (([upcoming_end - current, 0] | max) / 3600) | round(2) }}
          {% else %}
            {{ (([upcoming_end - upcoming_start, 0] | max) / 3600)
               | round(2) }}
          {% endif %}

      - name: "Hoymiles Night Protected Load Power"
        unique_id: hoymiles_night_protected_load_power
        icon: mdi:home-lightning-bolt-outline
        unit_of_measurement: "W"
        device_class: power
        state_class: measurement
        availability: >-
          {{ is_number(
               states('sensor.hoymiles_actual_load_power'))
             and as_timestamp(state_attr('sun.sun', 'next_rising'), 0) > 0
             and as_timestamp(state_attr('sun.sun', 'next_setting'), 0) > 0 }}
        state: >-
          {% set current = as_timestamp(now()) %}
          {% set rising =
            as_timestamp(state_attr('sun.sun', 'next_rising'), 0) %}
          {% set setting =
            as_timestamp(state_attr('sun.sun', 'next_setting'), 0) %}
          {% set buffer = 90 * 60 %}
          {% set previous_rising = rising - 24 * 60 * 60 %}
          {% set shortly_after_rising =
            is_state('sun.sun', 'above_horizon')
            and 0 <= current - previous_rising <= buffer %}
          {% set shortly_before_setting =
            is_state('sun.sun', 'above_horizon')
            and 0 <= setting - current <= buffer %}
          {% set in_window =
            is_state('sun.sun', 'below_horizon')
            or shortly_after_rising
            or shortly_before_setting %}
          {% set load =
            states('sensor.hoymiles_actual_load_power')
            | float(0) %}
          {{ ([load, 0] | max if in_window else 0) | round(0) }}

  - sensor:
      - name: "Hoymiles RCE Grid Export Power"
        unique_id: hoymiles_rce_grid_export_power
        icon: mdi:transmission-tower-export
        unit_of_measurement: "kW"
        device_class: power
        state_class: measurement
        availability: >-
          {{ is_number(
               states('sensor.hoymiles_hit_overview_grid_total_active_power')) }}
        state: >-
          {% set grid =
            states('sensor.hoymiles_hit_overview_grid_total_active_power')
            | float(0) %}
          {# A positive register value means power exported to the grid. #}
          {{ ([grid / 1000, 0] | max) | round(3) }}

      - name: "Hoymiles RCE BMS Safe Discharge Power"
        unique_id: hoymiles_rce_bms_safe_discharge_power
        icon: mdi:battery-lock-open-outline
        unit_of_measurement: "kW"
        device_class: power
        state_class: measurement
        availability: >-
          {{ is_number(states(
               'sensor.hoymiles_hit_maximum_discharge_current'))
             and is_number(states(
               'sensor.hoymiles_hit_battery_voltage_bms'))
             and is_number(states(
               'input_number.hoymiles_rce_export_efficiency'))
             and (states(
               'sensor.hoymiles_hit_maximum_discharge_current')
               | float(0)) > 0
             and (states(
               'sensor.hoymiles_hit_battery_voltage_bms')
               | float(0)) > 0 }}
        state: >-
          {% set current =
            states('sensor.hoymiles_hit_maximum_discharge_current')
            | float(0) %}
          {% set voltage =
            states('sensor.hoymiles_hit_battery_voltage_bms')
            | float(0) %}
          {% set efficiency =
            states('input_number.hoymiles_rce_export_efficiency')
            | float(95) / 100 %}
          {# A 5% buffer protects against changes in voltage and the BMS limit. #}
          {{ (current * voltage / 1000 * efficiency * 0.95) | round(2) }}
        attributes:
          maximum_discharge_current_a: >-
            {{ states('sensor.hoymiles_hit_maximum_discharge_current') }}
          battery_voltage_v: >-
            {{ states('sensor.hoymiles_hit_battery_voltage_bms') }}
          bms_safety_margin_percent: 5

      - name: "Hoymiles RCE Effective Discharge Power Percent"
        unique_id: hoymiles_rce_effective_discharge_power_percent
        icon: mdi:speedometer-slow
        unit_of_measurement: "%"
        state_class: measurement
        availability: >-
          {% set rated =
            states('input_select.hoymiles_rce_inverter_rated_power')
            | replace(' kW', '') | float(0) %}
          {{ rated > 0
             and is_number(states(
               'sensor.hoymiles_rce_bms_safe_discharge_power'))
             and is_number(states(
               'input_number.hoymiles_rce_requested_discharge_power')) }}
        state: >-
          {% set rated =
            states('input_select.hoymiles_rce_inverter_rated_power')
            | replace(' kW', '') | float(0) %}
          {% set raw_count =
            states(
              'sensor.hoymiles_hit_number_of_machines_master_and_slave') %}
          {% set count =
            raw_count | float(1) | round(0) | int
            if is_number(raw_count) else 1 %}
          {% set count = [[count, 1] | max, 10] | min %}
          {% set system_power = rated * count %}
          {% set requested =
            states('input_number.hoymiles_rce_requested_discharge_power')
            | float(0) %}
          {% set bms_percent =
            states('sensor.hoymiles_rce_bms_safe_discharge_power')
            | float(0) / system_power * 100
            if system_power > 0 else 0 %}
          {{ ([requested, bms_percent, 100] | min) | round(1) }}
        attributes:
          requested_percent: >-
            {{ states('input_number.hoymiles_rce_requested_discharge_power') }}
          bms_safe_power_kw: >-
            {{ states('sensor.hoymiles_rce_bms_safe_discharge_power') }}
          inverter_count: >-
            {{ states(
              'sensor.hoymiles_hit_number_of_machines_master_and_slave') }}
          rated_power_each: >-
            {{ states('input_select.hoymiles_rce_inverter_rated_power') }}

      - name: "Hoymiles RCE Revenue Rate"
        unique_id: hoymiles_rce_revenue_rate
        icon: mdi:cash-fast
        unit_of_measurement: "PLN/h"
        state_class: measurement
        availability: >-
          {{ is_number(states('sensor.hoymiles_rce_grid_export_power'))
             and is_number(states('sensor.hoymiles_rce_current_price')) }}
        state: >-
          {% set power =
            states('sensor.hoymiles_rce_grid_export_power') | float(0) %}
          {% set price =
            states('sensor.hoymiles_rce_current_price') | float(0) %}
          {{ (power * price) | round(4) }}

      - name: "Hoymiles RCE Current Price"
        unique_id: hoymiles_rce_current_price
        icon: mdi:cash-clock
        unit_of_measurement: "PLN/kWh"
        state_class: measurement
        availability: >-
          {% set rows = state_attr('sensor.hoymiles_rce_day', 'value') or [] %}
          {{ rows | count >= 2
             and rows[0]['business_date'] == now().strftime('%Y-%m-%d') }}
        state: >-
          {% set rows = state_attr('sensor.hoymiles_rce_day', 'value') or [] %}
          {% set slot = now().hour * 2 + (1 if now().minute >= 30 else 0) %}
          {% set index = slot * 2 %}
          {% if rows | count > index + 1 %}
            {{ (((rows[index]['rce_pln'] | float(0)) +
                  (rows[index + 1]['rce_pln'] | float(0))) / 2000) | round(4) }}
          {% else %}
            {{ none }}
          {% endif %}

      - name: "Hoymiles Solcast Forecast Today"
        unique_id: hoymiles_solcast_forecast_today
        icon: mdi:weather-sunny
        unit_of_measurement: "kWh"
        device_class: energy
        availability: >-
          {% set refresh = now().minute %}
          {% set configured =
            states('input_text.hoymiles_solcast_forecast_today_entity')
            | trim %}
          {% set candidates = [
            configured,
            'sensor.solcast_pv_forecast_forecast_today',
            'sensor.solcast_pv_forecast_prognoza_na_dzisiaj',
            'sensor.solcast_forecast_today'
          ] %}
          {% set ns = namespace(value=none) %}
          {% for entity in candidates if entity and ns.value is none %}
            {% if is_number(states(entity)) %}
              {% set ns.value = states(entity) | float(0) %}
            {% endif %}
          {% endfor %}
          {{ ns.value is not none }}
        state: >-
          {% set refresh = now().minute %}
          {% set configured =
            states('input_text.hoymiles_solcast_forecast_today_entity')
            | trim %}
          {% set candidates = [
            configured,
            'sensor.solcast_pv_forecast_forecast_today',
            'sensor.solcast_pv_forecast_prognoza_na_dzisiaj',
            'sensor.solcast_forecast_today'
          ] %}
          {% set ns = namespace(value=none) %}
          {% for entity in candidates if entity and ns.value is none %}
            {% if is_number(states(entity)) %}
              {% set ns.value = states(entity) | float(0) %}
            {% endif %}
          {% endfor %}
          {{ ns.value | round(2) if ns.value is not none else none }}
        attributes:
          source_entity: >-
            {% set configured =
              states('input_text.hoymiles_solcast_forecast_today_entity')
              | trim %}
            {% set candidates = [
              configured,
              'sensor.solcast_pv_forecast_forecast_today',
              'sensor.solcast_pv_forecast_prognoza_na_dzisiaj',
              'sensor.solcast_forecast_today'
            ] %}
            {% set ns = namespace(entity='') %}
            {% for entity in candidates if entity and not ns.entity %}
              {% if is_number(states(entity)) %}
                {% set ns.entity = entity %}
              {% endif %}
            {% endfor %}
            {{ ns.entity or 'none' }}

      - name: "Hoymiles Solcast Forecast Remaining Today"
        unique_id: hoymiles_solcast_forecast_remaining_today
        icon: mdi:weather-sunset-up
        unit_of_measurement: "kWh"
        device_class: energy
        availability: >-
          {% set candidates = [
            'sensor.solcast_pv_forecast_forecast_remaining_today',
            'sensor.solcast_pv_forecast_pozostala_prognoza_na_dzis',
            'sensor.solcast_forecast_remaining_today'
          ] %}
          {% set ns = namespace(value=none) %}
          {% for entity in candidates if ns.value is none %}
            {% if is_number(states(entity)) %}
              {% set ns.value = states(entity) | float(0) %}
            {% endif %}
          {% endfor %}
          {{ ns.value is not none
             or (is_number(states('sensor.hoymiles_solcast_forecast_today'))
                 and is_number(
                   states('sensor.hoymiles_hit_pv_total_energy_today'))) }}
        state: >-
          {% set candidates = [
            'sensor.solcast_pv_forecast_forecast_remaining_today',
            'sensor.solcast_pv_forecast_pozostala_prognoza_na_dzis',
            'sensor.solcast_forecast_remaining_today'
          ] %}
          {% set ns = namespace(value=none) %}
          {% for entity in candidates if ns.value is none %}
            {% if is_number(states(entity)) %}
              {% set ns.value = states(entity) | float(0) %}
            {% endif %}
          {% endfor %}
          {% if ns.value is not none %}
            {{ ns.value | round(2) }}
          {% else %}
            {% set forecast =
              states('sensor.hoymiles_solcast_forecast_today') | float(0) %}
            {% set actual =
              states('sensor.hoymiles_hit_pv_total_energy_today') | float(0) %}
            {{ ([forecast - actual, 0] | max) | round(2) }}
          {% endif %}

      - name: "Hoymiles Solcast Forecast Tomorrow"
        unique_id: hoymiles_solcast_forecast_tomorrow
        icon: mdi:weather-partly-cloudy
        unit_of_measurement: "kWh"
        device_class: energy
        availability: >-
          {% set refresh = now().minute %}
          {% set configured =
            states('input_text.hoymiles_solcast_forecast_tomorrow_entity')
            | trim %}
          {% set candidates = [
            configured,
            'sensor.solcast_pv_forecast_forecast_tomorrow',
            'sensor.solcast_pv_forecast_prognoza_na_jutro',
            'sensor.solcast_forecast_tomorrow'
          ] %}
          {% set ns = namespace(value=none) %}
          {% for entity in candidates if entity and ns.value is none %}
            {% if is_number(states(entity)) %}
              {% set ns.value = states(entity) | float(0) %}
            {% endif %}
          {% endfor %}
          {{ ns.value is not none }}
        state: >-
          {% set refresh = now().minute %}
          {% set configured =
            states('input_text.hoymiles_solcast_forecast_tomorrow_entity')
            | trim %}
          {% set candidates = [
            configured,
            'sensor.solcast_pv_forecast_forecast_tomorrow',
            'sensor.solcast_pv_forecast_prognoza_na_jutro',
            'sensor.solcast_forecast_tomorrow'
          ] %}
          {% set ns = namespace(value=none) %}
          {% for entity in candidates if entity and ns.value is none %}
            {% if is_number(states(entity)) %}
              {% set ns.value = states(entity) | float(0) %}
            {% endif %}
          {% endfor %}
          {{ ns.value | round(2) if ns.value is not none else none }}
        attributes:
          source_entity: >-
            {% set configured =
              states('input_text.hoymiles_solcast_forecast_tomorrow_entity')
              | trim %}
            {% set candidates = [
              configured,
              'sensor.solcast_pv_forecast_forecast_tomorrow',
              'sensor.solcast_pv_forecast_prognoza_na_jutro',
              'sensor.solcast_forecast_tomorrow'
            ] %}
            {% set ns = namespace(entity='') %}
            {% for entity in candidates if entity and not ns.entity %}
              {% if is_number(states(entity)) %}
                {% set ns.entity = entity %}
              {% endif %}
            {% endfor %}
            {{ ns.entity or 'none' }}

      - name: "Hoymiles Load Average 4 Days"
        unique_id: hoymiles_load_average_4_days
        icon: mdi:home-lightning-bolt-outline
        unit_of_measurement: "kWh"
        device_class: energy
        availability: >-
          {% set recorder_average =
            state_attr('sensor.hoymiles_hit_rce_optimized_plan',
                       'recorder_load_average_4d_kwh') %}
          {% set recorder_days =
            state_attr('sensor.hoymiles_hit_rce_optimized_plan',
                       'recorder_load_history_days') | int(0) %}
          {% set coverage =
            state_attr('sensor.hoymiles_load_energy_last_4_days',
                       'age_coverage_ratio') | float(0) %}
          {{ (is_number(recorder_average) and recorder_days >= 1)
             or (is_number(states('sensor.hoymiles_load_energy_last_4_days'))
                 and coverage >= 0.24) }}
        state: >-
          {% set recorder_average =
            state_attr('sensor.hoymiles_hit_rce_optimized_plan',
                       'recorder_load_average_4d_kwh') %}
          {% if is_number(recorder_average) %}
            {{ recorder_average | float(0) | round(2) }}
          {% else %}
            {% set total =
              states('sensor.hoymiles_load_energy_last_4_days') | float(0) %}
            {% set coverage =
              state_attr('sensor.hoymiles_load_energy_last_4_days',
                         'age_coverage_ratio') | float(0) %}
            {% set history_days = [[coverage * 4, 1] | max, 4] | min %}
            {{ (total / history_days) | round(2) }}
          {% endif %}
        attributes:
          history_days: >-
