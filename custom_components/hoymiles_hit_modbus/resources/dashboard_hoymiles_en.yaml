        show_header_toggle: false
        state_color: true
        entities:
          - entity: input_boolean.hoymiles_charge_schedule_enabled
            name: Enable daily schedule
          - entity: input_datetime.hoymiles_charge_start
            name: Start time
          - entity: input_number.hoymiles_charge_duration
            name: Duration
          - entity: number.hoymiles_hit_force_charge_soc
            name: Target SOC — grid charge
          - entity: number.hoymiles_hit_maximum_charge_power
            name: Max. grid charge power
          - entity: timer.hoymiles_charge
            name: Current cycle remaining time
          - entity: script.hoymiles_start_grid_charge
            name: Start grid charge now
      - type: custom:hoymiles-zebra-entities-card
        title: EMS control and stop
        show_header_toggle: false
        state_color: true
        view_layout:
          position: sidebar
        entities:
          - entity: select.hoymiles_hit_ems_mode
            name: Operating mode
          - entity: number.hoymiles_hit_self_use_soc
            name: SOC reserve — Self-Use
          - entity: script.hoymiles_stop_scheduled_cycle
            name: Stop and return to Self-Use
  - title: Profits
    path: zyski
    icon: mdi:cash-multiple
    type: sidebar
    badges: []
    cards:
      - type: markdown
        view_layout:
          position: sidebar
        content: >-
          # ⚡ Your installation is working for you

          {% set revenue = states('sensor.hoymiles_rce_revenue_daily')
             | float(0) %}
          {% set energy = states(
             'sensor.hoymiles_rce_grid_export_energy_daily') | float(0) %}
          {% set average = revenue / energy if energy > 0 else 0 %}

          **Today the grid received {{ energy | round(2) }} kWh**, and the calculated
          revenue at RCE prices is **{{ revenue | round(2) }} PLN**.
          The average achieved price is **{{ average | round(3) }} PLN/kWh**.

          Every exported kilowatt-hour is settled at the price applicable
          at the time of export. Period meters retain data after Home Assistant
          restarts.
      - type: glance
        title: 💰 Energy export revenue
        columns: 2
        show_name: true
        show_state: true
        state_color: true
        view_layout:
          position: sidebar
        entities:
          - entity: sensor.hoymiles_rce_revenue_daily
            name: Today
            icon: mdi:calendar-today
          - entity: sensor.hoymiles_rce_revenue_weekly
            name: This week
            icon: mdi:calendar-week
          - entity: sensor.hoymiles_rce_revenue_monthly
            name: This month
            icon: mdi:calendar-month
          - entity: sensor.hoymiles_rce_revenue_yearly
            name: This year
            icon: mdi:calendar-star
      - type: glance
        title: ⚡ Energy exported to the grid
        columns: 2
        show_name: true
        show_state: true
        state_color: true
        view_layout:
          position: sidebar
        entities:
          - entity: sensor.hoymiles_rce_grid_export_energy_daily
            name: Today
            icon: mdi:transmission-tower-export
          - entity: sensor.hoymiles_rce_grid_export_energy_weekly
            name: This week
            icon: mdi:calendar-week
          - entity: sensor.hoymiles_rce_grid_export_energy_monthly
            name: This month
            icon: mdi:calendar-month
          - entity: sensor.hoymiles_rce_grid_export_energy_yearly
            name: This year
            icon: mdi:calendar-star
      - type: markdown
        title: Average export price
        view_layout:
          position: sidebar
        content: |-
          {% set periods = [
            ('Today', 'daily'),
            ('Week', 'weekly'),
            ('Month', 'monthly'),
            ('Year', 'yearly')
          ] %}
          {% for label, period in periods %}
          {% set revenue = states(
            'sensor.hoymiles_rce_revenue_' ~ period) | float(0) %}
          {% set energy = states(
            'sensor.hoymiles_rce_grid_export_energy_' ~ period) | float(0) %}
          {% set average = revenue / energy if energy > 0 else 0 %}
          - **{{ label }}:** **{{ average | round(3) }} PLN/kWh** ·
            {{ revenue | round(2) }} PLN · {{ energy | round(2) }} kWh
          {% endfor %}
      - type: custom:hoymiles-zebra-entities-card
        title: Today's result — details
        show_header_toggle: false
        state_color: true
        entities:
          - entity: sensor.hoymiles_rce_current_price
            name: Current RCE price
          - entity: sensor.hoymiles_rce_grid_export_power
            name: Current grid export power
          - entity: sensor.hoymiles_rce_realized_controlled_export_today
            name: RCE-controlled export
          - entity: sensor.hoymiles_rce_realized_natural_export_today
            name: Natural PV surplus
          - entity: sensor.hoymiles_rce_unclassified_export_today
            name: Unclassified export
          - entity: sensor.hoymiles_rce_realized_controlled_revenue_today
            name: RCE-controlled revenue
          - entity: sensor.hoymiles_rce_realized_natural_revenue_today
            name: Natural surplus revenue
          - entity: sensor.hoymiles_rce_optimization_gain
            name: Forecast optimization benefit
          - entity: sensor.hoymiles_rce_status
            name: RCE automation status
      - type: custom:hoymiles-zebra-entities-card
        title: Result since meter activation
        show_header_toggle: false
        state_color: true
        view_layout:
          position: sidebar
        entities:
          - entity: sensor.hoymiles_rce_revenue_total
            name: Total revenue
            icon: mdi:cash-multiple
          - entity: sensor.hoymiles_rce_grid_export_energy_total
            name: Total export
            icon: mdi:transmission-tower-export
          - entity: sensor.hoymiles_hit_grid_energy_sell_total
            name: Inverter meter
            icon: mdi:counter
      - type: statistics-graph
        title: Revenue — last 30 days
        chart_type: bar
        period: day
        days_to_show: 30
        stat_types:
          - change
        entities:
          - entity: sensor.hoymiles_rce_revenue_total
            name: Revenue
