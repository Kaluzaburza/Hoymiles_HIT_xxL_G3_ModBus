# Dashboard Home Assistant dla Hoymiles Energy Storage
#
# Wklej CAŁĄ zawartość do edytora surowej konfiguracji nowego dashboardu.
# Animowany przepływ mocy używa zainstalowanej karty HACS
# custom:sunsynk-power-flow-card. Pozostałe karty są standardowe.
# Dashboard używa stabilnych identyfikatorów proxy tworzonych przez integrację
# Hoymiles HIT xxL G3 Modbus. Nie zależą one od nazwy urządzenia ESPHome.
# Karty harmonogramów EMS wymagają pakietu home_assistant/hoymiles_ems_scheduler.yaml.
# Obejmuje wszystkie aktywne encje; pominięta jest tylko jedna encja oznaczona
# w ESPHome jako disabled_by_default (opisana w zakładce Sterowanie).

title: Hoymiles Energy Storage
views:
  - title: Start
    path: start
    icon: mdi:view-dashboard
    type: sidebar
    badges: []
    cards:
      - type: markdown
        content: >-
          ## Hoymiles — panel operacyjny

          The most important values for everyday inverter operation. Detailed
          registers are available on separate tabs.
      - type: glance
        title: Current power flow
        columns: 7
        show_name: true
        show_state: true
        state_color: true
        entities:
          - entity: sensor.hoymiles_hit_overview_pv_total_power
            name: PV
          - entity: sensor.hoymiles_hit_overview_load_active_power
            name: Load
          - entity: sensor.hoymiles_hit_overview_grid_total_active_power
            name: Grid
          - entity: sensor.hoymiles_hit_overview_battery_power
            name: Battery
          - entity: sensor.hoymiles_hit_battery_current_inverter
            name: Battery (A)
          - entity: sensor.hoymiles_hit_battery_1_voltage
            name: Battery (V)
          - entity: sensor.hoymiles_hit_overview_battery_soc
            name: SOC
      - type: horizontal-stack
        cards:
          - type: entities
            title: Grid — voltages and frequency
            show_header_toggle: false
            state_color: true
            entities:
              - entity: sensor.hoymiles_hit_grid_voltage_l1
                name: L1 voltage
              - entity: sensor.hoymiles_hit_grid_voltage_l2
                name: L2 voltage
              - entity: sensor.hoymiles_hit_grid_voltage_l3
                name: L3 voltage
              - entity: sensor.hoymiles_hit_inverter_grid_frequency
                name: Frequency
          - type: entities
            title: Grid — power
            show_header_toggle: false
            state_color: true
            entities:
              - entity: sensor.hoymiles_hit_meter_grid_active_power_l1
                name: Power L1
              - entity: sensor.hoymiles_hit_meter_grid_active_power_l2
                name: Power L2
              - entity: sensor.hoymiles_hit_meter_grid_active_power_l3
                name: Power L3
              - entity: sensor.hoymiles_hit_meter_grid_total_active_power
                name: Total power
      - type: entities
        title: Control EMS
        show_header_toggle: false
        state_color: true
        view_layout:
          position: sidebar
        entities:
          - entity: select.hoymiles_hit_ems_mode
            name: Operating mode
          - entity: sensor.hoymiles_hit_parallel_ems_control_status
            name: "EMS control readiness"
          - entity: sensor.hoymiles_hit_number_of_machines_master_and_slave
            name: "Detected inverter count"
          - entity: button.hoymiles_hit_clear_fault
            name: "Clear Fault"
      - type: entities
        title: Protection parameters and temperatures
        show_header_toggle: false
        state_color: true
        view_layout:
          position: sidebar
        entities:
          - entity: sensor.hoymiles_hit_inv_ths_temp
            name: Inverter heatsink temperature
          - entity: sensor.hoymiles_hit_bat_ths_temp
            name: Battery-stage heatsink temperature
          - entity: sensor.hoymiles_hit_cav_temp
            name: Inverter internal temperature (CAV)
          - entity: sensor.hoymiles_hit_pe_voltage
            name: PP voltage
          - entity: sensor.hoymiles_hit_iso_resistor
            name: Insulation resistance
          - entity: sensor.hoymiles_hit_residual_current
            name: Residual current
      - type: custom:hoymiles-power-flow-card
        title: Current energy flow
        cardstyle: lite
        wide: true
        show_solar: true
        show_battery: true
        show_grid: true
        decimal_places: 2
        dynamic_line_width: true
        min_line_width: 1
        max_line_width: 4
        inverter:
          modern: true
          autarky: "no"
          auto_scale: true
        inverter_image: /api/hoymiles_hit_modbus/static/hoymiles-inverter.png
        battery:
          energy: 21000
          shutdown_soc: 10
          colour: "#00BCD4"
          charge_colour: "#00BCD4"
          animation_speed: 6
          max_power: 10000
          show_absolute: true
          dynamic_colour: false
          animate: true
        solar:
          mppts: 1
          pv1_name: PV
          colour: "#4CAF50"
          animation_speed: 6
          max_power: 10000
          dynamic_colour: true
        load:
          essential_name: Odbiory
          show_aux: false
          colour: "#00BCD4"
          animation_speed: 6
          max_power: 10000
          dynamic_colour: true
        grid:
          grid_name: Grid
          show_nonessential: false
          show_absolute: true
          animation_speed: 6
          max_power: 10000
          dynamic_colour: true
          invert_grid: true
        entities:
          inverter_power_175: sensor.hoymiles_hit_overview_inverter_active_power
          grid_power_169: sensor.hoymiles_hit_overview_grid_total_active_power
          grid_ct_power_172: sensor.hoymiles_hit_overview_grid_total_active_power
          battery_soc_184: sensor.hoymiles_hit_overview_battery_soc
          battery_power_190: sensor.hoymiles_hit_overview_battery_power
          battery_current_191: sensor.hoymiles_hit_battery_current_inverter
          battery_voltage_183: sensor.hoymiles_hit_battery_1_voltage
          essential_power: sensor.hoymiles_hit_overview_load_active_power
          pv1_power_186: sensor.hoymiles_hit_overview_pv_total_power
      - type: vertical-stack
        cards:
          - type: glance
            title: Daily summary — energia z PV
            columns: 1
            show_name: true
            show_state: true
            state_color: true
            entities:
              - entity: sensor.hoymiles_hit_pv_total_energy_today
                name: Generated today
          - type: glance
            columns: 3
            show_name: true
            show_state: true
            state_color: true
            entities:
              - entity: sensor.hoymiles_hit_pv_to_load_energy_today
                name: To home
              - entity: sensor.hoymiles_hit_pv_to_battery_energy_today
                name: To battery
              - entity: sensor.hoymiles_hit_pv_to_grid_energy_today
                name: To grid
      - type: history-graph
        title: Power — last 24 hours [W]
        hours_to_show: 24
        entities:
          - entity: sensor.hoymiles_hit_overview_pv_total_power
            name: PV
          - entity: sensor.hoymiles_hit_overview_load_active_power
            name: Load
          - entity: sensor.hoymiles_hit_overview_grid_total_active_power
            name: Grid
          - entity: sensor.hoymiles_hit_overview_battery_power
            name: Battery
      - type: entities
        title: System and connectivity
        show_header_toggle: false
        state_color: true
        view_layout:
          position: sidebar
        entities:
          - entity: sensor.hoymiles_hit_inverter_work_status
            name: "Inverter Work Status"
            tap_action:
              action: more-info
          - entity: sensor.hoymiles_hit_overview_system_work_status
