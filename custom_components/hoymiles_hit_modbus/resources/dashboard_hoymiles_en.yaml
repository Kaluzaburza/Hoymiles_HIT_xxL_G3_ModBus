            plan_entity: sensor.hoymiles_hit_rce_optimized_plan
            current_price_entity: sensor.hoymiles_rce_current_price
            active_entity: input_boolean.hoymiles_rce_discharge_active
            block_enabled_entity: input_boolean.hoymiles_sale_block_enabled
            block_start_entity: input_datetime.hoymiles_sale_block_start
            block_end_entity: input_datetime.hoymiles_sale_block_end
      - type: markdown
        title: Required forecast source
        view_layout:
          position: sidebar
        entity_id:
          - input_boolean.hoymiles_rce_dynamic_soc_enabled
          - sensor.hoymiles_rce_reserve_status
          - sensor.hoymiles_rce_dynamic_minimum_soc
        content: |-
          The automation requires the external integration
          **Solcast PV Forecast** by **BJReplay**:
          [installation and configuration](https://github.com/BJReplay/ha-solcast-solar).

          **Forecast Today** and **Forecast Tomorrow** are required.
          The entities are detected automatically in Polish and English HA;
          custom entity ids can be entered above.

          The optimizer simulates the balance every 30 minutes from now through tonight,
          the whole next day and the following night until **90 minutes after sunrise**.
          It first excludes the Self-Use outage reserve, the safety
          correction, and the full forecast home consumption through
          the end of the nearest protected night from export. Forecast PV before sunset does not
          reduce this night reserve. Only the remaining energy is assigned
          do the most valuable available RCE slots today or tomorrow.

          The export price is not configured manually. The optimizer compares
          the full financial result of every available slot in the horizon,
          selects the highest prices and includes natural PV export. An earlier
          discharge is used only when it increases revenue or creates
          battery headroom before a later surplus would be sold more cheaply.

          System power is calculated as **one inverter's rated power × the automatically
          detected inverter count × the configured discharge percentage**.
          Until at least 24 hours of history is collected, the configured fallback
          daily consumption above is used. The optimizer then uses the available
          history and gradually builds a complete four-day average;
          the actual history coverage is shown in the status card.

          The Self-Use reserve setting is not changed. This energy remains available
          below the normal threshold only during a grid outage.
      - type: markdown
        title: RCE discharge plan
        entity_id:
          - sensor.hoymiles_rce_discharge_plan
          - sensor.hoymiles_rce_automatic_price_floor
          - sensor.hoymiles_rce_optimization_gain
          - input_boolean.hoymiles_sale_block_enabled
          - input_datetime.hoymiles_sale_block_start
          - input_datetime.hoymiles_sale_block_end
        content: |-
          {% set periods = state_attr('sensor.hoymiles_rce_discharge_plan', 'periods') %}
          {% set minutes = state_attr('sensor.hoymiles_rce_discharge_plan',
                                     'planned_duration_minutes') | int(0) %}
          {% set dates = state_attr('sensor.hoymiles_rce_discharge_plan', 'data_dates') %}
          {% set export = state_attr('sensor.hoymiles_rce_discharge_plan',
                                     'expected_export_kwh') | float(0) %}
          {% set battery_export = state_attr('sensor.hoymiles_rce_discharge_plan',
                                             'planned_battery_export_kwh')
                                             | float(0) %}
          {% set pv_export = state_attr('sensor.hoymiles_rce_discharge_plan',
                                        'natural_pv_export_kwh') | float(0) %}
          {% set baseline_export = states(
               'sensor.hoymiles_rce_self_use_baseline_export') | float(0) %}
          {% set battery_revenue = state_attr(
               'sensor.hoymiles_rce_discharge_plan',
               'planned_battery_revenue_pln') | float(0) %}
          {% set pv_revenue = state_attr('sensor.hoymiles_rce_discharge_plan',
                                         'natural_pv_revenue_pln') | float(0) %}
          {% set revenue = state_attr('sensor.hoymiles_rce_discharge_plan',
                                      'estimated_revenue_pln') | float(0) %}
          {% set price_floor = states(
               'sensor.hoymiles_rce_automatic_price_floor') %}
          {% set gain = states('sensor.hoymiles_rce_optimization_gain') %}
          {% set preview = state_attr('sensor.hoymiles_rce_discharge_plan',
                                      'plan_is_preview') %}
          {% set scope = state_attr('sensor.hoymiles_rce_discharge_plan',
                                    'planning_scope') %}
          **Horizon:** {{ dates }}<br>
          **Price-data scope:** {{ 'today and tomorrow'
             if scope == 'today_and_tomorrow'
             else 'today only — tomorrow will be added automatically' }}<br>
          **Plan mode:** {{ 'preview — automatic discharge is disabled'
             if preview else 'active' }}<br>
          **Automatic plan price floor:** {{ price_floor
             if price_floor not in ['unknown', 'unavailable'] else 'no export planned' }}
          {{ 'PLN/kWh' if price_floor not in ['unknown', 'unavailable'] else '' }}<br>
          **Optimization gain:** {{ gain
             if gain not in ['unknown', 'unavailable'] else '0' }} PLN<br>
          **Most profitable periods selected by the optimizer:**<br>
          {{ periods or 'No data available to build a plan.' }}

          **Total plan:** {{ minutes // 60 }} h
          {{ minutes % 60 }} min ({{ states('sensor.hoymiles_rce_discharge_plan') }}
          30-minute blocks)<br>
          **Planned controlled export from now:** {{ battery_export | round(2) }}
          kWh → {{ battery_revenue | round(2) }} PLN<br>
          **Forecast surplus if Self-Use remains active:**
          {{ baseline_export | round(2) }} kWh<br>
          **Unavoidable PV surplus remaining after optimization:**
          {{ pv_export | round(2) }}
          kWh → {{ pv_revenue | round(2) }} PLN<br>
          **Total future export from now:** {{ export | round(2) }} kWh<br>
          **Total future estimated revenue:** {{ revenue | round(2) }} PLN

          Future-plan values do not include energy sold earlier
          today. Realized export is split above into
          RCE-controlled sales and natural surplus exported in Self-Use.

          The automation returns to **Self-Use** after the selected
          slot ends, the minimum SOC is reached, or the
          switch is disabled. The export lockout excludes the configured hours.
