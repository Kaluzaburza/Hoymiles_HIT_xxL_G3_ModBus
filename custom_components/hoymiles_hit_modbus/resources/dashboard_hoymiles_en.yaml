# Dashboard Home Assistant dla Hoymiles Energy Storage
#
# Wklej CAŁĄ zawartość do edytora surowej konfiguracji nowego dashboardu.
# Animowany przepływ mocy używa zainstalowanej karty HACS
# custom:sunsynk-power-flow-card. Pozostałe karty są standardowe.
# Identyfikatory encji są zgodne z rzeczywistym rejestrem tej instancji HA.
# Encje utworzone po zmianach nazw mają dodatkowy prefiks pv_hoymiles_inverter_.
# Karty harmonogramów EMS wymagają pakietu home_assistant/hoymiles_ems_scheduler.yaml.
# Obejmuje wszystkie aktywne encje; pominięta jest tylko jedna encja oznaczona
# w ESPHome jako disabled_by_default (opisana w zakładce Sterowanie).

title: Hoymiles Energy Storage
views:
  - title: Start
    path: start
    icon: mdi:view-dashboard
    type: sidebar
    badges: []
    cards:
      - type: markdown
        content: >-
          ## Hoymiles — panel operacyjny

          The most important values for everyday inverter operation. Detailed
          registers are available on separate tabs.
      - type: glance
        title: Current power flow
        columns: 5
        show_name: true
        show_state: true
        state_color: true
        entities:
          - entity: sensor.hoymiles_hit_overview_pv_total_power
            name: PV
          - entity: sensor.hoymiles_hit_overview_load_active_power
            name: Load
          - entity: sensor.hoymiles_hit_overview_grid_total_active_power
            name: Grid
          - entity: sensor.hoymiles_hit_overview_battery_power
            name: Battery
          - entity: sensor.hoymiles_hit_overview_battery_soc
            name: SOC
      - type: entities
        title: Grid — current values
        show_header_toggle: false
        state_color: true
        entities:
          - entity: sensor.hoymiles_hit_grid_voltage_l1
            name: L1 voltage
          - entity: sensor.hoymiles_hit_grid_current_l1n
            name: L1 current
          - entity: sensor.hoymiles_hit_grid_voltage_l2
            name: L2 voltage
          - entity: sensor.hoymiles_hit_grid_current_l2n
            name: L2 current
          - entity: sensor.hoymiles_hit_grid_voltage_l3
            name: L3 voltage
          - entity: sensor.hoymiles_hit_grid_current_l3n
            name: L3 current
          - entity: sensor.hoymiles_hit_inverter_grid_frequency
            name: Frequency
          - entity: sensor.hoymiles_hit_grid_total_current
            name: Total current (sum of phases)
      - type: entities
        title: Sterowanie EMS
        show_header_toggle: false
        state_color: true
        view_layout:
          position: sidebar
        entities:
          - entity: select.hoymiles_hit_ems_mode
            name: Operating mode
      - type: entities
        title: Parametry ochrony i temperatury
        show_header_toggle: false
        state_color: true
        view_layout:
          position: sidebar
        entities:
          - entity: sensor.hoymiles_hit_inv_ths_temp
            name: Temperatura radiatora falownika
          - entity: sensor.hoymiles_hit_bat_ths_temp
            name: Temperatura radiatora toru baterii
          - entity: sensor.hoymiles_hit_cav_temp
            name: Inverter internal temperature (CAV)
          - entity: sensor.hoymiles_hit_pe_voltage
            name: PP voltage
          - entity: sensor.hoymiles_hit_iso_resistor
            name: Rezystancja izolacji
          - entity: sensor.hoymiles_hit_residual_current
            name: Residual current
      - type: custom:sunsynk-power-flow-card
        title: Current energy flow
        cardstyle: lite
        wide: true
        show_solar: true
        show_battery: true
        show_grid: true
        decimal_places: 0
        dynamic_line_width: true
        min_line_width: 1
        max_line_width: 4
        inverter:
          modern: true
          autarky: "no"
          auto_scale: true
        battery:
          energy: 21000
          shutdown_soc: 10
          colour: "#00BCD4"
          charge_colour: "#00BCD4"
          animation_speed: 6
          max_power: 10000
          show_absolute: true
          dynamic_colour: false
          animate: true
        solar:
          mppts: 1
          pv1_name: PV
          colour: "#4CAF50"
          animation_speed: 6
          max_power: 10000
          dynamic_colour: true
        load:
          essential_name: Odbiory
          show_aux: false
          colour: "#00BCD4"
          animation_speed: 6
          max_power: 10000
          dynamic_colour: true
        grid:
          grid_name: Grid
          show_nonessential: false
          show_absolute: true
          animation_speed: 6
          max_power: 10000
          dynamic_colour: true
          invert_grid: true
        entities:
          inverter_power_175: sensor.hoymiles_hit_overview_inverter_active_power
          grid_power_169: sensor.hoymiles_hit_overview_grid_total_active_power
          grid_ct_power_172: sensor.hoymiles_hit_overview_grid_total_active_power
          battery_soc_184: sensor.hoymiles_hit_overview_battery_soc
          battery_power_190: sensor.hoymiles_hit_overview_battery_power
          battery_current_191: sensor.hoymiles_hit_battery_current_bms
          battery_voltage_183: sensor.hoymiles_hit_battery_voltage_bms
          essential_power: sensor.hoymiles_hit_overview_load_active_power
          pv1_power_186: sensor.hoymiles_hit_overview_pv_total_power
      - type: vertical-stack
        cards:
          - type: glance
            title: Daily summary — energia z PV
            columns: 1
            show_name: true
            show_state: true
            state_color: true
            entities:
              - entity: sensor.hoymiles_hit_pv_total_energy_today
                name: Wyprodukowano dzisiaj
          - type: glance
            columns: 3
            show_name: true
            show_state: true
            state_color: true
            entities:
              - entity: sensor.hoymiles_hit_pv_to_load_energy_today
                name: To home
              - entity: sensor.hoymiles_hit_pv_to_battery_energy_today
                name: To battery
              - entity: sensor.hoymiles_hit_pv_to_grid_energy_today
                name: To grid
      - type: history-graph
        title: Moc — ostatnie 24 godziny [W]
        hours_to_show: 24
        entities:
          - entity: sensor.hoymiles_hit_overview_pv_total_power
            name: PV
          - entity: sensor.hoymiles_hit_overview_load_active_power
            name: Load
          - entity: sensor.hoymiles_hit_overview_grid_total_active_power
            name: Grid
          - entity: sensor.hoymiles_hit_overview_battery_power
            name: Battery
      - type: entities
        title: System and connectivity
        show_header_toggle: false
        state_color: true
        view_layout:
          position: sidebar
        entities:
          - sensor.hoymiles_hit_inverter_work_status
          - sensor.hoymiles_hit_overview_system_work_status
          - sensor.hoymiles_hit_meter_link_status
          - sensor.hoymiles_hit_pv_link_status
          - sensor.hoymiles_hit_battery_link_status
          - sensor.hoymiles_hit_battery_work_status_bms
      - type: entities
        title: Alarms — quick view
        show_header_toggle: false
        state_color: true
        view_layout:
          position: sidebar
        entities:
          - sensor.hoymiles_hit_sw_fault
          - sensor.hoymiles_hit_hw_fault
          - sensor.hoymiles_hit_battery_fault_code_bms
          - sensor.hoymiles_hit_overview_battery_faults
          - sensor.hoymiles_hit_overview_dsp_power_faults
          - sensor.hoymiles_hit_dsp_safety_faults
          - sensor.hoymiles_hit_arm_communication_faults
          - sensor.hoymiles_hit_arm_peripheral_faults
          - sensor.hoymiles_hit_arm_system_faults
  - title: Automatyka EMS
    path: automatyka-ems
    icon: mdi:calendar-clock
    type: sidebar
    badges: []
    cards:
      - type: entities
        title: RCE automation — settings
        show_header_toggle: false
        state_color: true
        entities:
          - entity: input_boolean.hoymiles_rce_discharge_enabled
            name: Enable automatic discharge using RCE prices
          - entity: input_number.hoymiles_rce_price_threshold
            name: Minimum export price
          - entity: number.hoymiles_hit_maximum_discharge_power
            name: Grid discharge power
          - entity: number.hoymiles_hit_force_discharge_soc
            name: Minimum battery SOC
          - type: section
            label: Export lockout
          - entity: input_boolean.hoymiles_sale_block_enabled
            name: Enable export lockout
          - entity: input_datetime.hoymiles_sale_block_start
            name: Lockout start
          - entity: input_datetime.hoymiles_sale_block_end
            name: Lockout end
          - entity: binary_sensor.hoymiles_sale_block_active
            name: Lockout active now
          - entity: sensor.hoymiles_rce_current_price
            name: Current RCE price
          - entity: sensor.hoymiles_rce_status
            name: Automation status
      - type: custom:hoymiles-rce-chart-card
        title: RCE — prices and discharge plan
        entity: sensor.hoymiles_rce_day
        current_price_entity: sensor.hoymiles_rce_current_price
        threshold_entity: input_number.hoymiles_rce_price_threshold
        active_entity: input_boolean.hoymiles_rce_discharge_active
        block_enabled_entity: input_boolean.hoymiles_sale_block_enabled
        block_start_entity: input_datetime.hoymiles_sale_block_start
        block_end_entity: input_datetime.hoymiles_sale_block_end
      - type: markdown
        title: RCE discharge plan
        entity_id:
          - sensor.hoymiles_rce_discharge_plan
          - input_number.hoymiles_rce_price_threshold
          - input_boolean.hoymiles_sale_block_enabled
          - input_datetime.hoymiles_sale_block_start
          - input_datetime.hoymiles_sale_block_end
        content: |-
          {% set periods = state_attr('sensor.hoymiles_rce_discharge_plan', 'periods') %}
          {% set minutes = state_attr('sensor.hoymiles_rce_discharge_plan',
                                     'planned_duration_minutes') | int(0) %}
          {% set date = state_attr('sensor.hoymiles_rce_discharge_plan', 'data_date') %}
          **Day:** {{ date }}<br>
          **Periods above the configured threshold:**<br>
          {{ periods or 'No data do przyreadynia planu.' }}

          **Total plan:** {{ minutes // 60 }} h
          {{ minutes % 60 }} min ({{ states('sensor.hoymiles_rce_discharge_plan') }}
          30-minute blocks)

          The automation returns to **Self-Use** when the price falls to
          the threshold or below, when minimum SOC is reached, or when the
          switch is disabled. Periods inside the active export lockout are skipped,
          and the inverter remains in Self-Use mode.
      - type: markdown
        view_layout:
          position: sidebar
        content: >-
          ## Daily EMS schedules

          Each schedule runs every day while its switch is
          enabled. When the configured duration ends, the inverter returns to
          autokonsumpcji.

          Do not schedule charging and discharging at the same time.
          Turning a schedule off prevents subsequent starts.
      - type: entities
        title: Grid discharge
        show_header_toggle: false
        state_color: true
        entities:
          - entity: input_boolean.hoymiles_discharge_schedule_enabled
            name: Enable daily schedule
          - entity: input_datetime.hoymiles_discharge_start
            name: Start time
          - entity: input_number.hoymiles_discharge_duration
            name: Duration
          - entity: number.hoymiles_hit_force_discharge_soc
            name: Minimum SOC — grid discharge
          - entity: number.hoymiles_hit_maximum_discharge_power
            name: Max. grid discharge power
          - entity: timer.hoymiles_discharge
            name: Current cycle remaining time
          - entity: script.hoymiles_start_grid_discharge
            name: Start grid discharge now
      - type: entities
        title: Grid charge
        show_header_toggle: false
        state_color: true
        entities:
          - entity: input_boolean.hoymiles_charge_schedule_enabled
            name: Enable daily schedule
          - entity: input_datetime.hoymiles_charge_start
            name: Start time
          - entity: input_number.hoymiles_charge_duration
            name: Duration
          - entity: number.hoymiles_hit_force_charge_soc
            name: Target SOC — grid charge
          - entity: number.hoymiles_hit_maximum_charge_power
            name: Max. grid charge power
          - entity: timer.hoymiles_charge
            name: Current cycle remaining time
          - entity: script.hoymiles_start_grid_charge
            name: Start grid charge now
      - type: entities
        title: EMS control and stop
        show_header_toggle: false
        state_color: true
        view_layout:
          position: sidebar
        entities:
          - entity: select.hoymiles_hit_ems_mode
            name: Operating mode
          - entity: number.hoymiles_hit_self_use_soc
            name: SOC reserve — Self-Use
          - entity: script.hoymiles_stop_scheduled_cycle
            name: Stop and return to Self-Use
