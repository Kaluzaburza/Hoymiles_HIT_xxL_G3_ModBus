            tap_action:
              action: more-info
          - entity: sensor.hoymiles_hit_hw_fault
            name: "HW Fault"
            tap_action:
              action: more-info
          - entity: sensor.hoymiles_hit_battery_fault_code_bms
            name: Battery fault (BMS)
            tap_action:
              action: more-info
          - entity: sensor.hoymiles_hit_overview_battery_faults
            name: Battery faults
            tap_action:
              action: more-info
          - entity: sensor.hoymiles_hit_overview_dsp_power_faults
            name: DSP power faults
            tap_action:
              action: more-info
          - entity: sensor.hoymiles_hit_dsp_safety_faults
            name: "DSP Safety Faults"
            tap_action:
              action: more-info
          - entity: sensor.hoymiles_hit_arm_communication_faults
            name: "ARM Communication Faults"
            tap_action:
              action: more-info
          - entity: sensor.hoymiles_hit_arm_peripheral_faults
            name: "ARM Peripheral Faults"
            tap_action:
