  - title: Automatyka EMS
    path: automatyka-ems
    icon: mdi:calendar-clock
    type: sidebar
    badges: []
    cards:
      - type: entities
        title: RCE automation — required configuration
        show_header_toggle: false
        state_color: true
        entities:
          - entity: input_boolean.hoymiles_rce_discharge_enabled
            name: Enable automatic discharge using RCE prices
          - entity: input_number.hoymiles_rce_price_threshold
            name: Minimum export price
          - entity: input_select.hoymiles_rce_inverter_rated_power
            name: Rated power of one inverter
          - entity: number.hoymiles_hit_maximum_discharge_power
            name: Grid discharge power
          - entity: input_text.hoymiles_solcast_forecast_today_entity
            name: Solcast entity — today forecast
          - entity: input_text.hoymiles_solcast_forecast_tomorrow_entity
            name: Solcast entity — tomorrow forecast
          - entity: input_number.hoymiles_rce_fallback_daily_load
            name: Daily consumption before history is available
          - entity: input_boolean.hoymiles_rce_dynamic_soc_enabled
            name: Automatically calculate minimum SOC
          - entity: input_number.hoymiles_rce_soc_safety_margin
            name: SOC safety correction (+)
          - entity: input_boolean.hoymiles_sale_block_enabled
            name: Enable export lockout
          - entity: input_datetime.hoymiles_sale_block_start
            name: Lockout start
          - entity: input_datetime.hoymiles_sale_block_end
            name: Lockout end
      - type: entities
        title: RCE — status, forecast and result
        show_header_toggle: false
        state_color: true
        entities:
          - entity: sensor.hoymiles_rce_status
            name: Automation status
          - entity: sensor.hoymiles_hit_rce_optimized_plan
            name: Optimizer status
          - entity: sensor.hoymiles_rce_current_price
            name: Current RCE price
          - entity: binary_sensor.hoymiles_sale_block_active
            name: Lockout active now
          - entity: sensor.hoymiles_solcast_forecast_today
            name: Forecast PV production today
          - entity: sensor.hoymiles_solcast_forecast_remaining_today
            name: Remaining forecast PV production today
          - entity: sensor.hoymiles_solcast_forecast_tomorrow
            name: Forecast PV production tomorrow
          - entity: sensor.hoymiles_load_average_4_days
            name: Average daily LOAD — 4 days
          - entity: sensor.hoymiles_night_load_average_4_days
            name: Average protected-window consumption — 4 days
          - entity: sensor.hoymiles_rce_protected_home_energy
            name: Home energy protected from export
          - entity: sensor.hoymiles_rce_dynamic_minimum_soc
            name: Calculated minimum SOC for RCE
          - entity: sensor.hoymiles_rce_grid_export_energy_daily
            name: Energy exported to grid today
          - entity: sensor.hoymiles_rce_revenue_daily
            name: Estimated RCE revenue today
      - type: vertical-stack
        cards:
          - type: custom:hoymiles-rce-chart-card
            title: RCE — today
            entity: sensor.hoymiles_rce_day
            plan_entity: sensor.hoymiles_hit_rce_optimized_plan
            current_price_entity: sensor.hoymiles_rce_current_price
            threshold_entity: input_number.hoymiles_rce_price_threshold
            active_entity: input_boolean.hoymiles_rce_discharge_active
            block_enabled_entity: input_boolean.hoymiles_sale_block_enabled
            block_start_entity: input_datetime.hoymiles_sale_block_start
            block_end_entity: input_datetime.hoymiles_sale_block_end
          - type: custom:hoymiles-rce-chart-card
            title: RCE — tomorrow
            entity: sensor.hoymiles_rce_day_tomorrow
            future_data: true
            plan_entity: sensor.hoymiles_hit_rce_optimized_plan
            current_price_entity: sensor.hoymiles_rce_current_price
            threshold_entity: input_number.hoymiles_rce_price_threshold
            active_entity: input_boolean.hoymiles_rce_discharge_active
            block_enabled_entity: input_boolean.hoymiles_sale_block_enabled
            block_start_entity: input_datetime.hoymiles_sale_block_start
            block_end_entity: input_datetime.hoymiles_sale_block_end
      - type: markdown
        title: Required forecast source
        view_layout:
          position: sidebar
        entity_id:
          - input_boolean.hoymiles_rce_dynamic_soc_enabled
          - sensor.hoymiles_rce_reserve_status
          - sensor.hoymiles_rce_dynamic_minimum_soc
        content: |-
          The automation requires the external integration
          **Solcast PV Forecast** by **BJReplay**:
          [installation and configuration](https://github.com/BJReplay/ha-solcast-solar).

          **Forecast Today** and **Forecast Tomorrow** are required.
          The entities are detected automatically in Polish and English HA;
          custom entity ids can be entered above.

          The optimizer simulates the balance every 30 minutes from now through tonight,
          the whole next day and the following night until **90 minutes after sunrise**.
          It first protects the home supply, the Self-Use outage reserve, and
          the safety correction. Only the remaining energy is assigned to
          the most valuable available RCE slots today or tomorrow.

          Moc systemu jest liczona jako **moc jednego falownika × automatycznie
          detected inverter count × configured discharge percentage**.
          For the first 24 hours, the fallback daily consumption entered
          above is used; it is then replaced by the four-day average.

          The Self-Use reserve setting is not changed. This energy remains available
          below the normal threshold only during a grid outage.
      - type: markdown
        title: RCE discharge plan
        entity_id:
          - sensor.hoymiles_rce_discharge_plan
          - input_number.hoymiles_rce_price_threshold
          - input_boolean.hoymiles_sale_block_enabled
          - input_datetime.hoymiles_sale_block_start
          - input_datetime.hoymiles_sale_block_end
        content: |-
          {% set periods = state_attr('sensor.hoymiles_rce_discharge_plan', 'periods') %}
          {% set minutes = state_attr('sensor.hoymiles_rce_discharge_plan',
                                     'planned_duration_minutes') | int(0) %}
          {% set dates = state_attr('sensor.hoymiles_rce_discharge_plan', 'data_dates') %}
          {% set export = state_attr('sensor.hoymiles_rce_discharge_plan',
                                     'expected_export_kwh') | float(0) %}
          {% set revenue = state_attr('sensor.hoymiles_rce_discharge_plan',
                                      'estimated_revenue_pln') | float(0) %}
          **Horizon:** {{ dates }}<br>
          **Most profitable periods selected by the optimizer:**<br>
          {{ periods or 'No data available to build a plan.' }}

          **Total plan:** {{ minutes // 60 }} h
          {{ minutes % 60 }} min ({{ states('sensor.hoymiles_rce_discharge_plan') }}
          30-minute blocks)<br>
          **Forecast export:** {{ export | round(2) }} kWh<br>
          **Estimated revenue:** {{ revenue | round(2) }} PLN

          The automation returns to **Self-Use** after the selected
          slot ends, the minimum SOC is reached, or the
          switch is disabled. The export lockout excludes the configured hours.
      - type: markdown
        view_layout:
          position: sidebar
        content: >-
          ## Daily EMS schedules

          Each schedule runs every day while its switch is
          enabled. When the configured duration ends, the inverter returns to
          autokonsumpcji.

          Do not schedule charging and discharging at the same time.
          Turning a schedule off prevents subsequent starts.
      - type: entities
        title: Grid discharge
        show_header_toggle: false
        state_color: true
        entities:
          - entity: input_boolean.hoymiles_discharge_schedule_enabled
            name: Enable daily schedule
          - entity: input_datetime.hoymiles_discharge_start
            name: Start time
          - entity: input_number.hoymiles_discharge_duration
            name: Duration
          - entity: number.hoymiles_hit_force_discharge_soc
            name: Minimum SOC — grid discharge
          - entity: number.hoymiles_hit_maximum_discharge_power
            name: Max. grid discharge power
          - entity: timer.hoymiles_discharge
            name: Current cycle remaining time
          - entity: script.hoymiles_start_grid_discharge
            name: Start grid discharge now
      - type: entities
        title: Grid charge
        show_header_toggle: false
        state_color: true
        entities:
          - entity: input_boolean.hoymiles_charge_schedule_enabled
            name: Enable daily schedule
          - entity: input_datetime.hoymiles_charge_start
            name: Start time
          - entity: input_number.hoymiles_charge_duration
            name: Duration
          - entity: number.hoymiles_hit_force_charge_soc
            name: Target SOC — grid charge
          - entity: number.hoymiles_hit_maximum_charge_power
            name: Max. grid charge power
          - entity: timer.hoymiles_charge
            name: Current cycle remaining time
          - entity: script.hoymiles_start_grid_charge
            name: Start grid charge now
      - type: entities
        title: EMS control and stop
        show_header_toggle: false
        state_color: true
        view_layout:
          position: sidebar
        entities:
          - entity: select.hoymiles_hit_ems_mode
            name: Operating mode
          - entity: number.hoymiles_hit_self_use_soc
            name: SOC reserve — Self-Use
          - entity: script.hoymiles_stop_scheduled_cycle
            name: Stop and return to Self-Use
