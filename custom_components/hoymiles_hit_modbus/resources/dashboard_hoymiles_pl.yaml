# Dashboard Home Assistant dla Hoymiles Energy Storage
#
# Wklej CAŁĄ zawartość do edytora surowej konfiguracji nowego dashboardu.
# Animowany przepływ mocy używa zainstalowanej karty HACS
# custom:sunsynk-power-flow-card. Pozostałe karty są standardowe.
# Dashboard używa stabilnych identyfikatorów proxy tworzonych przez integrację
# Hoymiles HIT xxL G3 Modbus. Nie zależą one od nazwy urządzenia ESPHome.
# Karty harmonogramów EMS wymagają pakietu home_assistant/hoymiles_ems_scheduler.yaml.
# Obejmuje wszystkie aktywne encje; pominięta jest tylko jedna encja oznaczona
# w ESPHome jako disabled_by_default (opisana w zakładce Sterowanie).

title: Hoymiles Energy Storage
views:
  - title: Start
    path: start
    icon: mdi:view-dashboard
    type: sidebar
    badges: []
    cards:
      - type: markdown
        content: >-
          ## Hoymiles — panel operacyjny

          Najważniejsze dane do codziennej obsługi falownika. Szczegółowe
          rejestry są w osobnych zakładkach.
      - type: glance
        title: Bieżący przepływ mocy
        columns: 7
        show_name: true
        show_state: true
        state_color: true
        entities:
          - entity: sensor.hoymiles_hit_overview_pv_total_power
            name: PV
          - entity: sensor.hoymiles_hit_overview_load_active_power
            name: Dom
          - entity: sensor.hoymiles_hit_overview_grid_total_active_power
            name: Sieć
          - entity: sensor.hoymiles_hit_overview_battery_power
            name: Bateria
          - entity: sensor.hoymiles_hit_battery_current_inverter
            name: Bateria (A)
          - entity: sensor.hoymiles_hit_battery_1_voltage
            name: Bateria (V)
          - entity: sensor.hoymiles_hit_overview_battery_soc
            name: SOC
      - type: horizontal-stack
        cards:
          - type: entities
            title: Sieć — napięcia i częstotliwość
            show_header_toggle: false
            state_color: true
            entities:
              - entity: sensor.hoymiles_hit_grid_voltage_l1
                name: Napięcie L1
              - entity: sensor.hoymiles_hit_grid_voltage_l2
                name: Napięcie L2
              - entity: sensor.hoymiles_hit_grid_voltage_l3
                name: Napięcie L3
              - entity: sensor.hoymiles_hit_inverter_grid_frequency
                name: Częstotliwość
          - type: entities
            title: Sieć — moc
            show_header_toggle: false
            state_color: true
            entities:
              - entity: sensor.hoymiles_hit_meter_grid_active_power_l1
                name: Moc L1
              - entity: sensor.hoymiles_hit_meter_grid_active_power_l2
                name: Moc L2
              - entity: sensor.hoymiles_hit_meter_grid_active_power_l3
                name: Moc L3
              - entity: sensor.hoymiles_hit_meter_grid_total_active_power
                name: Moc łączna
      - type: entities
        title: Sterowanie EMS
        show_header_toggle: false
        state_color: true
        view_layout:
          position: sidebar
        entities:
          - entity: select.hoymiles_hit_ems_mode
            name: Tryb pracy
          - entity: sensor.hoymiles_hit_parallel_ems_control_status
            name: "Gotowość sterowania EMS"
          - entity: sensor.hoymiles_hit_number_of_machines_master_and_slave
            name: "Wykryta liczba falowników"
          - entity: button.hoymiles_hit_clear_fault
            name: "Wyczyść alarmy falownika"
      - type: entities
        title: Parametry ochrony i temperatury
        show_header_toggle: false
        state_color: true
        view_layout:
          position: sidebar
        entities:
          - entity: sensor.hoymiles_hit_inv_ths_temp
            name: Temperatura radiatora falownika
          - entity: sensor.hoymiles_hit_bat_ths_temp
            name: Temperatura radiatora toru baterii
          - entity: sensor.hoymiles_hit_cav_temp
            name: Temperatura wnętrza falownika (CAV)
          - entity: sensor.hoymiles_hit_pe_voltage
            name: Napięcie PP
          - entity: sensor.hoymiles_hit_iso_resistor
            name: Rezystancja izolacji
          - entity: sensor.hoymiles_hit_residual_current
            name: Prąd różnicowy
      - type: custom:hoymiles-power-flow-card
        title: Bieżący przepływ energii
        cardstyle: lite
        wide: true
        show_solar: true
        show_battery: true
        show_grid: true
        decimal_places: 2
        dynamic_line_width: true
        min_line_width: 1
        max_line_width: 4
        inverter:
          modern: true
          autarky: "no"
          auto_scale: true
        inverter_image: /api/hoymiles_hit_modbus/static/hoymiles-inverter.png
        battery:
          energy: 21000
          shutdown_soc: 10
          colour: "#00BCD4"
          charge_colour: "#00BCD4"
          animation_speed: 6
          max_power: 10000
          show_absolute: true
          dynamic_colour: false
          animate: true
        solar:
          mppts: 1
          pv1_name: PV
          colour: "#4CAF50"
          animation_speed: 6
          max_power: 10000
          dynamic_colour: true
        load:
          essential_name: Odbiory
          show_aux: false
          colour: "#00BCD4"
          animation_speed: 6
          max_power: 10000
          dynamic_colour: true
        grid:
          grid_name: Sieć
          show_nonessential: false
          show_absolute: true
          animation_speed: 6
          max_power: 10000
          dynamic_colour: true
          invert_grid: true
        entities:
          inverter_power_175: sensor.hoymiles_hit_overview_inverter_active_power
          grid_power_169: sensor.hoymiles_hit_overview_grid_total_active_power
          grid_ct_power_172: sensor.hoymiles_hit_overview_grid_total_active_power
          battery_soc_184: sensor.hoymiles_hit_overview_battery_soc
          battery_power_190: sensor.hoymiles_hit_overview_battery_power
          battery_current_191: sensor.hoymiles_hit_battery_current_inverter
          battery_voltage_183: sensor.hoymiles_hit_battery_1_voltage
          essential_power: sensor.hoymiles_hit_overview_load_active_power
          pv1_power_186: sensor.hoymiles_hit_overview_pv_total_power
      - type: vertical-stack
        cards:
          - type: glance
            title: Podsumowanie dzienne — energia z PV
            columns: 1
            show_name: true
            show_state: true
            state_color: true
            entities:
              - entity: sensor.hoymiles_hit_pv_total_energy_today
                name: Wyprodukowano dzisiaj
          - type: glance
            columns: 3
            show_name: true
            show_state: true
            state_color: true
            entities:
              - entity: sensor.hoymiles_hit_pv_to_load_energy_today
                name: Do domu
              - entity: sensor.hoymiles_hit_pv_to_battery_energy_today
                name: Do baterii
              - entity: sensor.hoymiles_hit_pv_to_grid_energy_today
                name: Do sieci
      - type: history-graph
        title: Moc — ostatnie 24 godziny [W]
        hours_to_show: 24
        entities:
          - entity: sensor.hoymiles_hit_overview_pv_total_power
            name: PV
          - entity: sensor.hoymiles_hit_overview_load_active_power
            name: Dom
          - entity: sensor.hoymiles_hit_overview_grid_total_active_power
            name: Sieć
          - entity: sensor.hoymiles_hit_overview_battery_power
            name: Bateria
      - type: entities
        title: Stan systemu i łączność
        show_header_toggle: false
        state_color: true
        view_layout:
          position: sidebar
        entities:
          - entity: sensor.hoymiles_hit_inverter_work_status
            name: "Stan pracy falownika"
            tap_action:
              action: more-info
          - entity: sensor.hoymiles_hit_overview_system_work_status
            name: Stan pracy systemu
            tap_action:
              action: more-info
          - entity: sensor.hoymiles_hit_meter_link_status
            name: Łącze licznika
            tap_action:
              action: more-info
          - entity: sensor.hoymiles_hit_pv_link_status
            name: Łącze PV
            tap_action:
              action: more-info
          - entity: sensor.hoymiles_hit_battery_link_status
            name: Łącze baterii
            tap_action:
              action: more-info
          - entity: sensor.hoymiles_hit_battery_work_status_bms
            name: "Stan pracy baterii (BMS)"
            tap_action:
              action: more-info
      - type: entities
        title: Alarmy — szybki podgląd
        show_header_toggle: false
        state_color: true
        view_layout:
          position: sidebar
        entities:
          - entity: sensor.hoymiles_hit_sw_fault
            name: "Błąd oprogramowania"
            tap_action:
              action: more-info
          - entity: sensor.hoymiles_hit_hw_fault
            name: "Błąd sprzętowy"
            tap_action:
              action: more-info
          - entity: sensor.hoymiles_hit_battery_fault_code_bms
            name: Błąd baterii (BMS)
            tap_action:
              action: more-info
          - entity: sensor.hoymiles_hit_overview_battery_faults
            name: Błędy baterii
            tap_action:
              action: more-info
          - entity: sensor.hoymiles_hit_overview_dsp_power_faults
            name: Błędy DSP mocy
            tap_action:
              action: more-info
          - entity: sensor.hoymiles_hit_dsp_safety_faults
            name: "Błędy DSP zabezpieczeń"
            tap_action:
              action: more-info
          - entity: sensor.hoymiles_hit_arm_communication_faults
            name: "Błędy komunikacji ARM"
            tap_action:
              action: more-info
          - entity: sensor.hoymiles_hit_arm_peripheral_faults
            name: "Błędy urządzeń peryferyjnych ARM"
            tap_action:
              action: more-info
          - entity: sensor.hoymiles_hit_arm_system_faults
            name: "Błędy systemowe ARM"
            tap_action:
              action: more-info
  - title: Automatyka EMS
    path: automatyka-ems
    icon: mdi:calendar-clock
    type: sidebar
    badges: []
    cards:
      - type: entities
        title: Automatyka RCE — konfiguracja wymagana
        show_header_toggle: false
        state_color: true
        entities:
          - entity: input_boolean.hoymiles_rce_discharge_enabled
            name: Włącz automatyczne rozładowanie według RCE
          - entity: input_number.hoymiles_rce_price_threshold
            name: Minimalna cena sprzedaży
          - entity: input_select.hoymiles_rce_inverter_rated_power
            name: Moc znamionowa jednego falownika
          - entity: number.hoymiles_hit_maximum_discharge_power
            name: Moc rozładowania do sieci
          - entity: input_text.hoymiles_solcast_forecast_today_entity
            name: Encja Solcast — prognoza na dzisiaj
          - entity: input_text.hoymiles_solcast_forecast_tomorrow_entity
            name: Encja Solcast — prognoza na jutro
          - entity: input_number.hoymiles_rce_fallback_daily_load
            name: Zużycie dobowe przed zebraniem historii
          - entity: input_boolean.hoymiles_rce_dynamic_soc_enabled
            name: Automatycznie wyliczaj minimalny SOC
          - entity: input_number.hoymiles_rce_soc_safety_margin
            name: Korekta bezpieczeństwa SOC (+)
          - entity: input_boolean.hoymiles_sale_block_enabled
            name: Włącz blokadę sprzedaży
          - entity: input_datetime.hoymiles_sale_block_start
            name: Początek blokady
          - entity: input_datetime.hoymiles_sale_block_end
            name: Koniec blokady
      - type: entities
        title: RCE — stan, prognoza i wynik
        show_header_toggle: false
        state_color: true
        entities:
          - entity: sensor.hoymiles_rce_status
            name: Stan automatyki
          - entity: sensor.hoymiles_hit_rce_optimized_plan
            name: Stan optymalizatora
          - entity: sensor.hoymiles_rce_current_price
            name: Bieżąca cena RCE
          - entity: binary_sensor.hoymiles_sale_block_active
            name: Blokada aktywna teraz
          - entity: sensor.hoymiles_solcast_forecast_today
            name: Prognozowana produkcja PV dzisiaj
          - entity: sensor.hoymiles_solcast_forecast_remaining_today
            name: Pozostała prognozowana produkcja dzisiaj
          - entity: sensor.hoymiles_solcast_forecast_tomorrow
            name: Prognozowana produkcja PV jutro
          - entity: sensor.hoymiles_load_average_4_days
            name: Średnie dobowe zużycie LOAD — 4 dni
          - entity: sensor.hoymiles_night_load_average_4_days
            name: Średnie zużycie w oknie nocnym — 4 dni
          - entity: sensor.hoymiles_rce_protected_home_energy
            name: Energia domu chroniona przed sprzedażą
          - entity: sensor.hoymiles_rce_dynamic_minimum_soc
            name: Wyliczony minimalny SOC dla RCE
          - entity: sensor.hoymiles_rce_grid_export_energy_daily
            name: Energia wysłana do sieci dzisiaj
          - entity: sensor.hoymiles_rce_revenue_daily
            name: Szacunkowy przychód RCE dzisiaj
      - type: vertical-stack
        cards:
          - type: custom:hoymiles-rce-chart-card
            title: RCE — dzisiaj
            entity: sensor.hoymiles_rce_day
            plan_entity: sensor.hoymiles_hit_rce_optimized_plan
            current_price_entity: sensor.hoymiles_rce_current_price
            threshold_entity: input_number.hoymiles_rce_price_threshold
            active_entity: input_boolean.hoymiles_rce_discharge_active
            block_enabled_entity: input_boolean.hoymiles_sale_block_enabled
            block_start_entity: input_datetime.hoymiles_sale_block_start
            block_end_entity: input_datetime.hoymiles_sale_block_end
          - type: custom:hoymiles-rce-chart-card
            title: RCE — jutro
            entity: sensor.hoymiles_rce_day_tomorrow
            future_data: true
            plan_entity: sensor.hoymiles_hit_rce_optimized_plan
            current_price_entity: sensor.hoymiles_rce_current_price
            threshold_entity: input_number.hoymiles_rce_price_threshold
            active_entity: input_boolean.hoymiles_rce_discharge_active
            block_enabled_entity: input_boolean.hoymiles_sale_block_enabled
            block_start_entity: input_datetime.hoymiles_sale_block_start
            block_end_entity: input_datetime.hoymiles_sale_block_end
      - type: markdown
        title: Wymagane źródło prognozy
        view_layout:
          position: sidebar
        entity_id:
          - input_boolean.hoymiles_rce_dynamic_soc_enabled
          - sensor.hoymiles_rce_reserve_status
          - sensor.hoymiles_rce_dynamic_minimum_soc
        content: |-
          Automatyka wymaga zewnętrznej integracji
          **Solcast PV Forecast** producenta **BJReplay**:
          [instalacja i konfiguracja](https://github.com/BJReplay/ha-solcast-solar).

          Wymagane są prognozy **Forecast Today** i **Forecast Tomorrow**.
          Encje są wykrywane automatycznie w polskiej i angielskiej wersji HA;
          w razie niestandardowych nazw można wpisać je u góry.

          Algorytm symuluje bilans co 30 minut od teraz przez dzisiejszą noc,
          cały kolejny dzień i następną noc do **90 minut po wschodzie**.
          Najpierw zabezpiecza zasilanie domu, rezerwę awaryjną Self-Use oraz
          korektę bezpieczeństwa. Dopiero pozostałą energię przydziela do
          najdroższych dostępnych bloków RCE dzisiaj lub jutro.

          Moc systemu jest liczona jako **moc jednego falownika × automatycznie
          wykryta liczba falowników × ustawiony procent rozładowania**.
          Przez pierwsze 24 godziny używane jest awaryjne zużycie dobowe z pola
          u góry; później zastępuje je średnia z ostatnich czterech dni.

          Pole rezerwy Self-Use nie jest zmieniane. Pozostaje energią dostępną
          poniżej normalnego progu wyłącznie podczas zaniku sieci.
      - type: markdown
        title: Plan rozładowań RCE
        entity_id:
          - sensor.hoymiles_rce_discharge_plan
          - input_number.hoymiles_rce_price_threshold
          - input_boolean.hoymiles_sale_block_enabled
          - input_datetime.hoymiles_sale_block_start
          - input_datetime.hoymiles_sale_block_end
        content: |-
          {% set periods = state_attr('sensor.hoymiles_rce_discharge_plan', 'periods') %}
          {% set minutes = state_attr('sensor.hoymiles_rce_discharge_plan',
                                     'planned_duration_minutes') | int(0) %}
          {% set dates = state_attr('sensor.hoymiles_rce_discharge_plan', 'data_dates') %}
          {% set export = state_attr('sensor.hoymiles_rce_discharge_plan',
                                     'expected_export_kwh') | float(0) %}
          {% set revenue = state_attr('sensor.hoymiles_rce_discharge_plan',
                                      'estimated_revenue_pln') | float(0) %}
          **Horyzont:** {{ dates }}<br>
          **Najbardziej opłacalne okresy wybrane przez algorytm:**<br>
          {{ periods or 'Brak danych do przygotowania planu.' }}

          **Łączny plan:** {{ minutes // 60 }} h
          {{ minutes % 60 }} min ({{ states('sensor.hoymiles_rce_discharge_plan') }}
          bloków po 30 min)<br>
          **Prognozowany eksport:** {{ export | round(2) }} kWh<br>
          **Szacunkowy przychód:** {{ revenue | round(2) }} PLN

          Automatyka wróci do **Autokonsumpcji (Self-Use)** po zakończeniu
          wybranego bloku, po osiągnięciu minimalnego SOC albo po wyłączeniu
          przełącznika. Blokada sprzedaży wyklucza wskazane godziny z planu.
      - type: markdown
        view_layout:
          position: sidebar
        content: >-
          ## Codzienne harmonogramy EMS

          Każdy harmonogram działa codziennie, dopóki jego przełącznik jest
          włączony. Po upływie ustawionego czasu falownik wraca do
          autokonsumpcji.

          Nie ustawiaj ładowania i rozładowania na tę samą godzinę.
          Wyłączenie przełącznika blokuje kolejne uruchomienia.
      - type: entities
        title: Rozładowanie do sieci
        show_header_toggle: false
        state_color: true
        entities:
          - entity: input_boolean.hoymiles_discharge_schedule_enabled
            name: Włącz harmonogram codzienny
          - entity: input_datetime.hoymiles_discharge_start
            name: Godzina rozpoczęcia
          - entity: input_number.hoymiles_discharge_duration
            name: Czas trwania
          - entity: number.hoymiles_hit_force_discharge_soc
            name: Minimalny SOC — rozładowanie do sieci
          - entity: number.hoymiles_hit_maximum_discharge_power
            name: Maks. moc rozładowania do sieci
          - entity: timer.hoymiles_discharge
            name: Pozostały czas bieżącego cyklu
          - entity: script.hoymiles_start_grid_discharge
            name: Uruchom rozładowanie teraz
      - type: entities
        title: Ładowanie z sieci
        show_header_toggle: false
        state_color: true
        entities:
          - entity: input_boolean.hoymiles_charge_schedule_enabled
            name: Włącz harmonogram codzienny
          - entity: input_datetime.hoymiles_charge_start
            name: Godzina rozpoczęcia
          - entity: input_number.hoymiles_charge_duration
            name: Czas trwania
          - entity: number.hoymiles_hit_force_charge_soc
            name: Docelowy SOC — ładowanie z sieci
          - entity: number.hoymiles_hit_maximum_charge_power
            name: Maks. moc ładowania z sieci
          - entity: timer.hoymiles_charge
            name: Pozostały czas bieżącego cyklu
          - entity: script.hoymiles_start_grid_charge
            name: Uruchom ładowanie teraz
      - type: entities
        title: Sterowanie i zakończenie EMS
        show_header_toggle: false
        state_color: true
        view_layout:
          position: sidebar
        entities:
          - entity: select.hoymiles_hit_ems_mode
            name: Tryb pracy
          - entity: number.hoymiles_hit_self_use_soc
            name: Rezerwa SOC — Self-Use
          - entity: script.hoymiles_stop_scheduled_cycle
            name: Zatrzymaj i wróć do Self-Use
