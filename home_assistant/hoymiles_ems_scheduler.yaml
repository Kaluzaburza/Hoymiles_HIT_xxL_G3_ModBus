# Pakiet Home Assistant: codzienne harmonogramy EMS dla falownika Hoymiles.
# Wymaga encji select.hoymiles_hit_ems_mode z integracji ESPHome.

input_boolean:
  hoymiles_discharge_schedule_enabled:
    name: "EMS — codzienne rozładowanie włączone"
    icon: mdi:transmission-tower-export

  hoymiles_charge_schedule_enabled:
    name: "EMS — codzienne ładowanie włączone"
    icon: mdi:transmission-tower-import

  # Wewnętrzne znaczniki pozwalają bezpiecznie obsłużyć restart HA podczas cyklu.
  hoymiles_discharge_cycle_active:
    name: "EMS — trwa cykl rozładowania"
    icon: mdi:battery-arrow-down

  hoymiles_charge_cycle_active:
    name: "EMS — trwa cykl ładowania"
    icon: mdi:battery-arrow-up

  hoymiles_rce_discharge_enabled:
    name: "EMS RCE — automatyczne rozładowanie włączone"
    icon: mdi:chart-line

  hoymiles_rce_dynamic_soc_enabled:
    name: "EMS RCE — dynamiczna rezerwa SOC"
    icon: mdi:weather-partly-cloudy

  # Wewnętrzny znacznik: tylko cykl rozpoczęty przez automatykę RCE może zostać
  # przez nią zakończony. Ręczne harmonogramy zachowują pierwszeństwo.
  hoymiles_rce_discharge_active:
    name: "EMS RCE — trwa rozładowanie"
    icon: mdi:battery-arrow-down-outline

  hoymiles_sale_block_enabled:
    name: "EMS — blokada sprzedaży w wybranych godzinach"
    icon: mdi:transmission-tower-off

input_datetime:
  hoymiles_discharge_start:
    name: "EMS — godzina rozpoczęcia rozładowania"
    has_date: false
    has_time: true
    icon: mdi:clock-start

  hoymiles_charge_start:
    name: "EMS — godzina rozpoczęcia ładowania"
    has_date: false
    has_time: true
    icon: mdi:clock-start

  hoymiles_sale_block_start:
    name: "EMS — początek blokady sprzedaży"
    has_date: false
    has_time: true
    icon: mdi:clock-start

  hoymiles_sale_block_end:
    name: "EMS — koniec blokady sprzedaży"
    has_date: false
    has_time: true
    icon: mdi:clock-end

input_text:
  hoymiles_solcast_forecast_today_entity:
    name: "EMS RCE — encja prognozy Solcast na dzisiaj"
    max: 255
    icon: mdi:solar-power-variant

  hoymiles_solcast_forecast_tomorrow_entity:
    name: "EMS RCE — encja prognozy Solcast na jutro"
    max: 255
    icon: mdi:solar-power-variant

input_select:
  hoymiles_rce_inverter_rated_power:
    name: "EMS RCE — moc znamionowa jednego falownika"
    options:
      - "5 kW"
      - "8 kW"
      - "10 kW"
      - "12 kW"
      - "15 kW"
      - "20 kW"
    initial: "10 kW"
    icon: mdi:solar-power

input_number:
  hoymiles_discharge_duration:
    name: "EMS — czas rozładowania"
    min: 1
    max: 720
    step: 1
    mode: box
    unit_of_measurement: "min"
    icon: mdi:timer-sand

  hoymiles_charge_duration:
    name: "EMS — czas ładowania"
    min: 1
    max: 720
    step: 1
    mode: box
    unit_of_measurement: "min"
    icon: mdi:timer-sand

  hoymiles_rce_price_threshold:
    name: "EMS RCE — minimalna cena sprzedaży"
    min: -1
    max: 5
    step: 0.01
    mode: box
    unit_of_measurement: "PLN/kWh"
    icon: mdi:currency-usd

  hoymiles_rce_soc_safety_margin:
    name: "EMS RCE — korekta bezpieczeństwa SOC"
    min: 0
    max: 50
    step: 1
    mode: slider
    unit_of_measurement: "%"
    icon: mdi:shield-plus-outline

  hoymiles_rce_fallback_daily_load:
    name: "EMS RCE — dobowe zużycie awaryjne przed zebraniem historii"
    min: 1
    max: 200
    step: 0.5
    initial: 10
    mode: box
    unit_of_measurement: "kWh"
    icon: mdi:home-lightning-bolt-outline

  hoymiles_rce_export_efficiency:
    name: "EMS RCE — sprawność eksportu z baterii"
    min: 80
    max: 100
    step: 1
    initial: 95
    mode: slider
    unit_of_measurement: "%"
    icon: mdi:percent-outline

# Licznik dzienny LOAD zwiększa się w ciągu dnia i zeruje po północy.
# sum_differences_nonnegative sumuje wyłącznie dodatnie przyrosty z ostatnich
# 96 godzin, uwzględniając reset licznika. Recorder odtwarza bufor po restarcie.
sensor:
  - platform: statistics
    name: "Hoymiles Load Energy Last 4 Days"
    unique_id: hoymiles_load_energy_last_4_days
    entity_id: sensor.hoymiles_hit_load_energy_use_today
    state_characteristic: sum_differences_nonnegative
    sampling_size: 20000
    max_age:
      days: 4
    keep_last_sample: true
    precision: 2

  # Moc LOAD jest próbkowana tylko w chronionym oknie nocnym. Całka tworzy
  # licznik energii, z którego po pierwszej pełnej dobie wyznaczana jest
  # rzeczywista średnia z maksymalnie czterech ostatnich nocy.
  - platform: integration
    source: sensor.hoymiles_night_protected_load_power
    name: "Hoymiles Night Protected Load Energy Total"
    unique_id: hoymiles_night_protected_load_energy_total
    unit_prefix: k
    unit_time: h
    round: 3
    method: left

  - platform: statistics
    name: "Hoymiles Night Protected Load Energy Last 4 Days"
    unique_id: hoymiles_night_protected_load_energy_last_4_days
    entity_id: sensor.hoymiles_night_protected_load_energy_total
    state_characteristic: sum_differences_nonnegative
    sampling_size: 10000
    max_age:
      days: 4
    keep_last_sample: true
    precision: 3

  - platform: integration
    source: sensor.hoymiles_rce_grid_export_power
    name: "Hoymiles RCE Grid Export Energy Total"
    unique_id: hoymiles_rce_grid_export_energy_total
    unit_time: h
    round: 3
    method: left

  - platform: integration
    source: sensor.hoymiles_rce_revenue_rate
    name: "Hoymiles RCE Revenue Total"
    unique_id: hoymiles_rce_revenue_total
    unit_time: h
    round: 3
    method: left

utility_meter:
  hoymiles_rce_grid_export_energy_daily:
    name: "Hoymiles RCE Grid Export Energy Daily"
    unique_id: hoymiles_rce_grid_export_energy_daily
    source: sensor.hoymiles_rce_grid_export_energy_total
    cycle: daily

  hoymiles_rce_revenue_daily:
    name: "Hoymiles RCE Revenue Daily"
    unique_id: hoymiles_rce_revenue_daily
    source: sensor.hoymiles_rce_revenue_total
    cycle: daily

# Oficjalne API PSE publikuje RCE w PLN/MWh w 96 okresach po 15 minut.
# Automatyka oraz dashboard łączą każde dwa kolejne okresy w 48 bloków
# półgodzinnych i przeliczają cenę na PLN/kWh.
rest:
  - resource_template: >-
      https://api.raporty.pse.pl/api/rce-pln?%24select=rce_pln%2Cperiod%2Cbusiness_date&%24filter=business_date%20eq%20%27{{ now().strftime('%Y-%m-%d') }}%27
    method: GET
    scan_interval: 900
    timeout: 30
    headers:
      Accept: application/json
    sensor:
      - name: "Hoymiles RCE Day"
        unique_id: hoymiles_rce_day
        icon: mdi:chart-areaspline
        value_template: "{{ value_json.value | count }}"
        json_attributes:
          - value

  - resource_template: >-
      https://api.raporty.pse.pl/api/rce-pln?%24select=rce_pln%2Cperiod%2Cbusiness_date&%24filter=business_date%20eq%20%27{{ (now() + timedelta(days=1)).strftime('%Y-%m-%d') }}%27
    method: GET
    scan_interval: 900
    timeout: 30
    headers:
      Accept: application/json
    sensor:
      - name: "Hoymiles RCE Day Tomorrow"
        unique_id: hoymiles_rce_day_tomorrow
        icon: mdi:chart-areaspline
        value_template: "{{ value_json.value | count }}"
        json_attributes:
          - value

template:
  # Okno ochronne trwa od 90 minut przed zachodem do 90 minut po wschodzie.
  # Próbkowanie co minutę ogranicza liczbę próbek statystycznych, zachowując
  # wystarczającą dokładność prognozy zużycia nocnego.
  - triggers:
      - trigger: time_pattern
        minutes: "/1"
      - trigger: homeassistant
        event: start
      - trigger: state
        entity_id: sun.sun
    binary_sensor:
      - name: "Hoymiles Night Protection Window"
        unique_id: hoymiles_night_protection_window
        icon: mdi:weather-night
        availability: >-
          {{ as_timestamp(state_attr('sun.sun', 'next_rising'), 0) > 0
             and as_timestamp(state_attr('sun.sun', 'next_setting'), 0) > 0 }}
        state: >-
          {% set current = as_timestamp(now()) %}
          {% set rising =
            as_timestamp(state_attr('sun.sun', 'next_rising'), 0) %}
          {% set setting =
            as_timestamp(state_attr('sun.sun', 'next_setting'), 0) %}
          {% set buffer = 90 * 60 %}
          {% set previous_rising = rising - 24 * 60 * 60 %}
          {% set shortly_after_rising =
            is_state('sun.sun', 'above_horizon')
            and 0 <= current - previous_rising <= buffer %}
          {% set shortly_before_setting =
            is_state('sun.sun', 'above_horizon')
            and 0 <= setting - current <= buffer %}
          {{ is_state('sun.sun', 'below_horizon')
             or shortly_after_rising
             or shortly_before_setting }}

    sensor:
      - name: "Hoymiles Night Protection Window Duration"
        unique_id: hoymiles_night_protection_window_duration
        icon: mdi:weather-sunset-down
        unit_of_measurement: "h"
        state_class: measurement
        availability: >-
          {{ as_timestamp(state_attr('sun.sun', 'next_rising'), 0) > 0
             and as_timestamp(state_attr('sun.sun', 'next_setting'), 0) > 0 }}
        state: >-
          {% set rising =
            as_timestamp(state_attr('sun.sun', 'next_rising'), 0) %}
          {% set setting =
            as_timestamp(state_attr('sun.sun', 'next_setting'), 0) %}
          {% set night_start =
            setting if setting < rising else setting - 24 * 60 * 60 %}
          {% set duration = (rising - night_start + 3 * 60 * 60) / 3600 %}
          {{ ([[duration, 0] | max, 24] | min) | round(2) }}

      - name: "Hoymiles Night Protection Window Remaining"
        unique_id: hoymiles_night_protection_window_remaining
        icon: mdi:weather-sunset-up
        unit_of_measurement: "h"
        state_class: measurement
        availability: >-
          {{ as_timestamp(state_attr('sun.sun', 'next_rising'), 0) > 0
             and as_timestamp(state_attr('sun.sun', 'next_setting'), 0) > 0 }}
        state: >-
          {% set current = as_timestamp(now()) %}
          {% set rising =
            as_timestamp(state_attr('sun.sun', 'next_rising'), 0) %}
          {% set setting =
            as_timestamp(state_attr('sun.sun', 'next_setting'), 0) %}
          {% set buffer = 90 * 60 %}
          {% set previous_rising = rising - 24 * 60 * 60 %}
          {% set shortly_after_rising =
            is_state('sun.sun', 'above_horizon')
            and 0 <= current - previous_rising <= buffer %}
          {% set upcoming_start = setting - buffer %}
          {% set upcoming_end = rising + buffer %}
          {% if shortly_after_rising %}
            {{ (([previous_rising + buffer - current, 0] | max) / 3600)
               | round(2) }}
          {% elif is_state('sun.sun', 'below_horizon') %}
            {{ (([upcoming_end - current, 0] | max) / 3600) | round(2) }}
          {% elif current >= upcoming_start %}
            {{ (([upcoming_end - current, 0] | max) / 3600) | round(2) }}
          {% else %}
            {{ (([upcoming_end - upcoming_start, 0] | max) / 3600)
               | round(2) }}
          {% endif %}

      - name: "Hoymiles Night Protected Load Power"
        unique_id: hoymiles_night_protected_load_power
        icon: mdi:home-lightning-bolt-outline
        unit_of_measurement: "W"
        device_class: power
        state_class: measurement
        availability: >-
          {{ is_number(
               states('sensor.hoymiles_hit_overview_load_active_power'))
             and as_timestamp(state_attr('sun.sun', 'next_rising'), 0) > 0
             and as_timestamp(state_attr('sun.sun', 'next_setting'), 0) > 0 }}
        state: >-
          {% set current = as_timestamp(now()) %}
          {% set rising =
            as_timestamp(state_attr('sun.sun', 'next_rising'), 0) %}
          {% set setting =
            as_timestamp(state_attr('sun.sun', 'next_setting'), 0) %}
          {% set buffer = 90 * 60 %}
          {% set previous_rising = rising - 24 * 60 * 60 %}
          {% set shortly_after_rising =
            is_state('sun.sun', 'above_horizon')
            and 0 <= current - previous_rising <= buffer %}
          {% set shortly_before_setting =
            is_state('sun.sun', 'above_horizon')
            and 0 <= setting - current <= buffer %}
          {% set in_window =
            is_state('sun.sun', 'below_horizon')
            or shortly_after_rising
            or shortly_before_setting %}
          {% set load =
            states('sensor.hoymiles_hit_overview_load_active_power')
            | float(0) %}
          {{ ([load, 0] | max if in_window else 0) | round(0) }}

  - sensor:
      - name: "Hoymiles RCE Grid Export Power"
        unique_id: hoymiles_rce_grid_export_power
        icon: mdi:transmission-tower-export
        unit_of_measurement: "kW"
        device_class: power
        state_class: measurement
        availability: >-
          {{ is_number(
               states('sensor.hoymiles_hit_overview_grid_total_active_power')) }}
        state: >-
          {% set grid =
            states('sensor.hoymiles_hit_overview_grid_total_active_power')
            | float(0) %}
          {{ ([-grid / 1000, 0] | max) | round(3) }}

      - name: "Hoymiles RCE Revenue Rate"
        unique_id: hoymiles_rce_revenue_rate
        icon: mdi:cash-fast
        unit_of_measurement: "PLN/h"
        state_class: measurement
        availability: >-
          {{ is_number(states('sensor.hoymiles_rce_grid_export_power'))
             and is_number(states('sensor.hoymiles_rce_current_price')) }}
        state: >-
          {% set power =
            states('sensor.hoymiles_rce_grid_export_power') | float(0) %}
          {% set price =
            states('sensor.hoymiles_rce_current_price') | float(0) %}
          {{ (power * price) | round(4) }}

      - name: "Hoymiles RCE Current Price"
        unique_id: hoymiles_rce_current_price
        icon: mdi:cash-clock
        unit_of_measurement: "PLN/kWh"
        state_class: measurement
        availability: >-
          {% set rows = state_attr('sensor.hoymiles_rce_day', 'value') or [] %}
          {{ rows | count >= 2
             and rows[0]['business_date'] == now().strftime('%Y-%m-%d') }}
        state: >-
          {% set rows = state_attr('sensor.hoymiles_rce_day', 'value') or [] %}
          {% set slot = now().hour * 2 + (1 if now().minute >= 30 else 0) %}
          {% set index = slot * 2 %}
          {% if rows | count > index + 1 %}
            {{ (((rows[index]['rce_pln'] | float(0)) +
                  (rows[index + 1]['rce_pln'] | float(0))) / 2000) | round(4) }}
          {% else %}
            {{ none }}
          {% endif %}

      - name: "Hoymiles Solcast Forecast Today"
        unique_id: hoymiles_solcast_forecast_today
        icon: mdi:weather-sunny
        unit_of_measurement: "kWh"
        device_class: energy
        state_class: measurement
        availability: >-
          {% set refresh = now().minute %}
          {% set configured =
            states('input_text.hoymiles_solcast_forecast_today_entity')
            | trim %}
          {% set candidates = [
            configured,
            'sensor.solcast_pv_forecast_forecast_today',
            'sensor.solcast_pv_forecast_prognoza_na_dzisiaj',
            'sensor.solcast_forecast_today'
          ] %}
          {% set ns = namespace(value=none) %}
          {% for entity in candidates if entity and ns.value is none %}
            {% if is_number(states(entity)) %}
              {% set ns.value = states(entity) | float(0) %}
            {% endif %}
          {% endfor %}
          {{ ns.value is not none }}
        state: >-
          {% set refresh = now().minute %}
          {% set configured =
            states('input_text.hoymiles_solcast_forecast_today_entity')
            | trim %}
          {% set candidates = [
            configured,
            'sensor.solcast_pv_forecast_forecast_today',
            'sensor.solcast_pv_forecast_prognoza_na_dzisiaj',
            'sensor.solcast_forecast_today'
          ] %}
          {% set ns = namespace(value=none) %}
          {% for entity in candidates if entity and ns.value is none %}
            {% if is_number(states(entity)) %}
              {% set ns.value = states(entity) | float(0) %}
            {% endif %}
          {% endfor %}
          {{ ns.value | round(2) if ns.value is not none else none }}
        attributes:
          source_entity: >-
            {% set configured =
              states('input_text.hoymiles_solcast_forecast_today_entity')
              | trim %}
            {% set candidates = [
              configured,
              'sensor.solcast_pv_forecast_forecast_today',
              'sensor.solcast_pv_forecast_prognoza_na_dzisiaj',
              'sensor.solcast_forecast_today'
            ] %}
            {% set ns = namespace(entity='') %}
            {% for entity in candidates if entity and not ns.entity %}
              {% if is_number(states(entity)) %}
                {% set ns.entity = entity %}
              {% endif %}
            {% endfor %}
            {{ ns.entity or 'brak' }}

      - name: "Hoymiles Solcast Forecast Remaining Today"
        unique_id: hoymiles_solcast_forecast_remaining_today
        icon: mdi:weather-sunset-up
        unit_of_measurement: "kWh"
        device_class: energy
        state_class: measurement
        availability: >-
          {% set candidates = [
            'sensor.solcast_pv_forecast_forecast_remaining_today',
            'sensor.solcast_pv_forecast_pozostala_prognoza_na_dzis',
            'sensor.solcast_forecast_remaining_today'
          ] %}
          {% set ns = namespace(value=none) %}
          {% for entity in candidates if ns.value is none %}
            {% if is_number(states(entity)) %}
              {% set ns.value = states(entity) | float(0) %}
            {% endif %}
          {% endfor %}
          {{ ns.value is not none
             or (is_number(states('sensor.hoymiles_solcast_forecast_today'))
                 and is_number(
                   states('sensor.hoymiles_hit_pv_total_energy_today'))) }}
        state: >-
          {% set candidates = [
            'sensor.solcast_pv_forecast_forecast_remaining_today',
            'sensor.solcast_pv_forecast_pozostala_prognoza_na_dzis',
            'sensor.solcast_forecast_remaining_today'
          ] %}
          {% set ns = namespace(value=none) %}
          {% for entity in candidates if ns.value is none %}
            {% if is_number(states(entity)) %}
              {% set ns.value = states(entity) | float(0) %}
            {% endif %}
          {% endfor %}
          {% if ns.value is not none %}
            {{ ns.value | round(2) }}
          {% else %}
            {% set forecast =
              states('sensor.hoymiles_solcast_forecast_today') | float(0) %}
            {% set actual =
              states('sensor.hoymiles_hit_pv_total_energy_today') | float(0) %}
            {{ ([forecast - actual, 0] | max) | round(2) }}
          {% endif %}

      - name: "Hoymiles Solcast Forecast Tomorrow"
        unique_id: hoymiles_solcast_forecast_tomorrow
        icon: mdi:weather-partly-cloudy
        unit_of_measurement: "kWh"
        device_class: energy
        state_class: measurement
        availability: >-
          {% set refresh = now().minute %}
          {% set configured =
            states('input_text.hoymiles_solcast_forecast_tomorrow_entity')
            | trim %}
          {% set candidates = [
            configured,
            'sensor.solcast_pv_forecast_forecast_tomorrow',
            'sensor.solcast_pv_forecast_prognoza_na_jutro',
            'sensor.solcast_forecast_tomorrow'
          ] %}
          {% set ns = namespace(value=none) %}
          {% for entity in candidates if entity and ns.value is none %}
            {% if is_number(states(entity)) %}
              {% set ns.value = states(entity) | float(0) %}
            {% endif %}
          {% endfor %}
          {{ ns.value is not none }}
        state: >-
          {% set refresh = now().minute %}
          {% set configured =
            states('input_text.hoymiles_solcast_forecast_tomorrow_entity')
            | trim %}
          {% set candidates = [
            configured,
            'sensor.solcast_pv_forecast_forecast_tomorrow',
            'sensor.solcast_pv_forecast_prognoza_na_jutro',
            'sensor.solcast_forecast_tomorrow'
          ] %}
          {% set ns = namespace(value=none) %}
          {% for entity in candidates if entity and ns.value is none %}
            {% if is_number(states(entity)) %}
              {% set ns.value = states(entity) | float(0) %}
            {% endif %}
          {% endfor %}
          {{ ns.value | round(2) if ns.value is not none else none }}
        attributes:
          source_entity: >-
            {% set configured =
              states('input_text.hoymiles_solcast_forecast_tomorrow_entity')
              | trim %}
            {% set candidates = [
              configured,
              'sensor.solcast_pv_forecast_forecast_tomorrow',
              'sensor.solcast_pv_forecast_prognoza_na_jutro',
              'sensor.solcast_forecast_tomorrow'
            ] %}
            {% set ns = namespace(entity='') %}
            {% for entity in candidates if entity and not ns.entity %}
              {% if is_number(states(entity)) %}
                {% set ns.entity = entity %}
              {% endif %}
            {% endfor %}
            {{ ns.entity or 'brak' }}

      - name: "Hoymiles Load Average 4 Days"
        unique_id: hoymiles_load_average_4_days
        icon: mdi:home-lightning-bolt-outline
        unit_of_measurement: "kWh"
        device_class: energy
        state_class: measurement
        availability: >-
          {% set coverage =
            state_attr('sensor.hoymiles_load_energy_last_4_days',
                       'age_coverage_ratio') | float(0) %}
          {{ is_number(states('sensor.hoymiles_load_energy_last_4_days'))
             and coverage >= 0.24 }}
        state: >-
          {% set total =
            states('sensor.hoymiles_load_energy_last_4_days') | float(0) %}
          {% set coverage =
            state_attr('sensor.hoymiles_load_energy_last_4_days',
                       'age_coverage_ratio') | float(0) %}
          {% set history_days = [[coverage * 4, 1] | max, 4] | min %}
          {{ (total / history_days) | round(2) }}
        attributes:
          history_days: >-
            {% set coverage =
              state_attr('sensor.hoymiles_load_energy_last_4_days',
                         'age_coverage_ratio') | float(0) %}
            {{ ([coverage * 4, 4] | min) | round(2) }}
          energy_in_history: >-
            {{ states('sensor.hoymiles_load_energy_last_4_days') }}

      - name: "Hoymiles Night Load Average 4 Days"
        unique_id: hoymiles_night_load_average_4_days
        icon: mdi:weather-night
        unit_of_measurement: "kWh"
        device_class: energy
        state_class: measurement
        availability: >-
          {% set coverage =
            state_attr(
              'sensor.hoymiles_night_protected_load_energy_last_4_days',
              'age_coverage_ratio') | float(0) %}
          {{ is_number(states(
               'sensor.hoymiles_night_protected_load_energy_last_4_days'))
             and coverage >= 0.24 }}
        state: >-
          {% set total =
            states('sensor.hoymiles_night_protected_load_energy_last_4_days')
            | float(0) %}
          {% set coverage =
            state_attr(
              'sensor.hoymiles_night_protected_load_energy_last_4_days',
              'age_coverage_ratio') | float(0) %}
          {% set history_days = [[coverage * 4, 1] | max, 4] | min %}
          {{ (total / history_days) | round(2) }}
        attributes:
          history_days: >-
            {% set coverage =
              state_attr(
                'sensor.hoymiles_night_protected_load_energy_last_4_days',
                'age_coverage_ratio') | float(0) %}
            {{ ([coverage * 4, 4] | min) | round(2) }}
          energy_in_history: >-
            {{ states(
              'sensor.hoymiles_night_protected_load_energy_last_4_days') }}

      - name: "Hoymiles RCE Energy Deficit Tomorrow"
        unique_id: hoymiles_rce_energy_deficit_tomorrow
        icon: mdi:battery-alert-variant-outline
        unit_of_measurement: "kWh"
        device_class: energy
        state_class: measurement
        availability: >-
          {{ is_number(states('sensor.hoymiles_load_average_4_days'))
             and is_number(states('sensor.hoymiles_solcast_forecast_tomorrow')) }}
        state: >-
          {% set load =
            states('sensor.hoymiles_load_average_4_days') | float(0) %}
          {% set pv =
            states('sensor.hoymiles_solcast_forecast_tomorrow') | float(0) %}
          {{ ([load - pv, 0] | max) | round(2) }}

      - name: "Hoymiles Protected Window Expected Load"
        unique_id: hoymiles_protected_window_expected_load
        icon: mdi:home-clock-outline
        unit_of_measurement: "kWh"
        device_class: energy
        state_class: measurement
        availability: >-
          {{ is_number(states('sensor.hoymiles_load_average_4_days'))
             and is_number(
               states('sensor.hoymiles_night_protection_window_duration'))
             and is_number(
               states('sensor.hoymiles_night_protection_window_remaining')) }}
        state: >-
          {% set daily =
            states('sensor.hoymiles_load_average_4_days') | float(0) %}
          {% set duration =
            states('sensor.hoymiles_night_protection_window_duration')
            | float(0) %}
          {% set remaining =
            states('sensor.hoymiles_night_protection_window_remaining')
            | float(0) %}
          {% if remaining <= 0 %}
            0
          {% elif is_number(states('sensor.hoymiles_night_load_average_4_days'))
                  and duration > 0 %}
            {% set night =
              states('sensor.hoymiles_night_load_average_4_days') | float(0) %}
            {{ (night * remaining / duration) | round(2) }}
          {% else %}
            {{ (daily * remaining / 24) | round(2) }}
          {% endif %}
        attributes:
          calculation_method: >-
            {% if is_number(
                states('sensor.hoymiles_night_load_average_4_days')) %}
              night_history
            {% else %}
              daily_average_fallback
            {% endif %}
          full_window_expected_kwh: >-
            {% set daily =
              states('sensor.hoymiles_load_average_4_days') | float(0) %}
            {% set duration =
              states('sensor.hoymiles_night_protection_window_duration')
              | float(0) %}
            {% if is_number(
                states('sensor.hoymiles_night_load_average_4_days')) %}
              {{ states('sensor.hoymiles_night_load_average_4_days') }}
            {% else %}
              {{ (daily * duration / 24) | round(2) }}
            {% endif %}

      - name: "Hoymiles RCE Protected Home Energy"
        unique_id: hoymiles_rce_protected_home_energy
        icon: mdi:home-battery-outline
        unit_of_measurement: "kWh"
        device_class: energy
        state_class: measurement
        availability: >-
          {{ state_attr('sensor.hoymiles_hit_rce_optimized_plan',
                        'protected_home_energy_kwh') is number }}
        state: >-
          {{ state_attr('sensor.hoymiles_hit_rce_optimized_plan',
                        'protected_home_energy_kwh') | float(0) | round(2) }}

      - name: "Hoymiles RCE Dynamic Minimum SOC"
        unique_id: hoymiles_rce_dynamic_minimum_soc
        icon: mdi:battery-lock
        unit_of_measurement: "%"
        state_class: measurement
        availability: >-
          {{ state_attr('sensor.hoymiles_hit_rce_optimized_plan',
                        'minimum_soc') is number }}
        state: >-
          {{ state_attr('sensor.hoymiles_hit_rce_optimized_plan',
                        'minimum_soc') | int(100) }}
        attributes:
          base_outage_reserve_soc: >-
            {{ states('number.hoymiles_hit_self_use_soc') }}
          forecast_tomorrow_kwh: >-
            {{ states('sensor.hoymiles_solcast_forecast_tomorrow') }}
          forecast_today_kwh: >-
            {{ states('sensor.hoymiles_solcast_forecast_today') }}
          forecast_remaining_today_kwh: >-
            {{ states('sensor.hoymiles_solcast_forecast_remaining_today') }}
          average_load_4d_kwh: >-
            {{ states('sensor.hoymiles_load_average_4_days') }}
          expected_deficit_kwh: >-
            {{ states('sensor.hoymiles_rce_energy_deficit_tomorrow') }}
          protected_window_remaining_kwh: >-
            {{ states('sensor.hoymiles_protected_window_expected_load') }}
          protected_home_energy_kwh: >-
            {{ states('sensor.hoymiles_rce_protected_home_energy') }}
          battery_capacity_kwh: >-
            {{ states('sensor.hoymiles_hit_battery_capacity') }}
          safety_margin_percentage_points: >-
            {{ states('input_number.hoymiles_rce_soc_safety_margin') }}
          optimizer_status: >-
            {{ state_attr('sensor.hoymiles_hit_rce_optimized_plan',
                          'status_code') }}

      - name: "Hoymiles RCE Effective Minimum SOC"
        unique_id: hoymiles_rce_effective_minimum_soc
        icon: mdi:battery-lock
        unit_of_measurement: "%"
        state_class: measurement
        availability: >-
          {{ (is_state('input_boolean.hoymiles_rce_dynamic_soc_enabled', 'on')
              and is_number(states('sensor.hoymiles_rce_dynamic_minimum_soc')))
             or (is_state('input_boolean.hoymiles_rce_dynamic_soc_enabled', 'off')
                 and is_number(
                   states('number.hoymiles_hit_force_discharge_soc'))) }}
        state: >-
          {% if is_state('input_boolean.hoymiles_rce_dynamic_soc_enabled', 'on') %}
            {{ states('sensor.hoymiles_rce_dynamic_minimum_soc') }}
          {% else %}
            {{ states('number.hoymiles_hit_force_discharge_soc') }}
          {% endif %}

      - name: "Hoymiles RCE Reserve Status"
        unique_id: hoymiles_rce_reserve_status
        icon: mdi:shield-check-outline
        state: >-
          {% if is_state('input_boolean.hoymiles_rce_dynamic_soc_enabled', 'off') %}
            Tryb ręczny — używany jest próg rozładowania falownika
          {% else %}
            {{ states('sensor.hoymiles_hit_rce_optimized_plan') }}
          {% endif %}

      - name: "Hoymiles RCE Discharge Plan"
        unique_id: hoymiles_rce_discharge_plan
        icon: mdi:calendar-clock
        state: >-
          {{ state_attr('sensor.hoymiles_hit_rce_optimized_plan',
                        'planned_slots') | default([], true) | count }}
        attributes:
          data_dates: >-
            {{ now().strftime('%Y-%m-%d') }},
            {{ (now() + timedelta(days=1)).strftime('%Y-%m-%d') }}
          planned_duration_minutes: >-
            {{ (state_attr('sensor.hoymiles_hit_rce_optimized_plan',
                           'planned_slots') | default([], true) | count) * 30 }}
          periods: >-
            {% set slots = state_attr(
              'sensor.hoymiles_hit_rce_optimized_plan',
              'planned_slots') | default([], true) %}
            {% set ns = namespace(items=[]) %}
            {% for slot in slots %}
              {% set ns.items = ns.items + [
                slot['date'] ~ ' ' ~ slot['start'] ~ '–' ~ slot['end']
                ~ ' (' ~ slot['energy'] ~ ' kWh; '
                ~ slot['price'] ~ ' PLN/kWh)'] %}
            {% endfor %}
            {{ ns.items | join(', ') if ns.items
               else 'Brak zaplanowanych okresów sprzedaży.' }}
          expected_export_kwh: >-
            {{ state_attr('sensor.hoymiles_hit_rce_optimized_plan',
                          'expected_total_export_kwh') }}
          estimated_revenue_pln: >-
            {{ state_attr('sensor.hoymiles_hit_rce_optimized_plan',
                          'estimated_revenue_pln') }}

      - name: "Hoymiles RCE Status"
        unique_id: hoymiles_rce_status
        icon: mdi:transmission-tower-export
        state: >-
          {% if is_state('input_boolean.hoymiles_rce_discharge_enabled', 'off') %}
            Wyłączona
          {% elif is_state('binary_sensor.hoymiles_sale_block_active', 'on') %}
            Blokada sprzedaży — Self-Use
          {% elif is_state('input_boolean.hoymiles_rce_discharge_active', 'on') %}
            Rozładowanie do sieci
          {% elif (states('sensor.hoymiles_hit_overview_battery_soc') | float(0))
                   <= (states('sensor.hoymiles_rce_effective_minimum_soc') | float(100)) %}
            Oczekiwanie — osiągnięto minimalny SOC
          {% elif is_state('input_boolean.hoymiles_discharge_cycle_active', 'on')
               or is_state('input_boolean.hoymiles_charge_cycle_active', 'on') %}
            Oczekiwanie — aktywny harmonogram ręczny
          {% else %}
            {{ states('sensor.hoymiles_hit_rce_optimized_plan') }}
          {% endif %}

    binary_sensor:
      - name: "Hoymiles RCE Price Above Threshold"
        unique_id: hoymiles_rce_price_above_threshold
        icon: mdi:calendar-check
        availability: >-
          {{ state_attr('sensor.hoymiles_hit_rce_optimized_plan',
                        'current_slot_planned') is not none }}
        state: >-
          {{ state_attr('sensor.hoymiles_hit_rce_optimized_plan',
                        'current_slot_planned') | default(false, true) }}

      - name: "Hoymiles RCE Reserve Ready"
        unique_id: hoymiles_rce_reserve_ready
        icon: mdi:shield-check-outline
        state: >-
          {% set status = state_attr(
            'sensor.hoymiles_hit_rce_optimized_plan', 'status_code') %}
          {{ status in ['ready', 'waiting_for_price', 'home_protected'] }}

      - name: "Hoymiles Sale Block Active"
        unique_id: hoymiles_sale_block_active
        icon: mdi:transmission-tower-off
        availability: >-
          {{ states('input_datetime.hoymiles_sale_block_start')
               not in ['unknown', 'unavailable', 'none']
             and states('input_datetime.hoymiles_sale_block_end')
               not in ['unknown', 'unavailable', 'none'] }}
        state: >-
          {% set start_parts =
            states('input_datetime.hoymiles_sale_block_start').split(':') %}
          {% set end_parts =
            states('input_datetime.hoymiles_sale_block_end').split(':') %}
          {% set start = (start_parts[0] | int(0)) * 60
                       + (start_parts[1] | int(0)) %}
          {% set finish = (end_parts[0] | int(0)) * 60
                        + (end_parts[1] | int(0)) %}
          {% set current = now().hour * 60 + now().minute %}
          {% set in_window =
            (start < finish and start <= current < finish)
            or (start > finish and (current >= start or current < finish)) %}
          {{ is_state('input_boolean.hoymiles_sale_block_enabled', 'on')
             and start != finish and in_window }}
        attributes:
          configured_window: >-
            {{ states('input_datetime.hoymiles_sale_block_start')[0:5] }}
            –
            {{ states('input_datetime.hoymiles_sale_block_end')[0:5] }}

timer:
  hoymiles_discharge:
    name: "EMS — pozostały czas rozładowania"
    duration: "01:30:00"
    restore: true
    icon: mdi:timer-outline

  hoymiles_charge:
    name: "EMS — pozostały czas ładowania"
    duration: "01:30:00"
    restore: true
    icon: mdi:timer-outline

script:
  hoymiles_start_grid_discharge:
    alias: "EMS — rozpocznij rozładowanie do sieci"
    description: "Przełącza EMS na rozładowanie poza godzinami blokady sprzedaży i uruchamia timer."
    icon: mdi:transmission-tower-export
    mode: restart
    sequence:
      - condition: state
        entity_id: binary_sensor.hoymiles_sale_block_active
        state: "off"
      - wait_template: >-
          {{ states('select.hoymiles_hit_ems_mode') not in
             ['unknown', 'unavailable', 'none'] }}
        timeout: "00:05:00"
        continue_on_timeout: false
      - action: timer.cancel
        target:
          entity_id: timer.hoymiles_charge
      - action: input_boolean.turn_off
        target:
          entity_id: input_boolean.hoymiles_charge_cycle_active
      - action: select.select_option
        target:
          entity_id: select.hoymiles_hit_ems_mode
        data:
          option: "grid_discharge"
      - action: timer.start
        target:
          entity_id: timer.hoymiles_discharge
        data:
          duration: >-
            {{ (states('input_number.hoymiles_discharge_duration') | int(90)) * 60 }}
      - action: input_boolean.turn_on
        target:
          entity_id: input_boolean.hoymiles_discharge_cycle_active

  hoymiles_start_grid_charge:
    alias: "EMS — rozpocznij ładowanie z sieci"
    description: "Przełącza EMS na ładowanie i uruchamia timer z czasu ustawionego na dashboardzie."
    icon: mdi:transmission-tower-import
    mode: restart
    sequence:
      - wait_template: >-
          {{ states('select.hoymiles_hit_ems_mode') not in
             ['unknown', 'unavailable', 'none'] }}
        timeout: "00:05:00"
        continue_on_timeout: false
      - action: timer.cancel
        target:
          entity_id: timer.hoymiles_discharge
      - action: input_boolean.turn_off
        target:
          entity_id: input_boolean.hoymiles_discharge_cycle_active
      - action: select.select_option
        target:
          entity_id: select.hoymiles_hit_ems_mode
        data:
          option: "grid_charge"
      - action: timer.start
        target:
          entity_id: timer.hoymiles_charge
        data:
          duration: >-
            {{ (states('input_number.hoymiles_charge_duration') | int(90)) * 60 }}
      - action: input_boolean.turn_on
        target:
          entity_id: input_boolean.hoymiles_charge_cycle_active

  hoymiles_stop_scheduled_cycle:
    alias: "EMS — zatrzymaj cykl i wróć do Self-Use"
    description: "Kończy oba timery i bezpiecznie przełącza falownik na autokonsumpcję."
    icon: mdi:stop-circle-outline
    mode: restart
    sequence:
      - action: timer.cancel
        target:
          entity_id:
            - timer.hoymiles_discharge
            - timer.hoymiles_charge
      - action: input_boolean.turn_off
        target:
          entity_id:
            - input_boolean.hoymiles_discharge_cycle_active
            - input_boolean.hoymiles_charge_cycle_active
      - wait_template: >-
          {{ states('select.hoymiles_hit_ems_mode') not in
             ['unknown', 'unavailable', 'none'] }}
        timeout: "00:05:00"
        continue_on_timeout: false
      - action: select.select_option
        target:
          entity_id: select.hoymiles_hit_ems_mode
        data:
          option: "self_use"

automation:
  - id: hoymiles_initialize_solcast_forecast_entity
    alias: "EMS RCE — ustaw domyślną encję Solcast"
    description: >-
      Wykrywa angielskie albo polskie encje Forecast Today i Forecast Tomorrow
      integracji Solcast PV Forecast producenta BJReplay. Poprawne własne encje
      użytkownika są zachowywane.
    mode: single
    triggers:
      - trigger: homeassistant
        event: start
    actions:
      - delay: "00:00:15"
      - if:
          - condition: template
            value_template: >-
              {% set configured =
                states('input_text.hoymiles_solcast_forecast_today_entity')
                | trim %}
              {% set candidates = [
                configured,
                'sensor.solcast_pv_forecast_forecast_today',
                'sensor.solcast_pv_forecast_prognoza_na_dzisiaj',
                'sensor.solcast_forecast_today'
              ] %}
              {% set ns = namespace(entity='') %}
              {% for entity in candidates if entity and not ns.entity %}
                {% if is_number(states(entity)) %}
                  {% set ns.entity = entity %}
                {% endif %}
              {% endfor %}
              {{ ns.entity != '' and ns.entity != configured }}
        then:
          - action: input_text.set_value
            target:
              entity_id: input_text.hoymiles_solcast_forecast_today_entity
            data:
              value: >-
                {% set configured =
                  states('input_text.hoymiles_solcast_forecast_today_entity')
                  | trim %}
                {% set candidates = [
                  configured,
                  'sensor.solcast_pv_forecast_forecast_today',
                  'sensor.solcast_pv_forecast_prognoza_na_dzisiaj',
                  'sensor.solcast_forecast_today'
                ] %}
                {% set ns = namespace(entity='') %}
                {% for entity in candidates if entity and not ns.entity %}
                  {% if is_number(states(entity)) %}
                    {% set ns.entity = entity %}
                  {% endif %}
                {% endfor %}
                {{ ns.entity }}
      - if:
          - condition: template
            value_template: >-
              {% set configured =
                states('input_text.hoymiles_solcast_forecast_tomorrow_entity')
                | trim %}
              {% set candidates = [
                configured,
                'sensor.solcast_pv_forecast_forecast_tomorrow',
                'sensor.solcast_pv_forecast_prognoza_na_jutro',
                'sensor.solcast_forecast_tomorrow'
              ] %}
              {% set ns = namespace(entity='') %}
              {% for entity in candidates if entity and not ns.entity %}
                {% if is_number(states(entity)) %}
                  {% set ns.entity = entity %}
                {% endif %}
              {% endfor %}
              {{ ns.entity != '' and ns.entity != configured }}
        then:
          - action: input_text.set_value
            target:
              entity_id: input_text.hoymiles_solcast_forecast_tomorrow_entity
            data:
              value: >-
                {% set configured =
                  states('input_text.hoymiles_solcast_forecast_tomorrow_entity')
                  | trim %}
                {% set candidates = [
                  configured,
                  'sensor.solcast_pv_forecast_forecast_tomorrow',
                  'sensor.solcast_pv_forecast_prognoza_na_jutro',
                  'sensor.solcast_forecast_tomorrow'
                ] %}
                {% set ns = namespace(entity='') %}
                {% for entity in candidates if entity and not ns.entity %}
                  {% if is_number(states(entity)) %}
                    {% set ns.entity = entity %}
                  {% endif %}
                {% endfor %}
                {{ ns.entity }}

  - id: hoymiles_rce_sync_dynamic_minimum_soc
    alias: "EMS RCE — zapisz dynamiczną rezerwę SOC"
    description: >-
      Zapisuje do falownika wyliczony minimalny SOC rozładowania. Plan chroni
      zasilanie domu od teraz, przez dzisiejszą noc, kolejny dzień i następną
      noc do 90 minut po wschodzie, a następnie wybiera najdroższe okna RCE.
    mode: restart
    triggers:
      - trigger: state
        entity_id:
          - input_boolean.hoymiles_rce_dynamic_soc_enabled
          - input_number.hoymiles_rce_soc_safety_margin
          - number.hoymiles_hit_self_use_soc
          - sensor.hoymiles_hit_battery_capacity
          - sensor.hoymiles_solcast_forecast_today
          - sensor.hoymiles_solcast_forecast_remaining_today
          - sensor.hoymiles_solcast_forecast_tomorrow
          - sensor.hoymiles_load_average_4_days
          - sensor.hoymiles_night_load_average_4_days
          - sensor.hoymiles_night_protection_window_remaining
          - sensor.hoymiles_protected_window_expected_load
          - sensor.hoymiles_rce_energy_deficit_tomorrow
          - sensor.hoymiles_rce_protected_home_energy
          - sensor.hoymiles_rce_dynamic_minimum_soc
          - binary_sensor.hoymiles_rce_reserve_ready
          - sensor.hoymiles_hit_rce_optimized_plan
      - trigger: time_pattern
        minutes: "/5"
      - trigger: homeassistant
        event: start
    conditions:
      - condition: state
        entity_id: input_boolean.hoymiles_rce_dynamic_soc_enabled
        state: "on"
      - condition: state
        entity_id: binary_sensor.hoymiles_rce_reserve_ready
        state: "on"
      - condition: template
        value_template: >-
          {{ is_number(states('sensor.hoymiles_rce_dynamic_minimum_soc'))
             and is_number(
               states('number.hoymiles_hit_force_discharge_soc')) }}
      - condition: template
        value_template: >-
          {{ ((states('number.hoymiles_hit_force_discharge_soc')
                | float(0))
              - (states('sensor.hoymiles_rce_dynamic_minimum_soc')
                 | float(0))) | abs >= 0.5 }}
    actions:
      - action: number.set_value
        target:
          entity_id: number.hoymiles_hit_force_discharge_soc
        data:
          value: >-
            {{ states('sensor.hoymiles_rce_dynamic_minimum_soc') | float(100) }}

  - id: hoymiles_enforce_sale_block
    alias: "EMS — wymuś blokadę sprzedaży"
    description: >-
      W godzinach blokady zatrzymuje każde rozładowanie do sieci i przełącza
      falownik na Autokonsumpcję (Self-Use). Ładowanie z sieci pozostaje dozwolone.
    mode: restart
    triggers:
      - trigger: state
        entity_id: binary_sensor.hoymiles_sale_block_active
        to: "on"
      - trigger: state
        entity_id: select.hoymiles_hit_ems_mode
        to: "grid_discharge"
      - trigger: homeassistant
        event: start
    conditions:
      - condition: state
        entity_id: binary_sensor.hoymiles_sale_block_active
        state: "on"
    actions:
      - action: timer.cancel
        target:
          entity_id: timer.hoymiles_discharge
      - action: input_boolean.turn_off
        target:
          entity_id:
            - input_boolean.hoymiles_discharge_cycle_active
            - input_boolean.hoymiles_rce_discharge_active
      - wait_template: >-
          {{ states('select.hoymiles_hit_ems_mode') not in
             ['unknown', 'unavailable', 'none'] }}
        timeout: "00:05:00"
        continue_on_timeout: false
      - if:
          - condition: state
            entity_id: select.hoymiles_hit_ems_mode
            state: "grid_discharge"
        then:
          - action: select.select_option
            target:
              entity_id: select.hoymiles_hit_ems_mode
            data:
              option: "self_use"

  - id: hoymiles_rce_grid_discharge_control
    alias: "EMS RCE — sterowanie rozładowaniem według ceny"
    description: >-
      Co minutę sprawdza dwudniowy plan optymalizatora. Rozładowuje tylko w
      wybranych najdroższych blokach, powyżej progu użytkownika i ponad SOC
      potrzebnym do zasilenia domu. Ręczne timery mają pierwszeństwo.
    mode: restart
    triggers:
      - trigger: time_pattern
        minutes: "/1"
      - trigger: state
        entity_id:
          - sensor.hoymiles_rce_current_price
          - sensor.hoymiles_hit_rce_optimized_plan
          - binary_sensor.hoymiles_rce_price_above_threshold
          - input_boolean.hoymiles_rce_discharge_enabled
          - input_boolean.hoymiles_sale_block_enabled
          - input_datetime.hoymiles_sale_block_start
          - input_datetime.hoymiles_sale_block_end
          - binary_sensor.hoymiles_sale_block_active
          - input_boolean.hoymiles_discharge_cycle_active
          - input_boolean.hoymiles_charge_cycle_active
          - timer.hoymiles_discharge
          - timer.hoymiles_charge
          - sensor.hoymiles_hit_overview_battery_soc
          - number.hoymiles_hit_force_discharge_soc
          - input_boolean.hoymiles_rce_dynamic_soc_enabled
          - input_number.hoymiles_rce_soc_safety_margin
          - sensor.hoymiles_rce_effective_minimum_soc
          - sensor.hoymiles_rce_dynamic_minimum_soc
          - binary_sensor.hoymiles_rce_reserve_ready
      - trigger: homeassistant
        event: start
    actions:
      - choose:
          # Jeśli w trakcie pracy RCE uruchomiono ręczny timer, automatyka RCE
          # oddaje mu sterowanie i nie zmienia ustawionego przez niego trybu.
          - conditions:
              - condition: state
                entity_id: input_boolean.hoymiles_rce_discharge_active
                state: "on"
              - condition: or
                conditions:
                  - condition: state
                    entity_id: input_boolean.hoymiles_discharge_cycle_active
                    state: "on"
                  - condition: state
                    entity_id: input_boolean.hoymiles_charge_cycle_active
                    state: "on"
            sequence:
              - action: input_boolean.turn_off
                target:
                  entity_id: input_boolean.hoymiles_rce_discharge_active

          # Start RCE: cena powyżej progu, zapas SOC i brak ręcznego cyklu.
          - conditions:
              - condition: state
                entity_id: input_boolean.hoymiles_rce_discharge_enabled
                state: "on"
              - condition: state
                entity_id: input_boolean.hoymiles_rce_discharge_active
                state: "off"
              - condition: state
                entity_id: binary_sensor.hoymiles_rce_price_above_threshold
                state: "on"
              - condition: state
                entity_id: binary_sensor.hoymiles_sale_block_active
                state: "off"
              - condition: state
                entity_id: binary_sensor.hoymiles_rce_reserve_ready
                state: "on"
              - condition: template
                value_template: >-
                  {{ (states('sensor.hoymiles_hit_overview_battery_soc') | float(0))
                     > (states('sensor.hoymiles_rce_effective_minimum_soc') | float(100)) }}
              - condition: state
                entity_id: input_boolean.hoymiles_discharge_cycle_active
                state: "off"
              - condition: state
                entity_id: input_boolean.hoymiles_charge_cycle_active
                state: "off"
              - condition: template
                value_template: >-
                  {{ not is_state('timer.hoymiles_discharge', 'active')
                     and not is_state('timer.hoymiles_charge', 'active')
                     and states('select.hoymiles_hit_ems_mode')
                       not in ['unknown', 'unavailable', 'none'] }}
            sequence:
              - if:
                  - condition: state
                    entity_id: input_boolean.hoymiles_rce_dynamic_soc_enabled
                    state: "on"
                then:
                  - action: number.set_value
                    target:
                      entity_id: number.hoymiles_hit_force_discharge_soc
                    data:
                      value: >-
                        {{ states('sensor.hoymiles_rce_effective_minimum_soc')
                           | float(100) }}
                  - wait_template: >-
                      {{ ((states(
                           'number.hoymiles_hit_force_discharge_soc')
                           | float(0))
                          - (states(
                            'sensor.hoymiles_rce_effective_minimum_soc')
                            | float(100))) | abs < 1.0 }}
                    timeout: "00:01:00"
                    continue_on_timeout: false
              - action: select.select_option
                target:
                  entity_id: select.hoymiles_hit_ems_mode
                data:
                  option: "grid_discharge"
              - action: input_boolean.turn_on
                target:
                  entity_id: input_boolean.hoymiles_rce_discharge_active

          # Stop RCE: cena spadła, osiągnięto minimalny SOC, wyłączono
          # automatykę albo dane PSE stały się niedostępne.
          - conditions:
              - condition: state
                entity_id: input_boolean.hoymiles_rce_discharge_active
                state: "on"
              - condition: template
                value_template: >-
                  {{ is_state('input_boolean.hoymiles_rce_discharge_enabled', 'off')
                     or is_state('binary_sensor.hoymiles_sale_block_active', 'on')
                     or is_state('binary_sensor.hoymiles_rce_reserve_ready', 'off')
                     or not is_state('binary_sensor.hoymiles_rce_price_above_threshold', 'on')
                     or (states('sensor.hoymiles_hit_overview_battery_soc') | float(0))
                        <= (states('sensor.hoymiles_rce_effective_minimum_soc') | float(100)) }}
              - condition: template
                value_template: >-
                  {{ states('select.hoymiles_hit_ems_mode')
                     not in ['unknown', 'unavailable', 'none'] }}
            sequence:
              - if:
                  - condition: state
                    entity_id: select.hoymiles_hit_ems_mode
                    state: "grid_discharge"
                then:
                  - action: select.select_option
                    target:
                      entity_id: select.hoymiles_hit_ems_mode
                    data:
                      option: "self_use"
              - action: input_boolean.turn_off
                target:
                  entity_id: input_boolean.hoymiles_rce_discharge_active

  - id: hoymiles_daily_grid_discharge
    alias: "EMS — codzienne rozładowanie do sieci"
    description: "Uruchamia rozładowanie codziennie o godzinie ustawionej na dashboardzie."
    mode: single
    triggers:
      - trigger: time
        at: input_datetime.hoymiles_discharge_start
    conditions:
      - condition: state
        entity_id: input_boolean.hoymiles_discharge_schedule_enabled
        state: "on"
      - condition: state
        entity_id: binary_sensor.hoymiles_sale_block_active
        state: "off"
    actions:
      - action: script.hoymiles_start_grid_discharge

  - id: hoymiles_daily_grid_charge
    alias: "EMS — codzienne ładowanie z sieci"
    description: "Uruchamia ładowanie codziennie o godzinie ustawionej na dashboardzie."
    mode: single
    triggers:
      - trigger: time
        at: input_datetime.hoymiles_charge_start
    conditions:
      - condition: state
        entity_id: input_boolean.hoymiles_charge_schedule_enabled
        state: "on"
    actions:
      - action: script.hoymiles_start_grid_charge

  - id: hoymiles_finish_grid_discharge
    alias: "EMS — zakończ rozładowanie i wróć do Self-Use"
    mode: single
    triggers:
      - trigger: timer.finished
        target:
          entity_id: timer.hoymiles_discharge
    actions:
      - wait_template: >-
          {{ states('select.hoymiles_hit_ems_mode') not in
             ['unknown', 'unavailable', 'none'] }}
        timeout: "01:00:00"
        continue_on_timeout: false
      - if:
          - condition: state
            entity_id: select.hoymiles_hit_ems_mode
            state: "grid_discharge"
        then:
          - action: select.select_option
            target:
              entity_id: select.hoymiles_hit_ems_mode
            data:
              option: "self_use"
      - action: input_boolean.turn_off
        target:
          entity_id: input_boolean.hoymiles_discharge_cycle_active

  - id: hoymiles_finish_grid_charge
    alias: "EMS — zakończ ładowanie i wróć do Self-Use"
    mode: single
    triggers:
      - trigger: timer.finished
        target:
          entity_id: timer.hoymiles_charge
    actions:
      - wait_template: >-
          {{ states('select.hoymiles_hit_ems_mode') not in
             ['unknown', 'unavailable', 'none'] }}
        timeout: "01:00:00"
        continue_on_timeout: false
      - if:
          - condition: state
            entity_id: select.hoymiles_hit_ems_mode
            state: "grid_charge"
        then:
          - action: select.select_option
            target:
              entity_id: select.hoymiles_hit_ems_mode
            data:
              option: "self_use"
      - action: input_boolean.turn_off
        target:
          entity_id: input_boolean.hoymiles_charge_cycle_active

  - id: hoymiles_restore_ems_cycle_after_ha_restart
    alias: "EMS — odzyskaj cykl po restarcie Home Assistant"
    description: "Wznawia aktywny cykl albo wraca do Self-Use, jeśli timer upłynął podczas wyłączenia HA."
    mode: single
    triggers:
      - trigger: homeassistant
        event: start
    actions:
      - delay: "00:00:15"
      - choose:
          - conditions:
              - condition: state
                entity_id: input_boolean.hoymiles_discharge_cycle_active
                state: "on"
              - condition: state
                entity_id: timer.hoymiles_discharge
                state: "active"
              - condition: state
                entity_id: binary_sensor.hoymiles_sale_block_active
                state: "off"
            sequence:
              - wait_template: >-
                  {{ states('select.hoymiles_hit_ems_mode') not in
                     ['unknown', 'unavailable', 'none'] }}
                timeout: "00:05:00"
                continue_on_timeout: false
              - action: select.select_option
                target:
                  entity_id: select.hoymiles_hit_ems_mode
                data:
                  option: "grid_discharge"
          - conditions:
              - condition: state
                entity_id: input_boolean.hoymiles_discharge_cycle_active
                state: "on"
            sequence:
              - wait_template: >-
                  {{ states('select.hoymiles_hit_ems_mode') not in
                     ['unknown', 'unavailable', 'none'] }}
                timeout: "00:05:00"
                continue_on_timeout: false
              - action: select.select_option
                target:
                  entity_id: select.hoymiles_hit_ems_mode
                data:
                  option: "self_use"
              - action: input_boolean.turn_off
                target:
                  entity_id: input_boolean.hoymiles_discharge_cycle_active
      - choose:
          - conditions:
              - condition: state
                entity_id: input_boolean.hoymiles_charge_cycle_active
                state: "on"
              - condition: state
                entity_id: timer.hoymiles_charge
                state: "active"
            sequence:
              - wait_template: >-
                  {{ states('select.hoymiles_hit_ems_mode') not in
                     ['unknown', 'unavailable', 'none'] }}
                timeout: "00:05:00"
                continue_on_timeout: false
              - action: select.select_option
                target:
                  entity_id: select.hoymiles_hit_ems_mode
                data:
                  option: "grid_charge"
          - conditions:
              - condition: state
                entity_id: input_boolean.hoymiles_charge_cycle_active
                state: "on"
            sequence:
              - wait_template: >-
                  {{ states('select.hoymiles_hit_ems_mode') not in
                     ['unknown', 'unavailable', 'none'] }}
                timeout: "00:05:00"
                continue_on_timeout: false
              - action: select.select_option
                target:
                  entity_id: select.hoymiles_hit_ems_mode
                data:
                  option: "self_use"
              - action: input_boolean.turn_off
                target:
                  entity_id: input_boolean.hoymiles_charge_cycle_active
