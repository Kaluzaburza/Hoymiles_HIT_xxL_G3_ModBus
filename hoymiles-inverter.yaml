# Public ESPHome entry point for Hoymiles HIT xxL G3 Modbus.
# This file is self-contained: ESPHome downloads all register packages from
# the versioned GitHub release. Only this file and the required secrets need
# to be copied to the user's ESPHome configuration directory.
#
# Wiring: use a 3.3 V logic-compatible UART/TTL <-> RS485 converter.
# Automatic-direction converters need TX, RX and GND. MAX3485/MAX485 modules
# with DE and /RE need an additional GPIO and the UART override from README.
# Protocol: Modbus RTU, 115200 8N1. FC03 read holding, FC04 read input, FC06/FC10 write.

substitutions:
  name: "hoymiles-inverter"
  friendly_name: "Hoymiles Inverter"
  device_description: "Hoymiles Energy Storage Inverter (Modbus V2.4)"

  modbus_controller_id: hoymiles_modbus
  modbus_fast_controller_id: hoymiles_modbus_fast
  modbus_control_controller_id: hoymiles_modbus_control
  modbus_settings_controller_id: hoymiles_modbus_settings
  modbus_inverter_address: "1"      # Modbus slave/unit address of the inverter
  baud_rate: "115200"
  # Stabilny cykl operacyjny. Przy 5 s pełna mapa rejestrów nie opróżniała
  # kolejki przed następnym wywołaniem i ESPHome odrzucał duplikaty poleceń.
  fast_update_interval: "13s"
  control_update_interval: "5s"
  settings_update_interval: "20s"
  update_interval: "150s"

  # RS485 UART pins (adjust to your board)
  uart_tx_pin: "GPIO17"
  uart_rx_pin: "GPIO16"
  # Read the README before wiring: TX goes to the converter input (DI/RXD),
  # RX goes to its output (RO/TXD). Manual-direction modules also need DE+/RE.

  board: "esp32dev"

  # Secrets (create secrets.yaml from secrets.yaml.example)
  wifi_ssid: !secret wifi_ssid
  wifi_password: !secret wifi_password
  fallback_password: !secret fallback_password
  api_key: !secret api_key
  ota_password: !secret ota_password

esp32:
  board: ${board}
  framework:
    type: esp-idf
    advanced:
      minimum_chip_revision: "3.1"
      sram1_as_iram: true

# ESPHome can recognize and adopt the complete public configuration from its
# dashboard. Firmware changes still require an explicit build and upload.
# Secrets remain local and are never downloaded from or uploaded to GitHub.
dashboard_import:
  package_import_url: github://Kaluzaburza/Hoymiles_HIT_xxL_G3_ModBus/hoymiles-inverter.yaml@main
  import_full_config: true

# Ograniczamy szczegółowe logi magistrali, zachowując komunikaty INFO potrzebne
# do potwierdzenia pełnego handshake API i diagnostyki sieci.
# `baud_rate: 0` z packages/core.yaml pozostaje zachowane przez scalanie pakietów.
logger:
  level: INFO
  logs:
    modbus: WARN
    modbus_controller: WARN

packages:
  hoymiles_hit_g3:
    url: https://github.com/Kaluzaburza/Hoymiles_HIT_xxL_G3_ModBus
    ref: v1.5.3
    refresh: 1d
    files:
      - packages/core.yaml
      - packages/network.yaml
      - packages/modbus_connection.yaml
      - packages/parallel_network.yaml
      - packages/settings.yaml
      - packages/system.yaml
      - packages/states_alarms.yaml
      - packages/inverter.yaml
      - packages/grid.yaml
      - packages/backup_load.yaml
      - packages/generator.yaml
      - packages/pv.yaml
      - packages/battery.yaml
      - packages/energy_flow.yaml
      - packages/meters.yaml
      - packages/overview.yaml
      - packages/diagnostics.yaml
