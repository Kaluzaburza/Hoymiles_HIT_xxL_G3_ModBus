# Dashboard Home Assistant dla Hoymiles Energy Storage
#
# Wklej CAŁĄ zawartość do edytora surowej konfiguracji nowego dashboardu.
# Animowany przepływ mocy używa zainstalowanej karty HACS
# custom:sunsynk-power-flow-card. Pozostałe karty są standardowe.
# Identyfikatory encji są zgodne z rzeczywistym rejestrem tej instancji HA.
# Encje utworzone po zmianach nazw mają dodatkowy prefiks pv_hoymiles_inverter_.
# Karty harmonogramów EMS wymagają pakietu home_assistant/hoymiles_ems_scheduler.yaml.
# Obejmuje wszystkie aktywne encje; pominięta jest tylko jedna encja oznaczona
# w ESPHome jako disabled_by_default (opisana w zakładce Sterowanie).

title: Hoymiles Energy Storage
views:
  - title: Start
    path: start
    icon: mdi:view-dashboard
    type: sidebar
    badges: []
    cards:
      - type: markdown
        content: >-
          ## Hoymiles — panel operacyjny

          Najważniejsze dane do codziennej obsługi falownika. Szczegółowe
          rejestry są w osobnych zakładkach.
      - type: glance
        title: Bieżący przepływ mocy
        columns: 5
        show_name: true
        show_state: true
        state_color: true
        entities:
          - entity: sensor.pv_hoymiles_inverter_overview_pv_total_power
            name: PV
          - entity: sensor.pv_hoymiles_inverter_overview_load_active_power
            name: Load
          - entity: sensor.pv_hoymiles_inverter_overview_grid_total_active_power
            name: Grid
          - entity: sensor.pv_hoymiles_inverter_overview_battery_power
            name: Battery
          - entity: sensor.pv_hoymiles_inverter_overview_battery_soc
            name: SOC
      - type: entities
        title: Sieć — wartości bieżące
        show_header_toggle: false
        state_color: true
        entities:
          - entity: sensor.pv_hoymiles_inverter_grid_voltage_l1
            name: Napięcie L1
          - entity: sensor.pv_hoymiles_inverter_grid_current_l1n
            name: Prąd L1
          - entity: sensor.pv_hoymiles_inverter_grid_voltage_l2
            name: Napięcie L2
          - entity: sensor.pv_hoymiles_inverter_grid_current_l2n
            name: Prąd L2
          - entity: sensor.pv_hoymiles_inverter_grid_voltage_l3
            name: Napięcie L3
          - entity: sensor.pv_hoymiles_inverter_grid_current_l3n
            name: Prąd L3
          - entity: sensor.pv_hoymiles_inverter_inverter_grid_frequency
            name: Częstotliwość
          - entity: sensor.pv_hoymiles_inverter_grid_total_current
            name: Prąd łączny (suma faz)
      - type: entities
        title: Sterowanie EMS
        show_header_toggle: false
        state_color: true
        view_layout:
          position: sidebar
        entities:
          - entity: select.pv_hoymiles_inverter_tryb_ems
            name: Tryb pracy
      - type: entities
        title: Parametry ochrony i temperatury
        show_header_toggle: false
        state_color: true
        view_layout:
          position: sidebar
        entities:
          - entity: sensor.hoymiles_inverter_inv_ths_temp
            name: Temperatura radiatora falownika
          - entity: sensor.hoymiles_inverter_bat_ths_temp
            name: Temperatura radiatora toru baterii
          - entity: sensor.hoymiles_inverter_cav_temp
            name: Temperatura wnętrza falownika (CAV)
          - entity: sensor.hoymiles_inverter_pe_voltage
            name: Napięcie PP
          - entity: sensor.hoymiles_inverter_iso_resistor
            name: Rezystancja izolacji
          - entity: sensor.hoymiles_inverter_residual_current
            name: Prąd różnicowy
      - type: custom:sunsynk-power-flow-card
        title: Bieżący przepływ energii
        cardstyle: lite
        wide: true
        show_solar: true
        show_battery: true
        show_grid: true
        decimal_places: 0
        dynamic_line_width: true
        min_line_width: 1
        max_line_width: 4
        inverter:
          modern: true
          autarky: "no"
          auto_scale: true
        battery:
          energy: 21000
          shutdown_soc: 10
          colour: "#00BCD4"
          charge_colour: "#00BCD4"
          animation_speed: 6
          max_power: 10000
          show_absolute: true
          dynamic_colour: false
          animate: true
        solar:
          mppts: 1
          pv1_name: PV
          colour: "#4CAF50"
          animation_speed: 6
          max_power: 10000
          dynamic_colour: true
        load:
          essential_name: Odbiory
          show_aux: false
          colour: "#00BCD4"
          animation_speed: 6
          max_power: 10000
          dynamic_colour: true
        grid:
          grid_name: Sieć
          show_nonessential: false
          show_absolute: true
          animation_speed: 6
          max_power: 10000
          dynamic_colour: true
          invert_grid: true
        entities:
          inverter_power_175: sensor.pv_hoymiles_inverter_overview_inverter_active_power
          grid_power_169: sensor.pv_hoymiles_inverter_overview_grid_total_active_power
          grid_ct_power_172: sensor.pv_hoymiles_inverter_overview_grid_total_active_power
          battery_soc_184: sensor.pv_hoymiles_inverter_overview_battery_soc
          battery_power_190: sensor.pv_hoymiles_inverter_overview_battery_power
          battery_current_191: sensor.pv_hoymiles_inverter_battery_current_bms
          battery_voltage_183: sensor.pv_hoymiles_inverter_battery_voltage_bms
          essential_power: sensor.pv_hoymiles_inverter_overview_load_active_power
          pv1_power_186: sensor.pv_hoymiles_inverter_overview_pv_total_power
      - type: vertical-stack
        cards:
          - type: glance
            title: Podsumowanie dzienne — energia z PV
            columns: 1
            show_name: true
            show_state: true
            state_color: true
            entities:
              - entity: sensor.hoymiles_inverter_pv_total_energy_today
                name: Wyprodukowano dzisiaj
          - type: glance
            columns: 3
            show_name: true
            show_state: true
            state_color: true
            entities:
              - entity: sensor.pv_hoymiles_inverter_pv_to_load_energy_today
                name: Do domu
              - entity: sensor.pv_hoymiles_inverter_pv_to_battery_energy_today
                name: Do baterii
              - entity: sensor.pv_hoymiles_inverter_pv_to_grid_energy_today
                name: Do sieci
      - type: history-graph
        title: Moc — ostatnie 24 godziny [W]
        hours_to_show: 24
        entities:
          - entity: sensor.pv_hoymiles_inverter_overview_pv_total_power
            name: PV
          - entity: sensor.pv_hoymiles_inverter_overview_load_active_power
            name: Load
          - entity: sensor.pv_hoymiles_inverter_overview_grid_total_active_power
            name: Grid
          - entity: sensor.pv_hoymiles_inverter_overview_battery_power
            name: Battery
      - type: entities
        title: Stan systemu i łączność
        show_header_toggle: false
        state_color: true
        view_layout:
          position: sidebar
        entities:
          - sensor.pv_hoymiles_inverter_inverter_work_status
          - sensor.pv_hoymiles_inverter_overview_system_work_status
          - sensor.pv_hoymiles_inverter_meter_link_status
          - sensor.pv_hoymiles_inverter_pv_link_status
          - sensor.pv_hoymiles_inverter_battery_link_status
          - sensor.pv_hoymiles_inverter_battery_work_status_bms
      - type: entities
        title: Alarmy — szybki podgląd
        show_header_toggle: false
        state_color: true
        view_layout:
          position: sidebar
        entities:
          - sensor.pv_hoymiles_inverter_sw_fault
          - sensor.pv_hoymiles_inverter_hw_fault
          - sensor.pv_hoymiles_inverter_battery_fault_code_bms
          - sensor.pv_hoymiles_inverter_overview_battery_faults
          - sensor.pv_hoymiles_inverter_overview_dsp_power_faults
          - sensor.pv_hoymiles_inverter_dsp_safety_faults
          - sensor.pv_hoymiles_inverter_arm_communication_faults
          - sensor.pv_hoymiles_inverter_arm_peripheral_faults
          - sensor.pv_hoymiles_inverter_arm_system_faults
  - title: Automatyka EMS
    path: automatyka-ems
    icon: mdi:calendar-clock
    type: sidebar
    badges: []
    cards:
      - type: entities
        title: Automatyka RCE — ustawienia
        show_header_toggle: false
        state_color: true
        entities:
          - entity: input_boolean.hoymiles_rce_discharge_enabled
            name: Włącz automatyczne rozładowanie według RCE
          - entity: input_number.hoymiles_rce_price_threshold
            name: Minimalna cena sprzedaży
          - entity: number.pv_hoymiles_inverter_maximum_discharge_power
            name: Moc rozładowania do sieci
          - entity: number.pv_hoymiles_inverter_force_discharge_soc
            name: Minimalny SOC akumulatora
          - type: section
            label: Blokada sprzedaży
          - entity: input_boolean.hoymiles_sale_block_enabled
            name: Włącz blokadę sprzedaży
          - entity: input_datetime.hoymiles_sale_block_start
            name: Początek blokady
          - entity: input_datetime.hoymiles_sale_block_end
            name: Koniec blokady
          - entity: binary_sensor.hoymiles_sale_block_active
            name: Blokada aktywna teraz
          - entity: sensor.hoymiles_rce_current_price
            name: Bieżąca cena RCE
          - entity: sensor.hoymiles_rce_status
            name: Stan automatyki
      - type: vertical-stack
        cards:
          - type: custom:hoymiles-rce-chart-card
            title: RCE — ceny i plan rozładowania
            entity: sensor.hoymiles_rce_day
            current_price_entity: sensor.hoymiles_rce_current_price
            threshold_entity: input_number.hoymiles_rce_price_threshold
            active_entity: input_boolean.hoymiles_rce_discharge_active
            block_enabled_entity: input_boolean.hoymiles_sale_block_enabled
            block_start_entity: input_datetime.hoymiles_sale_block_start
            block_end_entity: input_datetime.hoymiles_sale_block_end
      - type: markdown
        title: Plan rozładowań RCE
        entity_id:
          - sensor.hoymiles_rce_discharge_plan
          - input_number.hoymiles_rce_price_threshold
          - input_boolean.hoymiles_sale_block_enabled
          - input_datetime.hoymiles_sale_block_start
          - input_datetime.hoymiles_sale_block_end
        content: |-
          {% set periods = state_attr('sensor.hoymiles_rce_discharge_plan', 'periods') %}
          {% set minutes = state_attr('sensor.hoymiles_rce_discharge_plan',
                                     'planned_duration_minutes') | int(0) %}
          {% set date = state_attr('sensor.hoymiles_rce_discharge_plan', 'data_date') %}
          **Dzień:** {{ date }}<br>
          **Okresy powyżej ustawionego progu:**<br>
          {{ periods or 'Brak danych do przygotowania planu.' }}

          **Łączny plan:** {{ minutes // 60 }} h
          {{ minutes % 60 }} min ({{ states('sensor.hoymiles_rce_discharge_plan') }}
          bloków po 30 min)

          Automatyka wróci do **Autokonsumpcji (Self-Use)** po spadku ceny do
          progu lub niżej, po osiągnięciu minimalnego SOC albo po wyłączeniu
          przełącznika. W czasie aktywnej blokady sprzedaży okresy są pomijane,
          a falownik pozostaje w trybie Self-Use.
      - type: markdown
        view_layout:
          position: sidebar
        content: >-
          ## Codzienne harmonogramy EMS

          Każdy harmonogram działa codziennie, dopóki jego przełącznik jest
          włączony. Po upływie ustawionego czasu falownik wraca do
          autokonsumpcji.

          Nie ustawiaj ładowania i rozładowania na tę samą godzinę.
          Wyłączenie przełącznika blokuje kolejne uruchomienia.
      - type: entities
        title: Rozładowanie do sieci
        show_header_toggle: false
        state_color: true
        entities:
          - entity: input_boolean.hoymiles_discharge_schedule_enabled
            name: Włącz harmonogram codzienny
          - entity: input_datetime.hoymiles_discharge_start
            name: Godzina rozpoczęcia
          - entity: input_number.hoymiles_discharge_duration
            name: Czas trwania
          - entity: number.pv_hoymiles_inverter_force_discharge_soc
            name: Minimalny SOC — rozładowanie do sieci
          - entity: number.pv_hoymiles_inverter_maximum_discharge_power
            name: Maks. moc rozładowania do sieci
          - entity: timer.hoymiles_discharge
            name: Pozostały czas bieżącego cyklu
          - entity: script.hoymiles_start_grid_discharge
            name: Uruchom rozładowanie teraz
      - type: entities
        title: Ładowanie z sieci
        show_header_toggle: false
        state_color: true
        entities:
          - entity: input_boolean.hoymiles_charge_schedule_enabled
            name: Włącz harmonogram codzienny
          - entity: input_datetime.hoymiles_charge_start
            name: Godzina rozpoczęcia
          - entity: input_number.hoymiles_charge_duration
            name: Czas trwania
          - entity: number.pv_hoymiles_inverter_force_charge_soc
            name: Docelowy SOC — ładowanie z sieci
          - entity: number.pv_hoymiles_inverter_maximum_charge_power
            name: Maks. moc ładowania z sieci
          - entity: timer.hoymiles_charge
            name: Pozostały czas bieżącego cyklu
          - entity: script.hoymiles_start_grid_charge
            name: Uruchom ładowanie teraz
      - type: entities
        title: Sterowanie i zakończenie EMS
        show_header_toggle: false
        state_color: true
        view_layout:
          position: sidebar
        entities:
          - entity: select.pv_hoymiles_inverter_tryb_ems
            name: Tryb pracy
          - entity: number.pv_hoymiles_inverter_self_use_soc
            name: Rezerwa SOC — Self-Use
          - entity: script.hoymiles_stop_scheduled_cycle
            name: Zatrzymaj i wróć do Self-Use
