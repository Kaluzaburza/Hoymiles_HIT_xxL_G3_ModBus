      - type: custom:hoymiles-power-flow-card
        cardstyle: lite
        wide: true
        show_solar: true
        show_battery: true
        show_grid: true
        decimal_places: 2
        dynamic_line_width: true
        min_line_width: 1
        max_line_width: 4
        inverter:
          modern: true
          autarky: "no"
          auto_scale: true
        inverter_image: /local/hoymiles-inverter.png
        battery:
          energy: sensor.hoymiles_hit_battery_capacity
          shutdown_soc: 10
          # The normalized overview sensor already follows the card convention:
          # negative = charging, positive = discharging.
          colour: "#00BCD4"
          charge_colour: "#00BCD4"
          animation_speed: 6
          max_power: 10000
          show_absolute: true
          dynamic_colour: false
          animate: true
        solar:
          mppts: 1
          pv1_name: PV
          colour: "#4CAF50"
          animation_speed: 6
          max_power: 10000
          dynamic_colour: true
        load:
          essential_name: Odbiory
          show_aux: false
          colour: "#00BCD4"
          animation_speed: 6
          max_power: 10000
          dynamic_colour: true
        grid:
          grid_name: Sieć
          show_nonessential: false
          show_absolute: true
          animation_speed: 6
          max_power: 10000
          dynamic_colour: true
          invert_grid: true
        entities:
          inverter_power_175: sensor.hoymiles_hit_overview_inverter_active_power
          grid_power_169: sensor.hoymiles_hit_overview_grid_total_active_power
          grid_ct_power_172: sensor.hoymiles_hit_overview_grid_total_active_power
          battery_soc_184: sensor.hoymiles_hit_overview_battery_soc
          battery_power_190: sensor.hoymiles_hit_overview_battery_power
          battery_current_191: sensor.hoymiles_hit_battery_current_inverter
          battery_voltage_183: sensor.hoymiles_hit_battery_1_voltage
