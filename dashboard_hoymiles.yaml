              - entity: sensor.hoymiles_hit_load_power_l2n
                name: Odbiór — moc L2
              - entity: sensor.hoymiles_hit_load_power_l3n
                name: Odbiór — moc L3
              - entity: sensor.hoymiles_actual_load_power
                name: Odbiorniki — moc łącznie
      - type: custom:hoymiles-zebra-entities-card
