          - entity: sensor.hoymiles_actual_load_power
            name: Dom
          - entity: sensor.hoymiles_hit_overview_grid_total_active_power
            name: Sieć
          - entity: sensor.hoymiles_hit_overview_battery_power
            name: Bateria
          - entity: sensor.hoymiles_hit_battery_current_inverter
            name: Bateria (A)
          - entity: sensor.hoymiles_hit_battery_1_voltage
            name: Bateria (V)
          - entity: sensor.hoymiles_hit_overview_battery_soc
            name: SOC
