  - title: Bateria
    path: bateria
    icon: mdi:battery-high
    badges: []
    cards:
      - type: markdown
        content: |-
          ## Wyrównywanie magazynu
          Okresowy cykl serwisowy dla magazynów LiFePO4. W dniu wykonania
          najpierw wykorzystuje produkcję PV, po zachodzie doładowuje magazyn
          z sieci do 100%, a od 99% ogranicza rzeczywistą moc ładowania baterii
          do około 2 kW. Zadany czas wyrównywania jest liczony dopiero od
          osiągnięcia 100% SOC.

          Podczas cyklu RCE, ładowanie taryfowe i ręczne harmonogramy EMS są
          zawieszone. Ich ustawienia pozostają zapamiętane i wracają do pracy
          po zakończeniu. Wyłączenie przełącznika przerywa cykl i przywraca
          Self-Use. Funkcji używaj zgodnie z zaleceniami producenta baterii.
      - type: custom:hoymiles-zebra-entities-card
        title: Wyrównywanie magazynu — ustawienia i stan
        show_header_toggle: false
        state_color: true
        entities:
          - entity: input_boolean.hoymiles_battery_balancing_enabled
            name: Włącz automatyczne wyrównywanie
          - entity: input_number.hoymiles_battery_balancing_interval_days
            name: Wykonuj co określoną liczbę dni
          - entity: input_number.hoymiles_battery_balancing_hold_hours
            name: Czas wyrównywania przy 100% SOC
          - entity: sensor.hoymiles_battery_balancing_status
            name: Stan automatyki
          - entity: sensor.hoymiles_battery_balancing_next_run
            name: Następny planowany cykl
