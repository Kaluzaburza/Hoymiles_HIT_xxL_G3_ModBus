      - type: markdown
        title: Wymagane źródło prognozy
        view_layout:
          position: sidebar
        entity_id:
          - input_boolean.hoymiles_rce_dynamic_soc_enabled
          - sensor.hoymiles_rce_reserve_status
          - sensor.hoymiles_rce_dynamic_minimum_soc
        content: |-
          Automatyka wymaga zewnętrznej integracji
          **Solcast PV Forecast** producenta **BJReplay**:
          [instalacja i konfiguracja](https://github.com/BJReplay/ha-solcast-solar).

          Wymagane są prognozy **Forecast Today** i **Forecast Tomorrow**.
          Encje są wykrywane automatycznie w polskiej i angielskiej wersji HA;
          w razie niestandardowych nazw można wpisać je u góry.

          Algorytm symuluje bilans co 30 minut od teraz przez dzisiejszą noc,
          cały kolejny dzień i następną noc do **90 minut po wschodzie**.
          Najpierw odkłada poza sprzedażą rezerwę awaryjną Self-Use, korektę
          bezpieczeństwa oraz pełne przewidywane zużycie domu do końca
          najbliższej chronionej nocy. Prognozowane PV przed zachodem nie
          pomniejsza tej nocnej rezerwy. Dopiero pozostałą energię przydziela
          do najdroższych dostępnych bloków RCE dzisiaj lub jutro.

          Cena sprzedaży nie jest ustawiana ręcznie. Optymalizator porównuje
          pełny wynik finansowy wszystkich dostępnych bloków w horyzoncie,
          wybiera najwyższe ceny i uwzględnia naturalny eksport PV. Wcześniejsze
          rozładowanie wykona tylko wtedy, gdy zwiększy przychód lub utworzy
          miejsce w baterii przed późniejszą nadwyżką sprzedawaną taniej.

          Moc systemu jest liczona jako **moc jednego falownika × automatycznie
          wykryta liczba falowników × ustawiony procent rozładowania**.
          Do zebrania co najmniej 24 godzin historii używane jest awaryjne
          zużycie dobowe z pola u góry. Następnie algorytm korzysta z dostępnej
          historii i stopniowo dochodzi do pełnej średniej z czterech dni;
          faktyczne pokrycie historii jest pokazane w karcie stanu.

          Pole rezerwy Self-Use nie jest zmieniane. Pozostaje energią dostępną
          poniżej normalnego progu wyłącznie podczas zaniku sieci.
      - type: markdown
        title: Plan rozładowań RCE
        entity_id:
          - sensor.hoymiles_rce_discharge_plan
          - sensor.hoymiles_rce_automatic_price_floor
          - sensor.hoymiles_rce_optimization_gain
          - input_boolean.hoymiles_sale_block_enabled
          - input_datetime.hoymiles_sale_block_start
          - input_datetime.hoymiles_sale_block_end
        content: |-
          {% set periods = state_attr('sensor.hoymiles_rce_discharge_plan', 'periods') %}
          {% set minutes = state_attr('sensor.hoymiles_rce_discharge_plan',
                                     'planned_duration_minutes') | int(0) %}
          {% set dates = state_attr('sensor.hoymiles_rce_discharge_plan', 'data_dates') %}
          {% set export = state_attr('sensor.hoymiles_rce_discharge_plan',
                                     'expected_export_kwh') | float(0) %}
          {% set battery_export = state_attr('sensor.hoymiles_rce_discharge_plan',
                                             'planned_battery_export_kwh')
                                             | float(0) %}
          {% set pv_export = state_attr('sensor.hoymiles_rce_discharge_plan',
                                        'natural_pv_export_kwh') | float(0) %}
          {% set baseline_export = states(
               'sensor.hoymiles_rce_self_use_baseline_export') | float(0) %}
          {% set battery_revenue = state_attr(
               'sensor.hoymiles_rce_discharge_plan',
               'planned_battery_revenue_pln') | float(0) %}
          {% set pv_revenue = state_attr('sensor.hoymiles_rce_discharge_plan',
                                         'natural_pv_revenue_pln') | float(0) %}
          {% set revenue = state_attr('sensor.hoymiles_rce_discharge_plan',
                                      'estimated_revenue_pln') | float(0) %}
          {% set price_floor = states(
               'sensor.hoymiles_rce_automatic_price_floor') %}
          {% set gain = states('sensor.hoymiles_rce_optimization_gain') %}
          {% set preview = state_attr('sensor.hoymiles_rce_discharge_plan',
                                      'plan_is_preview') %}
          {% set scope = state_attr('sensor.hoymiles_rce_discharge_plan',
                                    'planning_scope') %}
          **Horyzont:** {{ dates }}<br>
          **Zakres cen:** {{ 'dzisiaj i jutro'
             if scope == 'today_and_tomorrow'
             else 'tylko dzisiaj — jutro zostanie dopisane automatycznie' }}<br>
          **Tryb planu:** {{ 'podgląd — automatyczne rozładowanie jest wyłączone'
             if preview else 'aktywny' }}<br>
          **Automatyczna cena graniczna planu:** {{ price_floor
             if price_floor not in ['unknown', 'unavailable'] else 'brak sprzedaży' }}
          {{ 'PLN/kWh' if price_floor not in ['unknown', 'unavailable'] else '' }}<br>
          **Korzyść optymalizacji:** {{ gain
             if gain not in ['unknown', 'unavailable'] else '0' }} PLN<br>
          **Najbardziej opłacalne okresy wybrane przez algorytm:**<br>
          {{ periods or 'Brak danych do przygotowania planu.' }}

          **Łączny plan:** {{ minutes // 60 }} h
          {{ minutes % 60 }} min ({{ states('sensor.hoymiles_rce_discharge_plan') }}
          bloków po 30 min)<br>
          **Zaplanowany eksport sterowany od teraz:** {{ battery_export | round(2) }}
          kWh → {{ battery_revenue | round(2) }} PLN<br>
          **Nadwyżka prognozowana przy pozostawieniu Self-Use:**
          {{ baseline_export | round(2) }} kWh<br>
          **Nieunikniona nadwyżka PV pozostała po optymalizacji:**
          {{ pv_export | round(2) }}
          kWh → {{ pv_revenue | round(2) }} PLN<br>
          **Łączny przyszły eksport od teraz:** {{ export | round(2) }} kWh<br>
          **Łączny przyszły szacunkowy przychód:** {{ revenue | round(2) }} PLN

          Dane przyszłego planu nie zawierają energii sprzedanej wcześniej
          dzisiaj. Eksport zrealizowany jest rozdzielany wyżej na sprzedaż
          sterowaną RCE i naturalną nadwyżkę w trybie Self-Use.

          Automatyka wróci do **Autokonsumpcji (Self-Use)** po zakończeniu
          wybranego bloku, po osiągnięciu minimalnego SOC albo po wyłączeniu
          przełącznika. Blokada sprzedaży wyklucza wskazane godziny z planu.
      - type: markdown
        view_layout:
          position: sidebar
        content: >-
          ## Codzienne harmonogramy EMS

          Każdy harmonogram działa codziennie, dopóki jego przełącznik jest
          włączony. Po upływie ustawionego czasu falownik wraca do
          autokonsumpcji.

          Nie ustawiaj ładowania i rozładowania na tę samą godzinę.
          Wyłączenie przełącznika blokuje kolejne uruchomienia.
      - type: custom:hoymiles-zebra-entities-card
