              - entity: number.pv_hoymiles_inverter_soc_start_charge_from_grid
                name: "SOC rozpoczęcia ładowania z sieci"
      - type: entities
        title: Sterowanie systemem
        show_header_toggle: false
        state_color: true
        view_layout:
          position: sidebar
        entities:
          - entity: select.pv_hoymiles_inverter_system_operation
            name: "Praca systemu"
      - type: markdown
        view_layout:
          position: sidebar
        content: >-
          **Uwaga:** zmiana `System Operation` może zatrzymać falownik.
          Encja `select.hoymiles_inverter_parallel_networking_command` jest celowo pominięta,
          ponieważ w ESPHome ma `disabled_by_default: true`. Włącz ją w Home
          Assistant tylko wtedy, gdy konfigurujesz pracę równoległą.
